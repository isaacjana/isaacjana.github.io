<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevToys - A Swiss Army knife for developers. 40+ client-side tools for encoding, converting, formatting, generating, and testing data.">
  <title>DevToys - Developer Tools</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Mobile Overlay -->
    <div class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="#" class="sidebar-logo" onclick="navigateTo('home'); return false;">
          <div class="sidebar-logo-icon">🛠️</div>
          <span class="sidebar-logo-text">DevToys</span>
        </a>
      </div>

      <div class="sidebar-search">
        <div class="search-input-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" class="search-input" id="sidebar-search" placeholder="Search tools..." autocomplete="off">
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Built dynamically by app.js -->
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="content-header">
        <div class="content-header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="content-title" id="content-title">All Tools</h1>
          <span class="content-subtitle" id="content-subtitle"></span>
        </div>
      </header>

      <div class="content-body" id="content-body">
        <!-- Tool content rendered here -->
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <!-- App Scripts (order matters!) -->
  <script src="js/toolRegistry.js"></script>
  <script src="js/tools/converters.js"></script>
  <script src="js/tools/encodersDecoders.js"></script>
  <script src="js/tools/formatters.js"></script>
  <script src="js/tools/generators.js"></script>
  <script src="js/tools/text.js"></script>
  <script src="js/tools/graphic.js"></script>
  <script src="js/tools/testers.js"></script>
  <script src="js/tools/thirdParty.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
