<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean | Bill Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="sticky top-0 z-50 w-full px-4 py-3 glass shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="../live-catch/" class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </div>
                <span class="text-xl font-black text-dark uppercase tracking-widest block leading-none">Ocean
                    Billing</span>
            </a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-12">
        <div class="bg-white p-10 rounded-[2.5rem] border shadow-xl">
            <h1 class="text-3xl font-extrabold mb-2">Billing Configuration</h1>
            <p class="text-slate-500 mb-10">Set up your business details for E-Invoicing and automated billing.</p>

            <form class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-400 uppercase tracking-wider">Business Name</label>
                        <input type="text"
                            class="w-full px-6 py-4 bg-slate-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-600 outline-none"
                            placeholder="Ocean Fresh Sarawak Sdn Bhd">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-400 uppercase tracking-wider">Tax ID (TIN
                            Number)</label>
                        <input type="text"
                            class="w-full px-6 py-4 bg-slate-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-600 outline-none"
                            placeholder="C1234567800">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-slate-400 uppercase tracking-wider">Registered Address</label>
                    <textarea
                        class="w-full px-6 py-4 bg-slate-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-600 outline-none"
                        rows="3" placeholder="Lot 123, Kuching Port Authority..."></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-400 uppercase tracking-wider">Currency</label>
                        <select
                            class="w-full px-6 py-4 bg-slate-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-600 outline-none">
                            <option>MYR (RM)</option>
                            <option>USD ($)</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-400 uppercase tracking-wider">SST Rate (%)</label>
                        <input type="number"
                            class="w-full px-6 py-4 bg-slate-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-600 outline-none"
                            value="6">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-400 uppercase tracking-wider">Default Terms</label>
                        <select
                            class="w-full px-6 py-4 bg-slate-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-600 outline-none">
                            <option>Cash on Delivery</option>
                            <option>Net 30</option>
                        </select>
                    </div>
                </div>

                <div class="pt-6">
                    <button type="button" onclick="alert('Billing profiles connected to Ocean!')"
                        class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg shadow-xl shadow-indigo-600/20 hover:scale-[1.01] transition-transform">
                        SAVE BILLING PROFILE
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
