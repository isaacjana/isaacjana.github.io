<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Burn | Titanium</title>
    
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --bg-main: #0f172a; 
            --bg-card: #1e293b; 
            --accent: #6366f1; 
            --text-main: #e2e8f0;
        }

        /* Theme Classes */
        body.theme-midnight { --bg-main: #0f172a; --bg-card: #1e293b; --accent: #6366f1; }
        body.theme-cyberpunk { --bg-main: #09090b; --bg-card: #18181b; --accent: #ec4899; }
        body.theme-forest { --bg-main: #052e16; --bg-card: #064e3b; --accent: #34d399; }
        
        body { background-color: var(--bg-main); color: var(--text-main); transition: background-color 0.5s; -webkit-tap-highlight-color: transparent; }
        
        .card-style { background-color: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); }
        .accent-text { color: var(--accent); }
        .accent-bg { background-color: var(--accent); }
        .accent-border { border-color: var(--accent); }

        /* Animations */
        @keyframes heartbeat { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 1; } }
        .heart-pulse { animation: heartbeat 1s infinite ease-in-out; color: var(--accent); }
        .completed { opacity: 0.4; filter: grayscale(1); transform: scale(0.98); pointer-events: none; }
        
        .day-btn.active { background-color: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .day-btn.today { border-color: var(--accent); }
        
        .muscle-part { fill: var(--bg-card); transition: fill 0.6s ease; }
        .muscle-active { fill: var(--accent); filter: drop-shadow(0 0 3px var(--accent)); }

        .edit-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px; padding: 4px; font-size: 11px; width: 100%; }

        /* Active Timer Ring */
        .timer-active { border-color: var(--accent); animation: pulse-border 1s infinite; }
        @keyframes pulse-border { 0% { box-shadow: 0 0 0 0px var(--accent); } 100% { box-shadow: 0 0 0 10px rgba(0,0,0,0); } }

        /* Notes Dropdown */
        .notes-area { display: none; }
        .notes-area.open { display: block; }
    </style>
</head>
<body class="font-sans selection:bg-indigo-500 overflow-x-hidden theme-midnight">

    <canvas id="confetti-canvas" style="position:fixed;top:0;left:0;pointer-events:none;z-index:999;"></canvas>

    <div id="gym-mode" class="fixed inset-0 z-[200] flex-col items-center justify-center p-6 text-center hidden" style="background-color: var(--bg-main)">
        <h1 id="gym-name" class="text-5xl font-black text-white uppercase leading-none mb-4">Select Workout</h1>
        <div class="flex items-baseline justify-center space-x-4">
            <div id="gym-target" class="text-8xl font-black accent-text tabular-nums">--</div>
            <div id="gym-unit" class="text-2xl font-bold text-slate-500 uppercase">--</div>
        </div>
        <div class="mt-8 text-slate-600 font-bold uppercase tracking-widest text-xs animate-pulse">Rotate to exit</div>
    </div>

    <div id="main-ui" class="pb-32 relative">
        
        <header class="fixed top-0 w-full backdrop-blur-xl border-b border-white/5 z-50 pt-4 pb-2 px-4" style="background-color: rgba(var(--bg-main), 0.9)">
            <div class="max-w-md mx-auto">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center space-x-3 cursor-pointer" id="open-profile">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg relative">
                            <span class="text-xs font-black" id="user-level-badge">1</span>
                        </div>
                        <div>
                            <span class="text-xs font-bold text-slate-400 uppercase block leading-none">Profile</span>
                            <span id="difficulty-display" class="text-sm font-black text-white uppercase tracking-tight">Level 1.0</span>
                        </div>
                    </div>
                    <button id="toggle-edit" class="text-slate-500 hover:text-white transition"><i class="fas fa-pencil-alt"></i></button>
                </div>

                <div class="flex justify-between space-x-1 overflow-x-auto no-scrollbar pb-2" id="day-nav-container"></div>
            </div>
        </header>

        <main class="max-w-md mx-auto mt-36 px-4">
            <div class="card-style rounded-[2.5rem] p-6 mb-6 relative overflow-hidden shadow-2xl">
                <div class="flex justify-between items-center relative z-10">
                    <div>
                        <div id="day-focus" class="accent-text font-bold uppercase tracking-widest text-xs mb-1">...</div>
                        <h2 id="calories-display" class="text-4xl font-black text-white">0 <span class="text-sm text-slate-500">Kcal</span></h2>
                        <div class="flex items-center space-x-2 mt-2">
                             <div class="h-1.5 w-24 bg-slate-800 rounded-full overflow-hidden">
                                 <div id="mini-progress" class="h-full accent-bg w-0 transition-all duration-500"></div>
                             </div>
                             <span id="percent-text" class="text-[10px] font-bold text-slate-400">0%</span>
                        </div>
                    </div>
                    <div class="w-16 h-24 opacity-80">
                         <svg viewBox="0 0 50 100" class="w-full h-full drop-shadow-lg">
                            <g transform="translate(0,0)">
                                <rect x="10" y="22" width="30" height="28" rx="4" class="muscle-part" data-muscle="Chest"/>
                                <rect x="2" y="24" width="7" height="32" rx="3" class="muscle-part" data-muscle="Arms"/>
                                <rect x="41" y="24" width="7" height="32" rx="3" class="muscle-part" data-muscle="Arms"/>
                                <rect x="12" y="58" width="10" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                                <rect x="28" y="58" width="10" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                                <rect x="20" y="35" width="10" height="15" rx="2" class="muscle-part" data-muscle="Abs" style="opacity:0.5"/>
                            </g>
                        </svg>
                    </div>
                </div>
            </div>

            <div id="start-overlay" class="absolute inset-0 z-10 flex items-start pt-48 justify-center rounded-3xl h-full transition-all">
                <button id="start-btn" class="accent-bg text-white font-black uppercase text-xl py-6 px-12 rounded-[2rem] shadow-2xl transform transition hover:scale-105 active:scale-95 animate-bounce">
                    <i class="fas fa-play mr-3"></i> Start Routine
                </button>
            </div>

            <div id="workout-list" class="space-y-3 blur-sm transition-all duration-500 pointer-events-none"></div>

        </main>
    </div>

    <div id="profile-modal" class="hidden fixed inset-0 z-[100] backdrop-blur-md bg-black/80 flex flex-col items-center justify-end sm:justify-center">
        <div class="card-style w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-8 relative h-[85vh] sm:h-auto overflow-y-auto">
            <button id="close-profile" class="absolute top-6 right-6 text-slate-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            
            <h2 class="text-2xl font-black text-white mb-6">Settings</h2>
            
            <div class="mb-6">
                <span class="text-xs font-bold text-slate-400 uppercase">App Theme</span>
                <div class="grid grid-cols-3 gap-2 mt-2">
                    <button class="theme-btn py-2 rounded-lg bg-[#0f172a] border border-white/20 text-xs font-bold text-white" data-theme="theme-midnight">Midnight</button>
                    <button class="theme-btn py-2 rounded-lg bg-[#09090b] border border-pink-500/50 text-xs font-bold text-pink-500" data-theme="theme-cyberpunk">Neon</button>
                    <button class="theme-btn py-2 rounded-lg bg-[#064e3b] border border-green-500/50 text-xs font-bold text-green-400" data-theme="theme-forest">Forest</button>
                </div>
            </div>

            <div class="mb-6 p-4 bg-black/20 rounded-2xl border border-white/5">
                <span class="text-xs font-bold text-slate-400 uppercase">Difficulty</span>
                <button id="level-up-btn" class="w-full mt-2 py-3 accent-bg rounded-xl font-bold text-white text-xs uppercase tracking-widest">Level Up (+10%)</button>
                <button id="level-reset-btn" class="w-full mt-2 text-[10px] text-red-400 uppercase">Reset to 1.0x</button>
            </div>

            <div class="p-3 bg-black/20 rounded-xl border border-white/5 mb-6">
                <span class="text-[10px] text-slate-500 uppercase font-bold">Audio Mode</span>
                <select id="sound-select" class="w-full bg-transparent text-white text-xs mt-1 p-2 rounded-lg"><option value="voice">Voice Coach</option><option value="beep">Beeps Only</option><option value="silent">Silent</option></select>
            </div>
            
            <div class="text-center text-xs text-slate-500 font-mono">v6.0 Titanium</div>
        </div>
    </div>

    <div id="rest-modal" class="hidden fixed inset-0 z-[150] bg-black/90 flex flex-col items-center justify-center p-8">
        <div class="text-9xl font-black text-white tabular-nums mb-4" id="rest-timer">30</div>
        <div class="accent-text font-black uppercase tracking-widest text-sm mb-12 animate-pulse" id="next-ex-label">RECOVER</div>
        <div class="card-style p-6 rounded-3xl w-full max-w-xs text-center">
            <p class="text-slate-400 text-xs uppercase tracking-widest mb-2">Up Next</p>
            <h3 id="next-ex-name" class="text-xl font-black text-white">...</h3>
        </div>
        <button id="skip-rest" class="mt-8 px-8 py-4 text-slate-600 hover:text-white transition font-bold uppercase tracking-widest text-xs">Skip Rest</button>
    </div>

    <script>
        $(document).ready(function() {
            
            // --- DATA ---
            const defaultSchedule = {
                1: { focus: "Chest & Triceps", color: "#6366f1", muscles: ["Chest", "Arms"], exercises: [{ id: "m1", name: "Push Ups", reps: 15, unit: "Reps", cal: 10, icon: "fa-hand-rock", rest: 30 }, { id: "m2", name: "Plank", reps: 45, unit: "Sec", cal: 5, icon: "fa-stopwatch", rest: 30 }, { id: "m3", name: "Tricep Dips", reps: 15, unit: "Reps", cal: 8, icon: "fa-chair", rest: 30 }] },
                2: { focus: "Back & Biceps", color: "#10b981", muscles: ["Chest", "Arms"], exercises: [{ id: "tu1", name: "Superman Holds", reps: 45, unit: "Sec", cal: 5, icon: "fa-superpowers", rest: 30 }, { id: "tu2", name: "Doorframe Rows", reps: 15, unit: "Reps", cal: 10, icon: "fa-columns", rest: 30 }, { id: "tu3", name: "Good Mornings", reps: 20, unit: "Reps", cal: 12, icon: "fa-sun", rest: 40 }] },
                3: { focus: "Legs & Glutes", color: "#f59e0b", muscles: ["Legs"], exercises: [{ id: "w1", name: "Air Squats", reps: 20, unit: "Reps", cal: 12, icon: "fa-chevron-down", rest: 30 }, { id: "w2", name: "Lunges", reps: 12, unit: "Per Leg", cal: 14, icon: "fa-walking", rest: 45 }, { id: "w3", name: "Wall Sit", reps: 45, unit: "Sec", cal: 10, icon: "fa-chair", rest: 30 }] },
                4: { focus: "Shoulders & Core", color: "#8b5cf6", muscles: ["Arms", "Abs"], exercises: [{ id: "th1", name: "Pike Push Ups", reps: 10, unit: "Reps", cal: 12, icon: "fa-mountain", rest: 45 }, { id: "th2", name: "Plank", reps: 60, unit: "Sec", cal: 8, icon: "fa-stopwatch", rest: 30 }, { id: "th3", name: "Russian Twists", reps: 25, unit: "Reps", cal: 10, icon: "fa-sync-alt", rest: 30 }] },
                5: { focus: "Full Body Intensity", color: "#ef4444", muscles: ["Chest", "Arms", "Legs", "Abs"], exercises: [{ id: "f1", name: "Burpees", reps: 10, unit: "Reps", cal: 20, icon: "fa-fire", rest: 60 }, { id: "f2", name: "Mountain Climbers", reps: 40, unit: "Sec", cal: 15, icon: "fa-running", rest: 30 }, { id: "f3", name: "Jumping Jacks", reps: 50, unit: "Reps", cal: 12, icon: "fa-star", rest: 20 }] },
                6: { focus: "Active Recovery", color: "#14b8a6", muscles: ["Abs"], exercises: [{ id: "s1", name: "Bird Dog", reps: 10, unit: "Per Side", cal: 5, icon: "fa-dog", rest: 20 }, { id: "s2", name: "Cat Cow Stretch", reps: 60, unit: "Sec", cal: 3, icon: "fa-cat", rest: 20 }] },
                0: { focus: "Rest & Mobility", color: "#64748b", muscles: [], exercises: [{ id: "su1", name: "Light Walk", reps: 15, unit: "Mins", cal: 50, icon: "fa-shoe-prints", rest: 0 }] }
            };

            const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            let activeDay = new Date().getDay();
            let schedule = JSON.parse(localStorage.getItem('db_schedule')) || defaultSchedule;
            let completed = JSON.parse(localStorage.getItem('db_completed')) || {};
            let profile = JSON.parse(localStorage.getItem('db_profile')) || { level: 1.0, sound: 'voice', theme: 'theme-midnight', notes: {} };
            let isEditing = false;
            let activeInterval = null; // For active exercise timer
            
            const synth = window.speechSynthesis;
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // --- INIT ---
            $('body').addClass(profile.theme);
            renderWeekNav();
            loadDay(activeDay);
            $('#level-val').text(profile.level.toFixed(1) + "x");
            $('#sound-select').val(profile.sound);

            // --- START ---
            $('#start-btn').click(function() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                $('#start-overlay').fadeOut();
                $('#workout-list').removeClass('blur-sm pointer-events-none');
                playSound("Session started.", true);
            });

            // --- RENDER ---
            function renderWeekNav() {
                const container = $('#day-nav-container').empty();
                dayNames.forEach((d, i) => {
                    const todayClass = (i === new Date().getDay()) ? 'today accent-border' : 'border-white/10';
                    container.append(`<button class="day-btn w-10 h-14 rounded-xl border card-style flex flex-col items-center justify-center transition-all active:scale-95 shrink-0 ${todayClass}" data-day="${i}"><span class="text-[8px] uppercase font-bold text-slate-500">Day</span><span class="text-sm font-black">${d}</span></button>`);
                });
            }

            function loadDay(i) {
                activeDay = parseInt(i);
                $('.day-btn').removeClass('active');
                $(`.day-btn[data-day="${activeDay}"]`).addClass('active');
                const data = schedule[activeDay];
                $('#day-focus').text(data.focus);
                $(':root').css('--accent', data.color);
                
                $('.muscle-part').removeClass('muscle-active');
                data.muscles.forEach(m => $(`.muscle-part[data-muscle="${m}"]`).addClass('muscle-active'));
                
                renderList();
                updateProgress();
            }

            function renderList() {
                const container = $('#workout-list').empty();
                const exList = schedule[activeDay].exercises;

                // Reset Gym Mode
                $('#gym-name').text("Ready"); $('#gym-target').text("--");

                exList.forEach((ex, idx) => {
                    const isDone = completed[activeDay] && completed[activeDay].includes(ex.id);
                    const reps = Math.ceil(ex.reps * profile.level);
                    const isTimed = (ex.unit.toLowerCase().includes('sec') || ex.unit.toLowerCase().includes('min'));
                    const note = profile.notes[ex.id] || "";

                    // Gym Mode
                    if (!isDone && $('#gym-name').text() === "Ready") {
                        $('#gym-name').text(ex.name); $('#gym-target').text(reps); $('#gym-unit').text(ex.unit);
                    }

                    if (isEditing) {
                        container.append(`
                            <div class="card-style p-4 rounded-2xl grid grid-cols-12 gap-2">
                                <div class="col-span-6"><label class="text-[9px] text-slate-500 uppercase">Name</label><input type="text" class="edit-input ex-name" value="${ex.name}" data-idx="${idx}"></div>
                                <div class="col-span-2"><label class="text-[9px] text-slate-500 uppercase">Reps</label><input type="number" class="edit-input ex-reps" value="${ex.reps}" data-idx="${idx}"></div>
                                <div class="col-span-4"><label class="text-[9px] text-slate-500 uppercase">Unit</label><input type="text" class="edit-input ex-unit" value="${ex.unit}" data-idx="${idx}"></div>
                            </div>
                        `);
                    } else {
                        // Action Button Logic (Check vs Play)
                        let btnHtml = '';
                        if (isDone) {
                            btnHtml = `<button class="w-12 h-12 rounded-full accent-bg flex items-center justify-center"><i class="fas fa-check text-white"></i></button>`;
                        } else if (isTimed) {
                            // ACTIVE TIMER BUTTON
                            btnHtml = `<button class="timer-btn w-12 h-12 rounded-full border-2 border-white/10 flex items-center justify-center transition active:scale-95" data-id="${ex.id}" data-duration="${reps}">
                                <i class="fas fa-play accent-text"></i>
                            </button>`;
                        } else {
                            // STANDARD CHECK BUTTON
                            btnHtml = `<button class="check-btn w-12 h-12 rounded-full border-2 border-white/10 flex items-center justify-center transition active:scale-95" data-id="${ex.id}">
                                <i class="fas fa-check accent-text opacity-0 hover:opacity-100"></i>
                            </button>`;
                        }

                        container.append(`
                            <div class="card-style p-5 rounded-[1.5rem] transition-all duration-300 ${isDone ? 'completed' : ''}" id="card-${ex.id}">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-4">
                                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white" style="background-color: ${schedule[activeDay].color}20; color: ${schedule[activeDay].color}">
                                            <i class="fas ${ex.icon}"></i>
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-white uppercase text-xs tracking-tight">${ex.name}</h3>
                                            <p class="text-slate-500 font-bold text-[10px] uppercase dynamic-text-${ex.id}">${reps} ${ex.unit}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <button class="text-slate-600 hover:text-white transition text-xs toggle-note" data-id="${ex.id}"><i class="fas fa-sticky-note"></i></button>
                                        ${btnHtml}
                                    </div>
                                </div>
                                <div class="notes-area mt-3 pt-3 border-t border-white/5 ${note ? 'block' : ''}" id="note-box-${ex.id}">
                                    <input type="text" class="save-note w-full bg-transparent text-[10px] text-indigo-300 placeholder-slate-700 focus:outline-none" placeholder="Add note (e.g. 15kg)..." value="${note}" data-id="${ex.id}">
                                </div>
                            </div>
                        `);
                    }
                });
                
                if(exList.every(e => completed[activeDay]?.includes(e.id))) {
                    $('#gym-name').text("DONE"); $('#gym-target').text("✔");
                }
            }

            // --- INTERACTIONS ---

            // 1. STANDARD CHECK
            $(document).on('click', '.check-btn', function() { completeExercise($(this).data('id'), $(this)); });

            // 2. ACTIVE TIMER (STOPWATCH)
            $(document).on('click', '.timer-btn', function() {
                const btn = $(this);
                const id = btn.data('id');
                const duration = btn.data('duration');
                const textLabel = $(`.dynamic-text-${id}`);
                
                if (btn.hasClass('running')) return; // Prevent double click
                btn.addClass('running timer-active');
                playSound("Go");

                let timeLeft = duration;
                textLabel.text(timeLeft + " Sec").addClass('accent-text');
                btn.html(`<span class="text-xs font-black accent-text">${timeLeft}</span>`);

                activeInterval = setInterval(() => {
                    timeLeft--;
                    btn.html(`<span class="text-xs font-black accent-text">${timeLeft}</span>`);
                    textLabel.text(timeLeft + " Sec");
                    
                    if (timeLeft <= 3 && timeLeft > 0) playSound("beep");
                    
                    if (timeLeft <= 0) {
                        clearInterval(activeInterval);
                        completeExercise(id, btn);
                    }
                }, 1000);
            });

            function completeExercise(id, btnElement) {
                if(!completed[activeDay]) completed[activeDay] = [];
                if(completed[activeDay].includes(id)) return;

                completed[activeDay].push(id);
                localStorage.setItem('db_completed', JSON.stringify(completed));
                
                // Visuals
                const card = $(`#card-${id}`);
                card.addClass('completed');
                btnElement.replaceWith(`<button class="w-12 h-12 rounded-full accent-bg flex items-center justify-center"><i class="fas fa-check text-white"></i></button>`);
                
                if(navigator.vibrate) navigator.vibrate(50);
                updateProgress();

                const remaining = schedule[activeDay].exercises.filter(e => !completed[activeDay].includes(e.id));
                if(remaining.length > 0) triggerRest(remaining[0]);
                else { playSound("Workout complete!", true); fireConfetti(); }
            }

            // 3. NOTES LOGGING
            $(document).on('click', '.toggle-note', function() { $(`#note-box-${$(this).data('id')}`).slideToggle(); });
            $(document).on('change', '.save-note', function() {
                profile.notes[$(this).data('id')] = $(this).val();
                localStorage.setItem('db_profile', JSON.stringify(profile));
            });

            // 4. THEME SWITCHER
            $('.theme-btn').click(function() {
                const theme = $(this).data('theme');
                $('body').removeClass('theme-midnight theme-cyberpunk theme-forest').addClass(theme);
                profile.theme = theme;
                localStorage.setItem('db_profile', JSON.stringify(profile));
            });

            // 5. EDIT MODE
            $('#toggle-edit').click(function() {
                if(isEditing) {
                    $('.ex-name').each(function() { schedule[activeDay].exercises[$(this).data('idx')].name = $(this).val(); });
                    $('.ex-reps').each(function() { schedule[activeDay].exercises[$(this).data('idx')].reps = parseInt($(this).val()); });
                    $('.ex-unit').each(function() { schedule[activeDay].exercises[$(this).data('idx')].unit = $(this).val(); });
                    localStorage.setItem('db_schedule', JSON.stringify(schedule));
                    isEditing = false; renderList();
                } else { isEditing = true; renderList(); }
            });

            // --- UTILS ---
            function updateProgress() {
                const totalEx = schedule[activeDay].exercises.length;
                const doneEx = completed[activeDay]?.length || 0;
                const pct = Math.round((doneEx / totalEx) * 100);
                $('#calories-display').html(`${(doneEx * 15)} <span class="text-sm text-slate-500">Kcal</span>`);
                $('#percent-text').text(pct + '%');
                $('#mini-progress').css('width', pct + '%');
            }

            function triggerRest(nextEx) {
                $('#rest-modal').removeClass('hidden');
                $('#next-ex-name').text(nextEx.name);
                $('#gym-name').text(nextEx.name); $('#gym-target').text(Math.ceil(nextEx.reps * profile.level));
                playSound("Rest. Next is " + nextEx.name);
                let time = nextEx.rest || 30;
                const timer = setInterval(() => {
                    time--;
                    $('#rest-timer').text(time);
                    if(time <= 3) playSound("beep");
                    if(time <= 0) { clearInterval(timer); $('#rest-modal').addClass('hidden'); playSound("Start!"); }
                }, 1000);
                $('#skip-rest').one('click', () => { clearInterval(timer); $('#rest-modal').addClass('hidden'); });
            }

            function playSound(text, forceVoice) {
                if(profile.sound === 'silent') return;
                if(text === 'beep' || (profile.sound === 'beep' && !forceVoice)) {
                    if(audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.value = 880; osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
                    osc.stop(audioCtx.currentTime + 0.1);
                } else {
                    synth.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.rate = 1.1;
                    synth.speak(u);
                }
            }

            function fireConfetti() {
                const canvas = document.getElementById('confetti-canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                let particles = [];
                for(let i=0; i<100; i++) particles.push({ x: canvas.width/2, y: canvas.height/2, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, color: `hsl(${Math.random()*360}, 100%, 50%)`, alpha: 1 });
                function animate() {
                    ctx.clearRect(0,0,canvas.width,canvas.height);
                    particles.forEach((p, i) => {
                        p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.alpha -= 0.01;
                        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.fillRect(p.x, p.y, 6, 6);
                        if(p.alpha <= 0) particles.splice(i, 1);
                    });
                    if(particles.length > 0) requestAnimationFrame(animate);
                }
                animate();
            }

            $('.day-btn').click(function() { loadDay($(this).data('day')); });
            $('#open-profile').click(() => $('#profile-modal').removeClass('hidden'));
            $('#close-profile').click(() => $('#profile-modal').addClass('hidden'));
            $('#level-up-btn').click(() => { profile.level += 0.1; localStorage.setItem('db_profile', JSON.stringify(profile)); $('#level-val').text(profile.level.toFixed(1) + "x"); });
            $('#level-reset-btn').click(() => { profile.level = 1.0; localStorage.setItem('db_profile', JSON.stringify(profile)); $('#level-val').text("1.0x"); });
            $('#sound-select').change(function() { profile.sound = $(this).val(); localStorage.setItem('db_profile', JSON.stringify(profile)); });
        });
    </script>
</body>
