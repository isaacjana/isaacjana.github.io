<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Burn | Amethyst</title>
    
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES --- */
        :root { 
            --bg-main: #0f172a; 
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #8b5cf6; /* Amethyst */
            --primary-gradient: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            --text-main: #f1f5f9;
        }

        /* Themes */
        body.theme-ruby { --primary: #f43f5e; --primary-gradient: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); }
        body.theme-ocean { --primary: #3b82f6; --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        body.theme-emerald { --primary: #10b981; --primary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%); }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; transition: background 0.5s; }

        /* --- UI COMPONENTS --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .gradient-text { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-bg { background: var(--primary-gradient); }
        
        .completed { opacity: 0.5; filter: grayscale(1); pointer-events: none; transition: 0.4s; }

        /* Day Nav */
        .day-btn { transition: all 0.3s; }
        .day-btn.active { background: var(--primary-gradient); color: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transform: translateY(-2px); }
        .status-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--primary); position: absolute; bottom: 6px; }
        .day-btn.active .status-dot { background: white; }

        /* Switch */
        .toggle-checkbox:checked { right: 0; border-color: var(--primary); }
        .toggle-checkbox:checked + .toggle-label { background-color: var(--primary); }

        /* Sticky Footer */
        .sticky-action-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            padding: 1rem 1.5rem 2rem 1.5rem;
            background: linear-gradient(to top, var(--bg-main) 80%, transparent);
            z-index: 50;
            display: flex; gap: 1rem; align-items: center; justify-content: space-between;
        }

        /* Animations */
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .list-item { animation: slideIn 0.3s ease-out forwards; }

        /* Landscape Mode */
        #gym-mode { display: none; }
        @media (orientation: landscape) and (max-height: 500px) { body { overflow: hidden; } #main-ui { display: none; } #gym-mode { display: flex; } }
    </style>
</head>
<body class="theme-default pb-32">

    <canvas id="confetti-canvas" style="position:fixed;top:0;left:0;pointer-events:none;z-index:999;"></canvas>

    <div id="gym-mode" class="fixed inset-0 z-[300] flex-col items-center justify-center p-6 text-center bg-slate-950">
        <div class="text-xs font-bold text-slate-500 uppercase tracking-[0.3em] mb-2">NOW ACTIVE</div>
        <h1 id="gym-name" class="text-6xl font-black text-white uppercase leading-none mb-4 tracking-tighter">START</h1>
        <div class="flex items-baseline justify-center space-x-4">
            <div id="gym-target" class="text-[8rem] font-black gradient-text tabular-nums leading-none">--</div>
            <div id="gym-unit" class="text-3xl font-bold text-slate-500 uppercase">--</div>
        </div>
        <div id="gym-timer" class="absolute top-6 right-6 text-2xl font-mono text-white opacity-50 font-bold">00:00</div>
    </div>

    <div id="main-ui">
        
        <header class="fixed top-0 w-full glass-panel z-[60] pt-4 pb-3 px-4 border-b-0 rounded-b-3xl">
            <div class="max-w-md mx-auto">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center space-x-3 cursor-pointer group" id="open-profile">
                        <div class="w-10 h-10 rounded-full gradient-bg flex items-center justify-center shadow-lg group-active:scale-95 transition">
                            <i class="fas fa-bars text-white"></i>
                        </div>
                        <div>
                            <span class="text-[10px] font-bold text-slate-400 uppercase block leading-none mb-1">Menu</span>
                            <span id="difficulty-display" class="text-sm font-black text-white uppercase tracking-tight">1.0x</span>
                        </div>
                    </div>
                    <div id="session-status" class="hidden px-3 py-1 rounded-full bg-green-500/20 text-green-400 text-[10px] font-bold uppercase tracking-widest border border-green-500/50 animate-pulse">
                        Active
                    </div>
                    
                    <button id="toggle-edit" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-slate-400 hover:text-white transition"><i class="fas fa-pencil-alt text-sm"></i></button>
                </div>
                <div class="flex justify-between space-x-2 overflow-x-auto no-scrollbar pb-1" id="day-nav-container"></div>
            </div>
        </header>

        <main class="max-w-md mx-auto mt-40 px-4">
            
            <div class="glass-panel rounded-[2.5rem] p-6 mb-6 relative overflow-hidden">
                <div class="flex justify-between items-center relative z-10">
                    <div class="flex-1">
                        <div id="day-focus" class="gradient-text font-black uppercase tracking-widest text-xs mb-2">...</div>
                        
                        <div class="flex items-baseline space-x-2 mb-2">
                            <h2 id="global-timer" class="text-5xl font-mono font-black text-white tracking-tighter">00:00</h2>
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Duration</span>
                        </div>

                        <div class="w-full max-w-[140px]">
                            <div class="flex justify-between text-[9px] font-bold text-slate-500 uppercase mb-1">
                                <span>Complete</span>
                                <span id="percent-text">0%</span>
                            </div>
                            <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                                <div id="mini-progress" class="h-full gradient-bg w-0 transition-all duration-500"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="w-20 h-28 opacity-90 relative">
                         <svg viewBox="0 0 50 100" class="w-full h-full drop-shadow-xl">
                            <g transform="translate(0,0)">
                                <rect x="10" y="22" width="30" height="28" rx="4" class="muscle-part" data-muscle="Chest"/>
                                <rect x="2" y="24" width="7" height="32" rx="3" class="muscle-part" data-muscle="Arms"/>
                                <rect x="41" y="24" width="7" height="32" rx="3" class="muscle-part" data-muscle="Arms"/>
                                <rect x="12" y="58" width="10" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                                <rect x="28" y="58" width="10" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                                <rect x="20" y="35" width="10" height="15" rx="2" class="muscle-part" data-muscle="Abs" style="opacity:0.5"/>
                            </g>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-end mb-4 px-2">
                <h3 class="text-white font-bold text-lg">Workout Plan</h3>
                
                <div class="flex items-center space-x-2" id="quick-warmup-container">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">Warm Up</span>
                    <div class="relative inline-block w-8 h-4 align-middle select-none">
                        <input type="checkbox" id="warmup-toggle" class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300"/>
                        <label for="warmup-toggle" class="toggle-label block overflow-hidden h-4 rounded-full bg-slate-700 cursor-pointer"></label>
                    </div>
                </div>
            </div>

            <div id="workout-list" class="space-y-3 pb-24"></div>

        </main>

        <div class="sticky-action-bar max-w-md mx-auto left-0 right-0">
            <button id="reset-day-btn" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-slate-400 hover:text-white transition">
                <i class="fas fa-redo-alt"></i>
            </button>
            <button id="main-action-btn" class="flex-1 h-14 gradient-bg rounded-2xl font-black text-white text-lg uppercase tracking-widest shadow-xl shadow-indigo-500/20 active:scale-95 transition flex items-center justify-center">
                <i class="fas fa-play mr-2"></i> Start Session
            </button>
        </div>
    </div>

    <div id="profile-modal" class="hidden fixed inset-0 z-[100] backdrop-blur-lg bg-slate-950/80 flex flex-col items-center justify-end sm:justify-center">
        <div class="glass-panel w-full max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] p-8 relative h-[80vh] sm:h-auto overflow-y-auto border-b-0">
            <button id="close-profile" class="absolute top-6 right-6 text-slate-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-3xl font-black text-white mb-8 tracking-tight">Settings</h2>
            
            <div class="mb-8">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Theme</span>
                <div class="grid grid-cols-4 gap-3 mt-3">
                    <button class="theme-btn h-10 rounded-2xl bg-[#8b5cf6]" data-theme="theme-default"></button>
                    <button class="theme-btn h-10 rounded-2xl bg-[#3b82f6]" data-theme="theme-ocean"></button>
                    <button class="theme-btn h-10 rounded-2xl bg-[#f43f5e]" data-theme="theme-ruby"></button>
                    <button class="theme-btn h-10 rounded-2xl bg-[#10b981]" data-theme="theme-emerald"></button>
                </div>
            </div>

            <div class="mb-8 p-5 bg-black/20 rounded-3xl border border-white/5">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Intensity</span>
                <div class="flex items-center justify-between mt-2 mb-4">
                    <span class="text-2xl font-black text-white" id="modal-level-val">1.0x</span>
                </div>
                <button id="level-up-btn" class="w-full py-4 gradient-bg rounded-2xl font-black text-white text-xs uppercase tracking-widest shadow-lg active:scale-95 transition">Level Up (+10%)</button>
                <button id="level-reset-btn" class="w-full mt-3 py-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest hover:text-white">Reset</button>
            </div>

            <button id="hard-reset" class="w-full py-4 border border-white/10 text-red-400 hover:bg-red-500/10 rounded-2xl font-bold text-xs uppercase tracking-widest transition">Factory Reset</button>
        </div>
    </div>

    <div id="rest-modal" class="hidden fixed inset-0 z-[400] bg-slate-950/95 flex flex-col items-center justify-center p-8 backdrop-blur-xl">
        <div class="text-[10rem] font-black gradient-text tabular-nums mb-4 leading-none" id="rest-timer">30</div>
        <div class="text-white font-black uppercase tracking-[0.5em] text-sm mb-12 animate-pulse" id="next-ex-label">RECOVER</div>
        
        <div class="glass-panel p-6 rounded-[2rem] w-full max-w-xs text-center mb-10 transform scale-110">
            <p class="text-slate-400 text-[10px] uppercase tracking-widest mb-2 font-bold">Up Next</p>
            <h3 id="next-ex-name" class="text-2xl font-black text-white">...</h3>
        </div>

        <div class="flex space-x-6">
            <button id="add-time" class="w-20 h-20 rounded-full glass-panel text-white font-bold hover:bg-white/10 active:scale-90 transition flex flex-col items-center justify-center"><span class="text-sm">+15</span><span class="text-[9px] text-slate-500">SEC</span></button>
            <button id="skip-rest" class="w-20 h-20 rounded-full glass-panel text-white font-bold hover:bg-white/10 active:scale-90 transition flex items-center justify-center"><i class="fas fa-forward text-xl"></i></button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            
            // --- DATA ---
            const defaultSchedule = {
                1: { focus: "Chest & Triceps", color: "#8b5cf6", muscles: ["Chest", "Arms"], exercises: [{ id: "m1", name: "Push Ups", reps: 15, unit: "Reps", icon: "fa-hand-rock", rest: 30 }, { id: "m2", name: "Plank", reps: 45, unit: "Sec", icon: "fa-stopwatch", rest: 30 }, { id: "m3", name: "Tricep Dips", reps: 15, unit: "Reps", icon: "fa-chair", rest: 30 }] },
                2: { focus: "Back & Biceps", color: "#3b82f6", muscles: ["Chest", "Arms"], exercises: [{ id: "tu1", name: "Superman Holds", reps: 45, unit: "Sec", icon: "fa-superpowers", rest: 30 }, { id: "tu2", name: "Doorframe Rows", reps: 15, unit: "Reps", icon: "fa-columns", rest: 30 }, { id: "tu3", name: "Good Mornings", reps: 20, unit: "Reps", icon: "fa-sun", rest: 40 }] },
                3: { focus: "Legs & Glutes", color: "#f59e0b", muscles: ["Legs"], exercises: [{ id: "w1", name: "Air Squats", reps: 20, unit: "Reps", icon: "fa-chevron-down", rest: 30 }, { id: "w2", name: "Lunges", reps: 12, unit: "Per Leg", icon: "fa-person-walking", rest: 45 }, { id: "w3", name: "Wall Sit", reps: 45, unit: "Sec", icon: "fa-chair", rest: 30 }] },
                4: { focus: "Shoulders & Core", color: "#f43f5e", muscles: ["Arms", "Abs"], exercises: [{ id: "th1", name: "Pike Push Ups", reps: 10, unit: "Reps", icon: "fa-mountain", rest: 45 }, { id: "th2", name: "Plank", reps: 60, unit: "Sec", icon: "fa-stopwatch", rest: 30 }, { id: "th3", name: "Russian Twists", reps: 25, unit: "Reps", icon: "fa-arrows-spin", rest: 30 }] },
                5: { focus: "Full Body Intensity", color: "#ef4444", muscles: ["Chest", "Arms", "Legs", "Abs"], exercises: [{ id: "f1", name: "Burpees", reps: 10, unit: "Reps", icon: "fa-fire", rest: 60 }, { id: "f2", name: "Mtn Climbers", reps: 40, unit: "Sec", icon: "fa-person-running", rest: 30 }, { id: "f3", name: "Jumping Jacks", reps: 50, unit: "Reps", icon: "fa-star", rest: 20 }] },
                6: { focus: "Active Recovery", color: "#10b981", muscles: ["Abs"], exercises: [{ id: "s1", name: "Bird Dog", reps: 10, unit: "Per Side", icon: "fa-dog", rest: 20 }, { id: "s2", name: "Cat Cow", reps: 60, unit: "Sec", icon: "fa-cat", rest: 20 }] },
                0: { focus: "Rest & Mobility", color: "#64748b", muscles: [], exercises: [{ id: "su1", name: "Light Walk", reps: 15, unit: "Mins", icon: "fa-shoe-prints", rest: 0 }] }
            };

            const warmupRoutine = [
                { id: "wm1", name: "Arm Circles", reps: 30, unit: "Sec", icon: "fa-sync", rest: 10 },
                { id: "wm2", name: "Jumping Jacks", reps: 20, unit: "Reps", icon: "fa-star", rest: 15 }
            ];

            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            let activeDay = new Date().getDay();
            let schedule = JSON.parse(localStorage.getItem('amy_schedule')) || defaultSchedule;
            let completed = JSON.parse(localStorage.getItem('amy_completed')) || {};
            let profile = JSON.parse(localStorage.getItem('amy_profile')) || { level: 1.0, theme: 'theme-default', sound: 'voice', warmup: false };
            
            let isEditing = false;
            let isSessionActive = false;
            let sessionTimerIntv = null;
            let sessionSeconds = 0;
            let currentSessionList = []; 

            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const synth = window.speechSynthesis;

            // --- INIT ---
            $('body').addClass(profile.theme);
            $('#warmup-toggle').prop('checked', profile.warmup);
            renderWeekNav();
            loadDay(activeDay);
            updateProfileUI();

            // --- MAIN ACTION BUTTON (START / STOP) ---
            $('#main-action-btn').click(function() {
                if(!isSessionActive) {
                    startSession();
                } else {
                    if(confirm("End current session?")) endSession(true);
                }
            });

            // --- WARMUP TOGGLE LOGIC ---
            $('#warmup-toggle').change(function() {
                profile.warmup = $(this).is(':checked');
                localStorage.setItem('amy_profile', JSON.stringify(profile));
                // Immediately rebuild the list visual
                buildQueue();
                renderList(); 
            });

            function buildQueue() {
                const base = schedule[activeDay].exercises;
                if($('#warmup-toggle').is(':checked')) {
                    currentSessionList = [...warmupRoutine, ...base];
                } else {
                    currentSessionList = [...base];
                }
            }

            function startSession() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                isSessionActive = true;
                
                // UI Changes
                $('#main-action-btn').html('<i class="fas fa-stop mr-2"></i> End Session').addClass('bg-red-500').removeClass('gradient-bg');
                $('#reset-day-btn').addClass('opacity-0 pointer-events-none'); // Hide reset during session
                $('#quick-warmup-container').fadeOut();
                $('#session-status').removeClass('hidden');

                // Timer
                sessionSeconds = 0;
                sessionTimerIntv = setInterval(() => {
                    sessionSeconds++;
                    const m = Math.floor(sessionSeconds / 60).toString().padStart(2, '0');
                    const s = (sessionSeconds % 60).toString().padStart(2, '0');
                    $('#global-timer, #gym-timer').text(`${m}:${s}`);
                }, 1000);

                playSound("Session started.");
                renderList(); // Re-render to unlock buttons
                updateGymMode();
            }

            function endSession(userAction = true) {
                isSessionActive = false;
                clearInterval(sessionTimerIntv);
                
                if(userAction) {
                    $('#main-action-btn').html('<i class="fas fa-play mr-2"></i> Start Session').addClass('gradient-bg').removeClass('bg-red-500');
                    $('#reset-day-btn').removeClass('opacity-0 pointer-events-none');
                    $('#quick-warmup-container').fadeIn();
                    $('#session-status').addClass('hidden');
                    $('#global-timer').text("00:00");
                    renderList(); // Re-render to lock/reset state visually
                }
            }

            // --- CORE UI ---
            function renderWeekNav() {
                const container = $('#day-nav-container').empty();
                dayNames.forEach((d, i) => {
                    const activeClass = (i === activeDay) ? 'active' : 'glass-panel text-slate-400';
                    const hasData = completed[i] && completed[i].length === schedule[i].exercises.length;
                    container.append(`<button class="day-btn w-12 h-16 rounded-2xl flex flex-col items-center justify-center relative shrink-0 ${activeClass}" data-day="${i}"><span class="text-[9px] uppercase font-bold opacity-60">${d}</span><span class="text-lg font-black">${i === new Date().getDay() ? '★' : new Date().getDate() + (i - new Date().getDay())}</span>${hasData ? '<div class="status-dot"></div>' : ''}</button>`);
                });
            }

            function loadDay(i) {
                activeDay = parseInt(i);
                $('.day-btn').removeClass('active').addClass('glass-panel text-slate-400');
                $(`.day-btn[data-day="${activeDay}"]`).addClass('active').removeClass('glass-panel text-slate-400');
                
                const data = schedule[activeDay];
                $('#day-focus').text(data.focus);
                
                $('.muscle-part').removeClass('muscle-active');
                data.muscles.forEach(m => $(`.muscle-part[data-muscle="${m}"]`).addClass('muscle-active'));

                buildQueue(); // Initial build
                renderList();
                updateProgress();
                endSession(true); // Reset state
            }

            function renderList() {
                const container = $('#workout-list').empty();
                if(currentSessionList.length === 0) { container.html('<div class="text-center text-slate-500 py-10">No exercises.</div>'); return; }

                currentSessionList.forEach((ex, idx) => {
                    const isDone = completed[activeDay] && completed[activeDay].includes(ex.id);
                    const reps = Math.ceil(ex.reps * profile.level);
                    const isTimed = (ex.unit.toLowerCase().includes('sec'));
                    
                    // Determine Button State
                    let btnHtml = '';
                    if (!isSessionActive) {
                        // Preview Mode: Disabled Buttons
                        btnHtml = `<div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-slate-500"><i class="fas fa-lock text-xs"></i></div>`;
                    } else if (isDone) {
                        btnHtml = `<div class="w-12 h-12 rounded-full gradient-bg flex items-center justify-center shadow-lg"><i class="fas fa-check text-white"></i></div>`;
                    } else if (isTimed) {
                        btnHtml = `<button class="timer-btn w-12 h-12 rounded-full glass-panel flex items-center justify-center text-white active:scale-90 transition" data-id="${ex.id}" data-duration="${reps}"><i class="fas fa-play text-xs"></i></button>`;
                    } else {
                        btnHtml = `<button class="check-btn w-12 h-12 rounded-full glass-panel flex items-center justify-center text-slate-500 hover:text-white active:scale-90 transition" data-id="${ex.id}"><i class="fas fa-check"></i></button>`;
                    }

                    // Warmup Tag
                    const isWarmup = ex.id.startsWith('wm');
                    const badge = isWarmup ? `<span class="text-[9px] bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded ml-2 uppercase font-bold">Warmup</span>` : '';
                    
                    if(isEditing) {
                        container.append(`<div class="glass-panel p-4 rounded-3xl text-center text-xs text-slate-500 list-item">Editing Disabled</div>`);
                    } else {
                        container.append(`
                            <div class="glass-panel p-5 rounded-[1.8rem] transition-all duration-300 ${isDone ? 'completed' : ''} list-item" id="card-${ex.id}">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-4">
                                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white gradient-bg shadow-lg"><i class="fas ${ex.icon}"></i></div>
                                        <div>
                                            <div class="flex items-center"><h3 class="font-bold text-white uppercase text-sm tracking-tight">${ex.name}</h3>${badge}</div>
                                            <p class="text-slate-400 font-bold text-xs uppercase dynamic-text-${ex.id}">${reps} ${ex.unit}</p>
                                        </div>
                                    </div>
                                    ${btnHtml}
                                </div>
                            </div>
                        `);
                    }
                });
            }

            // --- EXERCISE LOGIC ---
            function updateGymMode() {
                if(!isSessionActive) return;
                const nextEx = currentSessionList.find(e => !completed[activeDay]?.includes(e.id));
                if (nextEx) {
                    $('#gym-name').text(nextEx.name); $('#gym-target').text(Math.ceil(nextEx.reps * profile.level)); $('#gym-unit').text(nextEx.unit);
                } else {
                    $('#gym-name').text("DONE"); $('#gym-target').text("✔"); $('#gym-unit').text("");
                }
            }

            $(document).on('click', '.check-btn', function() { completeExercise($(this).data('id'), $(this)); });

            $(document).on('click', '.timer-btn', function() {
                const btn = $(this);
                if (btn.hasClass('running')) return;
                btn.addClass('running gradient-bg border-transparent text-white');
                let timeLeft = btn.data('duration');
                const label = $(`.dynamic-text-${btn.data('id')}`);
                playSound("Go");
                const intv = setInterval(() => {
                    timeLeft--;
                    btn.html(`<span class="text-xs font-black text-white">${timeLeft}</span>`);
                    label.text(timeLeft + " Sec").addClass('gradient-text');
                    if(timeLeft <= 3 && timeLeft > 0) playSound("beep");
                    if(timeLeft <= 0) { clearInterval(intv); completeExercise(btn.data('id'), btn); }
                }, 1000);
            });

            function completeExercise(id, btnEl) {
                if(!completed[activeDay]) completed[activeDay] = [];
                if(!completed[activeDay].includes(id)) {
                    completed[activeDay].push(id);
                    localStorage.setItem('amy_completed', JSON.stringify(completed));
                }
                $(`#card-${id}`).addClass('completed');
                btnEl.replaceWith(`<div class="w-12 h-12 rounded-full gradient-bg flex items-center justify-center shadow-lg"><i class="fas fa-check text-white"></i></div>`);
                if(navigator.vibrate) navigator.vibrate(50);
                updateProgress();
                updateGymMode();
                const remaining = currentSessionList.filter(e => !completed[activeDay].includes(e.id));
                if(remaining.length > 0) {
                    triggerRest(remaining[0]);
                    setTimeout(() => { document.getElementById('card-'+remaining[0].id).scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 600);
                } else {
                    finishSession();
                }
            }

            function triggerRest(nextEx) {
                $('#rest-modal').removeClass('hidden');
                $('#next-ex-name').text(nextEx.name);
                playSound("Rest.");
                let time = nextEx.rest || 30;
                $('#rest-timer').text(time);
                const intv = setInterval(() => {
                    time--;
                    $('#rest-timer').text(time);
                    if(time <= 3 && time > 0) playSound("beep");
                    if(time <= 0) { clearInterval(intv); $('#rest-modal').addClass('hidden'); playSound("Start!"); }
                }, 1000);
                $('#skip-rest').one('click', () => { clearInterval(intv); $('#rest-modal').addClass('hidden'); });
                $('#add-time').click(() => { time += 15; $('#rest-timer').text(time); });
            }

            // --- UTILS ---
            function playSound(text) {
                if(profile.sound === 'silent') return;
                if(text === 'beep' || profile.sound === 'beep') {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.value = 880; o.start(); 
                    g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
                    o.stop(audioCtx.currentTime + 0.1);
                } else {
                    synth.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.1; synth.speak(u);
                }
            }

            function updateProgress() {
                const total = currentSessionList.length;
                const done = currentSessionList.filter(e => completed[activeDay]?.includes(e.id)).length;
                const pct = Math.round((done / total) * 100) || 0;
                $('#percent-text').text(pct + '%'); $('#mini-progress').css('width', pct + '%');
                if(done === total && total > 0) renderWeekNav();
            }

            function finishSession() {
                fireConfetti(); endSession(false); playSound("Session Complete!"); setTimeout(() => alert("Great work!"), 1000);
            }
            function fireConfetti() {
                const c = document.getElementById('confetti-canvas'); const x = c.getContext('2d');
                c.width=window.innerWidth; c.height=window.innerHeight;
                let p=[]; for(let i=0;i<100;i++)p.push({x:c.width/2,y:c.height/2,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20,c:`hsl(${Math.random()*360},100%,50%)`,a:1});
                function a(){x.clearRect(0,0,c.width,c.height);p.forEach((k,i)=>{k.x+=k.vx;k.y+=k.vy;k.vy+=0.5;k.a-=0.02;x.fillStyle=k.c;x.globalAlpha=k.a;x.fillRect(k.x,k.y,8,8);if(k.a<=0)p.splice(i,1)});if(p.length)requestAnimationFrame(a);}a();
            }

            function updateProfileUI() {
                $('#difficulty-display').text(profile.level.toFixed(1) + "x");
                $('#modal-level-val').text(profile.level.toFixed(1) + "x");
            }

            // Bindings
            $('.day-btn').click(function() { loadDay($(this).data('day')); });
            $('#open-profile').click(() => $('#profile-modal').removeClass('hidden'));
            $('#close-profile').click(() => $('#profile-modal').addClass('hidden'));
            
            // Reset
            $('#reset-day-btn').click(() => { 
                if(confirm("Clear today's progress?")) { 
                    delete completed[activeDay]; 
                    localStorage.setItem('amy_completed', JSON.stringify(completed)); 
                    loadDay(activeDay); 
                }
            });

            // Settings
            $('.theme-btn').click(function() {
                const t = $(this).data('theme'); $('body').removeClass().addClass(t);
                profile.theme = t; localStorage.setItem('amy_profile', JSON.stringify(profile));
            });
            $('#level-up-btn').click(() => { profile.level += 0.1; localStorage.setItem('amy_profile', JSON.stringify(profile)); updateProfileUI(); loadDay(activeDay); });
            $('#level-reset-btn').click(() => { profile.level = 1.0; localStorage.setItem('amy_profile', JSON.stringify(profile)); updateProfileUI(); loadDay(activeDay); });
            $('#hard-reset').click(() => { if(confirm("Factory Reset?")) { localStorage.clear(); location.reload(); }});
            $('#toggle-edit').click(() => { isEditing = !isEditing; renderList(); });
        });
    </script>
</body>
</html>
