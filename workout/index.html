<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Burn PRO | Voice Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @keyframes pulse-bg { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .skeleton { animation: pulse-bg 1.5s infinite ease-in-out; background: #334155; }
        .progress-ring__circle { transition: stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: rotate(-90deg); transform-origin: 50% 50%; }
        .muscle-part { fill: #334155; transition: fill 0.6s ease; }
        .muscle-active { fill: #6366f1; }
        .completed { opacity: 0.35; pointer-events: none; filter: grayscale(1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans">

    <nav class="fixed top-0 w-full bg-slate-900/90 backdrop-blur border-b border-slate-800 z-50 p-3">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex space-x-6">
                <button class="nav-link active text-indigo-400 text-sm font-black uppercase tracking-tighter" data-tab="today">Today</button>
                <button class="nav-link text-slate-500 text-sm font-black uppercase tracking-tighter" data-tab="history">History</button>
            </div>
            <div class="flex items-center space-x-4">
                <i id="voice-indicator" class="fas fa-volume-up text-indigo-500 opacity-50"></i>
                <button id="open-settings" class="text-slate-400"><i class="fas fa-cog"></i></button>
            </div>
        </div>
    </nav>

    <main id="today" class="tab-content active max-w-md mx-auto mt-20 p-4">
        
        <div class="bg-slate-900 rounded-[2rem] p-6 border border-slate-800 shadow-2xl mb-8 flex items-center justify-between relative overflow-hidden">
            <div class="relative flex items-center justify-center z-10">
                <svg class="w-24 h-24">
                    <circle class="text-slate-800" stroke-width="6" stroke="currentColor" fill="transparent" r="42" cx="48" cy="48"/>
                    <circle id="progress-ring" class="text-indigo-500 progress-ring__circle" stroke-width="6" stroke-dasharray="263.8" stroke-dashoffset="263.8" stroke-linecap="round" stroke="currentColor" fill="transparent" r="42" cx="48" cy="48"/>
                </svg>
                <div class="absolute text-center">
                    <span id="progress-percent" class="text-xl font-black text-white">0%</span>
                </div>
            </div>

            <div class="flex-grow ml-6 z-10">
                <div class="text-3xl font-black text-white" id="cal-display">0</div>
                <div class="text-[10px] text-slate-500 uppercase tracking-[0.2em] mb-3">Calories</div>
                <div class="flex items-center space-x-2 bg-slate-800/50 w-fit px-3 py-1 rounded-full border border-slate-700">
                    <i class="fas fa-fire text-orange-500 text-xs"></i>
                    <span id="streak-display" class="text-xs font-bold text-slate-200">0</span>
                    <span class="text-[9px] text-slate-500 uppercase">Streak</span>
                </div>
            </div>

            <div class="w-14 h-20 opacity-60">
                <svg viewBox="0 0 50 100" class="muscle-svg">
                    <rect x="18" y="10" width="14" height="12" rx="6" class="muscle-part" data-muscle="Core"/>
                    <rect x="10" y="25" width="30" height="25" rx="4" class="muscle-part" data-muscle="Full Body"/>
                    <rect x="5" y="25" width="6" height="30" rx="3" class="muscle-part" data-muscle="Arms"/>
                    <rect x="39" y="25" width="6" height="30" rx="3" class="muscle-part" data-muscle="Arms"/>
                    <rect x="12" y="55" width="8" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                    <rect x="30" y="55" width="8" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                </svg>
            </div>
        </div>

        

        <div id="workout-container" class="space-y-4 pb-32"></div>

        <div class="fixed bottom-8 left-0 right-0 px-6 max-w-md mx-auto z-40">
            <button id="generate-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-5 rounded-2xl text-white font-black uppercase tracking-widest shadow-xl shadow-indigo-500/20 transform active:scale-95 transition">
                Start New Session
            </button>
        </div>
    </main>

    <main id="history" class="tab-content max-w-md mx-auto mt-20 p-4">
        <h2 class="text-xl font-black mb-6 uppercase tracking-tight">Activity History</h2>
        <div id="history-container" class="space-y-3"></div>
    </main>

    <div id="rest-modal" class="hidden fixed inset-0 z-[60] bg-slate-950 flex flex-col items-center justify-center p-8">
        <div class="w-full max-w-xs bg-slate-900 rounded-[3rem] p-12 border border-slate-800 text-center relative">
             <div class="text-indigo-400 text-xs font-black uppercase tracking-[0.3em] mb-4">Recover</div>
             <div class="text-8xl font-black text-white mb-10 tabular-nums" id="rest-timer">20</div>
             <button id="skip-rest" class="text-slate-500 hover:text-white font-bold text-sm tracking-widest uppercase">Skip Rest</button>
        </div>
        <div id="up-next" class="mt-12 text-center">
            <div class="text-slate-500 text-[10px] uppercase tracking-widest mb-2">Up Next</div>
            <div class="text-xl font-bold text-white" id="next-ex-name">...</div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // --- DATA ---
            const exerciseDB = [
                { name: "Push Ups", base: 12, unit: "Reps", type: "Strength", cal: 0.6, muscle: "Full Body" },
                { name: "Jump Squats", base: 15, unit: "Reps", type: "Cardio", cal: 0.9, muscle: "Legs" },
                { name: "Plank", base: 30, unit: "Sec", isTime: true, type: "Core", cal: 0.2, muscle: "Core" },
                { name: "Burpees", base: 8, unit: "Reps", type: "Full Body", cal: 1.4, muscle: "Full Body" },
                { name: "Tricep Dips", base: 12, unit: "Reps", type: "Arms", cal: 0.5, muscle: "Arms" },
                { name: "High Knees", base: 30, unit: "Sec", isTime: true, type: "Cardio", cal: 0.4, muscle: "Legs" }
            ];

            // --- STATE ---
            let state = JSON.parse(localStorage.getItem('burn_pro_v3')) || {
                streak: 0, lastDate: null, history: [], current: [], cals: 0, diff: 1, rest: 20
            };

            const synth = window.speechSynthesis;

            // --- VOICE COACH ---
            function announce(text) {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 1;
                utterance.rate = 1;
                synth.speak(utterance);
                $('#voice-indicator').addClass('animate-pulse opacity-100');
                utterance.onend = () => $('#voice-indicator').removeClass('animate-pulse opacity-100');
            }

            function updateUI() {
                const done = state.current.filter(e => e.done).length;
                const total = state.current.length || 1;
                const percent = Math.round((done / total) * 100);
                const offset = 263.8 - (percent / 100 * 263.8);
                
                $('#progress-ring').css('stroke-dashoffset', offset);
                $('#progress-percent').text(percent + '%');
                $('#cal-display').text(Math.floor(state.cals));
                $('#streak-display').text(state.streak);

                $('.muscle-part').removeClass('muscle-active');
                state.current.forEach(ex => {
                    if(!ex.done) $(`.muscle-part[data-muscle="${ex.muscle}"]`).addClass('muscle-active');
                });
            }

            function generate() {
                const container = $('#workout-container').empty();
                for(let i=0; i<5; i++) container.append('<div class="h-28 w-full skeleton rounded-3xl"></div>');

                setTimeout(() => {
                    state.current = exerciseDB.sort(() => 0.5 - Math.random()).slice(0, 5).map(ex => ({
                        ...ex,
                        target: Math.ceil(ex.base * state.diff),
                        done: false,
                        id: Math.random().toString(36).substr(2, 9)
                    }));
                    state.cals = 0;
                    save();
                    render();
                    announce("Workout ready. Your first exercise is " + state.current[0].name);
                }, 600);
            }

            function render() {
                const container = $('#workout-container').empty();
                state.current.forEach(ex => {
                    container.append(`
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-[2rem] flex items-center justify-between transition-all ${ex.done ? 'completed' : ''}">
                            <div>
                                <h3 class="font-black text-white text-lg tracking-tight">${ex.name}</h3>
                                <p class="text-indigo-500 font-bold text-sm">${ex.target} ${ex.unit}</p>
                            </div>
                            <button class="check-btn w-14 h-14 rounded-2xl bg-slate-800 flex items-center justify-center text-slate-400 active:bg-indigo-600 active:text-white transition shadow-lg" data-id="${ex.id}">
                                <i class="fas fa-check"></i>
                            </button>
                        </div>
                    `);
                });
            }

            function save() {
                localStorage.setItem('burn_pro_v3', JSON.stringify(state));
                updateUI();
            }

            // --- ACTIONS ---
            $(document).on('click', '.check-btn', function() {
                const id = $(this).data('id');
                const ex = state.current.find(e => e.id === id);
                ex.done = true;
                state.cals += (ex.cal * ex.target);
                
                const next = state.current.find(e => !e.done);
                if(!next) {
                    finishWorkout();
                } else if(state.rest > 0) {
                    startRest(next);
                }
                save();
                render();
            });

            function startRest(next) {
                $('#next-ex-name').text(next.name);
                $('#rest-modal').removeClass('hidden');
                announce("Take a rest. Up next: " + next.name);
                
                let time = state.rest;
                const timer = setInterval(() => {
                    time--;
                    $('#rest-timer').text(time);
                    if(time <= 3 && time > 0) announce(time.toString());
                    if(time <= 0) {
                        clearInterval(timer);
                        $('#rest-modal').addClass('hidden');
                        announce("Go!");
                    }
                }, 1000);
                $('#skip-rest').one('click', () => { clearInterval(timer); $('#rest-modal').addClass('hidden'); announce("Ready? Go."); });
            }

            function finishWorkout() {
                const today = new Date().toDateString();
                if(state.lastDate !== today) {
                    state.streak++;
                    state.lastDate = today;
                    state.history.unshift({ date: today, cals: state.cals });
                }
                announce("Amazing work. Session complete.");
            }

            $('.nav-link').click(function() {
                const tab = $(this).data('tab');
                $('.nav-link').removeClass('active text-indigo-400').addClass('text-slate-500');
                $(this).addClass('active text-indigo-400').removeClass('text-slate-500');
                $('.tab-content').removeClass('active');
                $('#' + tab).addClass('active');
                if(tab === 'history') {
                    $('#history-container').empty();
                    state.history.forEach(h => {
                        $('#history-container').append(`<div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex justify-between font-bold"><span class="text-slate-500">${h.date}</span><span class="text-indigo-400">${Math.floor(h.cals)} Kcal</span></div>`);
                    });
                }
            });

            $('#generate-btn').click(generate);
            if(state.current.length) render();
            updateUI();
        });
    </script>
</body>
</html>
