<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Burn | Pro Elite</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root { --zone:#6366f1 }
.completed{opacity:.25;filter:grayscale(1)}
.progress{transition:stroke-dashoffset .5s}
</style>
</head>

<body class="bg-slate-950 text-slate-200">

<!-- SUMMARY SCREEN -->
<div id="summary" class="hidden fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-8 text-center">
  <h1 class="text-4xl font-black mb-6">Workout Complete</h1>
  <div class="space-y-3 text-lg">
    <div>🔥 Calories: <span id="sumCals"></span></div>
    <div>⏱ Time: <span id="sumTime"></span></div>
    <div>❤️ Avg BPM: <span id="sumBpm"></span></div>
    <div>⚡ Peak Zone: <span id="sumZone"></span></div>
    <div>📈 Difficulty Next Time: <span id="sumDiff"></span></div>
  </div>
  <button onclick="location.reload()" class="mt-8 px-8 py-3 bg-white text-black rounded-xl font-black uppercase">Done</button>
</div>

<header class="fixed top-0 w-full bg-slate-950/90 backdrop-blur border-b border-white/5 px-6 py-4">
  <div class="max-w-md mx-auto flex justify-between items-center">
    <span id="bpm" class="font-black">72 BPM</span>
    <span id="zone" class="text-xs uppercase tracking-widest text-indigo-500">Warm Up</span>
  </div>
</header>

<main class="max-w-md mx-auto pt-24 p-6 pb-40">

<div class="bg-slate-900 p-6 rounded-2xl mb-6 text-center">
  <svg class="w-32 h-32 mx-auto mb-4">
    <circle r="58" cx="64" cy="64" fill="none" stroke="#1e293b" stroke-width="4"/>
    <circle id="ring" r="58" cx="64" cy="64" fill="none" stroke="var(--zone)" stroke-width="4"
      stroke-dasharray="364" stroke-dashoffset="364" stroke-linecap="round" class="progress"/>
  </svg>
  <div id="cals" class="text-3xl font-black">0</div>
  <input id="goal" type="range" min="100" max="600" step="50" value="200" class="w-full mt-4">
</div>

<div id="list" class="space-y-4 text-xs uppercase tracking-widest text-slate-500 text-center">
Set goal & start
</div>

</main>

<footer class="fixed bottom-0 w-full bg-slate-950/90 p-6">
<button id="start" class="w-full bg-white text-black py-4 rounded-xl font-black uppercase">Assemble Routine</button>
</footer>

<div id="modal" class="hidden fixed inset-0 bg-slate-950 z-40 flex flex-col items-center justify-center">
  <div id="timer" class="text-8xl font-black mb-4">20</div>
  <div id="label" class="uppercase tracking-widest text-indigo-500 mb-6">REST</div>
  <button id="skip" class="uppercase text-xs tracking-widest text-slate-500">Skip</button>
</div>

<script>
/* ---------- PWA ---------- */
if ("serviceWorker" in navigator) {
 navigator.serviceWorker.register("sw.js");
}

/* ---------- DATA ---------- */
const DB=[
 {n:"Push Ups",b:15,cal:.6,u:"Reps"},
 {n:"Jump Squats",b:12,cal:1,u:"Reps"},
 {n:"Plank",b:45,cal:.2,u:"Sec"},
 {n:"Burpees",b:8,cal:1.8,u:"Reps"},
 {n:"Wall Sit",b:40,cal:.4,u:"Sec"}
];

/* ---------- ENGINE ---------- */
const Engine={
 state:{
  list:[],i:0,c:0,goal:200,
  bpmLog:[],zoneLog:[],
  start:0,difficulty:1
 },

 zone(){
  const p=this.i()/this.state.list.length;
  if(p>.9) return ["Peak","#ef4444",1.4];
  if(p>.7) return ["Anabolic","#f59e0b",1.25];
  if(p>.3) return ["Fat Burn","#10b981",1.1];
  return ["Warm Up","#6366f1",1];
 },

 i(){return this.state.i},
 cur(){return this.state.list[this.state.i]},

 progress(){return this.i()/this.state.list.length},

 complete(){
  const [z,,m]=this.zone();
  const e=this.cur();
  this.state.c+=e.cal*e.b*m;
  this.state.i++;
  this.state.zoneLog.push(z);
  render();
 }
};

/* ---------- AI DIFFICULTY ---------- */
function adaptDifficulty(){
 const perf=Engine.state.c/Engine.state.goal;
 if(perf>1.1) Engine.state.difficulty+=0.1;
 if(perf<0.9) Engine.state.difficulty=Math.max(0.8,Engine.state.difficulty-0.1);
 localStorage.setItem("difficulty",Engine.state.difficulty);
}

/* ---------- ASSEMBLE ---------- */
function assemble(){
 Engine.state.goal=+goal.value;
 Engine.state.list=[];
 Engine.state.i=0;
 Engine.state.c=0;
 Engine.state.start=Date.now();
 let burn=0;
 while(burn<Engine.state.goal){
  let e={...DB[Math.random()*DB.length|0]};
  e.b=Math.round(e.b*Engine.state.difficulty);
  burn+=e.cal*e.b;
  Engine.state.list.push(e);
 }
 render();
}

/* ---------- FLOW ---------- */
function startEx(){
 const e=Engine.cur();
 let t=e.u==="Sec"?e.b:(e.cal>1?30:15);
 modal.classList.remove("hidden");
 label.textContent=e.n;
 timer.textContent=t;
 const int=setInterval(()=>{
  t--; timer.textContent=t;
  if(t<=0){clearInterval(int);modal.classList.add("hidden");Engine.complete();}
 },1000);
 skip.onclick=()=>{clearInterval(int);modal.classList.add("hidden");Engine.complete();}
}

/* ---------- RENDER ---------- */
function render(){
 list.innerHTML="";
 Engine.state.list.forEach((e,idx)=>{
  list.innerHTML+=`
  <div class="bg-slate-900 p-4 rounded-xl flex justify-between ${idx<Engine.i()?'completed':''}">
    <div>${e.n} • ${e.b} ${e.u}</div>
    ${idx===Engine.i()?`<button onclick="startEx()">▶</button>`:""}
  </div>`;
 });

 const p=Engine.progress();
 ring.style.strokeDashoffset=364-(364*p);
 cals.textContent=Math.floor(Engine.state.c);

 const [z,c]=Engine.zone();
 document.documentElement.style.setProperty("--zone",c);
 zone.textContent=z;

 const bpm=Math.floor(72+Math.sin(p*Math.PI/2)*88);
 bpmEl=bpm+" BPM";
 Engine.state.bpmLog.push(bpm);

 if(Engine.i()>=Engine.state.list.length && Engine.state.list.length){
  finish();
 }
}

/* ---------- SUMMARY ---------- */
function finish(){
 adaptDifficulty();
 const time=Math.round((Date.now()-Engine.state.start)/60000);
 sumCals.textContent=Math.floor(Engine.state.c);
 sumTime.textContent=time+" min";
 sumBpm.textContent=Math.round(Engine.state.bpmLog.reduce((a,b)=>a+b,0)/Engine.state.bpmLog.length);
 sumZone.textContent=[...new Set(Engine.state.zoneLog)].join(", ");
 sumDiff.textContent=Engine.state.difficulty.toFixed(2);
 summary.classList.remove("hidden");
}

/* ---------- INIT ---------- */
Engine.state.difficulty=+localStorage.getItem("difficulty")||1;
start.onclick=assemble;
</script>

</body>
</html>
