<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Burn | Pearl</title>
    
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES --- */
        :root { 
            --bg-main: #0f172a; 
            --glass-bg: rgba(15, 23, 42, 0.90);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6; 
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            --text-main: #f1f5f9;
        }

        /* Themes */
        body.theme-ruby { --primary: #f43f5e; --primary-gradient: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); }
        body.theme-emerald { --primary: #10b981; --primary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        body.theme-amber { --primary: #f59e0b; --primary-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; transition: background 0.5s; }

        /* --- UI COMPONENTS --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .gradient-text { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-bg { background: var(--primary-gradient); }
        
        .completed { opacity: 0.4; filter: grayscale(1); transform: scale(0.98); pointer-events: none; transition: 0.4s; }

        /* Tabs */
        .tab-btn { opacity: 0.5; border-bottom: 2px solid transparent; transition: 0.3s; }
        .tab-btn.active { opacity: 1; border-color: var(--primary); color: white; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Inputs */
        .glass-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 0.75rem; padding: 0.75rem; width: 100%; font-size: 0.875rem; outline: none; transition: 0.3s; }
        .glass-input:focus { border-color: var(--primary); background: rgba(0,0,0,0.5); }

        /* Switch */
        .toggle-checkbox:checked { right: 0; border-color: var(--primary); }
        .toggle-checkbox:checked + .toggle-label { background-color: var(--primary); }

        /* Muscle SVG */
        .muscle-part { fill: rgba(255,255,255,0.05); transition: fill 0.6s ease; }
        .muscle-active { fill: var(--primary); filter: drop-shadow(0 0 8px var(--primary)); }
        
        /* Landscape Mode */
        #gym-mode { display: none; }
        @media (orientation: landscape) and (max-height: 500px) { body { overflow: hidden; } #main-ui { display: none; } #gym-mode { display: flex; } }
    </style>
</head>
<body class="theme-default">

    <canvas id="confetti-canvas" style="position:fixed;top:0;left:0;pointer-events:none;z-index:999;"></canvas>

    <div id="gym-mode" class="fixed inset-0 z-[300] flex-col items-center justify-center p-6 text-center bg-slate-950">
        <div class="text-xs font-bold text-slate-500 uppercase tracking-[0.3em] mb-2">NOW ACTIVE</div>
        <h1 id="gym-name" class="text-6xl font-black text-white uppercase leading-none mb-4 tracking-tighter">START</h1>
        <div class="flex items-baseline justify-center space-x-4">
            <div id="gym-target" class="text-[8rem] font-black gradient-text tabular-nums leading-none">--</div>
            <div id="gym-unit" class="text-3xl font-bold text-slate-500 uppercase">--</div>
        </div>
        <div id="gym-timer" class="absolute top-6 right-6 text-2xl font-mono text-white opacity-50 font-bold">00:00</div>
    </div>

    <div id="main-ui" class="pb-32 relative">
        
        <header class="fixed top-0 w-full glass-panel z-[60] pt-4 pb-3 px-4 border-b-0 rounded-b-3xl">
            <div class="max-w-md mx-auto">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center space-x-3 cursor-pointer group" id="open-profile">
                        <div class="w-10 h-10 rounded-full gradient-bg flex items-center justify-center shadow-lg group-active:scale-95 transition">
                            <i class="fas fa-sliders-h text-white text-sm"></i>
                        </div>
                        <div>
                            <span class="text-[10px] font-bold text-slate-400 uppercase block leading-none mb-1">Settings</span>
                            <span class="text-sm font-black text-white uppercase tracking-tight">Menu</span>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button id="toggle-edit" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-slate-400 hover:text-white transition"><i class="fas fa-pencil-alt text-sm"></i></button>
                    </div>
                </div>
                <div class="flex justify-between space-x-2 overflow-x-auto no-scrollbar pb-1" id="day-nav-container"></div>
            </div>
        </header>

        <main class="max-w-md mx-auto mt-40 px-4">
            
            <div class="glass-panel rounded-[2.5rem] p-6 mb-8 relative overflow-hidden transition-all duration-300" id="stats-card">
                
                <button id="session-action-btn" class="absolute top-6 right-6 text-[10px] font-black uppercase tracking-widest transition z-20 flex items-center px-3 py-1 rounded-full bg-slate-800/50 hover:bg-slate-700 text-slate-400">
                    <i class="fas fa-redo-alt mr-2"></i> Reset
                </button>

                <div class="flex justify-between items-center relative z-10">
                    <div class="flex-1">
                        <div id="day-focus" class="gradient-text font-black uppercase tracking-widest text-xs mb-2">...</div>
                        <div class="flex items-baseline space-x-2 mb-2">
                            <h2 id="global-timer" class="text-6xl font-mono font-black text-white tracking-tighter">00:00</h2>
                        </div>
                        <div class="w-full max-w-[140px]">
                            <div class="flex justify-between text-[9px] font-bold text-slate-500 uppercase mb-1">
                                <span>Progress</span>
                                <span id="percent-text">0%</span>
                            </div>
                            <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                                <div id="mini-progress" class="h-full gradient-bg w-0 transition-all duration-500"></div>
                            </div>
                        </div>
                    </div>
                    <div class="w-20 h-28 opacity-90 relative">
                         <svg viewBox="0 0 50 100" class="w-full h-full drop-shadow-xl">
                            <g transform="translate(0,0)">
                                <rect x="10" y="22" width="30" height="28" rx="4" class="muscle-part" data-muscle="Chest"/>
                                <rect x="2" y="24" width="7" height="32" rx="3" class="muscle-part" data-muscle="Arms"/>
                                <rect x="41" y="24" width="7" height="32" rx="3" class="muscle-part" data-muscle="Arms"/>
                                <rect x="12" y="58" width="10" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                                <rect x="28" y="58" width="10" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                                <rect x="20" y="35" width="10" height="15" rx="2" class="muscle-part" data-muscle="Abs" style="opacity:0.5"/>
                            </g>
                        </svg>
                    </div>
                </div>
            </div>

            <div id="start-overlay" class="absolute top-36 left-0 right-0 z-40 flex flex-col items-center justify-start pt-6 h-full transition-all duration-500">
                <div class="glass-panel p-2 rounded-[3rem] mb-6">
                    <button id="start-btn" class="gradient-bg text-white font-black uppercase text-xl py-6 px-16 rounded-[2.8rem] shadow-2xl shadow-blue-500/20 transform transition hover:scale-105 active:scale-95 animate-bounce flex items-center">
                        <i class="fas fa-play mr-3"></i> Start
                    </button>
                </div>
                
                <div class="flex items-center space-x-3 glass-panel px-6 py-3 rounded-xl">
                    <span class="text-xs font-bold text-slate-300 uppercase tracking-wide">Include Warm-Up</span>
                    <div class="relative inline-block w-10 h-6 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="warmup-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300"/>
                        <label for="warmup-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-700 cursor-pointer"></label>
                    </div>
                </div>
            </div>

            <div id="workout-list" class="space-y-3 blur-sm transition-all duration-500 pointer-events-none pb-20"></div>

        </main>
    </div>

    <div id="profile-modal" class="hidden fixed inset-0 z-[100] backdrop-blur-lg bg-slate-950/80 flex flex-col items-center justify-end sm:justify-center">
        <div class="glass-panel w-full max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 relative h-[85vh] sm:h-auto overflow-y-auto border-b-0">
            <button id="close-profile" class="absolute top-6 right-6 text-slate-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            
            <h2 class="text-2xl font-black text-white mb-6 tracking-tight pl-2">Settings</h2>

            <div class="flex border-b border-white/10 mb-6 px-2">
                <button class="tab-btn active px-4 py-2 text-xs font-bold uppercase tracking-widest" data-tab="tab-prefs">Prefs</button>
                <button class="tab-btn px-4 py-2 text-xs font-bold uppercase tracking-widest" data-tab="tab-body">Body</button>
                <button class="tab-btn px-4 py-2 text-xs font-bold uppercase tracking-widest" data-tab="tab-data">Data</button>
            </div>

            <div id="tab-prefs" class="tab-content active space-y-6">
                
                <div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Theme</span>
                    <div class="grid grid-cols-4 gap-3 mt-2">
                        <button class="theme-btn h-10 rounded-xl bg-[#3b82f6]" data-theme="theme-default"></button>
                        <button class="theme-btn h-10 rounded-xl bg-[#f43f5e]" data-theme="theme-ruby"></button>
                        <button class="theme-btn h-10 rounded-xl bg-[#10b981]" data-theme="theme-emerald"></button>
                        <button class="theme-btn h-10 rounded-xl bg-[#f59e0b]" data-theme="theme-amber"></button>
                    </div>
                </div>

                <div class="p-4 bg-black/20 rounded-2xl border border-white/5">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Difficulty Multiplier</span>
                    <div class="flex items-center justify-between mt-1 mb-3">
                        <span class="text-xl font-black text-white" id="modal-level-val">1.0x</span>
                        <button id="level-reset-btn" class="text-[9px] font-bold text-slate-500 uppercase hover:text-white">Reset</button>
                    </div>
                    <button id="level-up-btn" class="w-full py-3 gradient-bg rounded-xl font-bold text-white text-xs uppercase tracking-widest shadow-lg active:scale-95 transition">Increase (+10%)</button>
                </div>

                <div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Audio</span>
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <select id="sound-pref" class="glass-input">
                            <option value="voice">Voice Coach</option>
                            <option value="beep">Beeps Only</option>
                            <option value="silent">Silent</option>
                        </select>
                        <button id="test-audio" class="glass-input text-center font-bold text-xs uppercase hover:bg-white/10">Test Audio</button>
                    </div>
                </div>
            </div>

            <div id="tab-body" class="tab-content space-y-6">
                 <div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Your Metrics</span>
                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <input type="number" id="input-weight" placeholder="Weight (kg)" class="glass-input">
                        <input type="number" id="input-height" placeholder="Height (cm)" class="glass-input">
                        <input type="number" id="input-age" placeholder="Age" class="glass-input">
                        <select id="input-gender" class="glass-input">
                            <option value="m">Male</option>
                            <option value="f">Female</option>
                        </select>
                    </div>
                    <button id="save-body-stats" class="w-full mt-4 py-3 bg-slate-800 text-white rounded-xl font-bold text-xs uppercase hover:bg-slate-700">Save & Calculate</button>
                 </div>

                 <div class="p-4 bg-black/20 rounded-2xl border border-white/5 text-center hidden" id="stats-result">
                     <div class="grid grid-cols-2 gap-4">
                         <div>
                             <span class="block text-[9px] text-slate-500 uppercase">BMI</span>
                             <span class="text-xl font-black text-white" id="res-bmi">--</span>
                         </div>
                         <div>
                             <span class="block text-[9px] text-slate-500 uppercase">Daily Kcal</span>
                             <span class="text-xl font-black text-white" id="res-tdee">--</span>
                         </div>
                     </div>
                 </div>
            </div>

            <div id="tab-data" class="tab-content space-y-4">
                <button id="export-data" class="w-full py-3 glass-input text-left flex items-center"><i class="fas fa-download mr-3 text-slate-400"></i> Export Backup (JSON)</button>
                
                <label class="w-full py-3 glass-input text-left flex items-center cursor-pointer">
                    <i class="fas fa-upload mr-3 text-slate-400"></i> Import Backup
                    <input type="file" id="import-data" class="hidden" accept=".json">
                </label>

                <div class="pt-4 border-t border-white/10">
                    <button id="hard-reset" class="w-full py-3 border border-red-500/30 text-red-400 hover:bg-red-500/10 rounded-xl font-bold text-xs uppercase tracking-widest transition">Factory Reset App</button>
                </div>
                <div class="text-center text-[9px] text-slate-600 font-mono mt-4">Version 13.0 Pearl</div>
            </div>

        </div>
    </div>

    <div id="rest-modal" class="hidden fixed inset-0 z-[400] bg-slate-950/95 flex flex-col items-center justify-center p-8 backdrop-blur-xl">
        <div class="text-[10rem] font-black gradient-text tabular-nums mb-4 leading-none" id="rest-timer">30</div>
        <div class="text-white font-black uppercase tracking-[0.5em] text-sm mb-12 animate-pulse" id="next-ex-label">RECOVER</div>
        <div class="glass-panel p-6 rounded-[2rem] w-full max-w-xs text-center mb-10 transform scale-110">
            <p class="text-slate-400 text-[10px] uppercase tracking-widest mb-2 font-bold">Up Next</p>
            <h3 id="next-ex-name" class="text-2xl font-black text-white">...</h3>
        </div>
        <div class="flex space-x-6">
            <button id="add-time" class="w-20 h-20 rounded-full glass-panel text-white font-bold hover:bg-white/10 active:scale-90 transition flex flex-col items-center justify-center"><span class="text-sm">+15</span><span class="text-[9px] text-slate-500">SEC</span></button>
            <button id="skip-rest" class="w-20 h-20 rounded-full glass-panel text-white font-bold hover:bg-white/10 active:scale-90 transition flex items-center justify-center"><i class="fas fa-forward text-xl"></i></button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            
            // --- DATA ---
            const defaultSchedule = {
                1: { focus: "Chest & Triceps", color: "#3b82f6", muscles: ["Chest", "Arms"], exercises: [{ id: "m1", name: "Push Ups", reps: 15, unit: "Reps", icon: "fa-hand-rock", rest: 30 }, { id: "m2", name: "Plank", reps: 45, unit: "Sec", icon: "fa-stopwatch", rest: 30 }, { id: "m3", name: "Tricep Dips", reps: 15, unit: "Reps", icon: "fa-chair", rest: 30 }] },
                2: { focus: "Back & Biceps", color: "#10b981", muscles: ["Chest", "Arms"], exercises: [{ id: "tu1", name: "Superman Holds", reps: 45, unit: "Sec", icon: "fa-superpowers", rest: 30 }, { id: "tu2", name: "Doorframe Rows", reps: 15, unit: "Reps", icon: "fa-columns", rest: 30 }, { id: "tu3", name: "Good Mornings", reps: 20, unit: "Reps", icon: "fa-sun", rest: 40 }] },
                3: { focus: "Legs & Glutes", color: "#f59e0b", muscles: ["Legs"], exercises: [{ id: "w1", name: "Air Squats", reps: 20, unit: "Reps", icon: "fa-chevron-down", rest: 30 }, { id: "w2", name: "Lunges", reps: 12, unit: "Per Leg", icon: "fa-person-walking", rest: 45 }, { id: "w3", name: "Wall Sit", reps: 45, unit: "Sec", icon: "fa-chair", rest: 30 }] },
                4: { focus: "Shoulders & Core", color: "#8b5cf6", muscles: ["Arms", "Abs"], exercises: [{ id: "th1", name: "Pike Push Ups", reps: 10, unit: "Reps", icon: "fa-mountain", rest: 45 }, { id: "th2", name: "Plank", reps: 60, unit: "Sec", icon: "fa-stopwatch", rest: 30 }, { id: "th3", name: "Russian Twists", reps: 25, unit: "Reps", icon: "fa-arrows-spin", rest: 30 }] },
                5: { focus: "Full Body Intensity", color: "#ef4444", muscles: ["Chest", "Arms", "Legs", "Abs"], exercises: [{ id: "f1", name: "Burpees", reps: 10, unit: "Reps", icon: "fa-fire", rest: 60 }, { id: "f2", name: "Mtn Climbers", reps: 40, unit: "Sec", icon: "fa-person-running", rest: 30 }, { id: "f3", name: "Jumping Jacks", reps: 50, unit: "Reps", icon: "fa-star", rest: 20 }] },
                6: { focus: "Active Recovery", color: "#10b981", muscles: ["Abs"], exercises: [{ id: "s1", name: "Bird Dog", reps: 10, unit: "Per Side", icon: "fa-dog", rest: 20 }, { id: "s2", name: "Cat Cow", reps: 60, unit: "Sec", icon: "fa-cat", rest: 20 }] },
                0: { focus: "Rest & Mobility", color: "#64748b", muscles: [], exercises: [{ id: "su1", name: "Light Walk", reps: 15, unit: "Mins", icon: "fa-shoe-prints", rest: 0 }] }
            };

            const warmupRoutine = [
                { id: "wm1", name: "Arm Circles", reps: 30, unit: "Sec", icon: "fa-sync", rest: 10 },
                { id: "wm2", name: "Jumping Jacks", reps: 20, unit: "Reps", icon: "fa-star", rest: 15 }
            ];

            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            let activeDay = new Date().getDay();
            let schedule = JSON.parse(localStorage.getItem('prl_schedule')) || defaultSchedule;
            let completed = JSON.parse(localStorage.getItem('prl_completed')) || {};
            // Profile now includes Body Stats
            let profile = JSON.parse(localStorage.getItem('prl_profile')) || { level: 1.0, theme: 'theme-default', sound: 'voice', warmup: false, weight: '', height: '', age: '', gender: 'm' };
            
            let isEditing = false;
            let isSessionActive = false;
            let sessionSeconds = 0;
            let sessionTimerIntv = null;
            let currentSessionList = [];
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const synth = window.speechSynthesis;

            // --- INIT ---
            $('body').addClass(profile.theme);
            renderWeekNav();
            loadDay(activeDay);
            updateSettingsUI();

            // --- START ---
            $('#start-btn').click(startSession);

            function startSession() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                isSessionActive = true;
                
                // Save Warmup Preference
                profile.warmup = $('#warmup-toggle').is(':checked');
                saveProfile();

                // Build Queue
                const base = schedule[activeDay].exercises;
                currentSessionList = profile.warmup ? [...warmupRoutine, ...base] : [...base];

                $('#start-overlay').fadeOut();
                $('#workout-list').removeClass('blur-sm pointer-events-none');
                
                // Switch Action Button
                $('#session-action-btn').html('<i class="fas fa-stop mr-2"></i> End').addClass('text-red-400 bg-red-400/10').removeClass('text-slate-400 bg-slate-800/50');
                
                renderList();
                
                // Timer
                sessionSeconds = 0;
                clearInterval(sessionTimerIntv);
                sessionTimerIntv = setInterval(() => {
                    sessionSeconds++;
                    const m = Math.floor(sessionSeconds / 60).toString().padStart(2, '0');
                    const s = (sessionSeconds % 60).toString().padStart(2, '0');
                    $('#global-timer, #gym-timer').text(`${m}:${s}`);
                }, 1000);

                playSound("Session started.");
                updateGymMode();
            }

            function endSession(userAction = true) {
                isSessionActive = false;
                clearInterval(sessionTimerIntv);
                if(userAction) {
                    $('#start-overlay').fadeIn();
                    $('#workout-list').addClass('blur-sm pointer-events-none');
                    $('#global-timer, #gym-timer').text("00:00");
                    $('#session-action-btn').html('<i class="fas fa-redo-alt mr-2"></i> Reset').removeClass('text-red-400 bg-red-400/10').addClass('text-slate-400 bg-slate-800/50');
                    $('#gym-name').text("START"); $('#gym-target').text("--"); $('#gym-unit').text("--");
                }
            }

            $('#session-action-btn').click(function() {
                if(isSessionActive) {
                    if(confirm("End current session?")) endSession(true);
                } else {
                    if(confirm("Clear progress for this day?")) {
                        delete completed[activeDay];
                        localStorage.setItem('prl_completed', JSON.stringify(completed));
                        loadDay(activeDay);
                    }
                }
            });

            // --- UI RENDERERS ---
            function renderWeekNav() {
                const container = $('#day-nav-container').empty();
                dayNames.forEach((d, i) => {
                    const activeClass = (i === activeDay) ? 'active' : 'glass-panel text-slate-400';
                    const hasData = completed[i] && completed[i].length === schedule[i].exercises.length;
                    container.append(`<button class="day-btn w-12 h-16 rounded-2xl flex flex-col items-center justify-center relative shrink-0 ${activeClass}" data-day="${i}"><span class="text-[9px] uppercase font-bold opacity-60">${d}</span><span class="text-lg font-black">${i === new Date().getDay() ? '★' : new Date().getDate() + (i - new Date().getDay())}</span>${hasData ? '<div class="status-dot"></div>' : ''}</button>`);
                });
            }

            function loadDay(i) {
                activeDay = parseInt(i);
                $('.day-btn').removeClass('active').addClass('glass-panel text-slate-400');
                $(`.day-btn[data-day="${activeDay}"]`).addClass('active').removeClass('glass-panel text-slate-400');
                
                const data = schedule[activeDay];
                $('#day-focus').text(data.focus);
                $('.muscle-part').removeClass('muscle-active');
                data.muscles.forEach(m => $(`.muscle-part[data-muscle="${m}"]`).addClass('muscle-active'));

                currentSessionList = data.exercises; 
                renderList();
                updateProgress();
                endSession(true);
            }

            function renderList() {
                const container = $('#workout-list').empty();
                if(currentSessionList.length === 0) { container.html('<div class="text-center text-slate-500 py-10">No exercises.</div>'); return; }

                currentSessionList.forEach((ex, idx) => {
                    const isDone = completed[activeDay] && completed[activeDay].includes(ex.id);
                    const reps = Math.ceil(ex.reps * profile.level);
                    const isTimed = (ex.unit.toLowerCase().includes('sec'));
                    const delay = idx * 50; 

                    let btnHtml = isDone 
                        ? `<button class="w-12 h-12 rounded-full gradient-bg flex items-center justify-center shadow-lg"><i class="fas fa-check text-white"></i></button>`
                        : (isTimed 
                            ? `<button class="timer-btn w-12 h-12 rounded-full glass-panel flex items-center justify-center text-white active:scale-90 transition" data-id="${ex.id}" data-duration="${reps}"><i class="fas fa-play text-xs"></i></button>`
                            : `<button class="check-btn w-12 h-12 rounded-full glass-panel flex items-center justify-center text-slate-500 hover:text-white active:scale-90 transition" data-id="${ex.id}"><i class="fas fa-check"></i></button>`
                        );
                    
                    if(isEditing) {
                        container.append(`<div class="glass-panel p-4 rounded-3xl text-center text-xs text-slate-500" style="animation: slideUpFade 0.5s ease forwards ${delay}ms; opacity: 0;">Editing Disabled</div>`);
                    } else {
                        container.append(`
                            <div class="glass-panel p-5 rounded-[1.8rem] transition-all duration-300 ${isDone ? 'completed' : ''}" id="card-${ex.id}" style="animation: slideUpFade 0.5s ease forwards ${delay}ms; opacity: 0;">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-4">
                                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white gradient-bg shadow-lg"><i class="fas ${ex.icon}"></i></div>
                                        <div><h3 class="font-bold text-white uppercase text-sm tracking-tight">${ex.name}</h3><p class="text-slate-400 font-bold text-xs uppercase dynamic-text-${ex.id}">${reps} ${ex.unit}</p></div>
                                    </div>
                                    ${btnHtml}
                                </div>
                            </div>
                        `);
                    }
                });
            }

            // --- EXERCISE LOGIC ---
            function updateGymMode() {
                if(!isSessionActive) return;
                const nextEx = currentSessionList.find(e => !completed[activeDay]?.includes(e.id));
                if (nextEx) {
                    $('#gym-name').text(nextEx.name); $('#gym-target').text(Math.ceil(nextEx.reps * profile.level)); $('#gym-unit').text(nextEx.unit);
                } else {
                    $('#gym-name').text("DONE"); $('#gym-target').text("✔"); $('#gym-unit').text("");
                }
            }

            $(document).on('click', '.check-btn', function() { completeExercise($(this).data('id'), $(this)); });

            $(document).on('click', '.timer-btn', function() {
                const btn = $(this);
                if (btn.hasClass('running')) return;
                btn.addClass('running gradient-bg border-transparent text-white');
                let timeLeft = btn.data('duration');
                const label = $(`.dynamic-text-${btn.data('id')}`);
                playSound("Go");
                const intv = setInterval(() => {
                    timeLeft--;
                    btn.html(`<span class="text-xs font-black text-white">${timeLeft}</span>`);
                    label.text(timeLeft + " Sec").addClass('gradient-text');
                    if(timeLeft <= 3 && timeLeft > 0) playSound("beep");
                    if(timeLeft <= 0) { clearInterval(intv); completeExercise(btn.data('id'), btn); }
                }, 1000);
            });

            function completeExercise(id, btnEl) {
                if(!completed[activeDay]) completed[activeDay] = [];
                if(!completed[activeDay].includes(id)) {
                    completed[activeDay].push(id);
                    localStorage.setItem('prl_completed', JSON.stringify(completed));
                }
                $(`#card-${id}`).addClass('completed');
                btnEl.replaceWith(`<button class="w-12 h-12 rounded-full gradient-bg flex items-center justify-center"><i class="fas fa-check text-white"></i></button>`);
                if(navigator.vibrate) navigator.vibrate(50);
                updateProgress();
                updateGymMode();
                const remaining = currentSessionList.filter(e => !completed[activeDay].includes(e.id));
                if(remaining.length > 0) {
                    triggerRest(remaining[0]);
                    setTimeout(() => { document.getElementById('card-'+remaining[0].id).scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 600);
                } else {
                    finishSession();
                }
            }

            function triggerRest(nextEx) {
                $('#rest-modal').removeClass('hidden');
                $('#next-ex-name').text(nextEx.name);
                playSound("Rest.");
                let time = nextEx.rest || 30;
                $('#rest-timer').text(time);
                const intv = setInterval(() => {
                    time--;
                    $('#rest-timer').text(time);
                    if(time <= 3 && time > 0) playSound("beep");
                    if(time <= 0) { clearInterval(intv); $('#rest-modal').addClass('hidden'); playSound("Start!"); }
                }, 1000);
                $('#skip-rest').one('click', () => { clearInterval(intv); $('#rest-modal').addClass('hidden'); });
                $('#add-time').click(() => { time += 15; $('#rest-timer').text(time); });
            }

            // --- SETTINGS & PROFILE LOGIC ---
            
            // Tab Switching
            $('.tab-btn').click(function() {
                $('.tab-btn').removeClass('active'); $(this).addClass('active');
                $('.tab-content').removeClass('active'); $(`#${$(this).data('tab')}`).addClass('active');
            });

            // Load UI Data
            function updateSettingsUI() {
                $('#user-level-badge').text(Math.floor(profile.level));
                $('#difficulty-display').text(profile.level.toFixed(1) + "x");
                $('#modal-level-val').text(profile.level.toFixed(1) + "x");
                $('#sound-pref').val(profile.sound);
                $('#input-weight').val(profile.weight);
                $('#input-height').val(profile.height);
                $('#input-age').val(profile.age);
                $('#input-gender').val(profile.gender);
                $('#warmup-toggle').prop('checked', profile.warmup);
                calculateStats();
            }

            function saveProfile() {
                localStorage.setItem('prl_profile', JSON.stringify(profile));
            }

            // Body Stats Calc
            $('#save-body-stats').click(function() {
                profile.weight = $('#input-weight').val();
                profile.height = $('#input-height').val();
                profile.age = $('#input-age').val();
                profile.gender = $('#input-gender').val();
                saveProfile();
                calculateStats();
                $(this).html('<i class="fas fa-check"></i> Saved').addClass('bg-green-600');
                setTimeout(()=> $(this).html('Save & Calculate').removeClass('bg-green-600'), 2000);
            });

            function calculateStats() {
                const w = parseFloat(profile.weight);
                const h = parseFloat(profile.height);
                const a = parseFloat(profile.age);
                if(w && h && a) {
                    const bmi = (w / ((h/100)*(h/100))).toFixed(1);
                    const bmr = (10*w) + (6.25*h) - (5*a) + (profile.gender==='m'?5:-161);
                    const tdee = Math.round(bmr * 1.55); // Mod Active
                    $('#res-bmi').text(bmi);
                    $('#res-tdee').text(tdee);
                    $('#stats-result').removeClass('hidden');
                }
            }

            // Backup/Restore
            $('#export-data').click(function() {
                const data = { schedule, completed, profile };
                const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `dailyburn_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            });

            $('#import-data').change(function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if(data.schedule) localStorage.setItem('prl_schedule', JSON.stringify(data.schedule));
                        if(data.completed) localStorage.setItem('prl_completed', JSON.stringify(data.completed));
                        if(data.profile) localStorage.setItem('prl_profile', JSON.stringify(data.profile));
                        location.reload();
                    } catch(err) { alert("Invalid File"); }
                };
                reader.readAsText(file);
            });

            // Audio & Theme
            $('#test-audio').click(() => playSound("Test Audio OK."));
            $('#sound-pref').change(function() { profile.sound = $(this).val(); saveProfile(); });
            $('.theme-btn').click(function() {
                const t = $(this).data('theme'); $('body').removeClass().addClass(t);
                profile.theme = t; saveProfile();
            });

            // Difficulty
            $('#level-up-btn').click(() => { profile.level += 0.1; saveProfile(); updateSettingsUI(); loadDay(activeDay); });
            $('#level-reset-btn').click(() => { profile.level = 1.0; saveProfile(); updateSettingsUI(); loadDay(activeDay); });
            $('#hard-reset').click(() => { if(confirm("Factory Reset?")) { localStorage.clear(); location.reload(); }});

            // --- UTILS ---
            function playSound(text) {
                if(profile.sound === 'silent') return;
                if(text === 'beep' || profile.sound === 'beep') {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.value = 880; o.start(); 
                    g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
                    o.stop(audioCtx.currentTime + 0.1);
                } else {
                    synth.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.1; synth.speak(u);
                }
            }

            function updateProgress() {
                const total = currentSessionList.length;
                const done = currentSessionList.filter(e => completed[activeDay]?.includes(e.id)).length;
                const pct = Math.round((done / total) * 100) || 0;
                $('#percent-text').text(pct + '%'); $('#mini-progress').css('width', pct + '%');
                if(done === total && total > 0) renderWeekNav();
            }

            function finishSession() {
                fireConfetti(); endSession(false); playSound("Session Complete!"); setTimeout(() => alert("Great work!"), 1000);
            }
            function fireConfetti() {
                const c = document.getElementById('confetti-canvas'); const x = c.getContext('2d');
                c.width=window.innerWidth; c.height=window.innerHeight;
                let p=[]; for(let i=0;i<100;i++)p.push({x:c.width/2,y:c.height/2,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20,c:`hsl(${Math.random()*360},100%,50%)`,a:1});
                function a(){x.clearRect(0,0,c.width,c.height);p.forEach((k,i)=>{k.x+=k.vx;k.y+=k.vy;k.vy+=0.5;k.a-=0.02;x.fillStyle=k.c;x.globalAlpha=k.a;x.fillRect(k.x,k.y,8,8);if(k.a<=0)p.splice(i,1)});if(p.length)requestAnimationFrame(a);}a();
            }

            $('.day-btn').click(function() { loadDay($(this).data('day')); });
            $('#open-profile').click(() => $('#profile-modal').removeClass('hidden'));
            $('#close-profile').click(() => $('#profile-modal').addClass('hidden'));
            $('#toggle-edit').click(() => { isEditing = !isEditing; renderList(); });
        });
    </script>
</body>
</html>
