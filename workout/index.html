<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Burn | Weekly Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --accent: #6366f1; }
        
        /* Smooth Transitions */
        body { transition: background-color 0.5s; }
        .transition-all-300 { transition: all 0.3s ease; }
        
        /* Animations */
        @keyframes heartbeat { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 1; } }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
        
        .heart-pulse { animation: heartbeat 1s infinite ease-in-out; color: var(--accent); }
        .heart-ring { animation: pulse-ring 1s infinite ease-out; background-color: var(--accent); }
        .progress-ring__circle { transition: stroke-dashoffset 0.6s ease, stroke 0.5s; transform: rotate(-90deg); transform-origin: 50% 50%; stroke: var(--accent); }
        
        /* Interaction States */
        .completed { opacity: 0.3; filter: grayscale(1); transform: scale(0.98); pointer-events: none; }
        .day-btn.active { background-color: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .day-btn.today { border-color: var(--accent); }
        
        /* Muscle Heatmap */
        .muscle-part { fill: #1e293b; transition: fill 0.6s ease; }
        .muscle-active { fill: var(--accent); filter: drop-shadow(0 0 3px var(--accent)); }

        /* Range Slider */
        input[type=range] { accent-color: var(--accent); }

        /* Gym Mode (Landscape) */
        #gym-mode { display: none; }
        @media (orientation: landscape) and (max-height: 500px) {
            body { overflow: hidden; }
            #main-ui { display: none; }
            #gym-mode { display: flex; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans selection:bg-indigo-500 overflow-x-hidden">

    <div id="gym-mode" class="fixed inset-0 bg-slate-950 z-[200] flex-col items-center justify-center p-6 text-center">
        <div class="text-slate-500 text-xs font-black tracking-[0.5em] mb-4 uppercase">Current Set</div>
        <h1 id="gym-name" class="text-5xl font-black text-white uppercase leading-none mb-4">Select Workout</h1>
        <div class="flex items-baseline justify-center space-x-4">
            <div id="gym-target" class="text-8xl font-black text-indigo-500 tabular-nums">--</div>
            <div id="gym-unit" class="text-2xl font-bold text-slate-500 uppercase">--</div>
        </div>
        <div class="mt-8 text-slate-600 font-bold uppercase tracking-widest text-xs animate-pulse">Rotate to exit</div>
    </div>

    <div id="main-ui" class="pb-32">
        
        <header class="fixed top-0 w-full bg-slate-950/90 backdrop-blur-xl border-b border-white/5 z-50 pt-4 pb-2 px-4">
            <div class="max-w-md mx-auto">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center space-x-3">
                        <div class="relative flex items-center justify-center">
                            <div class="heart-ring absolute w-6 h-6 rounded-full opacity-30"></div>
                            <i class="fas fa-heart heart-pulse relative z-10 text-sm"></i>
                        </div>
                        <div>
                            <span id="day-title" class="text-lg font-black text-white uppercase tracking-tight">Today</span>
                            <span class="text-[9px] font-black text-slate-500 uppercase block leading-none">Weekly Schedule</span>
                        </div>
                    </div>
                    <button id="reset-week" class="text-slate-600 hover:text-red-500 transition text-xs font-bold uppercase tracking-widest">Reset</button>
                </div>

                <div class="flex justify-between space-x-1 overflow-x-auto no-scrollbar pb-2">
                    <button class="day-btn w-10 h-14 rounded-xl border border-slate-800 bg-slate-900 flex flex-col items-center justify-center transition-all-300 active:scale-95 shrink-0" data-day="0">
                        <span class="text-[8px] uppercase font-bold text-slate-500">Sun</span>
                        <span class="text-sm font-black">S</span>
                    </button>
                    <button class="day-btn w-10 h-14 rounded-xl border border-slate-800 bg-slate-900 flex flex-col items-center justify-center transition-all-300 active:scale-95 shrink-0" data-day="1">
                        <span class="text-[8px] uppercase font-bold text-slate-500">Mon</span>
                        <span class="text-sm font-black">M</span>
                    </button>
                    <button class="day-btn w-10 h-14 rounded-xl border border-slate-800 bg-slate-900 flex flex-col items-center justify-center transition-all-300 active:scale-95 shrink-0" data-day="2">
                        <span class="text-[8px] uppercase font-bold text-slate-500">Tue</span>
                        <span class="text-sm font-black">T</span>
                    </button>
                    <button class="day-btn w-10 h-14 rounded-xl border border-slate-800 bg-slate-900 flex flex-col items-center justify-center transition-all-300 active:scale-95 shrink-0" data-day="3">
                        <span class="text-[8px] uppercase font-bold text-slate-500">Wed</span>
                        <span class="text-sm font-black">W</span>
                    </button>
                    <button class="day-btn w-10 h-14 rounded-xl border border-slate-800 bg-slate-900 flex flex-col items-center justify-center transition-all-300 active:scale-95 shrink-0" data-day="4">
                        <span class="text-[8px] uppercase font-bold text-slate-500">Thu</span>
                        <span class="text-sm font-black">T</span>
                    </button>
                    <button class="day-btn w-10 h-14 rounded-xl border border-slate-800 bg-slate-900 flex flex-col items-center justify-center transition-all-300 active:scale-95 shrink-0" data-day="5">
                        <span class="text-[8px] uppercase font-bold text-slate-500">Fri</span>
                        <span class="text-sm font-black">F</span>
                    </button>
                    <button class="day-btn w-10 h-14 rounded-xl border border-slate-800 bg-slate-900 flex flex-col items-center justify-center transition-all-300 active:scale-95 shrink-0" data-day="6">
                        <span class="text-[8px] uppercase font-bold text-slate-500">Sat</span>
                        <span class="text-sm font-black">S</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-md mx-auto mt-40 px-4">
            
            <div class="bg-slate-900 rounded-[2.5rem] p-6 border border-white/5 mb-6 relative overflow-hidden shadow-2xl">
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-500/20 rounded-full blur-3xl"></div>
                
                <div class="flex justify-between items-center relative z-10">
                    <div>
                        <div id="focus-label" class="text-indigo-400 font-bold uppercase tracking-widest text-xs mb-1">Push Day</div>
                        <h2 id="calories-display" class="text-4xl font-black text-white">0 <span class="text-sm text-slate-500">Kcal</span></h2>
                        <div class="flex items-center space-x-2 mt-2">
                             <div class="h-2 w-24 bg-slate-800 rounded-full overflow-hidden">
                                 <div id="mini-progress" class="h-full bg-indigo-500 w-0 transition-all duration-500"></div>
                             </div>
                             <span id="percent-text" class="text-[10px] font-bold text-slate-400">0%</span>
                        </div>
                    </div>

                    <div class="w-16 h-24 opacity-80">
                         <svg viewBox="0 0 50 100" class="w-full h-full drop-shadow-lg">
                            <g transform="translate(0,0)">
                                <rect x="18" y="8" width="14" height="12" rx="6" class="muscle-part" data-muscle="Neck"/>
                                <rect x="10" y="22" width="30" height="28" rx="4" class="muscle-part" data-muscle="Chest"/> <rect x="2" y="24" width="7" height="32" rx="3" class="muscle-part" data-muscle="Arms"/>
                                <rect x="41" y="24" width="7" height="32" rx="3" class="muscle-part" data-muscle="Arms"/>
                                <rect x="12" y="58" width="10" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                                <rect x="28" y="58" width="10" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                                <rect x="20" y="35" width="10" height="15" rx="2" class="muscle-part" data-muscle="Abs" style="opacity:0.5"/>
                            </g>
                        </svg>
                    </div>
                </div>
            </div>

            <div id="workout-list" class="space-y-3">
                </div>

        </main>
    </div>

    <div id="rest-modal" class="hidden fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center p-8">
        <div class="text-9xl font-black text-white tabular-nums mb-4 transition-all" id="rest-timer">30</div>
        <div class="text-indigo-500 font-black uppercase tracking-widest text-sm mb-12 animate-pulse" id="next-ex-label">RECOVER</div>
        
        <div class="bg-slate-900 border border-white/5 p-6 rounded-3xl w-full max-w-xs text-center">
            <p class="text-slate-400 text-xs uppercase tracking-widest mb-2">Up Next</p>
            <h3 id="next-ex-name" class="text-xl font-black text-white">...</h3>
        </div>
        
        <button id="skip-rest" class="mt-8 px-8 py-4 text-slate-600 hover:text-white transition font-bold uppercase tracking-widest text-xs">Skip Rest</button>
    </div>

    <script>
        $(document).ready(function() {
            
            // --- 1. WEEKLY DATA SCHEDULE (The Core Logic) ---
            const weeklySchedule = {
                1: { // Monday
                    focus: "Chest & Triceps",
                    color: "#3b82f6", // Blue
                    muscles: ["Chest", "Arms"],
                    exercises: [
                        { id: "m1", name: "Push Ups", reps: 15, unit: "Reps", cal: 10, icon: "fa-hand-rock" },
                        { id: "m2", name: "Diamond Push Ups", reps: 10, unit: "Reps", cal: 12, icon: "fa-gem" },
                        { id: "m3", name: "Tricep Dips", reps: 15, unit: "Reps", cal: 8, icon: "fa-chair" },
                        { id: "m4", name: "Wide Arm Push Ups", reps: 12, unit: "Reps", cal: 10, icon: "fa-arrows-alt-h" },
                        { id: "m5", name: "Plank to Push Up", reps: 10, unit: "Reps", cal: 15, icon: "fa-exchange-alt" }
                    ]
                },
                2: { // Tuesday
                    focus: "Back & Biceps",
                    color: "#10b981", // Emerald
                    muscles: ["Chest", "Arms"], // SVG simplifies Back to Torso
                    exercises: [
                        { id: "tu1", name: "Superman Holds", reps: 45, unit: "Sec", cal: 5, icon: "fa-superpowers" },
                        { id: "tu2", name: "Reverse Snow Angels", reps: 15, unit: "Reps", cal: 8, icon: "fa-snowflake" },
                        { id: "tu3", name: "Doorframe Rows", reps: 15, unit: "Reps", cal: 10, icon: "fa-columns" },
                        { id: "tu4", name: "Prone Y-Raises", reps: 15, unit: "Reps", cal: 6, icon: "fa-text-height" },
                        { id: "tu5", name: "Good Mornings", reps: 20, unit: "Reps", cal: 12, icon: "fa-sun" }
                    ]
                },
                3: { // Wednesday
                    focus: "Legs & Glutes",
                    color: "#f59e0b", // Amber
                    muscles: ["Legs"],
                    exercises: [
                        { id: "w1", name: "Air Squats", reps: 20, unit: "Reps", cal: 12, icon: "fa-chevron-down" },
                        { id: "w2", name: "Lunges", reps: 12, unit: "Per Leg", cal: 14, icon: "fa-walking" },
                        { id: "w3", name: "Glute Bridges", reps: 20, unit: "Reps", cal: 8, icon: "fa-archway" },
                        { id: "w4", name: "Calf Raises", reps: 30, unit: "Reps", cal: 6, icon: "fa-arrow-up" },
                        { id: "w5", name: "Wall Sit", reps: 45, unit: "Sec", cal: 10, icon: "fa-chair" }
                    ]
                },
                4: { // Thursday
                    focus: "Shoulders & Core",
                    color: "#8b5cf6", // Violet
                    muscles: ["Arms", "Abs"],
                    exercises: [
                        { id: "th1", name: "Pike Push Ups", reps: 10, unit: "Reps", cal: 12, icon: "fa-mountain" },
                        { id: "th2", name: "Shoulder Taps", reps: 30, unit: "Sec", cal: 10, icon: "fa-hand-point-down" },
                        { id: "th3", name: "Plank", reps: 60, unit: "Sec", cal: 8, icon: "fa-stopwatch" },
                        { id: "th4", name: "Russian Twists", reps: 25, unit: "Reps", cal: 10, icon: "fa-sync-alt" },
                        { id: "th5", name: "Arm Circles", reps: 45, unit: "Sec", cal: 5, icon: "fa-circle-notch" }
                    ]
                },
                5: { // Friday
                    focus: "Full Body Intensity",
                    color: "#ef4444", // Red
                    muscles: ["Chest", "Arms", "Legs", "Abs"],
                    exercises: [
                        { id: "f1", name: "Burpees", reps: 10, unit: "Reps", cal: 20, icon: "fa-fire" },
                        { id: "f2", name: "Mountain Climbers", reps: 40, unit: "Sec", cal: 15, icon: "fa-running" },
                        { id: "f3", name: "Jump Squats", reps: 15, unit: "Reps", cal: 15, icon: "fa-frog" },
                        { id: "f4", name: "Push Ups", reps: 15, unit: "Reps", cal: 10, icon: "fa-hand-rock" },
                        { id: "f5", name: "Jumping Jacks", reps: 50, unit: "Reps", cal: 12, icon: "fa-star" }
                    ]
                },
                6: { // Saturday
                    focus: "Active Recovery",
                    color: "#14b8a6", // Teal
                    muscles: ["Abs"],
                    exercises: [
                        { id: "s1", name: "Bird Dog", reps: 10, unit: "Per Side", cal: 5, icon: "fa-dog" },
                        { id: "s2", name: "Cat Cow Stretch", reps: 60, unit: "Sec", cal: 3, icon: "fa-cat" },
                        { id: "s3", name: "Dead Bug", reps: 15, unit: "Reps", cal: 6, icon: "fa-bug" },
                        { id: "s4", name: "Side Plank", reps: 30, unit: "Sec/Side", cal: 8, icon: "fa-slash" }
                    ]
                },
                0: { // Sunday
                    focus: "Rest & Mobility",
                    color: "#64748b", // Slate
                    muscles: [],
                    exercises: [
                        { id: "su1", name: "Light Walk", reps: 15, unit: "Mins", cal: 50, icon: "fa-shoe-prints" },
                        { id: "su2", name: "Deep Breathing", reps: 5, unit: "Mins", cal: 5, icon: "fa-wind" }
                    ]
                }
            };

            // --- 2. STATE MANAGEMENT ---
            let activeDay = new Date().getDay(); // 0-6
            let completedMap = JSON.parse(localStorage.getItem('dailyBurn_completed')) || {};
            const synth = window.speechSynthesis;

            // --- 3. CORE LOGIC ---
            function loadDay(dayIndex) {
                activeDay = parseInt(dayIndex);
                
                // Update Buttons
                $('.day-btn').removeClass('active');
                $(`.day-btn[data-day="${activeDay}"]`).addClass('active');

                // Update Header Info
                const dayData = weeklySchedule[activeDay];
                $('#day-title').text(getDayName(activeDay));
                $('#focus-label').text(dayData.focus);
                
                // Update Theme Colors
                $(':root').css('--accent', dayData.color);
                
                // Update Heatmap
                $('.muscle-part').removeClass('muscle-active');
                dayData.muscles.forEach(m => $(`.muscle-part[data-muscle="${m}"]`).addClass('muscle-active'));

                // Render List
                renderList(dayData.exercises);
                updateProgress();
            }

            function renderList(exercises) {
                const container = $('#workout-list').empty();
                
                // Gym Mode Preview reset
                $('#gym-name').text("Ready");
                $('#gym-target').text("--");

                exercises.forEach((ex) => {
                    const isDone = isCompleted(activeDay, ex.id);
                    
                    // Update Gym Mode to first incomplete item
                    if(!isDone && $('#gym-name').text() === "Ready") {
                        $('#gym-name').text(ex.name);
                        $('#gym-target').text(ex.reps);
                        $('#gym-unit').text(ex.unit);
                    }

                    container.append(`
                        <div class="bg-slate-900 border border-white/5 p-5 rounded-[1.5rem] flex items-center justify-between transition-all duration-300 ${isDone ? 'completed' : ''}" id="card-${ex.id}">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 bg-slate-950 rounded-2xl flex items-center justify-center text-white" style="background-color: ${weeklySchedule[activeDay].color}20; color: ${weeklySchedule[activeDay].color}">
                                    <i class="fas ${ex.icon}"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-white uppercase text-xs tracking-tight">${ex.name}</h3>
                                    <p class="text-slate-500 font-bold text-[10px] uppercase">${ex.reps} ${ex.unit}</p>
                                </div>
                            </div>
                            <button class="check-btn w-12 h-12 rounded-full border-2 border-slate-800 flex items-center justify-center transition active:scale-90" 
                                data-id="${ex.id}" data-cal="${ex.cal}">
                                <i class="fas fa-check text-white ${isDone ? '' : 'hidden'}"></i>
                            </button>
                        </div>
                    `);
                });

                if(exercises.every(e => isCompleted(activeDay, e.id))) {
                    $('#gym-name').text("DONE!");
                    $('#gym-target').text("✔");
                    $('#gym-unit').text("");
                }
            }

            function handleCheck(btn) {
                const exId = btn.data('id');
                const dayKey = activeDay.toString();
                
                // Initialize array if empty
                if (!completedMap[dayKey]) completedMap[dayKey] = [];

                // Toggle logic (prevent unchecking for simplicity in pro mode, or allow it?)
                // Let's allow one-way checking for the "Burn" effect
                if (completedMap[dayKey].includes(exId)) return;

                // Add to done list
                completedMap[dayKey].push(exId);
                localStorage.setItem('dailyBurn_completed', JSON.stringify(completedMap));
                
                // Visuals
                btn.find('i').removeClass('hidden');
                btn.css('background-color', 'var(--accent)').css('border-color', 'var(--accent)');
                $(`#card-${exId}`).addClass('completed');

                // Haptics & Sound
                if(navigator.vibrate) navigator.vibrate(50);
                
                // Logic for Next Step
                updateProgress();
                
                // Find next exercise for Rest Modal
                const dayData = weeklySchedule[activeDay];
                const remaining = dayData.exercises.filter(e => !completedMap[dayKey].includes(e.id));
                
                if (remaining.length > 0) {
                    triggerRest(remaining[0]);
                } else {
                    speak("Daily workout complete. Excellent work.");
                    if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
                }
            }

            function triggerRest(nextEx) {
                $('#rest-modal').removeClass('hidden');
                $('#next-ex-name').text(nextEx.name);
                $('#gym-name').text(nextEx.name); // Update Gym Mode early
                $('#gym-target').text(nextEx.reps);
                $('#gym-unit').text(nextEx.unit);

                speak("Rest. Next up: " + nextEx.name);
                
                let time = 30;
                const timer = setInterval(() => {
                    time--;
                    $('#rest-timer').text(time);
                    
                    if(time <= 3 && time > 0) {
                        speak(time.toString());
                        if(navigator.vibrate) navigator.vibrate(20);
                    }
                    
                    if(time <= 0) {
                        clearInterval(timer);
                        $('#rest-modal').addClass('hidden');
                        speak("Go!");
                        if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    }
                }, 1000);
                
                $('#skip-rest').one('click', () => { 
                    clearInterval(timer); 
                    $('#rest-modal').addClass('hidden'); 
                });
            }

            function updateProgress() {
                const dayData = weeklySchedule[activeDay];
                const dayKey = activeDay.toString();
                const doneIds = completedMap[dayKey] || [];
                
                let totalCals = 0;
                dayData.exercises.forEach(ex => {
                    if(doneIds.includes(ex.id)) totalCals += ex.cal;
                });

                const percent = Math.round((doneIds.length / dayData.exercises.length) * 100);
                
                // Update UI numbers
                $('#calories-display').html(`${totalCals} <span class="text-sm text-slate-500">Kcal</span>`);
                $('#percent-text').text(percent + '%');
                $('#mini-progress').css('width', percent + '%');
            }

            function speak(text) {
                synth.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 1.1;
                synth.speak(u);
            }

            function getDayName(i) {
                return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][i];
            }

            // --- 4. EVENT LISTENERS ---
            
            // Day Navigation
            $('.day-btn').click(function() {
                loadDay($(this).data('day'));
            });

            // Mark Complete
            $(document).on('click', '.check-btn', function() {
                handleCheck($(this));
            });

            // Reset Week
            $('#reset-week').click(function() {
                if(confirm("Reset all weekly progress?")) {
                    localStorage.removeItem('dailyBurn_completed');
                    completedMap = {};
                    loadDay(activeDay);
                }
            });

            // Highlight Today button on init
            const todayIndex = new Date().getDay();
            $(`.day-btn[data-day="${todayIndex}"]`).addClass('today border-indigo-500');

            // --- INIT ---
            loadDay(todayIndex);
        });
    </script>
</body>
</html>
