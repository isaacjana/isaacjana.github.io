<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Burn | Titanium</title>
    
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES --- */
        :root { 
            --bg-main: #0f172a; 
            --glass-bg: rgba(15, 23, 42, 0.92);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1; 
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --text-main: #f1f5f9;
        }

        /* Themes */
        body.theme-emerald { --primary: #10b981; --primary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        body.theme-ruby { --primary: #f43f5e; --primary-gradient: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); }
        body.theme-amber { --primary: #f59e0b; --primary-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; transition: background 0.5s; padding-bottom: 120px; }

        /* --- UI COMPONENTS --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .gradient-text { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-bg { background: var(--primary-gradient); }
        .completed { opacity: 0.5; filter: grayscale(1); pointer-events: none; transition: 0.4s; }

        /* Day Nav */
        .day-btn { transition: all 0.3s; }
        .day-btn.active { background: var(--primary-gradient); color: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transform: translateY(-2px); }
        .status-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--primary); position: absolute; bottom: 6px; }
        .day-btn.active .status-dot { background: white; }

        /* Inputs & Edit Fields */
        .glass-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 0.75rem; padding: 0.75rem; width: 100%; font-size: 0.875rem; outline: none; transition: 0.3s; }
        .edit-field { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 6px; padding: 6px 8px; font-size: 11px; width: 100%; transition: 0.3s; }
        .edit-field:focus { border-color: var(--primary); outline: none; background: rgba(0,0,0,0.8); }

        /* Tabs */
        .tab-btn { opacity: 0.5; border-bottom: 2px solid transparent; transition: 0.3s; }
        .tab-btn.active { opacity: 1; border-color: var(--primary); color: white; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Streak Fire Animation */
        .streak-fire { animation: flicker 1.5s infinite alternate; color: #f97316; filter: drop-shadow(0 0 5px #f97316); }
        @keyframes flicker { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.8; transform: scale(0.9); } }

        /* Sticky Footer */
        .sticky-action-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            padding: 1rem 1.5rem 2rem 1.5rem;
            background: linear-gradient(to top, var(--bg-main) 90%, transparent);
            z-index: 50;
            display: flex; gap: 1rem; align-items: center; justify-content: space-between;
            transition: transform 0.3s;
        }
        .sticky-action-bar.hidden-bar { transform: translateY(100%); }

        /* Landscape Mode */
        #gym-mode { display: none; }
        @media (orientation: landscape) and (max-height: 500px) { body { overflow: hidden; } #main-ui { display: none; } #gym-mode { display: flex; } }
    </style>
</head>
<body class="theme-default">

    <canvas id="confetti-canvas" style="position:fixed;top:0;left:0;pointer-events:none;z-index:999;"></canvas>

    <div id="gym-mode" class="fixed inset-0 z-[300] flex-col items-center justify-center p-6 text-center bg-slate-950">
        <div class="text-xs font-bold text-slate-500 uppercase tracking-[0.3em] mb-2">NOW ACTIVE</div>
        <h1 id="gym-name" class="text-6xl font-black text-white uppercase leading-none mb-4 tracking-tighter">START</h1>
        <div class="flex items-baseline justify-center space-x-4">
            <div id="gym-target" class="text-[8rem] font-black gradient-text tabular-nums leading-none">--</div>
            <div id="gym-unit" class="text-3xl font-bold text-slate-500 uppercase">--</div>
        </div>
        <div id="gym-timer" class="absolute top-6 right-6 text-2xl font-mono text-white opacity-50 font-bold">00:00</div>
    </div>

    <div id="main-ui">
        
        <header class="fixed top-0 w-full glass-panel z-[60] pt-4 pb-3 px-4 border-b-0 rounded-b-3xl">
            <div class="max-w-md mx-auto">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center space-x-3 cursor-pointer group" id="open-profile">
                        <div class="w-10 h-10 rounded-full gradient-bg flex items-center justify-center shadow-lg group-active:scale-95 transition">
                            <i class="fas fa-bars text-white"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold text-slate-400 uppercase block leading-none mb-0.5">Menu</span>
                            <div class="flex items-center space-x-1">
                                <i class="fas fa-fire text-xs streak-fire"></i>
                                <span id="streak-count" class="text-xs font-black text-white tabular-nums">0</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-3">
                         <button id="quick-mute" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-slate-400 hover:text-white transition">
                            <i class="fas fa-volume-up text-xs"></i>
                        </button>
                        <button id="toggle-edit" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-slate-400 hover:text-white transition">
                            <i class="fas fa-pencil-alt text-sm"></i>
                        </button>
                    </div>
                </div>
                <div class="flex justify-between space-x-2 overflow-x-auto no-scrollbar pb-1" id="day-nav-container"></div>
            </div>
        </header>

        <main class="max-w-md mx-auto mt-40 px-4">
            
            <div class="glass-panel rounded-[2.5rem] p-6 mb-6 relative overflow-hidden">
                <div class="flex justify-between items-center relative z-10">
                    <div class="flex-1">
                        <div id="day-focus" class="gradient-text font-black uppercase tracking-widest text-xs mb-2">...</div>
                        <div class="flex items-baseline space-x-2 mb-2">
                            <h2 id="global-timer" class="text-5xl font-mono font-black text-white tracking-tighter">00:00</h2>
                            <span class="text-[10px] font-bold text-slate-500 uppercase" id="timer-label">Duration</span>
                        </div>
                        <div class="w-full max-w-[140px]">
                            <div class="flex justify-between text-[9px] font-bold text-slate-500 uppercase mb-1">
                                <span>Complete</span>
                                <span id="percent-text">0%</span>
                            </div>
                            <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                                <div id="mini-progress" class="h-full gradient-bg w-0 transition-all duration-500"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="w-20 h-28 opacity-90 relative">
                         <svg viewBox="0 0 50 100" class="w-full h-full drop-shadow-xl">
                            <g transform="translate(0,0)">
                                <rect x="10" y="22" width="30" height="28" rx="4" class="muscle-part" data-muscle="Chest"/>
                                <rect x="2" y="24" width="7" height="32" rx="3" class="muscle-part" data-muscle="Arms"/>
                                <rect x="41" y="24" width="7" height="32" rx="3" class="muscle-part" data-muscle="Arms"/>
                                <rect x="12" y="58" width="10" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                                <rect x="28" y="58" width="10" height="40" rx="4" class="muscle-part" data-muscle="Legs"/>
                                <rect x="20" y="35" width="10" height="15" rx="2" class="muscle-part" data-muscle="Abs" style="opacity:0.5"/>
                            </g>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-end mb-4 px-2" id="list-header">
                <h3 class="text-white font-bold text-lg">Workout Plan</h3>
                
                <div class="flex items-center space-x-2" id="quick-warmup-container">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">Warm Up</span>
                    <div class="relative inline-block w-8 h-4 align-middle select-none">
                        <input type="checkbox" id="warmup-toggle" class="absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300" style="right: 100%"/>
                        <label for="warmup-toggle" class="block overflow-hidden h-4 rounded-full bg-slate-700 cursor-pointer"></label>
                    </div>
                </div>
            </div>

            <div id="workout-list" class="space-y-3 pb-8"></div>

        </main>

        <div id="action-bar" class="sticky-action-bar max-w-md mx-auto left-0 right-0">
            <button id="reset-day-btn" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-slate-400 hover:text-white transition">
                <i class="fas fa-redo-alt"></i>
            </button>
            <button id="main-action-btn" class="flex-1 h-14 gradient-bg rounded-2xl font-black text-white text-lg uppercase tracking-widest shadow-xl shadow-indigo-500/20 active:scale-95 transition flex items-center justify-center">
                <i class="fas fa-play mr-2"></i> Start Session
            </button>
        </div>
    </div>

    <div id="profile-modal" class="hidden fixed inset-0 z-[100] backdrop-blur-lg bg-slate-950/80 flex flex-col items-center justify-end sm:justify-center">
        <div class="glass-panel w-full max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 relative h-[85vh] sm:h-auto overflow-y-auto border-b-0">
            <button id="close-profile" class="absolute top-6 right-6 text-slate-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-2xl font-black text-white mb-6 tracking-tight pl-2">Menu</h2>

            <div class="flex border-b border-white/10 mb-6 px-2 overflow-x-auto no-scrollbar">
                <button class="tab-btn active px-4 py-2 text-xs font-bold uppercase tracking-widest shrink-0" data-tab="tab-prefs">Prefs</button>
                <button class="tab-btn px-4 py-2 text-xs font-bold uppercase tracking-widest shrink-0" data-tab="tab-journal">Journal</button>
                <button class="tab-btn px-4 py-2 text-xs font-bold uppercase tracking-widest shrink-0" data-tab="tab-data">Data</button>
            </div>

            <div id="tab-prefs" class="tab-content active space-y-6">
                <div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Theme</span>
                    <div class="grid grid-cols-3 gap-3 mt-2">
                        <button class="theme-btn h-10 rounded-xl bg-[#6366f1]" data-theme="theme-default"></button>
                        <button class="theme-btn h-10 rounded-xl bg-[#10b981]" data-theme="theme-emerald"></button>
                        <button class="theme-btn h-10 rounded-xl bg-[#f43f5e]" data-theme="theme-ruby"></button>
                    </div>
                </div>
                <div class="p-4 bg-black/20 rounded-2xl border border-white/5">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Global Difficulty</span>
                    <div class="flex items-center justify-between mt-1 mb-3">
                        <span class="text-xl font-black text-white" id="modal-level-val">1.0x</span>
                        <button id="level-reset-btn" class="text-[9px] font-bold text-slate-500 uppercase hover:text-white">Reset</button>
                    </div>
                    <button id="level-up-btn" class="w-full py-3 gradient-bg rounded-xl font-bold text-white text-xs uppercase tracking-widest shadow-lg active:scale-95 transition">Increase (+10%)</button>
                </div>
            </div>

            <div id="tab-journal" class="tab-content space-y-4">
                <div id="journal-list" class="space-y-3">
                    <div class="text-center text-slate-500 text-xs py-10">No history yet.</div>
                </div>
            </div>

            <div id="tab-data" class="tab-content space-y-4">
                <button id="export-data" class="w-full py-3 glass-input text-left flex items-center"><i class="fas fa-download mr-3 text-slate-400"></i> Export Backup</button>
                <button id="hard-reset" class="w-full py-3 border border-red-500/30 text-red-400 hover:bg-red-500/10 rounded-xl font-bold text-xs uppercase tracking-widest transition">Factory Reset App</button>
            </div>
        </div>
    </div>

    <div id="overload-modal" class="hidden fixed inset-0 z-[400] bg-slate-950/95 flex flex-col items-center justify-center p-8 backdrop-blur-xl">
        <div class="w-20 h-20 rounded-full gradient-bg flex items-center justify-center text-3xl text-white mb-6 shadow-2xl animate-bounce">
            <i class="fas fa-level-up-alt"></i>
        </div>
        <h2 class="text-2xl font-black text-white mb-2 text-center">Session Complete!</h2>
        <p class="text-slate-400 text-sm text-center mb-8">Was that workout too easy for you?</p>
        
        <div class="w-full max-w-xs space-y-3">
            <button id="overload-yes" class="w-full py-4 gradient-bg rounded-2xl font-bold text-white uppercase tracking-widest shadow-lg">Yes, Make it Harder</button>
            <button id="overload-no" class="w-full py-4 glass-panel rounded-2xl font-bold text-slate-400 uppercase tracking-widest">No, Keep it same</button>
        </div>
    </div>

    <div id="rest-modal" class="hidden fixed inset-0 z-[400] bg-slate-950/95 flex flex-col items-center justify-center p-8 backdrop-blur-xl">
        <div class="text-[10rem] font-black gradient-text tabular-nums mb-4 leading-none" id="rest-timer">30</div>
        <div class="text-white font-black uppercase tracking-[0.5em] text-sm mb-12 animate-pulse" id="next-ex-label">RECOVER</div>
        <div class="glass-panel p-6 rounded-[2rem] w-full max-w-xs text-center mb-10 transform scale-110">
            <h3 id="next-ex-name" class="text-2xl font-black text-white">...</h3>
        </div>
        <div class="flex space-x-6">
            <button id="add-time" class="w-20 h-20 rounded-full glass-panel text-white font-bold hover:bg-white/10 active:scale-90 transition flex flex-col items-center justify-center"><span class="text-sm">+15</span></button>
            <button id="skip-rest" class="w-20 h-20 rounded-full glass-panel text-white font-bold hover:bg-white/10 active:scale-90 transition flex items-center justify-center"><i class="fas fa-forward text-xl"></i></button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            
            // --- DATA ---
            const defaultSchedule = {
                1: { focus: "Chest & Triceps", color: "#10b981", muscles: ["Chest", "Arms"], exercises: [{ id: "m1", name: "Push Ups", reps: 15, unit: "Reps", icon: "fa-hand-rock", rest: 30 }, { id: "m2", name: "Plank", reps: 45, unit: "Sec", icon: "fa-stopwatch", rest: 30 }, { id: "m3", name: "Tricep Dips", reps: 15, unit: "Reps", icon: "fa-chair", rest: 30 }] },
                2: { focus: "Back & Biceps", color: "#3b82f6", muscles: ["Chest", "Arms"], exercises: [{ id: "tu1", name: "Superman Holds", reps: 45, unit: "Sec", icon: "fa-superpowers", rest: 30 }, { id: "tu2", name: "Doorframe Rows", reps: 15, unit: "Reps", icon: "fa-columns", rest: 30 }, { id: "tu3", name: "Good Mornings", reps: 20, unit: "Reps", icon: "fa-sun", rest: 40 }] },
                3: { focus: "Legs & Glutes", color: "#f59e0b", muscles: ["Legs"], exercises: [{ id: "w1", name: "Air Squats", reps: 20, unit: "Reps", icon: "fa-chevron-down", rest: 30 }, { id: "w2", name: "Lunges", reps: 12, unit: "Per Leg", icon: "fa-person-walking", rest: 45 }, { id: "w3", name: "Wall Sit", reps: 45, unit: "Sec", icon: "fa-chair", rest: 30 }] },
                4: { focus: "Shoulders & Core", color: "#f43f5e", muscles: ["Arms", "Abs"], exercises: [{ id: "th1", name: "Pike Push Ups", reps: 10, unit: "Reps", icon: "fa-mountain", rest: 45 }, { id: "th2", name: "Plank", reps: 60, unit: "Sec", icon: "fa-stopwatch", rest: 30 }, { id: "th3", name: "Russian Twists", reps: 25, unit: "Reps", icon: "fa-arrows-spin", rest: 30 }] },
                5: { focus: "Full Body Intensity", color: "#ef4444", muscles: ["Chest", "Arms", "Legs", "Abs"], exercises: [{ id: "f1", name: "Burpees", reps: 10, unit: "Reps", icon: "fa-fire", rest: 60 }, { id: "f2", name: "Mtn Climbers", reps: 40, unit: "Sec", icon: "fa-person-running", rest: 30 }, { id: "f3", name: "Jumping Jacks", reps: 50, unit: "Reps", icon: "fa-star", rest: 20 }] },
                6: { focus: "Active Recovery", color: "#10b981", muscles: ["Abs"], exercises: [{ id: "s1", name: "Bird Dog", reps: 10, unit: "Per Side", icon: "fa-dog", rest: 20 }, { id: "s2", name: "Cat Cow", reps: 60, unit: "Sec", icon: "fa-cat", rest: 20 }] },
                0: { focus: "Rest & Mobility", color: "#64748b", muscles: [], exercises: [{ id: "su1", name: "Light Walk", reps: 15, unit: "Mins", icon: "fa-shoe-prints", rest: 0 }] }
            };

            const warmupRoutine = [
                { id: "wm1", name: "Arm Circles", reps: 30, unit: "Sec", icon: "fa-sync", rest: 10 },
                { id: "wm2", name: "Jumping Jacks", reps: 20, unit: "Reps", icon: "fa-star", rest: 15 }
            ];

            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            let activeDay = new Date().getDay();
            
            // --- STORAGE KEYS ---
            const KEY_SCHED = 'ti_schedule';
            const KEY_COMP = 'ti_completed';
            const KEY_PROF = 'ti_profile';
            const KEY_HIST = 'ti_history';
            const KEY_STREAK = 'ti_streak';

            let schedule = JSON.parse(localStorage.getItem(KEY_SCHED)) || defaultSchedule;
            let completed = JSON.parse(localStorage.getItem(KEY_COMP)) || {};
            let profile = JSON.parse(localStorage.getItem(KEY_PROF)) || { level: 1.0, theme: 'theme-default', sound: 'voice', warmup: false };
            let history = JSON.parse(localStorage.getItem(KEY_HIST)) || [];
            let streakData = JSON.parse(localStorage.getItem(KEY_STREAK)) || { count: 0, lastDate: null };
            
            let isEditing = false;
            let isSessionActive = false;
            let sessionTimerIntv = null;
            let sessionSeconds = 0;
            let currentSessionList = []; 
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const synth = window.speechSynthesis;

            // --- INIT ---
            $('body').addClass(profile.theme);
            $('#warmup-toggle').prop('checked', profile.warmup);
            updateAudioIcon();
            updateStreakUI();
            renderWeekNav();
            loadDay(activeDay);
            updateSettingsUI();

            // --- STREAK LOGIC ---
            function updateStreakUI() {
                // Simple logic: if lastDate was yesterday, keep streak. If older, reset.
                const today = new Date().toDateString();
                const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                
                if (streakData.lastDate !== today && streakData.lastDate !== yesterday.toDateString()) {
                    // Check if they missed a day (unless it's a new user)
                    if(streakData.lastDate) streakData.count = 0; 
                }
                $('#streak-count').text(streakData.count);
                if(streakData.count > 0) $('.streak-fire').css('opacity', '1');
                else $('.streak-fire').css('opacity', '0.3');
                
                localStorage.setItem(KEY_STREAK, JSON.stringify(streakData));
            }

            function incrementStreak() {
                const today = new Date().toDateString();
                if (streakData.lastDate !== today) {
                    streakData.count++;
                    streakData.lastDate = today;
                    localStorage.setItem(KEY_STREAK, JSON.stringify(streakData));
                    updateStreakUI();
                }
            }

            // --- MAIN ACTION BUTTON ---
            $('#main-action-btn').click(function() {
                if(!isSessionActive) {
                    startSession();
                } else {
                    if(confirm("End current session?")) endSession(true);
                }
            });

            // --- EDIT LOGIC (SAFE) ---
            $('#toggle-edit').click(function() {
                if(isSessionActive) { alert("Stop the session before editing."); return; }
                isEditing = !isEditing;
                
                if(isEditing) {
                    $(this).html('<i class="fas fa-check text-green-400"></i>').addClass('border-green-400');
                    $('#action-bar').addClass('hidden-bar'); 
                    $('#quick-warmup-container').addClass('opacity-0 pointer-events-none');
                } else {
                    saveEdits();
                    $(this).html('<i class="fas fa-pencil-alt"></i>').removeClass('border-green-400');
                    $('#action-bar').removeClass('hidden-bar');
                    $('#quick-warmup-container').removeClass('opacity-0 pointer-events-none');
                }
                renderList();
            });

            function saveEdits() {
                // Lookup by ID to be safe
                $('.edit-name').each(function() { 
                    const id = $(this).data('id'); const ex = schedule[activeDay].exercises.find(e => e.id === id); if(ex) ex.name = $(this).val(); 
                });
                $('.edit-reps').each(function() { 
                    const id = $(this).data('id'); const ex = schedule[activeDay].exercises.find(e => e.id === id); if(ex) ex.reps = parseInt($(this).val()); 
                });
                $('.edit-unit').each(function() { 
                    const id = $(this).data('id'); const ex = schedule[activeDay].exercises.find(e => e.id === id); if(ex) ex.unit = $(this).val(); 
                });
                $('.edit-rest').each(function() { 
                    const id = $(this).data('id'); const ex = schedule[activeDay].exercises.find(e => e.id === id); if(ex) ex.rest = parseInt($(this).val()); 
                });
                localStorage.setItem(KEY_SCHED, JSON.stringify(schedule));
                buildQueue(); 
            }

            // --- WARMUP TOGGLE ---
            $('#warmup-toggle').change(function() {
                if(isSessionActive) return;
                profile.warmup = $(this).is(':checked');
                localStorage.setItem(KEY_PROF, JSON.stringify(profile));
                buildQueue();
                renderList(); 
            });

            function buildQueue() {
                const base = schedule[activeDay].exercises;
                // If editing, ONLY show base exercises to prevent confusing edits
                if(isEditing) {
                    currentSessionList = [...base];
                } else {
                    currentSessionList = profile.warmup ? [...warmupRoutine, ...base] : [...base];
                }
            }

            // --- SESSION CONTROL ---
            function startSession() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                isSessionActive = true;
                
                $('#main-action-btn').html('<i class="fas fa-stop mr-2"></i> End Session').addClass('bg-red-500').removeClass('gradient-bg');
                $('#reset-day-btn').addClass('opacity-0 pointer-events-none');
                $('#quick-warmup-container').fadeOut();
                $('#timer-label').text("Active");

                if(isEditing) { isEditing = false; $('#toggle-edit').html('<i class="fas fa-pencil-alt"></i>').removeClass('border-green-400'); $('#action-bar').removeClass('hidden-bar'); }

                sessionSeconds = 0;
                clearInterval(sessionTimerIntv);
                sessionTimerIntv = setInterval(() => {
                    sessionSeconds++;
                    const m = Math.floor(sessionSeconds / 60).toString().padStart(2, '0');
                    const s = (sessionSeconds % 60).toString().padStart(2, '0');
                    $('#global-timer, #gym-timer').text(`${m}:${s}`);
                }, 1000);

                playSound("Session started.");
                renderList(); 
                updateGymMode();
            }

            function endSession(userAction = true) {
                isSessionActive = false;
                clearInterval(sessionTimerIntv);
                
                $('#main-action-btn').html('<i class="fas fa-play mr-2"></i> Start Session').addClass('gradient-bg').removeClass('bg-red-500');
                $('#reset-day-btn').removeClass('opacity-0 pointer-events-none');
                $('#quick-warmup-container').fadeIn();
                $('#global-timer').text("00:00");
                $('#timer-label').text("Duration");
                $('#gym-name').text("START"); $('#gym-target').text("--"); $('#gym-unit').text("--");
                $('#overload-modal').addClass('hidden'); // Ensure modal closes
                
                renderList();
            }

            // --- RENDER LIST ---
            function renderList() {
                const container = $('#workout-list').empty();
                // When editing, show schedule[activeDay], otherwise currentSessionList
                const listToRender = isEditing ? schedule[activeDay].exercises : currentSessionList;

                if(listToRender.length === 0) { container.html('<div class="text-center text-slate-500 py-10">No exercises.</div>'); return; }

                listToRender.forEach((ex, idx) => {
                    const isDone = completed[activeDay] && completed[activeDay].includes(ex.id);
                    const reps = Math.ceil(ex.reps * profile.level);
                    const isTimed = (ex.unit.toLowerCase().includes('sec'));
                    const isWarmup = ex.id.startsWith('wm');

                    if(isEditing) {
                         container.append(`
                            <div class="glass-panel p-4 rounded-3xl grid grid-cols-12 gap-2 mb-2">
                                <div class="col-span-5"><label class="text-[9px] text-slate-500 uppercase">Name</label><input type="text" class="edit-field edit-name" value="${ex.name}" data-id="${ex.id}"></div>
                                <div class="col-span-2"><label class="text-[9px] text-slate-500 uppercase">Reps</label><input type="number" class="edit-field edit-reps" value="${ex.reps}" data-id="${ex.id}"></div>
                                <div class="col-span-3"><label class="text-[9px] text-slate-500 uppercase">Unit</label><input type="text" class="edit-field edit-unit" value="${ex.unit}" data-id="${ex.id}"></div>
                                <div class="col-span-2"><label class="text-[9px] text-slate-500 uppercase">Rest</label><input type="number" class="edit-field edit-rest" value="${ex.rest||30}" data-id="${ex.id}"></div>
                            </div>
                        `);
                    } else {
                        let btnHtml = '';
                        if (!isSessionActive) {
                            btnHtml = `<div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-slate-500"><i class="fas fa-lock text-xs"></i></div>`;
                        } else if (isDone) {
                            btnHtml = `<div class="w-12 h-12 rounded-full gradient-bg flex items-center justify-center shadow-lg"><i class="fas fa-check text-white"></i></div>`;
                        } else if (isTimed) {
                            btnHtml = `<button class="timer-btn w-12 h-12 rounded-full glass-panel flex items-center justify-center text-white active:scale-90 transition" data-id="${ex.id}" data-duration="${reps}"><i class="fas fa-play text-xs"></i></button>`;
                        } else {
                            btnHtml = `<button class="check-btn w-12 h-12 rounded-full glass-panel flex items-center justify-center text-slate-500 hover:text-white active:scale-90 transition" data-id="${ex.id}"><i class="fas fa-check"></i></button>`;
                        }
                        const badge = isWarmup ? `<span class="text-[9px] bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded ml-2 uppercase font-bold">Warmup</span>` : '';
                        
                        container.append(`
                            <div class="glass-panel p-5 rounded-[1.8rem] transition-all duration-300 ${isDone ? 'completed' : ''} mb-2" id="card-${ex.id}">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-4">
                                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white gradient-bg shadow-lg"><i class="fas ${ex.icon}"></i></div>
                                        <div>
                                            <div class="flex items-center"><h3 class="font-bold text-white uppercase text-sm tracking-tight">${ex.name}</h3>${badge}</div>
                                            <p class="text-slate-400 font-bold text-xs uppercase dynamic-text-${ex.id}">${reps} ${ex.unit}</p>
                                        </div>
                                    </div>
                                    ${btnHtml}
                                </div>
                            </div>
                        `);
                    }
                });
            }

            // --- EXERCISE & REST ---
            function updateGymMode() {
                if(!isSessionActive) return;
                const nextEx = currentSessionList.find(e => !completed[activeDay]?.includes(e.id));
                if (nextEx) {
                    $('#gym-name').text(nextEx.name); $('#gym-target').text(Math.ceil(nextEx.reps * profile.level)); $('#gym-unit').text(nextEx.unit);
                } else {
                    $('#gym-name').text("DONE"); $('#gym-target').text("✔"); $('#gym-unit').text("");
                }
            }

            $(document).on('click', '.check-btn', function() { completeExercise($(this).data('id'), $(this)); });
            $(document).on('click', '.timer-btn', function() {
                const btn = $(this);
                if (btn.hasClass('running')) return;
                btn.addClass('running gradient-bg border-transparent text-white');
                let timeLeft = btn.data('duration');
                const label = $(`.dynamic-text-${btn.data('id')}`);
                playSound("Go");
                const intv = setInterval(() => {
                    timeLeft--;
                    btn.html(`<span class="text-xs font-black text-white">${timeLeft}</span>`);
                    label.text(timeLeft + " Sec").addClass('gradient-text');
                    if(timeLeft <= 3 && timeLeft > 0) playSound("beep");
                    if(timeLeft <= 0) { clearInterval(intv); completeExercise(btn.data('id'), btn); }
                }, 1000);
            });

            function completeExercise(id, btnEl) {
                if(!completed[activeDay]) completed[activeDay] = [];
                if(!completed[activeDay].includes(id)) { completed[activeDay].push(id); localStorage.setItem(KEY_COMP, JSON.stringify(completed)); }
                $(`#card-${id}`).addClass('completed');
                btnEl.replaceWith(`<div class="w-12 h-12 rounded-full gradient-bg flex items-center justify-center shadow-lg"><i class="fas fa-check text-white"></i></div>`);
                if(navigator.vibrate) navigator.vibrate(50);
                updateGymMode();
                const remaining = currentSessionList.filter(e => !completed[activeDay].includes(e.id));
                if(remaining.length > 0) { 
                    triggerRest(remaining[0]); 
                    setTimeout(() => { document.getElementById('card-'+remaining[0].id).scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 600); 
                } else { 
                    finishSession(); 
                }
            }

            function triggerRest(nextEx) {
                $('#rest-modal').removeClass('hidden'); $('#next-ex-name').text(nextEx.name); playSound("Rest.");
                let time = nextEx.rest || 30; $('#rest-timer').text(time);
                const intv = setInterval(() => { time--; $('#rest-timer').text(time); if(time <= 3 && time > 0) playSound("beep"); if(time <= 0) { clearInterval(intv); $('#rest-modal').addClass('hidden'); playSound("Start!"); } }, 1000);
                $('#skip-rest').one('click', () => { clearInterval(intv); $('#rest-modal').addClass('hidden'); });
                $('#add-time').click(() => { time += 15; $('#rest-timer').text(time); });
            }

            function finishSession() {
                incrementStreak();
                
                // Add to History
                history.unshift({ date: new Date().toLocaleString(), focus: schedule[activeDay].focus, time: $('#global-timer').text() });
                if(history.length > 20) history.pop(); // Keep last 20
                localStorage.setItem(KEY_HIST, JSON.stringify(history));
                populateJournal();

                endSession(false);
                fireConfetti();
                playSound("Session Complete!");
                
                // Show Overload Modal
                setTimeout(() => $('#overload-modal').removeClass('hidden'), 500);
            }

            // --- OVERLOAD LOGIC ---
            $('#overload-yes').click(function() {
                // Increase reps for today's exercises permanently
                schedule[activeDay].exercises.forEach(e => {
                     // Add 2 reps if it's rep based, 5 sec if time based
                     if(e.unit.toLowerCase().includes('sec')) e.reps += 5;
                     else e.reps += 2;
                });
                localStorage.setItem(KEY_SCHED, JSON.stringify(schedule));
                $('#overload-modal').addClass('hidden');
                alert("Routine Updated! Harder next time.");
                loadDay(activeDay);
            });
            $('#overload-no').click(() => $('#overload-modal').addClass('hidden'));

            // --- QUICK MUTE ---
            $('#quick-mute').click(function() {
                if(profile.sound === 'silent') { profile.sound = 'voice'; } else { profile.sound = 'silent'; }
                localStorage.setItem(KEY_PROF, JSON.stringify(profile));
                updateAudioIcon();
            });
            function updateAudioIcon() {
                if(profile.sound === 'silent') $('#quick-mute').html('<i class="fas fa-volume-mute text-red-400"></i>');
                else $('#quick-mute').html('<i class="fas fa-volume-up text-xs"></i>');
            }

            // --- JOURNAL UI ---
            function populateJournal() {
                const el = $('#journal-list').empty();
                if(history.length === 0) { el.html('<div class="text-center text-slate-500 text-xs py-10">No history yet.</div>'); return; }
                history.forEach(h => {
                    el.append(`
                        <div class="glass-panel p-4 rounded-2xl flex justify-between items-center">
                            <div>
                                <div class="text-[10px] text-slate-500">${h.date}</div>
                                <div class="font-bold text-white text-sm">${h.focus}</div>
                            </div>
                            <div class="text-xs font-mono text-slate-300">${h.time}</div>
                        </div>
                    `);
                });
            }

            // --- UTILS & BOILERPLATE ---
            function playSound(text) { if(profile.sound === 'silent') return; if(text === 'beep') { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1); o.stop(audioCtx.currentTime + 0.1); } else { synth.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.1; synth.speak(u); } }
            function fireConfetti() { const c = document.getElementById('confetti-canvas'); const x = c.getContext('2d'); c.width=window.innerWidth; c.height=window.innerHeight; let p=[]; for(let i=0;i<100;i++)p.push({x:c.width/2,y:c.height/2,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20,c:`hsl(${Math.random()*360},100%,50%)`,a:1}); function a(){x.clearRect(0,0,c.width,c.height);p.forEach((k,i)=>{k.x+=k.vx;k.y+=k.vy;k.vy+=0.5;k.a-=0.02;x.fillStyle=k.c;x.globalAlpha=k.a;x.fillRect(k.x,k.y,8,8);if(k.a<=0)p.splice(i,1)});if(p.length)requestAnimationFrame(a);}a(); }
            
            function renderWeekNav() { const container = $('#day-nav-container').empty(); dayNames.forEach((d, i) => { const activeClass = (i === activeDay) ? 'active' : 'glass-panel text-slate-400'; const hasData = completed[i] && completed[i].length === schedule[i].exercises.length; container.append(`<button class="day-btn w-12 h-16 rounded-2xl flex flex-col items-center justify-center relative shrink-0 ${activeClass}" data-day="${i}"><span class="text-[9px] uppercase font-bold opacity-60">${d}</span><span class="text-lg font-black">${i === new Date().getDay() ? '★' : new Date().getDate() + (i - new Date().getDay())}</span>${hasData ? '<div class="status-dot"></div>' : ''}</button>`); }); }
            function loadDay(i) { activeDay = parseInt(i); $('.day-btn').removeClass('active').addClass('glass-panel text-slate-400'); $(`.day-btn[data-day="${activeDay}"]`).addClass('active').removeClass('glass-panel text-slate-400'); const data = schedule[activeDay]; $('#day-focus').text(data.focus); $('.muscle-part').removeClass('muscle-active'); data.muscles.forEach(m => $(`.muscle-part[data-muscle="${m}"]`).addClass('muscle-active')); buildQueue(); renderList(); endSession(false); }
            function updateSettingsUI() { $('#modal-level-val').text(profile.level.toFixed(1) + "x"); }
            $('.tab-btn').click(function() { $('.tab-btn').removeClass('active'); $(this).addClass('active'); $('.tab-content').removeClass('active'); $(`#${$(this).data('tab')}`).addClass('active'); });

            // Bindings
            $('.day-btn').click(function() { loadDay($(this).data('day')); });
            $('#open-profile').click(() => { populateJournal(); $('#profile-modal').removeClass('hidden'); });
            $('#close-profile').click(() => $('#profile-modal').addClass('hidden'));
            $('#reset-day-btn').click(() => { if(confirm("Clear day?")) { delete completed[activeDay]; localStorage.setItem(KEY_COMP, JSON.stringify(completed)); loadDay(activeDay); }});
            $('.theme-btn').click(function() { const t = $(this).data('theme'); $('body').removeClass().addClass(t); profile.theme = t; localStorage.setItem(KEY_PROF, JSON.stringify(profile)); });
            $('#level-up-btn').click(() => { profile.level += 0.1; localStorage.setItem(KEY_PROF, JSON.stringify(profile)); updateSettingsUI(); loadDay(activeDay); });
            $('#level-reset-btn').click(() => { profile.level = 1.0; localStorage.setItem(KEY_PROF, JSON.stringify(profile)); updateSettingsUI(); loadDay(activeDay); });
            $('#hard-reset').click(() => { if(confirm("Reset?")) { localStorage.clear(); location.reload(); }});
            $('#export-data').click(function() { const data = { schedule, completed, profile, history, streakData }; const blob = new Blob([JSON.stringify(data)], {type: "application/json"}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `dailyburn_backup.json`; a.click(); });
        });
    </script>
</body>
</html>
