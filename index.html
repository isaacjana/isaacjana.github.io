<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Firestore Example</title>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input, button {
            margin: 5px;
            padding: 10px;
        }
        #data {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Firebase Firestore Example</h1>

    <!-- Form to add data -->
    <div>
        <input type="text" id="name" placeholder="Enter name">
        <input type="text" id="email" placeholder="Enter email">
        <button onclick="addData()">Add Data</button>
    </div>

    <!-- Display data -->
    <div id="data">
        <h2>Data from Firestore:</h2>
        <ul id="data-list"></ul>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";

      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyBDvuw9mY_Gq_dUdOIEKM5O6YvCaTs61x8",
        authDomain: "jabber-3ef94.firebaseapp.com",
        projectId: "jabber-3ef94",
        storageBucket: "jabber-3ef94.firebasestorage.app",
        messagingSenderId: "435172590693",
        appId: "1:435172590693:web:d508508bb6885c995bf28c"
      };
    // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Function to add data to Firestore
        function addData() {
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;

            db.collection("users").add({
                name: name,
                email: email
            })
            .then(() => {
                console.log("Data added successfully!");
                document.getElementById("name").value = "";
                document.getElementById("email").value = "";
                fetchData(); // Refresh the data list
            })
            .catch((error) => {
                console.error("Error adding data: ", error);
            });
        }

        // Function to fetch and display data from Firestore
        function fetchData() {
            const dataList = document.getElementById("data-list");
            dataList.innerHTML = ""; // Clear the list

            db.collection("users").get()
            .then((querySnapshot) => {
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const listItem = document.createElement("li");
                    listItem.textContent = `Name: ${data.name}, Email: ${data.email}`;
                    dataList.appendChild(listItem);
                });
            })
            .catch((error) => {
                console.error("Error fetching data: ", error);
            });
        }

        // Fetch data on page load
        fetchData();
    </script>
</body>
</html>
