<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js"></script>
    <title>Firebase Firestore Example 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input, button {
            margin: 5px;
            padding: 10px;
        }
        #data {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Firebase Firestore Example</h1>

    <!-- Form to add data -->
    <div>
        <input type="text" id="name" placeholder="Enter name">
        <input type="text" id="email" placeholder="Enter email">
        <button onclick="addData()">Add Data</button>
    </div>

    <!-- Display data -->
    <div id="data">
        <h2>Data from Firestore:</h2>
        <ul id="data-list"></ul>
    </div>

    <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBDvuw9mY_Gq_dUdOIEKM5O6YvCaTs61x8",
        authDomain: "jabber-3ef94.firebaseapp.com",
        projectId: "jabber-3ef94",
        storageBucket: "jabber-3ef94.firebasestorage.app",
        messagingSenderId: "435172590693",
        appId: "1:435172590693:web:d508508bb6885c995bf28c"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Function to add data to Firestore
    async function addData() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;

        try {
            // Add a new document to the "users" collection
            await addDoc(collection(db, "users"), {
                name: name,
                email: email
            });
            console.log("Data added successfully!");

            // Clear the input fields
            document.getElementById("name").value = "";
            document.getElementById("email").value = "";

            // Refresh the data list
            fetchData();
        } catch (error) {
            console.error("Error adding data: ", error);
        }
    }

    // Function to fetch and display data from Firestore
    async function fetchData() {
        const dataList = document.getElementById("data-list");
        dataList.innerHTML = ""; // Clear the list

        try {
            // Get all documents from the "users" collection
            const querySnapshot = await getDocs(collection(db, "users"));
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const listItem = document.createElement("li");
                listItem.textContent = `Name: ${data.name}, Email: ${data.email}`;
                dataList.appendChild(listItem);
            });
        } catch (error) {
            console.error("Error fetching data: ", error);
        }
    }

    // Fetch data on page load
    fetchData();
</script>
</body>
</html>
