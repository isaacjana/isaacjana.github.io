<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgileWorks Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkbg: '#0f172a', darkcard: '#1e293b' } } }
        }
    </script>
    <style>
        .loader { border-top-color: #3b82f6; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Poker Card Flip Animation */
        .poker-card { perspective: 1000px; }
        .poker-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .flipped .poker-inner { transform: rotateY(180deg); }
        .poker-front, .poker-back { backface-visibility: hidden; }
        .poker-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-gray-100 dark:bg-darkbg text-gray-800 dark:text-gray-200 transition-colors duration-200">

    <div id="login-screen" class="flex items-center justify-center h-screen bg-gradient-to-br from-blue-900 to-slate-900">
        <div class="bg-white dark:bg-darkcard p-8 rounded-xl shadow-2xl text-center w-96">
            <h1 class="text-3xl font-bold mb-2 text-blue-600">AgileWorks <span class="text-xs bg-blue-100 text-blue-800 px-2 rounded">PRO</span></h1>
            <p class="text-gray-500 mb-6">Full Stack Scrum Suite</p>
            
            <label class="block text-left text-sm mb-1 font-bold">Select Role (For Demo)</label>
            <select id="login-role" class="w-full mb-4 border p-2 rounded dark:bg-gray-700 dark:border-gray-600">
                <option value="dev">Developer (Member)</option>
                <option value="master">Scrum Master (Admin)</option>
            </select>

            <button id="btn-login" class="w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 rounded hover:bg-gray-50 flex items-center justify-center gap-2 transition dark:bg-gray-700 dark:text-white dark:border-gray-600">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
                Sign in with Google
            </button>
        </div>
    </div>

    <div id="app-dashboard" class="hidden min-h-screen flex flex-col">
        
        <nav class="bg-white dark:bg-darkcard shadow border-b border-gray-200 dark:border-gray-700">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex justify-between h-16">
                    <div class="flex items-center gap-6">
                        <span class="font-bold text-xl text-blue-600">AgileWorks</span>
                        <div class="hidden md:flex gap-4 text-sm font-medium">
                            <button onclick="switchTab('board')" class="nav-btn text-blue-600 border-b-2 border-blue-600 pb-1">Board</button>
                            <button onclick="switchTab('retro')" class="nav-btn text-gray-500 hover:text-blue-600 pb-1">Retro</button>
                            <button onclick="switchTab('poker')" class="nav-btn text-gray-500 hover:text-blue-600 pb-1">Poker</button>
                            <button onclick="switchTab('analytics')" class="nav-btn text-gray-500 hover:text-blue-600 pb-1">Analytics</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                            <i class="fa-solid fa-moon"></i>
                        </button>
                        <span id="user-display" class="text-sm font-medium"></span>
                        <span id="role-badge" class="text-xs bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded"></span>
                        <button id="btn-logout" class="text-sm text-red-500 hover:text-red-700"><i class="fa-solid fa-power-off"></i></button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow p-6 max-w-7xl mx-auto w-full">
            
            <div id="view-board" class="view-section space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-center bg-white dark:bg-darkcard p-4 rounded shadow gap-4">
                    <div class="flex gap-4 items-center w-full md:w-auto">
                        <select id="sprint-select" class="border p-2 rounded dark:bg-gray-700 dark:border-gray-600 w-full"></select>
                    </div>
                    <div class="flex gap-2 w-full md:w-auto justify-end">
                         <button id="btn-complete-sprint" class="role-master hidden bg-purple-600 text-white px-4 py-2 rounded text-sm hover:bg-purple-700">Complete Sprint</button>
                        <button id="btn-new-sprint-modal" class="role-master hidden bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">+ New Sprint</button>
                        <button id="btn-export-excel" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700"><i class="fa-solid fa-file-excel"></i> Export</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                    <div class="lg:col-span-1 bg-white dark:bg-darkcard p-4 rounded shadow h-[600px] flex flex-col">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="font-bold">Backlog</h2>
                            <button onclick="openItemModal('PBI')" class="text-blue-500 hover:text-blue-700 text-sm font-bold">+ Add</button>
                        </div>
                        <div id="pbi-list" class="flex-grow overflow-y-auto space-y-2 pr-2"></div>
                    </div>
                    
                    <div class="lg:col-span-3 grid grid-cols-3 gap-4 h-[600px]">
                        <div class="kanban-col bg-gray-200 dark:bg-gray-800 p-3 rounded flex flex-col">
                            <h3 class="font-bold text-gray-500 text-xs uppercase mb-3">To Do</h3>
                            <div id="col-todo" class="flex-grow overflow-y-auto space-y-2"></div>
                        </div>
                        <div class="kanban-col bg-blue-50 dark:bg-slate-800 p-3 rounded flex flex-col">
                            <h3 class="font-bold text-blue-500 text-xs uppercase mb-3">In Progress</h3>
                            <div id="col-doing" class="flex-grow overflow-y-auto space-y-2"></div>
                        </div>
                        <div class="kanban-col bg-green-50 dark:bg-slate-800 p-3 rounded flex flex-col">
                            <h3 class="font-bold text-green-500 text-xs uppercase mb-3">Done</h3>
                            <div id="col-done" class="flex-grow overflow-y-auto space-y-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="view-retro" class="view-section hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold">Retrospective</h2>
                    <button onclick="clearRetro()" class="role-master hidden text-red-500 text-sm hover:underline">Clear Board</button>
                </div>
                <div class="grid grid-cols-3 gap-6 h-[600px]">
                    <div class="bg-green-100 dark:bg-green-900/30 p-4 rounded-lg flex flex-col">
                        <div class="flex justify-between mb-4"><h3 class="font-bold text-green-700 dark:text-green-400">Start Doing</h3> <button onclick="addRetroItem('start')" class="text-xl">+</button></div>
                        <div id="retro-start" class="overflow-y-auto space-y-2 flex-grow"></div>
                    </div>
                    <div class="bg-red-100 dark:bg-red-900/30 p-4 rounded-lg flex flex-col">
                        <div class="flex justify-between mb-4"><h3 class="font-bold text-red-700 dark:text-red-400">Stop Doing</h3> <button onclick="addRetroItem('stop')" class="text-xl">+</button></div>
                        <div id="retro-stop" class="overflow-y-auto space-y-2 flex-grow"></div>
                    </div>
                    <div class="bg-blue-100 dark:bg-blue-900/30 p-4 rounded-lg flex flex-col">
                        <div class="flex justify-between mb-4"><h3 class="font-bold text-blue-700 dark:text-blue-400">Continue Doing</h3> <button onclick="addRetroItem('continue')" class="text-xl">+</button></div>
                        <div id="retro-continue" class="overflow-y-auto space-y-2 flex-grow"></div>
                    </div>
                </div>
            </div>

            <div id="view-poker" class="view-section hidden text-center space-y-8">
                <h2 class="text-2xl font-bold">Planning Poker</h2>
                <div class="role-master hidden space-x-4">
                    <button onclick="togglePokerReveal(true)" class="bg-blue-600 text-white px-6 py-2 rounded">Reveal Cards</button>
                    <button onclick="resetPoker()" class="bg-gray-500 text-white px-6 py-2 rounded">Reset Round</button>
                </div>
                
                <div class="bg-green-700 dark:bg-green-900 rounded-full h-64 w-full max-w-4xl mx-auto flex items-center justify-center relative shadow-inner mt-12">
                    <p class="text-white opacity-50 font-bold text-xl">Table</p>
                    <div id="poker-players" class="absolute inset-0 w-full h-full">
                        </div>
                </div>

                <div class="mt-8">
                    <h3 class="text-gray-500 mb-4">Choose your estimate</h3>
                    <div class="flex justify-center gap-4 flex-wrap">
                        <button onclick="castVote(1)" class="poker-vote-btn w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded text-2xl font-bold hover:-translate-y-2 transition">1</button>
                        <button onclick="castVote(2)" class="poker-vote-btn w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded text-2xl font-bold hover:-translate-y-2 transition">2</button>
                        <button onclick="castVote(3)" class="poker-vote-btn w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded text-2xl font-bold hover:-translate-y-2 transition">3</button>
                        <button onclick="castVote(5)" class="poker-vote-btn w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded text-2xl font-bold hover:-translate-y-2 transition">5</button>
                        <button onclick="castVote(8)" class="poker-vote-btn w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded text-2xl font-bold hover:-translate-y-2 transition">8</button>
                        <button onclick="castVote(13)" class="poker-vote-btn w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded text-2xl font-bold hover:-translate-y-2 transition">13</button>
                    </div>
                </div>
            </div>

            <div id="view-analytics" class="view-section hidden space-y-6">
                <h2 class="text-2xl font-bold">Team Velocity</h2>
                <div class="bg-white dark:bg-darkcard p-6 rounded shadow h-96">
                    <canvas id="velocityChart"></canvas>
                </div>
            </div>

        </main>
    </div>

    <div id="modal-details" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white dark:bg-darkcard p-6 rounded-lg w-[600px] max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between mb-4">
                <input id="detail-title" class="text-xl font-bold bg-transparent border-none w-full focus:ring-0" value="Task Title">
                <button onclick="$('#modal-details').addClass('hidden')" class="text-gray-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="grid grid-cols-3 gap-4">
                <div class="col-span-2 space-y-4">
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold">Description</label>
                        <textarea id="detail-desc" class="w-full border p-2 rounded h-24 dark:bg-gray-700 dark:border-gray-600 mt-1"></textarea>
                    </div>
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold">Discussion</label>
                        <div id="detail-comments" class="bg-gray-50 dark:bg-slate-800 p-2 rounded h-40 overflow-y-auto mb-2 space-y-2 text-sm"></div>
                        <div class="flex gap-2">
                            <input id="inp-comment" placeholder="Write a comment..." class="flex-grow border p-2 rounded dark:bg-gray-700">
                            <button id="btn-post-comment" class="bg-blue-600 text-white px-3 rounded">Send</button>
                        </div>
                    </div>
                </div>
                <div class="col-span-1 space-y-4 border-l pl-4 dark:border-gray-700">
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold">Points</label>
                        <input id="detail-points" type="number" class="w-full border p-1 rounded mt-1 dark:bg-gray-700">
                    </div>
                    <button id="btn-save-details" class="w-full bg-blue-600 text-white py-2 rounded">Save Changes</button>
                    <button id="btn-delete-item" class="role-master hidden w-full border border-red-500 text-red-500 py-2 rounded hover:bg-red-50">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-dod" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white dark:bg-darkcard p-6 rounded-lg w-96">
            <h3 class="text-lg font-bold mb-4 text-green-600">Definition of Done</h3>
            <div class="space-y-2 mb-4">
                <label class="flex items-center gap-2"><input type="checkbox" class="dod-check w-4 h-4"> Code Reviewed</label>
                <label class="flex items-center gap-2"><input type="checkbox" class="dod-check w-4 h-4"> Unit Tests Passed</label>
                <label class="flex items-center gap-2"><input type="checkbox" class="dod-check w-4 h-4"> QA Verified</label>
                <label class="flex items-center gap-2"><input type="checkbox" class="dod-check w-4 h-4"> Product Owner Approval</label>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="$('#modal-dod').addClass('hidden')" class="px-4 py-2 text-gray-500">Cancel</button>
                <button id="btn-confirm-dod" class="px-4 py-2 bg-green-600 text-white rounded opacity-50 cursor-not-allowed" disabled>Confirm Move</button>
            </div>
        </div>
    </div>

    <div id="modal-sprint" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white dark:bg-darkcard p-6 rounded-lg w-96">
            <h3 class="font-bold mb-4">Start New Sprint</h3>
            <input id="new-sprint-name" placeholder="Sprint Name" class="w-full border p-2 mb-2 rounded dark:bg-gray-700">
            <button id="btn-create-sprint" class="w-full bg-blue-600 text-white py-2 rounded">Create</button>
            <button onclick="$('#modal-sprint').addClass('hidden')" class="w-full mt-2 text-gray-500">Cancel</button>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyD4QLq5wS3t_W1ckxuBDWydSDWSkVcaW7k",
            authDomain: "agile-works-ba545.firebaseapp.com",
            projectId: "agile-works-ba545",
            storageBucket: "agile-works-ba545.firebasestorage.app",
            messagingSenderId: "588869159638",
            appId: "1:588869159638:web:5bfc6e3740ec231776d777"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let currentRole = 'dev'; // dev | master
        let currentSprintId = null;
        let pendingMoveId = null; // for DoD

        // 2. AUTH & RBAC
        $('#btn-login').click(() => {
            currentRole = $('#login-role').val(); // Capture selected role
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(e => alert(e.message));
        });

        $('#btn-logout').click(() => auth.signOut());

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                $('#login-screen').addClass('hidden');
                $('#app-dashboard').removeClass('hidden');
                $('#user-display').text(user.displayName);
                
                // Set Role UI
                $('#role-badge').text(currentRole === 'master' ? 'Scrum Master' : 'Developer');
                if(currentRole === 'master') $('.role-master').removeClass('hidden');
                else $('.role-master').addClass('hidden');

                initApp();
            } else {
                $('#login-screen').removeClass('hidden');
                $('#app-dashboard').addClass('hidden');
            }
        });

        function initApp() {
            loadSprints();
            setupRetro();
            setupPoker();
            setupTabs();
        }

        // 3. TAB SYSTEM
        window.switchTab = (tabId) => {
            $('.view-section').addClass('hidden');
            $(`#view-${tabId}`).removeClass('hidden');
            $('.nav-btn').removeClass('text-blue-600 border-b-2 border-blue-600').addClass('text-gray-500');
            $(event.target).removeClass('text-gray-500').addClass('text-blue-600 border-b-2 border-blue-600');
            
            if(tabId === 'analytics') loadVelocityChart();
        };

        // 4. DARK MODE
        $('#theme-toggle').click(() => {
            $('html').toggleClass('dark');
            const isDark = $('html').hasClass('dark');
            $('#theme-toggle i').toggleClass('fa-moon fa-sun');
        });

        // 5. BOARD LOGIC
        function loadSprints() {
            db.collection('sprints').orderBy('createdAt', 'desc').onSnapshot(snap => {
                const $sel = $('#sprint-select');
                $sel.empty();
                snap.docs.forEach(doc => {
                    const s = doc.data();
                    if(s.status !== 'completed') {
                        $sel.append(`<option value="${doc.id}">${s.name}</option>`);
                    }
                });
                if(!currentSprintId && snap.docs.length > 0) {
                    $sel.val(snap.docs[0].id).change();
                }
            });
        }

        $('#sprint-select').change(function() {
            currentSprintId = $(this).val();
            loadItems(currentSprintId);
        });

        function loadItems(sprintId) {
            if(!sprintId) return;
            db.collection('items').where('sprintId', '==', sprintId).onSnapshot(snap => {
                $('#col-todo, #col-doing, #col-done, #pbi-list').empty();
                
                snap.docs.forEach(doc => {
                    const item = doc.data();
                    const card = renderCard(doc.id, item);
                    
                    if(item.type === 'PBI') $('#pbi-list').append(card);
                    else if(item.status === 'todo') $('#col-todo').append(card);
                    else if(item.status === 'doing') $('#col-doing').append(card);
                    else if(item.status === 'done') $('#col-done').append(card);
                });
            });
        }

        function renderCard(id, item) {
            // Simplified actions
            let btns = '';
            if(item.type === 'PBI') btns = `<button onclick="updateItem('${id}', {type:'SBI', status:'todo'})" class="text-xs bg-gray-200 px-2 rounded">To Sprint</button>`;
            else {
                if(item.status === 'todo') btns = `<button onclick="updateItem('${id}', {status:'doing'})" class="text-xs text-blue-600 bg-blue-100 px-2 rounded">Start</button>`;
                if(item.status === 'doing') btns = `<button onclick="initiateDone('${id}')" class="text-xs text-green-600 bg-green-100 px-2 rounded">Done</button>`;
                if(item.status === 'done') btns = `<i class="fa-solid fa-check text-green-500"></i>`;
            }

            return `
                <div class="bg-white dark:bg-darkcard p-3 rounded shadow-sm border-l-4 ${item.status==='done'?'border-green-500':'border-blue-500'} cursor-pointer hover:shadow-md transition" onclick="openDetailModal('${id}')">
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold text-sm">${item.title}</span>
                        <span class="text-xs bg-gray-200 dark:bg-gray-700 px-1 rounded h-fit">${item.points || '-'}</span>
                    </div>
                    <div class="flex justify-between items-center" onclick="event.stopPropagation()">
                        <span class="text-[10px] text-gray-400 uppercase">${item.type}</span>
                        <div class="flex gap-1">${btns}</div>
                    </div>
                </div>
            `;
        }

        window.updateItem = (id, data) => db.collection('items').doc(id).update(data);

        // 6. DoD & ITEM DETAILS
        window.initiateDone = (id) => {
            pendingMoveId = id;
            $('.dod-check').prop('checked', false);
            $('#btn-confirm-dod').prop('disabled', true).addClass('opacity-50 cursor-not-allowed');
            $('#modal-dod').removeClass('hidden');
        };

        $('.dod-check').change(() => {
            const allChecked = $('.dod-check:checked').length === $('.dod-check').length;
            if(allChecked) $('#btn-confirm-dod').prop('disabled', false).removeClass('opacity-50 cursor-not-allowed');
            else $('#btn-confirm-dod').prop('disabled', true).addClass('opacity-50 cursor-not-allowed');
        });

        $('#btn-confirm-dod').click(() => {
            updateItem(pendingMoveId, { status: 'done' });
            $('#modal-dod').addClass('hidden');
        });

        // Detail Modal Logic
        let currentDetailId = null;
        window.openDetailModal = (id) => {
            currentDetailId = id;
            db.collection('items').doc(id).get().then(doc => {
                const data = doc.data();
                $('#detail-title').val(data.title);
                $('#detail-desc').val(data.description || '');
                $('#detail-points').val(data.points || 0);
                $('#modal-details').removeClass('hidden');
                loadComments(id);
            });
        };

        // Note: In real app, separate subcollection. Here using array for simplicity.
        function loadComments(id) {
            // Using a simple workaround: fetching the doc again or listening to it
            // Assuming 'comments' field is array of objects { user, text, time }
            db.collection('items').doc(id).onSnapshot(doc => {
                const data = doc.data();
                const $box = $('#detail-comments').empty();
                (data.comments || []).forEach(c => {
                    $box.append(`<div class="bg-white dark:bg-gray-700 p-2 rounded shadow-sm"><span class="font-bold text-xs text-blue-500">${c.user}</span>: ${c.text}</div>`);
                });
            });
        }

        $('#btn-post-comment').click(async () => {
            const txt = $('#inp-comment').val();
            if(!txt) return;
            const comment = { user: currentUser.displayName, text: txt, time: Date.now() };
            await db.collection('items').doc(currentDetailId).update({
                comments: firebase.firestore.FieldValue.arrayUnion(comment)
            });
            $('#inp-comment').val('');
        });
        
        $('#btn-save-details').click(() => {
             db.collection('items').doc(currentDetailId).update({
                 title: $('#detail-title').val(),
                 description: $('#detail-desc').val(),
                 points: parseInt($('#detail-points').val())
             });
             $('#modal-details').addClass('hidden');
        });

        window.openItemModal = (type) => {
            // Quick add for demo
            const title = prompt("Task Title:");
            if(title) db.collection('items').add({
                title, type, status: 'todo', sprintId: currentSprintId, points: 0, createdAt: Date.now()
            });
        };

        // 7. RETROSPECTIVE
        function setupRetro() {
            db.collection('retro').onSnapshot(snap => {
                $('#retro-start, #retro-stop, #retro-continue').empty();
                snap.docs.forEach(doc => {
                    const d = doc.data();
                    const html = `<div class="bg-white dark:bg-darkcard p-2 rounded shadow text-sm relative group">
                        ${d.text}
                        <button onclick="db.collection('retro').doc('${doc.id}').delete()" class="hidden group-hover:block absolute top-1 right-1 text-red-500"><i class="fa-solid fa-times"></i></button>
                    </div>`;
                    $(`#retro-${d.type}`).append(html);
                });
            });
        }
        window.addRetroItem = (type) => {
            const txt = prompt(`Add to ${type}:`);
            if(txt) db.collection('retro').add({ type, text: txt, createdAt: Date.now() });
        };
        window.clearRetro = () => {
            if(confirm("Clear all retro items?")) {
                db.collection('retro').get().then(snap => {
                    snap.forEach(doc => doc.ref.delete());
                });
            }
        };

        // 8. PLANNING POKER
        function setupPoker() {
            db.collection('poker').doc('session').onSnapshot(doc => {
                if(!doc.exists) return;
                const data = doc.data(); // { revealed: bool, votes: { uid: val } }
                const votes = data.votes || {};
                
                // Render Table Players
                $('#poker-players').empty();
                Object.keys(votes).forEach((uid, index) => {
                    // Visual positioning logic skipped for brevity, just listing them
                    const val = votes[uid];
                    const isRevealed = data.revealed;
                    
                    const cardContent = isRevealed 
                        ? `<div class="bg-white text-black font-bold text-xl flex items-center justify-center h-16 w-12 rounded border-2 border-blue-500 shadow">${val}</div>`
                        : `<div class="bg-blue-600 h-16 w-12 rounded border-2 border-white shadow bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')]"></div>`;

                    $('#poker-players').append(`
                        <div class="inline-block m-2 text-center">
                            ${cardContent}
                            <div class="text-xs text-white mt-1">Player</div>
                        </div>
                    `);
                });
            });
        }

        window.castVote = (val) => {
            db.collection('poker').doc('session').set({
                votes: { [currentUser.uid]: val }
            }, { merge: true });
        };

        window.togglePokerReveal = (revealed) => {
            db.collection('poker').doc('session').update({ revealed: revealed });
        };

        window.resetPoker = () => {
            db.collection('poker').doc('session').set({ revealed: false, votes: {} });
        };

        // 9. ANALYTICS (Velocity)
        // Note: For this to work, we need to mark sprints as complete and save their total points.
        $('#btn-complete-sprint').click(async () => {
             if(!confirm("Complete this sprint and archive stats?")) return;
             
             // 1. Calculate points
             const items = await db.collection('items').where('sprintId', '==', currentSprintId).where('status', '==', 'done').get();
             let total = 0;
             items.forEach(d => total += (d.data().points || 0));

             // 2. Save stats
             const sprintName = $('#sprint-select option:selected').text();
             await db.collection('sprint_stats').add({ name: sprintName, points: total, date: Date.now() });

             // 3. Mark sprint complete
             await db.collection('sprints').doc(currentSprintId).update({ status: 'completed' });
        });

        function loadVelocityChart() {
             db.collection('sprint_stats').orderBy('date').get().then(snap => {
                 const labels = [];
                 const data = [];
                 snap.forEach(doc => {
                     const d = doc.data();
                     labels.push(d.name);
                     data.push(d.points);
                 });

                 const ctx = document.getElementById('velocityChart').getContext('2d');
                 new Chart(ctx, {
                     type: 'bar',
                     data: {
                         labels: labels,
                         datasets: [{
                             label: 'Completed Story Points',
                             data: data,
                             backgroundColor: '#3b82f6'
                         }]
                     },
                     options: { responsive: true, maintainAspectRatio: false }
                 });
             });
        }

        // Utils
        $('#btn-new-sprint-modal').click(() => $('#modal-sprint').removeClass('hidden'));
        $('#btn-create-sprint').click(() => {
            db.collection('sprints').add({
                name: $('#new-sprint-name').val(),
                status: 'active',
                createdAt: Date.now()
            });
            $('#modal-sprint').addClass('hidden');
        });

        // Initialize Poker Session if not exists
        db.collection('poker').doc('session').get().then(doc => {
            if(!doc.exists) db.collection('poker').doc('session').set({ revealed: false, votes: {} });
        });

    </script>
</body>
</html>
