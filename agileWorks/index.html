<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgileWorks Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkbg: '#0f172a', darkcard: '#1e293b' } } }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        /* Poker Animations */
        .poker-card { transition: transform 0.2s; }
        .poker-card:hover { transform: translateY(-5px); }
        
        /* Loader */
        .loader { border-top-color: #3b82f6; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 dark:bg-darkbg text-gray-800 dark:text-gray-200 transition-colors duration-200 font-sans h-screen overflow-hidden flex flex-col">

    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-blue-900 to-slate-900">
        <div class="bg-white dark:bg-darkcard p-8 rounded-xl shadow-2xl text-center w-96">
            <h1 class="text-3xl font-bold mb-2 text-blue-600">AgileWorks <span class="text-xs bg-blue-100 text-blue-800 px-2 rounded">PRO</span></h1>
            <p class="text-gray-500 mb-6">Full Stack Scrum Suite</p>
            
            <label class="block text-left text-sm mb-1 font-bold">Select Role (Demo)</label>
            <select id="login-role" class="w-full mb-4 border p-2 rounded dark:bg-gray-700 dark:border-gray-600">
                <option value="dev">Developer (Member)</option>
                <option value="master">Scrum Master (Admin)</option>
            </select>

            <button id="btn-login" class="w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 rounded hover:bg-gray-50 flex items-center justify-center gap-2 transition dark:bg-gray-700 dark:text-white dark:border-gray-600">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
                Sign in with Google
            </button>
        </div>
    </div>

    <nav class="bg-white dark:bg-darkcard shadow border-b border-gray-200 dark:border-gray-700 shrink-0">
        <div class="max-w-full px-6">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-8">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-blue-600 text-2xl"></i>
                        <span class="font-bold text-xl hidden sm:block">AgileWorks</span>
                    </div>
                    <div class="hidden md:flex gap-6 text-sm font-medium">
                        <button onclick="switchTab('board')" class="nav-btn text-blue-600 border-b-2 border-blue-600 pb-1 px-1 transition">Board</button>
                        <button onclick="switchTab('retro')" class="nav-btn text-gray-500 hover:text-blue-600 pb-1 px-1 transition">Retro</button>
                        <button onclick="switchTab('poker')" class="nav-btn text-gray-500 hover:text-blue-600 pb-1 px-1 transition">Poker</button>
                        <button onclick="switchTab('analytics')" class="nav-btn text-gray-500 hover:text-blue-600 pb-1 px-1 transition">Analytics</button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative hidden lg:block">
                        <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                        <input id="global-search" type="text" placeholder="Search tasks..." class="pl-8 pr-4 py-1.5 rounded-full border border-gray-300 text-sm focus:ring-2 focus:ring-blue-500 w-48 dark:bg-gray-800 dark:border-gray-600">
                    </div>
                    
                    <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    
                    <div class="text-right hidden sm:block">
                        <div id="user-display" class="text-sm font-bold leading-tight">User</div>
                        <div id="role-badge" class="text-[10px] uppercase tracking-wider text-gray-500">Role</div>
                    </div>
                    <button id="btn-logout" class="text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 p-2 rounded"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow p-6 overflow-hidden max-w-[1600px] mx-auto w-full">
        
        <div id="view-board" class="view-section flex flex-col h-full gap-4">
            
            <div class="flex flex-col md:flex-row justify-between items-center bg-white dark:bg-darkcard p-3 rounded shadow-sm gap-4 shrink-0">
                <div class="flex gap-4 items-center w-full md:w-auto">
                    <select id="sprint-select" class="border p-2 rounded dark:bg-gray-700 dark:border-gray-600 min-w-[200px] text-sm font-bold"></select>
                    <label class="flex items-center gap-2 text-sm cursor-pointer select-none">
                        <input type="checkbox" id="filter-my-tasks" class="rounded text-blue-600">
                        <span>My Tasks</span>
                    </label>
                </div>
                <div class="flex gap-2 w-full md:w-auto justify-end">
                    <button id="btn-complete-sprint" class="role-master hidden bg-purple-600 text-white px-4 py-2 rounded text-sm hover:bg-purple-700 shadow transition"><i class="fa-solid fa-flag-checkered mr-1"></i> Complete</button>
                    <button id="btn-new-sprint-modal" class="role-master hidden bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 shadow transition"><i class="fa-solid fa-plus mr-1"></i> Sprint</button>
                    <button id="btn-export-excel" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700 shadow transition"><i class="fa-solid fa-file-excel mr-1"></i> Export</button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 h-full overflow-hidden">
                <div class="lg:col-span-1 bg-white dark:bg-darkcard rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col h-full">
                    <div class="p-3 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800/50 rounded-t-lg">
                        <h2 class="font-bold text-gray-600 dark:text-gray-300">Backlog (PBI)</h2>
                        <button onclick="openItemModal('PBI')" class="text-blue-600 hover:bg-blue-100 p-1 rounded transition"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div id="pbi-list" class="flex-grow overflow-y-auto p-2 space-y-2"></div>
                </div>
                
                <div class="lg:col-span-3 grid grid-cols-3 gap-4 h-full">
                    <div class="flex flex-col h-full bg-gray-100 dark:bg-gray-800/50 rounded-lg border border-gray-200 dark:border-gray-700">
                        <div class="p-3 border-b dark:border-gray-700 font-bold text-xs uppercase text-gray-500 tracking-wider">To Do</div>
                        <div id="col-todo" class="kanban-col flex-grow overflow-y-auto p-2 space-y-2" data-status="todo"></div>
                    </div>
                    <div class="flex flex-col h-full bg-blue-50 dark:bg-blue-900/10 rounded-lg border border-blue-100 dark:border-blue-900/30">
                        <div class="p-3 border-b border-blue-100 dark:border-blue-900/30 font-bold text-xs uppercase text-blue-500 tracking-wider">In Progress</div>
                        <div id="col-doing" class="kanban-col flex-grow overflow-y-auto p-2 space-y-2" data-status="doing"></div>
                    </div>
                    <div class="flex flex-col h-full bg-green-50 dark:bg-green-900/10 rounded-lg border border-green-100 dark:border-green-900/30">
                        <div class="p-3 border-b border-green-100 dark:border-green-900/30 font-bold text-xs uppercase text-green-500 tracking-wider">Done</div>
                        <div id="col-done" class="kanban-col flex-grow overflow-y-auto p-2 space-y-2" data-status="done"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-retro" class="view-section hidden h-full flex flex-col gap-6">
            <div class="flex justify-between items-center shrink-0">
                <h2 class="text-2xl font-bold">Retrospective Board</h2>
                <button onclick="clearRetro()" class="role-master hidden text-red-500 text-sm hover:bg-red-50 px-3 py-1 rounded transition">Clear Board</button>
            </div>
            <div class="grid grid-cols-3 gap-6 h-full overflow-hidden">
                <div class="bg-green-50 dark:bg-green-900/20 p-4 rounded-xl border border-green-100 dark:border-green-900/50 flex flex-col h-full">
                    <div class="flex justify-between mb-4 items-center">
                        <h3 class="font-bold text-green-700 dark:text-green-400">Start Doing</h3> 
                        <button onclick="addRetroItem('start')" class="bg-green-200 dark:bg-green-800 text-green-800 dark:text-green-100 w-8 h-8 rounded-full hover:scale-110 transition">+</button>
                    </div>
                    <div id="retro-start" class="overflow-y-auto space-y-3 flex-grow pr-2"></div>
                </div>
                <div class="bg-red-50 dark:bg-red-900/20 p-4 rounded-xl border border-red-100 dark:border-red-900/50 flex flex-col h-full">
                    <div class="flex justify-between mb-4 items-center">
                        <h3 class="font-bold text-red-700 dark:text-red-400">Stop Doing</h3> 
                        <button onclick="addRetroItem('stop')" class="bg-red-200 dark:bg-red-800 text-red-800 dark:text-red-100 w-8 h-8 rounded-full hover:scale-110 transition">+</button>
                    </div>
                    <div id="retro-stop" class="overflow-y-auto space-y-3 flex-grow pr-2"></div>
                </div>
                <div class="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-100 dark:border-blue-900/50 flex flex-col h-full">
                    <div class="flex justify-between mb-4 items-center">
                        <h3 class="font-bold text-blue-700 dark:text-blue-400">Continue Doing</h3> 
                        <button onclick="addRetroItem('continue')" class="bg-blue-200 dark:bg-blue-800 text-blue-800 dark:text-blue-100 w-8 h-8 rounded-full hover:scale-110 transition">+</button>
                    </div>
                    <div id="retro-continue" class="overflow-y-auto space-y-3 flex-grow pr-2"></div>
                </div>
            </div>
        </div>

        <div id="view-poker" class="view-section hidden h-full flex flex-col items-center justify-center space-y-8 relative">
            <h2 class="text-2xl font-bold absolute top-0 left-0">Planning Poker</h2>
            <div class="role-master hidden absolute top-0 right-0 space-x-2">
                <button onclick="togglePokerReveal(true)" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 transition">Reveal</button>
                <button onclick="resetPoker()" class="bg-gray-500 text-white px-4 py-2 rounded shadow hover:bg-gray-600 transition">Reset</button>
            </div>
            
            <div class="bg-green-700 dark:bg-green-900 rounded-[100px] h-80 w-full max-w-5xl flex items-center justify-center relative shadow-2xl border-8 border-green-800 dark:border-green-950">
                <p class="text-white/30 font-bold text-2xl tracking-widest uppercase">Team Table</p>
                <div id="poker-players" class="absolute inset-0 w-full h-full flex items-center justify-center flex-wrap content-between py-4"></div>
            </div>

            <div class="w-full max-w-3xl">
                <h3 class="text-gray-500 text-center mb-4 text-sm uppercase tracking-widest">Select Your Estimate</h3>
                <div class="flex justify-center gap-4 flex-wrap">
                    <button onclick="castVote(1)" class="poker-card w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded-lg text-2xl font-bold shadow-lg text-blue-600 hover:bg-blue-50">1</button>
                    <button onclick="castVote(2)" class="poker-card w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded-lg text-2xl font-bold shadow-lg text-blue-600 hover:bg-blue-50">2</button>
                    <button onclick="castVote(3)" class="poker-card w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded-lg text-2xl font-bold shadow-lg text-blue-600 hover:bg-blue-50">3</button>
                    <button onclick="castVote(5)" class="poker-card w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded-lg text-2xl font-bold shadow-lg text-blue-600 hover:bg-blue-50">5</button>
                    <button onclick="castVote(8)" class="poker-card w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded-lg text-2xl font-bold shadow-lg text-blue-600 hover:bg-blue-50">8</button>
                    <button onclick="castVote(13)" class="poker-card w-16 h-24 bg-white dark:bg-darkcard border-2 border-blue-500 rounded-lg text-2xl font-bold shadow-lg text-blue-600 hover:bg-blue-50">13</button>
                </div>
            </div>
        </div>

        <div id="view-analytics" class="view-section hidden h-full">
            <h2 class="text-2xl font-bold mb-6">Team Velocity</h2>
            <div class="bg-white dark:bg-darkcard p-6 rounded-lg shadow-lg h-[500px] w-full">
                <canvas id="velocityChart"></canvas>
            </div>
        </div>
    </main>

    <div id="modal-details" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[100] backdrop-blur-sm">
        <div class="bg-white dark:bg-darkcard rounded-xl w-[700px] max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col">
            <div class="p-6 border-b dark:border-gray-700 flex justify-between items-start">
                <input id="detail-title" class="text-2xl font-bold bg-transparent border-none w-full focus:ring-0 text-gray-800 dark:text-white" value="Task Title">
                <button onclick="$('#modal-details').addClass('hidden')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div class="p-6 grid grid-cols-3 gap-6 flex-grow">
                <div class="col-span-2 space-y-6">
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold mb-1 block">Description</label>
                        <textarea id="detail-desc" class="w-full border p-3 rounded-lg text-sm h-24 dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-blue-500" placeholder="Add a more detailed description..."></textarea>

                    <div class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-lg">
                        <label class="text-xs uppercase text-gray-500 font-bold mb-2 block">Subtasks</label>
                        <div id="subtask-list" class="space-y-2 mb-3"></div>

                            <button onclick="addSubtask()" class="bg-blue-600 text-white px-3 rounded hover:bg-blue-700"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold mb-2 block">Activity & Comments</label>
                        <div id="detail-comments" class="space-y-3 mb-3 max-h-40 overflow-y-auto p-1"></div>
                        <div class="flex gap-2">
                            <img id="my-avatar-comment" src="" class="w-8 h-8 rounded-full border">
                            <input id="inp-comment" placeholder="Write a comment..." class="flex-grow border p-2 rounded text-sm dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:border-blue-500">
                            <button id="btn-post-comment" class="text-blue-600 hover:text-blue-800 font-bold text-sm">Send</button>

                <div class="col-span-1 space-y-4">
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold block mb-1">Assignee</label>
                        <select id="detail-assignee" class="w-full border p-2 rounded dark:bg-gray-700 dark:border-gray-600 text-sm"></select>
                    </div>
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold block mb-1">Story Points</label>
                        <input id="detail-points" type="number" class="w-full border p-2 rounded dark:bg-gray-700 dark:border-gray-600 text-sm">
                    </div>
                    <div class="pt-4 border-t dark:border-gray-700 space-y-2">

                        <button id="btn-delete-item" class="role-master hidden w-full border border-red-500 text-red-500 py-2 rounded hover:bg-red-50 dark:hover:bg-red-900/20 transition">Delete Task</button>

    <div id="modal-dod" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[110]">
        <div class="bg-white dark:bg-darkcard p-6 rounded-xl w-96 shadow-2xl border-t-4 border-green-500 transform transition-all scale-100">
            <h3 class="text-lg font-bold mb-4 text-green-600 flex items-center gap-2"><i class="fa-solid fa-clipboard-check"></i> Definition of Done</h3>
            <div class="space-y-3 mb-6">
                <label class="flex items-center gap-3 p-2 hover:bg-gray-50 dark:hover:bg-gray-800 rounded cursor-pointer">
                    <input type="checkbox" class="dod-check w-5 h-5 text-green-600 rounded focus:ring-green-500"> 
                    <span class="text-sm">Code Reviewed & Approved</span>
                </label>
                <label class="flex items-center gap-3 p-2 hover:bg-gray-50 dark:hover:bg-gray-800 rounded cursor-pointer">
                    <input type="checkbox" class="dod-check w-5 h-5 text-green-600 rounded focus:ring-green-500"> 
                    <span class="text-sm">Unit Tests Passed</span>
                </label>
                <label class="flex items-center gap-3 p-2 hover:bg-gray-50 dark:hover:bg-gray-800 rounded cursor-pointer">
                    <input type="checkbox" class="dod-check w-5 h-5 text-green-600 rounded focus:ring-green-500"> 
                    <span class="text-sm">QA / Product Owner Verified</span>
                </label>

            <div class="flex justify-end gap-3">
                <button onclick="$('#modal-dod').addClass('hidden'); cancelDrag();" class="px-4 py-2 text-gray-500 hover:text-gray-700">Cancel</button>
                <button id="btn-confirm-dod" class="px-6 py-2 bg-green-600 text-white rounded shadow opacity-50 cursor-not-allowed transition" disabled>Confirm Move</button>
            </div>

    <div id="modal-sprint" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[100]">
        <div class="bg-white dark:bg-darkcard p-6 rounded-xl w-96 shadow-lg">
            <h3 class="font-bold mb-4 text-lg">Start New Sprint</h3>
            <input id="new-sprint-name" placeholder="Sprint Name (e.g. Sprint 42)" class="w-full border p-3 mb-4 rounded dark:bg-gray-700 dark:border-gray-600">
            <div class="flex justify-end gap-2">
                <button onclick="$('#modal-sprint').addClass('hidden')" class="px-4 py-2 text-gray-500">Cancel</button>
                <button id="btn-create-sprint" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Create</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyD4QLq5wS3t_W1ckxuBDWydSDWSkVcaW7k",
            authDomain: "agile-works-ba545.firebaseapp.com",
            projectId: "agile-works-ba545",
            storageBucket: "agile-works-ba545.firebasestorage.app",
            messagingSenderId: "588869159638",
            appId: "1:588869159638:web:5bfc6e3740ec231776d777"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // State Variables
        let currentUser = null;
        let currentRole = 'dev'; 
        let currentSprintId = null;
        let currentDetailId = null;
        let pendingMoveId = null;
        let pendingDragEvent = null; // To revert drag if DoD fails
        let allUsers = [];

        // --- 2. AUTHENTICATION & STARTUP ---
        $('#btn-login').click(() => {
            currentRole = $('#login-role').val(); 
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(e => alert(e.message));
        });

        $('#btn-logout').click(() => {
            auth.signOut();
            location.reload();
        });

        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;
                // Sync Role
                const userRef = db.collection('users').doc(user.uid);
                try {
                    const doc = await userRef.get();
                    if (!doc.exists) {
                        await userRef.set({ displayName: user.displayName, email: user.email, role: currentRole, createdAt: Date.now() });
                    } else {
                        currentRole = doc.data().role;
                    }
                } catch(e) { console.error("Auth Error", e); }

                // UI Setup
                $('#login-screen').addClass('hidden');
                $('#user-display').text(user.displayName);
                $('#role-badge').text(currentRole === 'master' ? 'Scrum Master' : 'Developer');
                if (currentRole === 'master') $('.role-master').removeClass('hidden');

                initApp();
            } else {
                $('#login-screen').removeClass('hidden');
            }
        });

        function initApp() {
            setupTabs();
            loadUsers(); // For assignee dropdown
            loadSprints();
            setupRetro();
            setupPoker();
            initDragAndDrop();
        }

        // Load Users for Assignee Dropdowns
        function loadUsers() {
            db.collection('users').get().then(snap => {
                allUsers = [];
                $('#detail-assignee').empty().append('<option value="">Unassigned</option>');
                snap.forEach(doc => {
                    const u = doc.data();
                    allUsers.push(u);
                    $('#detail-assignee').append(`<option value="${u.displayName}">${u.displayName}</option>`);
                });
            });
        }

        // --- 3. UI LOGIC (TABS & DARK MODE) ---
        window.switchTab = (tabId) => {
            $('.view-section').addClass('hidden');
            $(`#view-${tabId}`).removeClass('hidden');
            $('.nav-btn').removeClass('text-blue-600 border-b-2 border-blue-600').addClass('text-gray-500');
            $(event.target).removeClass('text-gray-500').addClass('text-blue-600 border-b-2 border-blue-600');
            if(tabId === 'analytics') loadVelocityChart();
        };

        $('#theme-toggle').click(() => {
            $('html').toggleClass('dark');
            $('#theme-toggle i').toggleClass('fa-moon fa-sun');
        });

        // --- 4. BOARD LOGIC (KANBAN) ---
        function loadSprints() {
            db.collection('sprints').orderBy('createdAt', 'desc').onSnapshot(snap => {
                const $sel = $('#sprint-select');
                $sel.empty();
                if (snap.empty) { $sel.append('<option value="">No Sprints</option>'); return; }
                
                snap.docs.forEach(doc => {
                    if (doc.data().status !== 'completed') 
                        $sel.append(`<option value="${doc.id}">${doc.data().name}</option>`);
                });
                
                if (!currentSprintId && snap.docs.length > 0) {
                    $sel.val(snap.docs[0].id).change();
                }
            });
        }

        $('#sprint-select').change(function() {
            currentSprintId = $(this).val();
            if (currentSprintId) loadItems(currentSprintId);
        });

        function loadItems(sprintId) {
            db.collection('items').where('sprintId', '==', sprintId).onSnapshot(snap => {
                $('#col-todo, #col-doing, #col-done, #pbi-list').empty();
                
                snap.docs.forEach(doc => {
                    const item = doc.data();
                    const card = renderCard(doc.id, item);
                    
                    if (item.type === 'PBI') $('#pbi-list').append(card);
                    else if (item.status === 'todo') $('#col-todo').append(card);
                    else if (item.status === 'doing') $('#col-doing').append(card);
                    else if (item.status === 'done') $('#col-done').append(card);
                });
                applyFilters(); // Re-apply search if typing
            });
        }

        function renderCard(id, item) {
            const assignee = item.assignee || 'Unassigned';
            const avatar = `https://ui-avatars.com/api/?name=${assignee}&background=random&color=fff&size=24`;
            
            // Subtask Progress
            let progressHtml = '';
            if (item.subtasks && item.subtasks.length > 0) {
                const total = item.subtasks.length;
                const done = item.subtasks.filter(t => t.done).length;
                const pct = (done/total)*100;
                progressHtml = `
                <div class="mt-2 text-[10px] text-gray-400 flex items-center gap-2">
                    <div class="flex-grow bg-gray-200 rounded-full h-1.5 dark:bg-gray-700"><div class="bg-green-500 h-1.5 rounded-full" style="width:${pct}%"></div></div>
                    <span>${done}/${total}</span>
                </div>`;
            }

            // Buttons Logic (Fallback for non-drag users)
            let actionBtn = '';
            if(item.type === 'PBI') actionBtn = `<button onclick="updateItem('${id}', {type:'SBI', status:'todo'}); event.stopPropagation();" class="text-xs bg-gray-200 px-2 py-1 rounded hover:bg-gray-300">To Sprint</button>`;

            return `
                <div class="drag-item bg-white dark:bg-darkcard p-3 rounded-lg shadow-sm border-l-4 ${item.status==='done'?'border-green-500':'border-blue-500'} cursor-grab hover:shadow-md transition group relative" 
                     data-id="${id}" onclick="openDetailModal('${id}')">
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-bold text-sm text-gray-800 dark:text-gray-200 leading-snug">${item.title}</span>
                        <span class="text-xs bg-gray-100 dark:bg-gray-700 px-1.5 py-0.5 rounded text-gray-500 font-mono">${item.points||'-'}</span>
                    </div>
                    ${progressHtml}
                    <div class="flex justify-between items-center mt-3">
                        <div class="flex items-center gap-2">
                             <img src="${avatar}" class="w-5 h-5 rounded-full border border-white shadow-sm" title="Assigned to ${assignee}">
                             <span class="text-[10px] text-gray-400 uppercase tracking-wide">${item.type}</span>
                        </div>
                        <div class="opacity-0 group-hover:opacity-100 transition-opacity">${actionBtn}</div>
                    </div>
                </div>
            `;
        }

        // --- 5. DRAG AND DROP & FILTERS ---
        function initDragAndDrop() {
            const containers = [document.getElementById('col-todo'), document.getElementById('col-doing'), document.getElementById('col-done')];
            containers.forEach(el => {
                new Sortable(el, {
                    group: 'kanban',
                    animation: 150,
                    delay: 100, // Touch friendly
                    ghostClass: 'opacity-50',
                    onEnd: function (evt) {
                        const itemId = evt.item.getAttribute('data-id');
                        const newStatus = evt.to.getAttribute('data-status');
                        
                        // Prevent PBI drag for now or handle separately
                        if(!newStatus) return; 

                        if (newStatus === 'done') {
                            pendingMoveId = itemId;
                            pendingDragEvent = { item: evt.item, from: evt.from }; // Store to revert
                            $('.dod-check').prop('checked', false);
                            $('#btn-confirm-dod').prop('disabled', true).addClass('opacity-50');
                            $('#modal-dod').removeClass('hidden');
                        } else {
                            updateItem(itemId, { status: newStatus });
                        }
                    }
                });
            });
        }

        window.cancelDrag = () => {
             // Simple reload to revert DOM, or manually move back. Reload is safer for sync.
             loadItems(currentSprintId);
        }

        // Search & Filter
        $('#global-search').on('input', applyFilters);
        $('#filter-my-tasks').on('change', applyFilters);

        function applyFilters() {
            const term = $('#global-search').val().toLowerCase();
            const myTasksOnly = $('#filter-my-tasks').is(':checked');
            const myName = currentUser ? currentUser.displayName : "";

            $('.drag-item').each(function() {
                const $el = $(this);
                const title = $el.find('.font-bold').text().toLowerCase();
                const assigneeTitle = $el.find('img').attr('title') || "";
                
                let visible = true;
                if (term && !title.includes(term)) visible = false;
                if (myTasksOnly && !assigneeTitle.includes(myName)) visible = false;

                if (visible) $el.removeClass('hidden'); else $el.addClass('hidden');
            });
        }

        // --- 6. DETAILS MODAL & SUBTASKS ---
        window.openDetailModal = (id) => {
            currentDetailId = id;
            db.collection('items').doc(id).onSnapshot(doc => {
                if(!doc.exists) return; // Deleted
                const data = doc.data();
                $('#detail-title').val(data.title);
                $('#detail-desc').val(data.description || '');
                $('#detail-points').val(data.points || 0);
                $('#detail-assignee').val(data.assignee || '');
                $('#my-avatar-comment').attr('src', `https://ui-avatars.com/api/?name=${currentUser.displayName}&size=32`);
                
                // Render Comments
                $('#detail-comments').empty();
                (data.comments || []).forEach(c => {
                    $('#detail-comments').append(`
                        <div class="bg-gray-50 dark:bg-gray-700/50 p-2 rounded text-sm">
                            <span class="font-bold text-blue-600 dark:text-blue-400 text-xs">${c.user}</span> 
                            <span class="text-gray-700 dark:text-gray-300">${c.text}</span>
                        </div>
                    `);
                });

                // Render Subtasks
                $('#subtask-list').empty();
                (data.subtasks || []).forEach((t, idx) => {
                    $('#subtask-list').append(`
                        <div class="flex items-center gap-2 text-sm group">
                            <input type="checkbox" ${t.done?'checked':''} onchange="toggleSubtask(${idx}, ${t.done})" class="cursor-pointer">
                            <span class="${t.done?'line-through text-gray-400':''} flex-grow">${t.text}</span>
                            <button onclick="deleteSubtask(${idx})" class="text-red-400 opacity-0 group-hover:opacity-100 px-2">&times;</button>
                        </div>
                    `);
                });
                
                $('#modal-details').removeClass('hidden');
            });
        };

        $('#btn-save-details').click(() => {
            updateItem(currentDetailId, {
                title: $('#detail-title').val(),
                description: $('#detail-desc').val(),
                points: parseInt($('#detail-points').val()),
                assignee: $('#detail-assignee').val()
            });
            $('#modal-details').addClass('hidden');
        });

        window.addSubtask = () => {
            const text = $('#new-subtask').val();
            if(text) {
                db.collection('items').doc(currentDetailId).update({
                    subtasks: firebase.firestore.FieldValue.arrayUnion({text, done: false})
                });
                $('#new-subtask').val('');
            }
        }

        window.toggleSubtask = async (idx, oldVal) => {
            // Need to read-modify-write for array updates at specific index
            const doc = await db.collection('items').doc(currentDetailId).get();
            const subs = doc.data().subtasks;
            subs[idx].done = !oldVal;
            db.collection('items').doc(currentDetailId).update({ subtasks: subs });
        }
        
        window.deleteSubtask = async (idx) => {
            const doc = await db.collection('items').doc(currentDetailId).get();
            const subs = doc.data().subtasks;
            subs.splice(idx, 1);
            db.collection('items').doc(currentDetailId).update({ subtasks: subs });
        }

        $('#btn-post-comment').click(() => {
            const text = $('#inp-comment').val();
            if(text) {
                db.collection('items').doc(currentDetailId).update({
                    comments: firebase.firestore.FieldValue.arrayUnion({ user: currentUser.displayName, text })
                });
                $('#inp-comment').val('');
            }
        });

        // DoD & Confetti
        $('.dod-check').change(() => {
            const all = $('.dod-check:checked').length === $('.dod-check').length;
            $('#btn-confirm-dod').prop('disabled', !all).toggleClass('opacity-50 cursor-not-allowed', !all);
        });

        $('#btn-confirm-dod').click(() => {
            updateItem(pendingMoveId, { status: 'done' });
            $('#modal-dod').addClass('hidden');
            triggerConfetti();
        });

        function triggerConfetti() {
            var count = 200;
            var defaults = { origin: { y: 0.7 } };
            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, { particleCount: Math.floor(count * particleRatio) }));
            }
            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        // --- 7. RETRO & POKER & EXCEL ---
        function setupRetro() {
            db.collection('retro').onSnapshot(snap => {
                $('#retro-start, #retro-stop, #retro-continue').empty();
                snap.docs.forEach(doc => {
                    const d = doc.data();
                    $(`#retro-${d.type}`).append(`
                        <div class="bg-white dark:bg-darkcard p-3 rounded shadow text-sm relative group border-l-4 ${d.type==='start'?'border-green-400':d.type==='stop'?'border-red-400':'border-blue-400'}">
                            ${d.text}
                            ${(currentRole==='master' || d.uid === currentUser.uid) ? 
                              `<button onclick="db.collection('retro').doc('${doc.id}').delete()" class="absolute top-1 right-1 text-red-400 hidden group-hover:block">&times;</button>` : ''}
                        </div>
                    `);
                });
            });
        }
        window.addRetroItem = (type) => {
            const t = prompt("Add Item:");
            if(t) db.collection('retro').add({ type, text: t, uid: currentUser.uid, createdAt: Date.now() });
        }
        window.clearRetro = () => { if(confirm("Clear All?")) db.collection('retro').get().then(s => s.forEach(d => d.ref.delete())); }

        // Poker
        function setupPoker() {
            db.collection('poker').doc('session').onSnapshot(doc => {
                if(!doc.exists) return;
                const d = doc.data();
                $('#poker-players').empty();
                Object.keys(d.votes || {}).forEach(uid => {
                    const val = d.votes[uid];
                    const show = d.revealed;
                    // Find user name from local cache
                    const uName = allUsers.find(u => u.uid === uid)?.displayName || "Player"; // Simplified matching
                    
                    $('#poker-players').append(`
                        <div class="flex flex-col items-center mx-4 mb-4">
                            <div class="w-12 h-16 rounded border-2 ${show ? 'bg-white border-blue-600 text-blue-600 text-xl font-bold flex items-center justify-center' : 'bg-blue-600 border-white bg-[url(https://www.transparenttextures.com/patterns/diagmonds-light.png)]'} shadow transition-all">
                                ${show ? val : ''}
                            </div>
                            <span class="text-white text-xs mt-1 font-bold">${uid === currentUser.uid ? 'Me' : 'Player'}</span>
                        </div>
                    `);
                });
            });
        }
        window.castVote = (v) => {
            const upd = {}; upd[`votes.${currentUser.uid}`] = v;
            db.collection('poker').doc('session').set(upd, {merge:true});
        }
        window.togglePokerReveal = (r) => db.collection('poker').doc('session').update({revealed:r});
        window.resetPoker = () => db.collection('poker').doc('session').set({revealed:false, votes:{}});

        // Excel Export
        $('#btn-export-excel').click(async () => {
             const items = await db.collection('items').where('sprintId', '==', currentSprintId).get();
             const data = items.docs.map(d => {
                 const i = d.data();
                 return { Title: i.title, Points: i.points, Assignee: i.assignee, Status: i.status };
             });
             const ws = XLSX.utils.json_to_sheet(data);
             const wb = XLSX.utils.book_new();
             XLSX.utils.book_append_sheet(wb, ws, "Sprint Data");
             XLSX.writeFile(wb, "Sprint_Export.xlsx");
        });

        // --- 8. UTILS ---
        window.updateItem = (id, d) => db.collection('items').doc(id).update(d);
        
        window.openItemModal = (type) => {
            if(!currentSprintId) return alert("Select a Sprint first.");
            const t = prompt("Task Title:");
            if(t) db.collection('items').add({ title: t, type, status: 'todo', sprintId: currentSprintId, points: 0, createdAt: Date.now() });
        };
        
        $('#btn-new-sprint-modal').click(() => $('#modal-sprint').removeClass('hidden'));
        $('#btn-create-sprint').click(() => {
            const n = $('#new-sprint-name').val();
            if(n) db.collection('sprints').add({ name: n, status: 'active', createdAt: Date.now() });
            $('#modal-sprint').addClass('hidden');
        });

        // Initialize Poker Doc if missing
        db.collection('poker').doc('session').get().then(d=>{if(!d.exists) db.collection('poker').doc('session').set({})});

        // Analytics
        function loadVelocityChart() {
            db.collection('sprint_stats').orderBy('date').get().then(snap => {
                const labels = [], data = [];
                snap.forEach(d => { labels.push(d.data().name); data.push(d.data().points); });
                new Chart(document.getElementById('velocityChart'), {
                    type: 'bar',
                    data: { labels, datasets: [{ label: 'Points Completed', data, backgroundColor: '#3b82f6' }] },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            });
        }
        
        $('#btn-complete-sprint').click(async () => {
            if(!confirm("Complete Sprint?")) return;
            const snap = await db.collection('items').where('sprintId','==',currentSprintId).where('status','==','done').get();
            let pts = 0; snap.forEach(d => pts += (parseInt(d.data().points)||0));
            await db.collection('sprint_stats').add({ name: $('#sprint-select option:selected').text(), points: pts, date: Date.now() });
            await db.collection('sprints').doc(currentSprintId).update({ status: 'completed' });
            triggerConfetti();
        });

    </script>
</body>
</html>
