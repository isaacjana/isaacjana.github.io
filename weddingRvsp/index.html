<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation & RSVP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Lato:wght@300;400;700&family=Montserrat:wght@200;900&display=swap" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { gold: { 300: '#F5D061', 400: '#D4AF37', 500: '#C5A028' }, rose: { 50: '#fff0f3', 100: '#ffe4e6', 900: '#881337' } },
                fontFamily: { classic: ['Cinzel', 'serif'], modern: ['Montserrat', 'sans-serif'], floral: ['Great Vibes', 'cursive'], body: ['Lato', 'sans-serif'] }
            }}
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; background: #000; }
        .page-section { display: none; opacity: 0; transition: opacity 0.6s ease-in-out; }
        .page-section.active { display: block; opacity: 1; }
        
        #loading-screen { position: fixed; inset: 0; background: #fff; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        #bg-slideshow { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .bg-slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2s ease-in-out; }
        .bg-slide.active { opacity: 0.5; }

        .card-gallery-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .card-gallery-img.active { opacity: 1; }

        #entrance-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 1.2s ease-in-out; }
        .curtain-panel { position: absolute; top: 0; bottom: 0; width: 50%; background: #111; transition: transform 1.2s cubic-bezier(0.7, 0, 0.3, 1); z-index: 51; }
        .curtain-left { left: 0; border-right: 1px solid #D4AF37; } .curtain-right { right: 0; border-left: 1px solid #D4AF37; }
        .open .curtain-left { transform: translateX(-100%); } .open .curtain-right { transform: translateX(100%); }
        .theme-modern #entrance-overlay { background: #000; } .theme-modern.open #entrance-overlay { transform: translateY(-100%); }
        .theme-floral #entrance-overlay { background: #fff; } .theme-floral.open #entrance-overlay { opacity: 0; visibility: hidden; }

        .wish-scroll { animation: scrollWishes 25s linear infinite; }
        @keyframes scrollWishes { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
        
        .glass-light { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen text-gray-800">

    <div id="loading-screen"><div class="w-10 h-10 border-4 border-gold-400 border-t-transparent rounded-full animate-spin"></div></div>

    <audio id="bg-music" loop></audio>
    <div id="bg-slideshow"></div>
    <div id="entrance-curtains-container"></div>
    
    <div id="entrance-content" class="fixed inset-0 z-[55] flex flex-col items-center justify-center pointer-events-none transition-opacity duration-1000">
        <div class="pointer-events-auto cursor-pointer flex flex-col items-center" onclick="enterSite()">
            <div class="w-16 h-16 rounded-full border border-white/20 flex items-center justify-center bg-white/5 backdrop-blur-sm animate-pulse mb-4">
                <i class="fas fa-heart text-white/80 text-2xl"></i>
            </div>
            <p class="text-white font-classic tracking-[0.4em] text-sm">TAP TO OPEN</p>
        </div>
    </div>

    <div id="view-landing" class="page-section min-h-screen w-full flex flex-col items-center justify-center p-4 relative z-10">
        <div id="invite-card" class="w-full max-w-md transition-all duration-1000 transform translate-y-8 opacity-0"></div>
        
        <div class="mt-8 w-full max-w-md text-center">
            <div id="live-attendance" class="inline-block bg-black/40 backdrop-blur px-6 py-2 rounded-full border border-white/10 text-white text-[10px] font-bold tracking-widest mb-6 opacity-0 transition-opacity duration-1000">
                <span id="pax-count">0</span> GUESTS ATTENDING
            </div>
            
            <div class="h-24 overflow-hidden relative">
                <div id="wishes-scroller" class="space-y-6 py-4">
                    </div>
                <div class="absolute inset-x-0 top-0 h-4 bg-gradient-to-b from-black/20 to-transparent"></div>
                <div class="absolute inset-x-0 bottom-0 h-4 bg-gradient-to-t from-black/20 to-transparent"></div>
            </div>
        </div>

        <button onclick="$('#view-login').fadeIn()" class="fixed bottom-6 right-6 text-[9px] text-white/50 hover:text-white uppercase tracking-widest bg-black/20 px-4 py-2 rounded-full border border-white/5 backdrop-blur">
            RSVP LOGIN
        </button>
    </div>

    <div id="view-login" class="hidden fixed inset-0 z-[80] bg-black/95 backdrop-blur-xl flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-2xl relative text-center">
            <button onclick="$('#view-login').fadeOut()" class="absolute top-4 right-4 text-gray-300 p-2"><i class="fas fa-times"></i></button>
            <h2 class="text-xl font-bold font-classic mb-6">Invitation Code</h2>
            <input type="text" id="input-invite-code" placeholder="ENTER CODE" class="w-full p-4 bg-gray-50 border rounded-2xl text-center font-bold text-lg uppercase mb-4 outline-none focus:border-gold-400">
            <button id="btn-enter-code" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-bold uppercase text-xs tracking-widest">Unlock</button>
            <div id="login-error" class="hidden text-red-500 text-xs font-bold mt-4"></div>
        </div>
    </div>

    <main id="view-rsvp" class="page-section max-w-2xl mx-auto w-full p-4 pt-10 pb-24 relative z-10">
        <div class="glass-light rounded-[2.5rem] shadow-2xl overflow-hidden mb-6">
            <div class="bg-gray-900 text-white p-8 text-center">
                <h2 class="text-2xl font-classic">Confirm Attendance</h2>
                <p class="text-xs text-gold-400 mt-2 font-bold tracking-widest uppercase" id="guest-group-name"></p>
            </div>
            <div class="p-6 md:p-8">
                <form id="rsvp-form" class="space-y-6">
                    <div id="guest-list-container" class="space-y-4"></div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Wedding Wishes</label>
                        <textarea id="rsvp-note" rows="4" class="w-full p-4 border border-gray-200 rounded-2xl bg-gray-50 text-sm focus:bg-white transition" placeholder="Write your heart out..."></textarea>
                    </div>
                    <button type="submit" id="btn-submit-rsvp" class="w-full bg-gold-500 text-white font-bold py-5 rounded-2xl shadow-lg uppercase tracking-widest text-sm">Submit RSVP</button>
                </form>
            </div>
        </div>
    </main>

    <main id="view-admin" class="page-section max-w-5xl mx-auto w-full p-4 bg-white min-h-screen text-gray-800">
        <div class="flex justify-between items-center p-6 border-b">
            <div>
                <h2 class="font-classic font-bold">Admin Panel</h2>
                <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Total Visits: <span id="visit-count" class="text-black">0</span></p>
            </div>
            <button onclick="logout()" class="text-red-500 font-bold text-xs uppercase">Logout</button>
        </div>
        <div class="p-6">
            <div class="flex gap-4 mb-8">
                <button onclick="switchAdminTab('guests')" class="px-4 py-2 bg-gray-100 rounded-lg text-xs font-bold">GUESTS</button>
                <button onclick="switchAdminTab('wishes')" class="px-4 py-2 bg-gray-100 rounded-lg text-xs font-bold">MANAGE WISHES</button>
                <button onclick="switchAdminTab('settings')" class="px-4 py-2 bg-gray-100 rounded-lg text-xs font-bold">SITE CONFIG</button>
            </div>
            
            <div id="admin-tab-guests">
                <div class="mb-4"><button onclick="$('#modal-add-guest').fadeIn()" class="bg-black text-white px-4 py-2 rounded-lg text-xs">+ ADD INVITE</button></div>
                <table class="w-full text-left text-sm border-collapse"><tbody id="admin-table-body"></tbody></table>
            </div>

            <div id="admin-tab-wishes" class="hidden">
                <div class="bg-gray-50 p-4 rounded-xl mb-4 text-xs font-bold uppercase text-gray-500">Live Guest Wishes</div>
                <table class="w-full text-left text-sm border-collapse"><tbody id="admin-wishes-body"></tbody></table>
            </div>

            <div id="admin-tab-settings" class="hidden">
                <form id="settings-form" class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <select id="set-theme" class="p-2 border rounded"><option value="classic">Classic</option><option value="modern">Modern</option><option value="floral">Floral</option></select>
                        <select id="set-music" class="p-2 border rounded"><option value="">No Music</option><option value="music1.mp3">Track 1</option><option value="music2.mp3">Track 2</option><option value="music3.mp3">Track 3</option></select>
                    </div>
                    <input id="set-names" placeholder="Names" class="w-full p-2 border rounded">
                    <input id="set-deadline" type="date" class="w-full p-2 border rounded">
                    <div><label class="block font-bold text-xs mb-2 uppercase text-gray-400">BG Slideshow (URLs)</label><div id="bg-photo-list" class="space-y-2"></div><button type="button" onclick="addPhotoInput('bg-photo-list')" class="text-blue-500 text-xs mt-2">+ Add BG</button></div>
                    <div><label class="block font-bold text-xs mb-2 uppercase text-gray-400">Card Gallery (URLs)</label><div id="card-photo-list" class="space-y-2"></div><button type="button" onclick="addPhotoInput('card-photo-list')" class="text-blue-500 text-xs mt-2">+ Add Card Photo</button></div>
                    <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">SAVE ALL SETTINGS</button>
                </form>
            </div>
        </div>
    </main>

    <div id="modal-add-guest" class="fixed inset-0 bg-black/80 hidden z-[90] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm shadow-2xl">
            <h3 class="font-bold mb-4 font-classic">New Invitation</h3>
            <input id="new-code" placeholder="CODE" class="w-full p-3 border rounded-xl mb-2 uppercase font-bold">
            <input id="new-names" placeholder="GUEST NAMES" class="w-full p-3 border rounded-xl mb-4">
            <div class="flex gap-4 mb-4"><label><input type="radio" name="new-side" value="groom" checked> Groom</label><label><input type="radio" name="new-side" value="bride"> Bride</label></div>
            <button onclick="createInvite()" class="w-full bg-black text-white py-3 rounded-xl font-bold">CREATE</button>
            <button onclick="$('#modal-add-guest').fadeOut()" class="w-full mt-2 text-gray-400 text-sm">Cancel</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAOEMrxylKIxZQgsY-aHMI87KmVIqMh9AQ", authDomain: "wedding-rvsp-e446c.firebaseapp.com", projectId: "wedding-rvsp-e446c", storageBucket: "wedding-rvsp-e446c.firebasestorage.app", messagingSenderId: "836260285764", appId: "1:836260285764:web:b1e8ca3ea64f7616e7db11" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let siteConfig = { theme: 'classic', names: '', deadline: '', musicTrack: '', bgPhotos: [], cardPhotos: [] };
        let currentInviteId = localStorage.getItem('rsvp_id');
        let isAdmin = localStorage.getItem('rsvp_admin') === 'true';
        let bgInterval, cardInterval, audio = document.getElementById('bg-music');

        $(document).ready(async () => {
            await loadConfig();
            loadStatsAndWishes();
            if(!isAdmin) trackVisit();
            $('#loading-screen').fadeOut();
            if(isAdmin) { $('#entrance-overlay').hide(); $('#view-admin').addClass('active'); loadAdmin(); }
            else { renderLanding(); }
        });

        async function loadConfig() {
            try {
                const doc = await db.collection('site_config').doc('main').get();
                if(doc.exists) siteConfig = { ...siteConfig, ...doc.data() };
                if(siteConfig.musicTrack) audio.src = siteConfig.musicTrack;
            } catch(e) {}
        }

        async function trackVisit() {
            const ref = db.collection('site_config').doc('stats');
            await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(ref);
                const newCount = (doc.exists ? doc.data().visits : 0) + 1;
                transaction.set(ref, { visits: newCount }, { merge: true });
            });
        }

        async function loadStatsAndWishes() {
            const statsDoc = await db.collection('site_config').doc('stats').get();
            if(statsDoc.exists) $('#visit-count').text(statsDoc.data().visits);

            const snap = await db.collection('invitations').get();
            let totalYes = 0;
            let wishes = [];
            snap.forEach(doc => {
                const d = doc.data();
                if(!d.isAdmin && d.guests) {
                    d.guests.forEach(g => { if(g.isAttending) totalYes++; });
                    if(d.note) wishes.push({ name: d.guestNames, note: d.note, id: doc.id });
                }
            });
            $('#pax-count').text(totalYes);
            $('#live-attendance').css('opacity', 1);
            
            const scroller = $('#wishes-scroller');
            scroller.empty();
            if(wishes.length > 0) {
                if(wishes.length > 2) scroller.addClass('wish-scroll');
                const combined = [...wishes, ...wishes]; // Loop for infinite scroll
                combined.forEach(w => {
                    scroller.append(`<div class="text-white/80 text-center"><p class="italic text-xs font-serif leading-relaxed">"${w.note}"</p><p class="text-[9px] uppercase tracking-widest text-gold-400 mt-2">— ${w.name}</p></div>`);
                });
            } else {
                scroller.append(`<div class="text-white/20 text-xs italic uppercase tracking-widest">Wishes will appear here...</div>`);
            }
        }

        function renderLanding() {
            const c = siteConfig;
            const curtains = $('#entrance-curtains-container');
            if(c.theme === 'classic') curtains.html('<div id="entrance-overlay" class="theme-classic"><div class="curtain-panel curtain-left"></div><div class="curtain-panel curtain-right"></div></div>');
            else curtains.html(`<div id="entrance-overlay" class="theme-${c.theme}"></div>`);

            const bgCont = $('#bg-slideshow'); bgCont.empty();
            const bgs = c.bgPhotos.length ? c.bgPhotos : ["https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=2000"];
            bgs.forEach((url, i) => bgCont.append(`<div class="bg-slide ${i===0?'active':''}" style="background-image: url('${url}')"></div>`));
            if(bgs.length > 1) {
                let cur = 0;
                bgInterval = setInterval(() => { $('.bg-slide').removeClass('active'); cur = (cur + 1) % bgs.length; $('.bg-slide').eq(cur).addClass('active'); }, 5000);
            }

            const card = $('#invite-card');
            let galleryHtml = '';
            if(c.cardPhotos.length > 0) {
                let imgs = '';
                c.cardPhotos.forEach((url, i) => imgs += `<img src="${url}" class="card-gallery-img ${i===0?'active':''}">`);
                galleryHtml = `<div class="relative w-full h-full overflow-hidden">${imgs}</div>`;
                let cCur = 0;
                cardInterval = setInterval(() => { $('.card-gallery-img').removeClass('active'); cCur = (cCur + 1) % c.cardPhotos.length; $('.card-gallery-img').eq(cCur).addClass('active'); }, 4000);
            }

            let layout = '';
            if(c.theme === 'classic') {
                layout = `<div class="bg-[#fdfbf7] p-8 text-center border-[10px] border-double border-gold-400 shadow-2xl">
                    <div class="w-full h-64 border-2 border-gold-300 mb-6 shadow-inner">${galleryHtml}</div>
                    <p class="uppercase tracking-[0.3em] text-[10px] mb-4 text-gray-400 font-bold">The Wedding of</p>
                    <h1 class="font-classic text-4xl mb-6 text-gray-800">${c.names || 'J & J'}</h1>
                    <div class="h-px w-20 bg-gold-400 mx-auto"></div>
                </div>`;
            } else if (c.theme === 'modern') {
                layout = `<div class="bg-white shadow-2xl overflow-hidden text-center">
                    <div class="w-full h-80 grayscale contrast-125 bg-gray-100">${galleryHtml}</div>
                    <div class="p-8"><h1 class="font-modern font-black text-5xl uppercase tracking-tighter">${c.names}</h1></div>
                </div>`;
            } else {
                layout = `<div class="glass-light p-10 rounded-[4rem] text-center shadow-2xl relative border-4 border-white overflow-hidden flex flex-col items-center justify-center">
                    <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/floral-paper.png')]"></div>
                    <div class="w-48 h-48 rounded-full border-4 border-white shadow-xl overflow-hidden mb-8 relative z-10 bg-rose-50">${galleryHtml}</div>
                    <h1 class="font-floral text-7xl text-rose-900 mb-4 relative z-10 leading-none">${c.names || 'J & J'}</h1>
                    <p class="font-classic tracking-[0.2em] text-[10px] text-rose-800 relative z-10 font-bold">INVITE YOU TO CELEBRATE</p>
                </div>`;
            }
            card.html(layout);
            $('.page-section').removeClass('active'); $('#view-landing').addClass('active');
        }

        function enterSite() {
            $('body').addClass('open');
            $('#entrance-content').fadeOut();
            if(audio.src) audio.play().catch(()=>{});
            setTimeout(() => { $('#entrance-overlay').hide(); $('#invite-card').removeClass('translate-y-8 opacity-0'); }, 1000);
        }

        $('#btn-enter-code').click(async () => {
            const code = $('#input-invite-code').val().trim().toUpperCase();
            if(code === 'ADMIN') { localStorage.setItem('rsvp_admin', 'true'); location.reload(); return; }
            const snap = await db.collection('invitations').where('inviteCode', '==', code).limit(1).get();
            if(snap.empty) { $('#login-error').text('INVALID CODE').removeClass('hidden'); return; }
            const doc = snap.docs[0];
            localStorage.setItem('rsvp_id', doc.id);
            currentInviteId = doc.id;
            loadRSVP(doc.data());
        });

        function loadRSVP(data) {
            $('#view-login').fadeOut(); $('#view-landing').hide(); $('#view-rsvp').addClass('active');
            $('#guest-group-name').text(data.guestNames);
            const cont = $('#guest-list-container'); cont.empty();
            data.guests.forEach((g, i) => {
                cont.append(`<div class="bg-white p-5 rounded-3xl border flex justify-between items-center" data-idx="${i}">
                    <span class="font-bold text-sm">${g.name}</span>
                    <div class="flex gap-2">
                        <label class="px-4 py-2 border rounded-2xl text-[10px] font-bold cursor-pointer transition ${g.isAttending===true?'bg-green-100 border-green-500':''}"><input type="radio" name="g${i}" value="y" class="hidden" ${g.isAttending===true?'checked':''}>ACCEPT</label>
                        <label class="px-4 py-2 border rounded-2xl text-[10px] font-bold cursor-pointer transition ${g.isAttending===false?'bg-red-100 border-red-500':''}"><input type="radio" name="g${i}" value="n" class="hidden" ${g.isAttending===false?'checked':''}>DECLINE</label>
                    </div>
                </div>`);
            });
            $('#rsvp-note').val(data.note || '');
        }

        $('#rsvp-form').submit(async (e) => {
            e.preventDefault();
            const guests = [];
            $('#guest-list-container > div').each(function() {
                const i = $(this).data('idx');
                const val = $(this).find(`input[name="g${i}"]:checked`).val();
                guests.push({ name: $(this).find('span').text(), isAttending: val==='y' });
            });
            await db.collection('invitations').doc(currentInviteId).update({ guests, note: $('#rsvp-note').val(), status: 'responded' });
            alert('THANK YOU FOR YOUR RSVP!'); location.reload();
        });

        async function deleteWish(id) {
            if(confirm('Delete this wish?')) {
                await db.collection('invitations').doc(id).update({ note: "" });
                alert('Wish Deleted');
                loadAdmin();
            }
        }

        function loadAdmin() {
            const c = siteConfig;
            $('#set-theme').val(c.theme); $('#set-music').val(c.musicTrack); $('#set-names').val(c.names); $('#set-deadline').val(c.deadline);
            $('#bg-photo-list, #card-photo-list').empty();
            c.bgPhotos.forEach(u => addPhotoInput('bg-photo-list', u));
            c.cardPhotos.forEach(u => addPhotoInput('card-photo-list', u));
            
            db.collection('invitations').orderBy('status').onSnapshot(snap => {
                const tb = $('#admin-table-body'); tb.empty();
                const wb = $('#admin-wishes-body'); wb.empty();
                snap.forEach(doc => {
                    const d = doc.data(); if(d.isAdmin) return;
                    tb.append(`<tr class="border-b"><td class="p-3 font-bold">${d.inviteCode}</td><td class="p-3">${d.guestNames}</td><td class="p-3 text-right"><button onclick="delInv('${doc.id}')" class="text-red-500 font-bold">X</button></td></tr>`);
                    if(d.note) {
                        wb.append(`<tr class="border-b"><td class="p-3 text-xs italic">"${d.note}"</td><td class="p-3 text-[10px] uppercase font-bold text-gray-400">${d.guestNames}</td><td class="p-3 text-right"><button onclick="deleteWish('${doc.id}')" class="text-gray-400 hover:text-red-500">DELETE</button></td></tr>`);
                    }
                });
            });
        }

        window.addPhotoInput = (id, v='') => { $(`#${id}`).append(`<div class="flex gap-2"><input value="${v}" class="w-full p-2 border rounded text-xs photo-input"><button type="button" onclick="$(this).parent().remove()" class="text-red-500">X</button></div>`); };

        $('#settings-form').submit(async (e) => {
            e.preventDefault();
            const bgPhotos = []; $('#bg-photo-list .photo-input').each(function(){ if($(this).val()) bgPhotos.push($(this).val()); });
            const cardPhotos = []; $('#card-photo-list .photo-input').each(function(){ if($(this).val()) cardPhotos.push($(this).val()); });
            await db.collection('site_config').doc('main').set({
                theme: $('#set-theme').val(), musicTrack: $('#set-music').val(), names: $('#set-names').val(), deadline: $('#set-deadline').val(),
                bgPhotos, cardPhotos, contacts: []
            });
            alert('SETTINGS SAVED!'); location.reload();
        });

        async function createInvite() {
            const code = $('#new-code').val().toUpperCase();
            const names = $('#new-names').val();
            const guests = names.split(',').map(n => ({ name: n.trim(), isAttending: null }));
            await db.collection('invitations').add({ inviteCode: code, guestNames: names, side: $('input[name="new-side"]:checked').val(), guests, status: 'pending' });
            $('#modal-add-guest').fadeOut();
        }
        async function delInv(id) { if(confirm('Permanently delete invitation?')) await db.collection('invitations').doc(id).delete(); }
        function logout() { localStorage.clear(); location.reload(); }
        function switchAdminTab(t) { $('#admin-tab-guests, #admin-tab-settings, #admin-tab-wishes').hide(); $(`#admin-tab-${t}`).show(); }
    </script>
</body>
</html>
