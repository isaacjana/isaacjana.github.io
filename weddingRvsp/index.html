<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Lato:wght@300;400;700&family=Montserrat:wght@200;400;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { gold: { 300: '#F5D061', 400: '#D4AF37', 500: '#C5A028' }, rose: { 50: '#fff0f3', 100: '#ffe4e6', 900: '#881337' }, navy: { 800: '#1e293b', 900: '#0f172a' } },
                fontFamily: { classic: ['Cinzel', 'serif'], modern: ['Montserrat', 'sans-serif'], floral: ['Great Vibes', 'cursive'], serif: ['Playfair Display', 'serif'], body: ['Lato', 'sans-serif'] }
            }}

    <style>
        :root { --curtain-color: #111; --curtain-border: #D4AF37; }
        body { background: #000; overflow-x: hidden; -webkit-tap-highlight-color: transparent; font-family: 'Lato', sans-serif; }
        
        /* Views */
        .page-section { display: none; opacity: 0; transform: translateY(20px); transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .page-section.active { display: block; opacity: 1; transform: translateY(0); }
        
        #loading-screen { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        /* Backgrounds */
        #bg-slideshow { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .bg-slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.5s ease-in-out; transform: scale(1.05); }
        .bg-slide.active { opacity: 0.5; transform: scale(1); }
        .card-gallery-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease; }
        .card-gallery-img.active { opacity: 1; }

        /* Curtain Animation */
        #entrance-overlay { position: fixed; inset: 0; z-index: 2000; display: flex; cursor: pointer; }
        .curtain-panel { width: 50.5%; background: var(--curtain-color); transition: transform 1.8s cubic-bezier(0.77, 0, 0.175, 1); z-index: 2001; }
        .curtain-left { border-right: 1px solid var(--curtain-border); } 
        .curtain-right { border-left: 1px solid var(--curtain-border); }
        .open .curtain-left { transform: translateX(-100%); } 
        .open .curtain-right { transform: translateX(100%); }

        /* UI Elements */
        .glass-light { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(20px); }
        .wish-scroll { animation: scrollWishes 45s linear infinite; }
        @keyframes scrollWishes { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
        .map-frame { width: 100%; height: 220px; border-radius: 1.5rem; overflow: hidden; border: 1px solid #e5e7eb; margin-bottom: 1rem; position: relative; background: #f9fafb; }
        .map-frame iframe { width: 100%; height: 100%; border: 0; filter: grayscale(0.1); }
        .photo-input:focus { border-color: #D4AF37; background: #fff; }
    </style>
</head>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAOEMrxylKIxZQgsY-aHMI87KmVIqMh9AQ", authDomain: "wedding-rvsp-e446c.firebaseapp.com", projectId: "wedding-rvsp-e446c", storageBucket: "wedding-rvsp-e446c.firebasestorage.app", messagingSenderId: "836260285764", appId: "1:836260285764:web:b1e8ca3ea64f7616e7db11" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let siteConfig = { theme: 'classic', names: '', deadline: '', musicTrack: '', bgPhotos: [], cardPhotos: [], reception: {}, matrimony: {} };
        let currentInviteId = localStorage.getItem('rsvp_id');
        let isAdmin = localStorage.getItem('rsvp_admin') === 'true';
        let bgInterval, cardInterval, countdownInterval, audio = document.getElementById('bg-music');
        let currentQRLink = "";

        // --- CORE FUNCTIONS (DEFINED BEFORE EXECUTION) ---

        async function loadConfig() {
            try {
                const doc = await db.collection('site_config').doc('main').get();
                if(doc.exists) siteConfig = { ...siteConfig, ...doc.data() };
                if(siteConfig.musicTrack) audio.src = siteConfig.musicTrack;
                
                const root = document.documentElement;
                if(siteConfig.theme === 'midnight') { root.style.setProperty('--curtain-color', '#0f172a'); }
                if(siteConfig.theme === 'floral') { root.style.setProperty('--curtain-color', '#fff'); root.style.setProperty('--curtain-border', '#ffe4e6'); }
            } catch(e) {}
        }

        async function loadStatsAndWishes() {
            const stats = await db.collection('site_config').doc('stats').get();
            if(stats.exists) $('#visit-count').text(stats.data().visits);
            const snap = await db.collection('invitations').get();
            let total = 0, wishes = [];
            snap.forEach(doc => {
                const d = doc.data();
                if(!d.isAdmin && d.guests) {
                    d.guests.forEach(g => { if(g.isAttending) total++; });
                    if(d.note) wishes.push({ name: d.guestNames, note: d.note });
                }
            });
            $('#pax-count').text(total); $('#live-attendance').css('opacity', 1);
            const scroller = $('#wishes-scroller'); scroller.empty();
            if(wishes.length > 0) {
                if(wishes.length > 2) scroller.addClass('wish-scroll');
                [...wishes, ...wishes].forEach(w => scroller.append(`<div class="text-white/80 text-center px-6"><p class="italic text-[12px] font-serif">"${w.note}"</p><p class="text-[8px] uppercase tracking-widest text-gold-400 mt-3 font-black">— ${w.name}</p></div>`));
            } else scroller.append(`<div class="text-white/20 text-[10px] italic">Wishes will appear here...</div>`);
        }

        function startCountdown() {
            if(!siteConfig.deadline) return;
            const targetDate = new Date(siteConfig.deadline).getTime();
            if(isNaN(targetDate)) return;

            if(countdownInterval) clearInterval(countdownInterval);
            const update = () => {
                const now = new Date().getTime(); const diff = targetDate - now;
                if(diff < 0) return;
                $('#days').text(String(Math.floor(diff / 86400000)).padStart(2, '0'));
                $('#hours').text(String(Math.floor((diff % 86400000) / 3600000)).padStart(2, '0'));
                $('#minutes').text(String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0'));
                $('#seconds').text(String(Math.floor((diff % 60000) / 1000)).padStart(2, '0'));
            };
            update(); countdownInterval = setInterval(update, 1000);
        }

        async function trackVisit() {
            const ref = db.collection('site_config').doc('stats');
            await db.runTransaction(async (t) => {
                const doc = await t.get(ref); const count = (doc.exists ? doc.data().visits : 0) + 1;
                t.set(ref, { visits: count }, { merge: true });
            });
        }

        function renderLanding() {
            const c = siteConfig;
            $('#entrance-curtains-container').html('<div id="entrance-overlay"><div class="curtain-panel curtain-left"></div><div class="curtain-panel curtain-right"></div></div>');
            
            const bgCont = $('#bg-slideshow'); bgCont.empty();
            const bgs = c.bgPhotos?.length ? c.bgPhotos : ["https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=2000"];
            bgs.forEach((url, i) => bgCont.append(`<div class="bg-slide ${i===0?'active':''}" style="background-image: url('${url}')"></div>`));
            if(bgs.length > 1) { 
                let cur = 0; if(bgInterval) clearInterval(bgInterval); 
                bgInterval = setInterval(() => { $('.bg-slide').removeClass('active'); cur = (cur + 1) % bgs.length; $('.bg-slide').eq(cur).addClass('active'); }, 6000); 
            }

            const card = $('#invite-card');
            let galleryHtml = '';
            if(c.cardPhotos?.length > 0) {
                let imgs = ''; c.cardPhotos.forEach((url, i) => imgs += `<img src="${url}" class="card-gallery-img ${i===0?'active':''}">`);
                galleryHtml = `<div class="relative w-full h-full overflow-hidden shadow-inner rounded-xl">${imgs}</div>`;
                let cCur = 0; if(cardInterval) clearInterval(cardInterval); cardInterval = setInterval(() => { $('.card-gallery-img').removeClass('active'); cCur = (cCur + 1) % c.cardPhotos.length; $('.card-gallery-img').eq(cCur).addClass('active'); }, 4500);
            }

            let layout = '';
            switch(c.theme) {
                case 'modern': layout = `<div class="bg-white shadow-2xl overflow-hidden"><div class="w-full h-84 grayscale contrast-125">${galleryHtml}</div><div class="p-12 text-center uppercase font-modern font-black text-5xl tracking-tighter text-black leading-none">${c.names}</div></div>`; break;
                case 'floral': layout = `<div class="glass-light p-12 rounded-[4.5rem] text-center shadow-2xl relative border-4 border-white flex flex-col items-center justify-center min-h-[550px]"><div class="w-52 h-52 rounded-full border-4 border-white shadow-2xl overflow-hidden mb-12 bg-rose-50">${galleryHtml}</div><h1 class="font-floral text-8xl text-rose-900 leading-none mb-4">${c.names}</h1><p class="font-classic text-[10px] text-rose-800 font-black tracking-widest">GETTING MARRIED</p></div>`; break;
                case 'midnight': layout = `<div class="bg-navy-900 border-2 border-gold-400 p-12 text-center shadow-2xl rounded-sm"><div class="w-full h-72 border border-gold-400/20 mb-12">${galleryHtml}</div><h1 class="font-classic text-gold-300 text-5xl mb-6 tracking-widest">${c.names}</h1><p class="text-gold-400/40 text-[9px] tracking-[0.6em] font-black uppercase">The Royal Wedding Ceremony</p></div>`; break;
                case 'zen': layout = `<div class="bg-white p-14 text-center shadow-sm border-l-[12px] border-gray-900"><div class="w-full h-64 mb-14 overflow-hidden grayscale">${galleryHtml}</div><h1 class="font-modern font-thin text-5xl text-gray-900 mb-6 uppercase tracking-tight">${c.names}</h1><p class="font-modern text-[8px] tracking-[0.8em] text-gray-300 uppercase">Simplicity in Love</p></div>`; break;
                case 'film': layout = `<div class="bg-[#e2e2e2] p-8 shadow-2xl"><div class="bg-black w-full h-80 mb-8 p-3 relative shadow-2xl overflow-hidden">${galleryHtml}</div><div class="text-center"><h1 class="font-serif italic text-5xl text-black">${c.names}</h1><p class="font-modern text-[9px] tracking-[0.4em] text-gray-400 mt-6 uppercase font-black">Our Love Story on Film</p></div></div>`; break;
                default: layout = `<div class="bg-[#fdfbf7] p-12 text-center border-[15px] border-double border-gold-400 shadow-2xl"><div class="w-full h-72 border-2 border-gold-300 mb-10 shadow-inner">${galleryHtml}</div><h1 class="font-classic text-6xl text-gray-800 leading-tight mb-8">${c.names || 'John & Sarah'}</h1><div class="h-1 w-24 bg-gold-400 mx-auto opacity-30 rounded-full"></div></div>`;
            }
            card.html(layout); $('.page-section').removeClass('active'); $('#view-landing').addClass('active');
        }

        // --- INIT ---
        $(document).ready(async () => {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('code')) { await handleAutoLogin(urlParams.get('code')); }

            await loadConfig();
            await loadStatsAndWishes();
            startCountdown();

            if(!isAdmin) trackVisit();
            $('#loading-screen').fadeOut(1000);
            
            if(isAdmin) { 
                $('#entrance-overlay, #entrance-content').hide(); 
                $('#view-admin').addClass('active'); 
                loadAdmin(); 
            } else { 
                renderLanding(); 
            }
        });

        // --- HELPERS ---
        function enterSite() {
            $('body').addClass('open'); $('#entrance-content').fadeOut();
            if(audio.src) { audio.volume = 0.5; audio.play().catch(()=>{}); }
            setTimeout(() => { $('#entrance-overlay').fadeOut(1200); $('#invite-card').removeClass('translate-y-12 opacity-0'); }, 1200);
        }

        async function handleAutoLogin(code) {
            const snap = await db.collection('invitations').where('inviteCode', '==', code.toUpperCase()).limit(1).get();
            if(!snap.empty) { const doc = snap.docs[0]; localStorage.setItem('rsvp_id', doc.id); currentInviteId = doc.id; loadRSVP(doc.data()); }
        }

        $('#btn-enter-code').click(async () => {
            const code = $('#input-invite-code').val().trim().toUpperCase(); if(!code) return;
            const btn = $('#btn-enter-code'); btn.text('Verifying...');
            if(code === 'ADMIN') { localStorage.setItem('rsvp_admin', 'true'); location.reload(); return; }
            try {
                const snap = await db.collection('invitations').where('inviteCode', '==', code).limit(1).get();
                if(snap.empty) { $('#login-error').text('Invalid Code').removeClass('hidden'); btn.text('Verify Code'); return; }
                const doc = snap.docs[0]; localStorage.setItem('rsvp_id', doc.id); currentInviteId = doc.id; loadRSVP(doc.data());
            } catch(e) { btn.text('Verify Code'); }
        });

        function loadRSVP(data) {
            $('#view-login').fadeOut(); $('#view-landing').hide(); $('#view-rsvp').addClass('active');
            $('#guest-group-name').text(data.guestNames);
            const cont = $('#guest-list-container'); cont.empty();
            data.guests.forEach((g, i) => {
                cont.append(`<div class="bg-white p-6 rounded-[2.5rem] border border-gray-50 flex justify-between items-center shadow-sm" data-idx="${i}">
                    <span class="font-bold text-gray-900 text-sm tracking-tight">${g.name}</span>
                    <div class="flex gap-2">
                        <label class="px-5 py-3 border-2 border-gray-100 rounded-2xl text-[10px] font-black cursor-pointer transition-all ${g.isAttending===true?'bg-emerald-50 border-emerald-500 text-emerald-700':''}"><input type="radio" name="g${i}" value="y" class="hidden" ${g.isAttending===true?'checked':''}>ACCEPT</label>
                        <label class="px-5 py-3 border-2 border-gray-100 rounded-2xl text-[10px] font-black cursor-pointer transition-all ${g.isAttending===false?'bg-rose-50 border-rose-500 text-rose-700':''}"><input type="radio" name="g${i}" value="n" class="hidden" ${g.isAttending===false?'checked':''}>DECLINE</label>
                    </div>
                </div>`);
            });
            $('#rsvp-note').val(data.note || '');
            
            const details = $('#event-details-display'); details.empty();
            const c = siteConfig;
            
            const renderLoc = (title, venue, time) => {
                if(!venue) return "";
                const mapEmbed = `https://maps.google.com/maps?q=${encodeURIComponent(venue)}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
                return `
                <div class="p-8 bg-gray-50/50 rounded-[3rem] border border-white hover:bg-white transition-all shadow-sm">
                    <h4 class="text-[11px] font-black text-gold-500 uppercase tracking-[0.3em] mb-4">${title}</h4>
                    <p class="font-bold text-lg text-gray-900 mb-2 leading-tight">${venue}</p>
                    <p class="text-[12px] text-gray-400 font-bold mb-6">${new Date(time).toLocaleString([], { dateStyle: 'full', timeStyle: 'short' })}</p>
                    <div class="map-frame mb-6">
                        <iframe src="${mapEmbed}"></iframe>
                    </div>
                    <div class="flex gap-3">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(venue)}" target="_blank" class="flex-1 text-[10px] bg-white border border-gray-200 px-6 py-4 rounded-2xl font-black text-center uppercase tracking-widest shadow-sm hover:shadow-md transition-all">Directions</a>
                        <button onclick="addToCalendar('${venue}', '${time}')" class="flex-1 text-[10px] bg-navy-900 text-white px-6 py-4 rounded-2xl font-black uppercase tracking-widest shadow-lg active:scale-95 transition-all">Add to Calendar</button>
                    </div>
                </div>`;
            };
            details.append(renderLoc("The Ceremony & Reception", c.reception.loc, c.reception.time));
            details.append(renderLoc("Religious Service", c.matrimony.loc, c.matrimony.time));
        }

        function addToCalendar(loc, time) {
            const date = new Date(time);
            const title = "Wedding of " + siteConfig.names;
            // Generate Google Calendar Link
            const googleUrl = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${date.toISOString().replace(/-|:|\.\d\d\d/g, "")}/${date.toISOString().replace(/-|:|\.\d\d\d/g, "")}&details=Wedding Invitation&location=${encodeURIComponent(loc)}&sf=true&output=xml`;
            
            // Generate ICS File
            const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${title}\nDTSTART:${date.toISOString().replace(/-|:|\.\d\d\d/g, "")}\nLOCATION:${loc}\nDESCRIPTION:Wedding Invitation\nEND:VEVENT\nEND:VCALENDAR`;
            const blob = new Blob([icsContent], { type: 'text/calendar' });
            
            if (confirm("Choose Calendar Type:\nOK for Google Calendar\nCancel for Apple/Outlook (.ics file)")) {
                window.open(googleUrl, '_blank');
            } else {
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'wedding.ics'; link.click();
            }
        }

        $('#rsvp-form').submit(async (e) => {
            e.preventDefault(); const guests = []; $('#guest-list-container > div').each(function() {
                const i = $(this).data('idx'); const val = $(this).find(`input[name="g${i}"]:checked`).val();
                guests.push({ name: $(this).find('span').text(), isAttending: val==='y' ? true : (val==='n' ? false : null) });
            });
            await db.collection('invitations').doc(currentInviteId).update({ guests, note: $('#rsvp-note').val(), status: 'responded' });
            alert('RSVP Saved!'); location.reload();
        });

        // --- ADMIN ---
        function loadAdmin() {
            const c = siteConfig;
            $('#set-theme').val(c.theme); $('#set-music').val(c.musicTrack); $('#set-names').val(c.names); $('#set-deadline').val(c.deadline);
            $('#set-rec-loc').val(c.reception?.loc); $('#set-rec-time').val(c.reception?.time);
            $('#set-mat-loc').val(c.matrimony?.loc); $('#set-mat-time').val(c.matrimony?.time);
            $('#bg-photo-list, #card-photo-list').empty();
            c.bgPhotos?.forEach(u => addPhotoInput('bg-photo-list', u));
            c.cardPhotos?.forEach(u => addPhotoInput('card-photo-list', u));
            db.collection('invitations').onSnapshot(snap => {
                const tb = $('#admin-table-body'); tb.empty(); const wb = $('#admin-wishes-body'); wb.empty();
                snap.forEach(doc => {
                    const d = doc.data(); if(d.isAdmin) return;
                    tb.append(`<tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors"><td class="p-5 font-black tracking-widest text-navy-900 text-[12px]">${d.inviteCode}</td><td class="p-5"><p class="font-bold text-sm">${d.guestNames}</p><p class="text-[9px] uppercase font-black text-gray-300 mt-1">${d.side}</p></td><td class="p-5 text-right"><button onclick="generateQR('${d.inviteCode}', '${d.guestNames}')" class="text-blue-500 font-black mr-6 text-[10px] uppercase">QR</button><button onclick="delInv('${doc.id}')" class="text-rose-400 font-black uppercase text-[10px]">Del</button></td></tr>`);
                    if(d.note) wb.append(`<tr class="border-b border-gray-50"><td class="p-6 italic text-navy-900 text-sm">"${d.note}"</td><td class="p-6 text-[10px] uppercase font-black text-gray-300">By: ${d.guestNames}</td><td class="p-6 text-right"><button onclick="deleteWish('${doc.id}')" class="text-rose-500 font-black"><i class="fas fa-trash-alt"></i></button></td></tr>`);
                });
            });
        }

        function generateQR(code, name) {
            $('#qr-container').empty(); $('#qr-title').text(name);
            currentQRLink = window.location.origin + window.location.pathname + '?code=' + code;
            new QRCode(document.getElementById("qr-container"), { text: currentQRLink, width: 256, height: 256, colorDark : "#0f172a", correctLevel : QRCode.CorrectLevel.H });
            $('#modal-qr').fadeIn();
        }

        function copyQRLink() {
            navigator.clipboard.writeText(currentQRLink).then(() => alert('Link copied to clipboard!'));
        }

        window.addPhotoInput = (id, v='') => { $(`#${id}`).append(`<div class="flex gap-4 items-center"><input value="${v}" class="flex-grow p-5 border-2 border-gray-50 rounded-2xl text-[12px] photo-input bg-gray-50/50" placeholder="Paste image URL here"><button type="button" onclick="$(this).parent().remove()" class="bg-rose-50 text-rose-500 w-12 h-12 rounded-2xl flex items-center justify-center font-black">X</button></div>`); };
        
        $('#settings-form').submit(async (e) => {
            e.preventDefault(); const bgPhotos = []; $('#bg-photo-list .photo-input').each(function(){ if($(this).val()) bgPhotos.push($(this).val()); });
            const cardPhotos = []; $('#card-photo-list .photo-input').each(function(){ if($(this).val()) cardPhotos.push($(this).val()); });
            await db.collection('site_config').doc('main').set({
                theme: $('#set-theme').val(), musicTrack: $('#set-music').val(), names: $('#set-names').val(), deadline: $('#set-deadline').val(),
                reception: { loc: $('#set-rec-loc').val(), time: $('#set-rec-time').val() }, matrimony: { loc: $('#set-mat-loc').val(), time: $('#set-mat-time').val() },
                bgPhotos, cardPhotos
            }); alert('Settings Updated.'); location.reload();
        });

        async function createInvite() {
            const code = $('#new-code').val().toUpperCase(); const names = $('#new-names').val(); if(!code || !names) return;
            const guests = names.split(',').map(n => ({ name: n.trim(), isAttending: null }));
            await db.collection('invitations').add({ inviteCode: code, guestNames: names, side: $('input[name="new-side"]:checked').val(), guests, status: 'pending' });
            $('#modal-add-guest').fadeOut();
        }
        
        async function downloadGuestList() {
            const snap = await db.collection('invitations').get();
            let csv = "Code,Side,Group,Name,Attending,Wish\n";
            snap.forEach(doc => { const d = doc.data(); if(d.isAdmin) return;
                d.guests.forEach(g => { csv += `${d.inviteCode},${d.side},"${d.guestNames}","${g.name}",${g.isAttending===true?'Yes':(g.isAttending===false?'No':'N/A')},"${(d.note || '').replace(/"/g, '""')}"\n`; });
            });
            const blob = new Blob([csv], { type: 'text/csv' }); const link = document.createElement('a');
            link.href = URL.createObjectURL(blob); link.download = 'WeddingGuestList.csv'; link.click();
        }

        async function deleteWish(id) { if(confirm('Delete wish?')) await db.collection('invitations').doc(id).update({ note: "" }); }
        async function delInv(id) { if(confirm('Delete invite?')) await db.collection('invitations').doc(id).delete(); }
        function logout() { localStorage.clear(); location.reload(); }
        function switchAdminTab(t) { $('.page-section main > div').hide(); $(`#admin-tab-${t}`).show(); }
    </script>
</body>
</html>
