<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <meta name="description" content="Official Wedding Invitation & RSVP">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        .admin-nav-item {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: 0.3s;
        }

        .admin-nav-item.active {
            background: var(--primary);
            color: #000;
        }

        .client-card {
            position: relative;
        }

        .client-actions {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid var(--primary);
            background: transparent;
            color: var(--primary);
        }

        .btn-small:hover {
            background: var(--primary);
            color: #000;
        }
    </style>
</head>

<body>

    <!-- Cinematic Loader -->
    <div id="loader">
        <div class="loader-logo serif" id="loader-initials">W I</div>
        <div class="loader-line"></div>
    </div>

    <div class="app-container" id="main-content" style="opacity: 0;">
        <!-- Hero Section -->
        <section class="hero" id="home">
            <div class="hero-content fade-up">
                <p class="serif italic" style="margin-bottom: 20px; font-size: 1.2rem;">Join us in celebrating</p>
                <h1 class="names" id="display-names">...</h1>
                <div class="date" id="display-date">...</div>
                <p style="letter-spacing: 0.2rem; margin-bottom: 40px;" id="display-venue">...</p>
                <button class="cta-button" onclick="scrollToRSVP()">RSVP Now</button>
            </div>
        </section>

        <!-- Message Section -->
        <section style="background: var(--secondary); min-height: 40vh;">
            <div style="text-align: center; max-width: 600px; padding: 2rem;">
                <h2 class="serif" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 30px;">Our Journey
                </h2>
                <p class="fade-up" id="display-quote">...</p>
            </div>
        </section>

        <!-- RSVP Section -->
        <section class="rsvp-section" id="rsvp">
            <div class="rsvp-card fade-up">
                <h2 class="serif" style="text-align: center; font-size: 2.5rem; margin-bottom: 1rem;">RSVP</h2>
                <p style="text-align: center; margin-bottom: 3rem; color: var(--accent);">Please respond to our
                    invitation</p>

                <form id="rsvp-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="guest-name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label>Attendance</label>
                        <select id="attendance" required>
                            <option value="attending">Accepts with Pleasure</option>
                            <option value="declined">Declines with Regret</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Number of Guests</label>
                        <input type="number" id="guest-count" value="1" min="1" max="10">
                    </div>
                    <div class="form-group">
                        <label>Dietary Restrictions</label>
                        <textarea id="dietary" rows="3" placeholder="Any allergies or requirements?"></textarea>
                    </div>
                    <button type="submit" class="cta-button" style="width: 100%;">Confirm Attendance</button>
                </form>
            </div>
        </section>

        <!-- Admin Dashboard -->
        <div id="admin-view" class="admin-view" style="display: none;">
            <div id="admin-login-section" style="text-align: center; padding: 4rem;">
                <h2 class="serif" style="font-size: 3rem; color: var(--primary); margin-bottom: 2rem;">Admin Access</h2>
                <button class="cta-button" id="login-btn">Sign in with Google</button>
            </div>

            <div id="admin-content" style="display: none;">
                <nav
                    style="display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid var(--primary); padding-bottom: 1rem; margin-bottom: 2rem;">
                    <h2 class="serif" style="color: var(--primary); margin: 0; margin-right: 2rem;">Wedding Manager</h2>
                    <a href="#" class="admin-nav-item active" id="nav-clients">Clients</a>
                    <a href="#" class="admin-nav-item" id="nav-rsvps" style="display: none;">RSVPs</a>
                    <button id="logout-btn"
                        style="margin-left: auto; background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer;">Logout</button>
                </nav>

                <!-- Client List View -->
                <div id="view-clients">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>Active Clients</h3>
                        <button class="cta-button" id="btn-add-client" style="padding: 0.5rem 1rem;">+ Add
                            Client</button>
                    </div>
                    <div class="rsvp-list" id="client-list" style="margin-top: 2rem;"></div>
                </div>

                <!-- Guest List View -->
                <div id="view-rsvps" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3 id="rsvp-view-title">RSVPs</h3>
                        <button class="btn-small" id="btn-back-to-clients">Back to Clients</button>
                    </div>
                    <div id="stats" style="margin: 2rem 0; display: flex; gap: 2rem;">
                        <div class="guest-card">Total Records: <span id="total-guests">0</span></div>
                        <div class="guest-card">Attending Guests: <span id="total-attending">0</span></div>
                    </div>
                    <div class="rsvp-list" id="rsvp-list"></div>
                </div>
            </div>
        </div>

        <footer style="text-align: center; padding: 4rem; background: #111; color: var(--primary);">
            <div class="serif" id="display-initials" style="font-size: 1.5rem; letter-spacing: 0.5rem;">W I</div>
        </footer>
    </div>

    <!-- Client Modal -->
    <div id="client-modal"
        style="display:none; position: fixed; top: 0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; overflow-y: auto; padding: 2rem;">
        <div
            style="max-width: 600px; margin: 0 auto; background: var(--secondary); padding: 3rem; border-radius: 30px; border: 1px solid var(--primary); box-shadow: var(--shadow);">
            <h2 class="serif" id="modal-title">New Event</h2>
            <form id="client-form" style="margin-top: 2rem;">
                <input type="hidden" id="client-id">
                <div class="form-group">
                    <label>Internal Name (Couple Names)</label>
                    <input type="text" id="client-names" placeholder="Julian & Elena" required>
                </div>
                <div class="form-group">
                    <label>URL Slug (unique)</label>
                    <input type="text" id="client-slug" placeholder="julian-elena" required>
                </div>
                <div class="form-group">
                    <label>Wedding Date</label>
                    <input type="text" id="client-date" placeholder="Saturday, June 20, 2026" required>
                </div>
                <div class="form-group">
                    <label>Venue</label>
                    <input type="text" id="client-venue" placeholder="The Raffles Hotel, Singapore" required>
                </div>
                <div class="form-group">
                    <label>Short Message / Quote</label>
                    <textarea id="client-quote" rows="3"
                        placeholder="Love is not finding someone to live with..."></textarea>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 3rem;">
                    <button type="submit" class="cta-button" style="flex: 2;">Save Invitation</button>
                    <button type="button" id="btn-close-modal"
                        style="flex: 1; background: #333; color: #fff; border: none; border-radius: 50px; cursor: pointer;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase App Logic -->
    <script type="module" src="js/app.js"></script>
    <script>
        function scrollToRSVP() {
            document.getElementById('rsvp').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>

</html>
