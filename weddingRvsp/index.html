<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation & RSVP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Lato:wght@300;400;700&family=Montserrat:wght@200;400;900&display=swap" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --curtain-color: #111; --curtain-border: #D4AF37; }
        body { background: #000; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .page-section { display: none; opacity: 0; transition: opacity 0.6s ease; }
        .page-section.active { display: block; opacity: 1; }
        #loading-screen { position: fixed; inset: 0; background: #fff; z-index: 2000; display: flex; justify-content: center; align-items: center; }
        #bg-slideshow { position: fixed; inset: 0; z-index: -1; }
        .bg-slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2s ease-in-out; }
        .bg-slide.active { opacity: 0.5; }
        .card-gallery-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease; }
        .card-gallery-img.active { opacity: 1; }
        #entrance-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; }
        .curtain-panel { width: 50.5%; background: var(--curtain-color); transition: transform 1.5s cubic-bezier(0.7, 0, 0.3, 1); border-color: var(--curtain-border); }
        .curtain-left { border-right-width: 1px; } .curtain-right { border-left-width: 1px; }
        .open .curtain-left { transform: translateX(-100%); } .open .curtain-right { transform: translateX(100%); }
        .wish-scroll { animation: scrollWishes 30s linear infinite; }
        @keyframes scrollWishes { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-gold-500"></div></div>

    <audio id="bg-music" loop></audio>
    <div id="bg-slideshow"></div>
    <div id="entrance-curtains-container"></div>
    
    <div id="entrance-content" class="fixed inset-0 z-[1100] flex flex-col items-center justify-center">
        <button onclick="enterSite()" class="bg-white/10 backdrop-blur-md p-8 rounded-full border border-white/20 animate-pulse">
            <i class="fas fa-heart text-white text-3xl"></i>
        </button>
        <p class="text-white mt-4 tracking-widest text-xs uppercase font-classic">Open Invitation</p>
    </div>

    <div id="view-landing" class="page-section min-h-screen flex flex-col items-center justify-center p-4">
        <div id="invite-card" class="w-full max-w-md transition-all duration-1000 opacity-0 translate-y-10"></div>
        
        <div class="mt-8 w-full max-w-md text-center">
            <div id="wedding-countdown" class="grid grid-cols-4 gap-2 mb-6">
                <div class="bg-black/40 p-3 rounded-xl border border-white/10 text-white">
                    <div id="days" class="text-xl font-bold">00</div>
                    <div class="text-[8px] uppercase">Days</div>
                </div>
                <div class="bg-black/40 p-3 rounded-xl border border-white/10 text-white">
                    <div id="hours" class="text-xl font-bold">00</div>
                    <div class="text-[8px] uppercase">Hrs</div>
                </div>
                <div class="bg-black/40 p-3 rounded-xl border border-white/10 text-white">
                    <div id="minutes" class="text-xl font-bold">00</div>
                    <div class="text-[8px] uppercase">Min</div>
                </div>
                <div class="bg-black/40 p-3 rounded-xl border border-white/10 text-white">
                    <div id="seconds" class="text-xl font-bold">00</div>
                    <div class="text-[8px] uppercase">Sec</div>
                </div>
            </div>

            <div id="live-attendance" class="text-white/70 text-[10px] tracking-widest font-bold mb-4">
                <span id="pax-count">0</span> GUESTS ATTENDING
            </div>
            
            <div class="h-20 overflow-hidden relative border-t border-white/10 pt-4">
                <div id="wishes-scroller" class="space-y-4"></div>
            </div>
        </div>

        <button onclick="$('#view-login').fadeIn()" class="fixed bottom-6 right-6 text-[9px] text-white/40 border border-white/10 px-4 py-2 rounded-full">LOGIN</button>
    </div>

    <main id="view-rsvp" class="page-section max-w-2xl mx-auto p-4 pt-12">
        <div class="bg-white rounded-3xl overflow-hidden shadow-2xl">
            <div class="bg-navy-900 text-white p-8 text-center">
                <h2 class="text-2xl font-classic">Confirm RSVP</h2>
                <p id="guest-group-name" class="text-gold-400 text-xs mt-2 uppercase"></p>
            </div>
            <form id="rsvp-form" class="p-6 space-y-6">
                <div id="guest-list-container"></div>
                <textarea id="rsvp-note" class="w-full p-4 bg-gray-50 rounded-xl border text-sm" placeholder="Your Wedding Wishes..."></textarea>
                <button type="submit" class="w-full bg-gold-500 text-white py-4 rounded-xl font-bold uppercase tracking-widest">Submit</button>
            </form>
        </div>
        <div id="event-details-display" class="mt-8 space-y-4 pb-20"></div>
    </main>

    <main id="view-admin" class="page-section max-w-5xl mx-auto p-6 bg-white min-h-screen">
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h2 class="text-xl font-bold font-classic">Wedding Admin</h2>
            <button onclick="logout()" class="text-red-500 text-xs font-bold">LOGOUT</button>
        </div>
        <nav class="flex gap-4 mb-8 overflow-x-auto pb-2">
            <button onclick="switchAdminTab('guests')" class="px-4 py-2 bg-gray-100 rounded-lg text-xs font-bold uppercase">Guests</button>
            <button onclick="switchAdminTab('wishes')" class="px-4 py-2 bg-gray-100 rounded-lg text-xs font-bold uppercase">Wishes</button>
            <button onclick="switchAdminTab('settings')" class="px-4 py-2 bg-gray-100 rounded-lg text-xs font-bold uppercase">Settings</button>
            <button onclick="downloadGuestList()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold uppercase ml-auto">Export</button>
        </nav>
        
        <div id="admin-tab-guests" class="space-y-4">
            <button onclick="$('#modal-add-guest').fadeIn()" class="bg-black text-white px-4 py-2 rounded-lg text-xs uppercase font-bold">+ New Guest</button>
            <table class="w-full text-left text-xs"><tbody id="admin-table-body" class="divide-y divide-gray-100"></tbody></table>
        </div>

        <div id="admin-tab-wishes" class="hidden"><table class="w-full text-left text-xs"><tbody id="admin-wishes-body"></tbody></table></div>

        <div id="admin-tab-settings" class="hidden">
            <form id="settings-form" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <select id="set-theme" class="p-3 border rounded-xl"><option value="classic">Classic</option><option value="modern">Modern</option><option value="floral">Floral</option><option value="midnight">Midnight</option></select>
                    <input id="set-names" placeholder="Names (e.g. John & Sarah)" class="p-3 border rounded-xl">
                </div>
                <input id="set-deadline" type="datetime-local" class="w-full p-3 border rounded-xl">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[10px] uppercase font-bold">Reception</label><input id="set-rec-loc" placeholder="Address" class="w-full p-2 border rounded mt-1"></div>
                    <div><label class="text-[10px] uppercase font-bold">Reception Time</label><input id="set-rec-time" type="datetime-local" class="w-full p-2 border rounded mt-1"></div>
                </div>
                <div id="bg-photo-list" class="space-y-2"></div>
                <button type="button" onclick="addPhotoInput('bg-photo-list')" class="text-blue-500 text-xs">+ Add BG Photo URL</button>
                <button type="submit" class="w-full bg-navy-900 text-white py-4 rounded-xl font-bold uppercase mt-4">Save All</button>
            </form>
        </div>
    </main>

    <div id="view-login" class="hidden fixed inset-0 z-[1200] bg-black/95 flex items-center justify-center p-6">
        <div class="bg-white p-10 rounded-3xl w-full max-w-sm text-center">
            <h2 class="text-xl font-bold font-classic mb-8 uppercase">Invite Access</h2>
            <input id="input-invite-code" placeholder="ENTER CODE" class="w-full p-4 border rounded-2xl text-center mb-6 uppercase">
            <button id="btn-enter-code" class="w-full bg-black text-white py-4 rounded-2xl font-bold uppercase">Unlock</button>
        </div>
    </div>

    <div id="modal-add-guest" class="hidden fixed inset-0 z-[2000] bg-black/90 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm">
            <h3 class="font-bold mb-6 text-center uppercase tracking-widest">New Guest</h3>
            <input id="new-code" placeholder="INVITE CODE" class="w-full p-4 border rounded-xl mb-4 uppercase">
            <input id="new-names" placeholder="GUEST NAME(S)" class="w-full p-4 border rounded-xl mb-6">
            <button onclick="createInvite()" class="w-full bg-navy-900 text-white py-4 rounded-xl font-bold uppercase">Create</button>
            <button onclick="$('#modal-add-guest').fadeOut()" class="w-full mt-2 text-gray-400 text-xs">Cancel</button>
        </div>
    </div>

    <script>
        // 1. FIREBASE & CONFIG
        const firebaseConfig = { apiKey: "AIzaSyAOEMrxylKIxZQgsY-aHMI87KmVIqMh9AQ", authDomain: "wedding-rvsp-e446c.firebaseapp.com", projectId: "wedding-rvsp-e446c", storageBucket: "wedding-rvsp-e446c.firebasestorage.app", messagingSenderId: "836260285764", appId: "1:836260285764:web:b1e8ca3ea64f7616e7db11" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let siteConfig = { theme: 'classic', names: '', deadline: '', bgPhotos: [], reception: {} };
        let countdownInterval;

        // 2. DEFINE FUNCTIONS FIRST
        async function loadConfig() {
            const doc = await db.collection('site_config').doc('main').get();
            if(doc.exists) siteConfig = { ...siteConfig, ...doc.data() };
        }

        async function loadStatsAndWishes() {
            const snap = await db.collection('invitations').get();
            let total = 0, wishes = [];
            snap.forEach(doc => {
                const d = doc.data();
                if(!d.isAdmin && d.guests) {
                    d.guests.forEach(g => { if(g.isAttending) total++; });
                    if(d.note) wishes.push({ name: d.guestNames, note: d.note });
                }
            });
            $('#pax-count').text(total);
            const scroller = $('#wishes-scroller');
            scroller.empty();
            if(wishes.length > 0) {
                if(wishes.length > 2) scroller.addClass('wish-scroll');
                [...wishes, ...wishes].forEach(w => scroller.append(`<div class="text-white/80 text-center"><p class="italic text-[11px]">"${w.note}"</p><p class="text-[8px] uppercase mt-1">— ${w.name}</p></div>`));
            }
        }

        function startCountdown() {
            if(!siteConfig.deadline) return;
            const targetDate = new Date(siteConfig.deadline.replace(' ', 'T')).getTime();
            if(isNaN(targetDate)) return;

            if(countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const diff = targetDate - now;
                if(diff < 0) { clearInterval(countdownInterval); return; }

                $('#days').text(Math.floor(diff / 86400000).toString().padStart(2, '0'));
                $('#hours').text(Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0'));
                $('#minutes').text(Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0'));
                $('#seconds').text(Math.floor((diff % 60000) / 1000).toString().padStart(2, '0'));
            }, 1000);
        }

        function renderLanding() {
            const c = siteConfig;
            $('#entrance-curtains-container').html('<div id="entrance-overlay"><div class="curtain-panel curtain-left"></div><div class="curtain-panel curtain-right"></div></div>');
            const bgCont = $('#bg-slideshow'); bgCont.empty();
            const bgs = c.bgPhotos?.length ? c.bgPhotos : ["https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=2000"];
            bgs.forEach((url, i) => bgCont.append(`<div class="bg-slide ${i===0?'active':''}" style="background-image: url('${url}')"></div>`));
            if(bgs.length > 1) { 
                let cur = 0; setInterval(() => { $('.bg-slide').removeClass('active'); cur = (cur + 1) % bgs.length; $('.bg-slide').eq(cur).addClass('active'); }, 5000); 
            }
            $('#invite-card').html(`<div class="bg-white p-10 text-center border-8 border-double border-gold-400"><h1 class="font-classic text-4xl mb-4">${c.names || 'Wedding Invitation'}</h1><div class="h-1 w-12 bg-gold-400 mx-auto"></div></div>`).addClass('active').css('opacity', 1);
            $('.page-section').removeClass('active'); $('#view-landing').addClass('active');
        }

        function enterSite() {
            $('body').addClass('open');
            $('#entrance-content').fadeOut();
            setTimeout(() => $('#entrance-overlay').fadeOut(), 1500);
        }

        // 3. READY HANDLER
        $(document).ready(async () => {
            await loadConfig();
            await loadStatsAndWishes();
            startCountdown();
            
            $('#loading-screen').fadeOut();
            if(localStorage.getItem('rsvp_admin') === 'true') {
                $('#entrance-overlay, #entrance-content').hide();
                $('#view-admin').addClass('active');
                loadAdmin();
            } else {
                renderLanding();
            }
        });

        // Other logic (admin/rsvp) continues...
        function switchAdminTab(t) { $('.page-section main > div').hide(); $(`#admin-tab-${t}`).show(); }
        function logout() { localStorage.clear(); location.reload(); }
        window.addPhotoInput = (id, v='') => { $(`#${id}`).append(`<div class="flex gap-2"><input value="${v}" class="flex-grow p-2 border photo-input text-xs"><button onclick="$(this).parent().remove()">X</button></div>`); };
    </script>
</body>
</html>
