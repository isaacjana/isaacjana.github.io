<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding RSVP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Lato:wght@300;400;700&family=Montserrat:wght@300;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#D4AF37', 500: '#C5A028' },
                        rose: { 50: '#fff1f2', 900: '#881337' },
                    },
                    fontFamily: {
                        classic: ['Cinzel', 'serif'],
                        modern: ['Montserrat', 'sans-serif'],
                        floral: ['Great Vibes', 'cursive'],
                        body: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Default state: Hidden */
        .page-section { display: none; }
        
        /* Loading Screen Styles */
        #loading-screen { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #D4AF37; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Slideshow & Animations */
        .slide-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; z-index: 0; }
        .slide-bg.active { opacity: 1; }

        /* Animations */
        .theme-classic .slide-bg.active { animation: kenBurns 10s infinite alternate; }
        @keyframes kenBurns { from { transform: scale(1); } to { transform: scale(1.1); } }
        
        .music-playing { animation: pulse-ring 2s infinite; }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }
    </style>
</head>
<body class="text-gray-700 min-h-screen bg-gray-50 overflow-x-hidden">

    <div id="loading-screen">
        <div class="spinner mb-4"></div>
        <div class="text-sm font-bold tracking-widest text-gray-400">LOADING WEDDING...</div>
    </div>

    <div id="youtube-player" class="hidden"></div>

    <button id="music-fab" onclick="toggleMusic()" class="fixed bottom-6 right-6 z-[100] bg-white text-gray-800 p-3 rounded-full shadow-xl hidden hover:scale-110 transition border border-gray-200">
        <i id="music-icon" class="fas fa-play"></i>
    </button>

    <div id="view-landing" class="page-section min-h-screen w-full relative">
        <div id="slideshow-wrapper" class="absolute inset-0 z-0 overflow-hidden"></div>
        <div id="bg-overlay" class="absolute inset-0 z-10 bg-black/30 transition-colors duration-500"></div>

        <div class="relative z-20 min-h-screen flex items-center justify-center p-4">
            <div id="invite-card" class="w-full max-w-4xl min-h-[70vh] shadow-2xl overflow-hidden relative transition-all duration-500 flex flex-col items-center justify-center text-center p-8 md:p-12 backdrop-blur-sm">
                </div>
        </div>

        <div class="absolute bottom-4 left-0 right-0 z-30 text-center">
            <button onclick="$('#view-landing').hide(); $('#view-login').fadeIn();" class="text-[10px] text-white/60 hover:text-white uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full backdrop-blur">
                Admin / Guest Login
            </button>
        </div>
    </div>

    <div id="view-login" class="hidden fixed inset-0 z-[60] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white max-w-sm w-full p-8 rounded-2xl shadow-2xl relative">
            <button onclick="$('#view-login').fadeOut(); $('#view-landing').fadeIn();" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-bold text-center mb-6 font-classic text-gray-800">Private Access</h2>
            <input type="text" id="input-invite-code" placeholder="ENTER CODE" class="w-full p-4 border-2 border-gray-100 rounded-xl text-center font-bold text-xl uppercase tracking-[0.2em] focus:outline-none focus:border-gold-500 mb-4">
            <button id="btn-enter-code" class="w-full bg-gray-900 text-white py-4 rounded-xl font-bold hover:bg-gray-800 transition shadow-lg tracking-widest text-sm">UNLOCK</button>
            <div id="login-error" class="hidden text-red-500 text-center mt-3 text-xs font-bold uppercase tracking-wide"></div>
        </div>
    </div>

    <main id="view-rsvp" class="page-section max-w-3xl mx-auto w-full p-4 md:p-8 pt-10 pb-24">
        <button onclick="location.reload()" class="mb-6 text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-gray-800"><i class="fas fa-arrow-left mr-2"></i> Back Home</button>
        
        <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden mb-8 border border-gray-100">
            <div class="bg-gray-900 p-10 text-center text-white relative">
                <h2 class="text-4xl font-classic mb-2 relative z-10">RSVP</h2>
                <p class="opacity-80 text-sm relative z-10">Welcome, <span id="guest-group-name" class="font-bold text-gold-400"></span></p>
                <div id="deadline-badge" class="mt-4 inline-block bg-white/10 border border-white/20 px-4 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest relative z-10"></div>
            </div>
            
            <div class="p-8 md:p-10">
                <div id="rsvp-locked-msg" class="hidden bg-red-50 border-l-4 border-red-500 p-4 mb-8 text-red-700 text-sm font-bold">Deadline passed.</div>
                <form id="rsvp-form" class="space-y-6">
                    <div id="guest-list-container" class="space-y-4"></div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Message</label>
                        <textarea id="rsvp-note" rows="3" class="w-full p-4 border rounded-xl bg-gray-50"></textarea>
                    </div>
                    <button type="submit" id="btn-submit-rsvp" class="w-full bg-gold-500 hover:bg-gold-400 text-white font-bold py-4 rounded-xl shadow-lg uppercase tracking-widest text-sm">Confirm RSVP</button>
                </form>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-lg border border-gray-100 p-8">
            <h3 class="font-classic text-xl text-center mb-6 border-b pb-4">Contacts</h3>
            <div id="contact-list-display" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </main>

    <main id="view-admin" class="page-section max-w-6xl mx-auto w-full p-6">
        <div class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-bold font-classic">Dashboard</h2>
            <div class="flex gap-2">
                <button onclick="switchAdminTab('guests')" class="px-5 py-2 rounded-lg bg-gray-50 font-bold border">Guests</button>
                <button onclick="switchAdminTab('settings')" class="px-5 py-2 rounded-lg bg-gray-50 font-bold border">Config</button>
                <button onclick="logout()" class="px-4 py-2 text-red-500 border rounded-lg"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div id="admin-tab-guests">
            <div class="grid grid-cols-4 gap-4 mb-6 text-center">
                <div class="bg-white p-4 rounded-2xl shadow border">Total: <span id="stat-total" class="font-black">0</span></div>
                <div class="bg-white p-4 rounded-2xl shadow border text-green-600">Attending: <span id="stat-attending" class="font-black">0</span></div>
                <div class="bg-white p-4 rounded-2xl shadow border text-blue-600">Groom: <span id="stat-groom" class="font-black">0</span></div>
                <div class="bg-white p-4 rounded-2xl shadow border text-pink-600">Bride: <span id="stat-bride" class="font-black">0</span></div>
            </div>
            <div class="bg-white rounded-2xl shadow border overflow-hidden p-4">
                <div class="flex gap-2 mb-4">
                    <button onclick="$('#modal-add-guest').fadeIn()" class="bg-black text-white px-6 py-2 rounded-lg font-bold">+ New Invite</button>
                </div>
                <table class="w-full text-sm text-left"><tbody id="admin-table-body"></tbody></table>
            </div>
        </div>

        <div id="admin-tab-settings" class="hidden">
            <form id="settings-form" class="max-w-4xl mx-auto space-y-6 bg-white p-8 rounded-2xl shadow">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="font-bold text-xs">Theme</label>
                        <select id="set-theme" class="w-full p-2 border rounded">
                            <option value="classic">Classic</option>
                            <option value="modern">Modern</option>
                            <option value="floral">Floral</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-bold text-xs">Names</label>
                        <input type="text" id="set-names" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="font-bold text-xs">Deadline</label>
                        <input type="date" id="set-deadline" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="font-bold text-xs">YouTube URL</label>
                        <input type="text" id="set-music" class="w-full p-2 border rounded">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div class="bg-gray-50 p-3 rounded border">
                        <label class="font-bold text-xs uppercase">Reception</label>
                        <input type="text" id="set-rec-loc" class="w-full p-2 border rounded mt-1 text-sm" placeholder="Location">
                        <input type="datetime-local" id="set-rec-time" class="w-full p-2 border rounded mt-1 text-sm">
                    </div>
                    <div class="bg-gray-50 p-3 rounded border">
                        <div class="flex justify-between">
                            <label class="font-bold text-xs uppercase">Matrimony</label>
                            <label><input type="checkbox" id="set-mat-enable"> Enable</label>
                        </div>
                        <input type="text" id="set-mat-loc" class="w-full p-2 border rounded mt-1 text-sm" placeholder="Location">
                        <input type="datetime-local" id="set-mat-time" class="w-full p-2 border rounded mt-1 text-sm">
                    </div>
                </div>

                <div>
                    <label class="font-bold text-xs">Background Photos (URLs)</label>
                    <div id="photo-list-inputs" class="space-y-2 mb-2"></div>
                    <button type="button" onclick="addPhotoInput('')" class="text-xs text-gold-500">+ Add Photo</button>
                </div>
                <div>
                    <label class="font-bold text-xs">Contacts</label>
                    <div id="contact-list-inputs" class="space-y-2 mb-2"></div>
                    <button type="button" onclick="addContactInput()" class="text-xs text-gold-500">+ Add Contact</button>
                </div>
                <button type="submit" class="w-full bg-black text-white py-3 rounded font-bold">Save Config</button>
            </form>
        </div>
    </main>

    <div id="modal-add-guest" class="fixed inset-0 bg-black/60 hidden z-[70] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 w-full max-w-md">
            <h3 class="font-bold mb-4">New Invite</h3>
            <input type="text" id="new-code" placeholder="CODE" class="w-full p-2 border rounded mb-2 uppercase">
            <div class="flex gap-4 mb-2"><label><input type="radio" name="new-side" value="groom" checked> Groom</label><label><input type="radio" name="new-side" value="bride"> Bride</label></div>
            <input type="text" id="new-names" placeholder="Names..." class="w-full p-2 border rounded mb-4">
            <button onclick="createInvite()" class="w-full bg-black text-white py-2 rounded font-bold">Create</button>
            <button onclick="$('#modal-add-guest').fadeOut()" class="w-full mt-2 text-gray-500">Cancel</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-gray-900 text-white px-6 py-4 rounded-xl shadow-2xl hidden z-[80] flex items-center gap-3">
        <i class="fas fa-check-circle text-green-400"></i> <span>Settings Saved</span>
    </div>

    <script>
        // 1. FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAOEMrxylKIxZQgsY-aHMI87KmVIqMh9AQ",
            authDomain: "wedding-rvsp-e446c.firebaseapp.com",
            projectId: "wedding-rvsp-e446c",
            storageBucket: "wedding-rvsp-e446c.firebasestorage.app",
            messagingSenderId: "836260285764",
            appId: "1:836260285764:web:b1e8ca3ea64f7616e7db11",
            measurementId: "G-461QMHPHXQ"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. STATE
        let siteConfig = { 
            theme: 'classic', 
            names: 'Jane & John',
            deadline: '2026-12-31',
            reception: { loc: 'Grand Hall', time: '2026-09-24T18:00' },
            matrimony: { enabled: false, loc: '', time: '' },
            photos: ["https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=2000"],
            contacts: [],
            youtube: ""
        };
        let currentInviteId = localStorage.getItem('rsvp_id');
        let isAdmin = localStorage.getItem('rsvp_admin') === 'true';
        let player, slideshowInterval;

        // 3. STARTUP
        $(document).ready(async () => {
            setTimeout(() => {
                if($('#loading-screen').is(':visible')) completeLoading();
            }, 2000); // Fail-safe
            await loadSiteConfig();
        });

        async function loadSiteConfig() {
            try {
                const doc = await db.collection('site_config').doc('main').get();
                if (doc.exists) siteConfig = { ...siteConfig, ...doc.data() };
            } catch (e) { console.error("DB Error", e); }
            finally { completeLoading(); }
        }

        function completeLoading() {
            $('#loading-screen').fadeOut();
            renderLandingPage();
            if(isAdmin) {
                $('#view-landing').hide();
                $('#view-admin').show();
                loadAdminData();
            }
            if(window.YT && siteConfig.youtube) initYouTube(siteConfig.youtube);
        }

        function renderLandingPage() {
            const c = siteConfig;
            $('body').removeClass().addClass(`text-gray-700 min-h-screen theme-${c.theme}`);

            // Slideshow
            const wrap = $('#slideshow-wrapper'); wrap.empty();
            if(c.photos && c.photos.length) {
                c.photos.forEach((url, i) => wrap.append(`<div class="slide-bg ${i===0?'active':''}" style="background-image: url('${url}');"></div>`));
                if(c.photos.length > 1) {
                    if(slideshowInterval) clearInterval(slideshowInterval);
                    let cur = 0;
                    const slides = $('.slide-bg');
                    slideshowInterval = setInterval(() => {
                        slides.eq(cur).removeClass('active');
                        cur = (cur + 1) % slides.length;
                        slides.eq(cur).addClass('active');
                    }, 5000);
                }
            }

            // Card Content
            const card = $('#invite-card');
            const d = new Date(c.reception.time || Date.now());
            const dateStr = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

            let html = '';
            if(c.theme === 'classic') {
                $('#bg-overlay').addClass('bg-black/40');
                card.addClass('bg-[#fdfbf7] border-[8px] border-double border-gray-200');
                html = `<p class="uppercase tracking-[0.3em] text-xs text-gray-500 mb-6">The Wedding Of</p><h1 class="font-classic text-5xl md:text-7xl text-gray-800 mb-8">${c.names}</h1><div class="w-24 h-px bg-gold-400 mb-8"></div><p class="font-classic text-xl font-bold mb-2">${dateStr}</p><p class="text-xs uppercase tracking-widest text-gray-500 mb-10">${c.reception.loc || ''}</p><button onclick="$('#view-login').fadeIn()" class="bg-white border font-classic py-3 px-10 hover:bg-gold-500 hover:text-white transition">RSVP</button>`;
            } else if (c.theme === 'modern') {
                $('#bg-overlay').addClass('bg-white/10 backdrop-blur-md');
                card.addClass('bg-white text-black border-none shadow-none');
                html = `<h1 class="font-modern font-black text-6xl md:text-8xl tracking-tighter mb-4 uppercase leading-[0.9]">${c.names}</h1><div class="bg-black text-white px-4 py-1 text-lg font-bold font-modern rotate-[-2deg] mt-4">${dateStr}</div><button onclick="$('#view-login').fadeIn()" class="mt-12 border-4 border-black px-12 py-4 font-black hover:bg-black hover:text-white transition uppercase">Respond</button>`;
            } else {
                $('#bg-overlay').addClass('bg-pink-900/20');
                card.addClass('bg-white/90 rounded-[3rem]');
                html = `<h1 class="font-floral text-7xl md:text-8xl text-rose-900 mb-2 p-4">${c.names}</h1><p class="font-body italic text-gray-500 mb-8">Request the honor of your presence</p><div class="border-y border-rose-200 py-6 w-full max-w-md"><p class="font-bold text-rose-800 text-xl font-classic">${dateStr}</p></div><button onclick="$('#view-login').fadeIn()" class="mt-10 bg-rose-900 text-white font-serif italic py-3 px-12 rounded-full hover:bg-rose-800 transition">Save your seat</button>`;
            }
            card.html(html);
        }

        // --- AUTH ---
        $('#btn-enter-code').click(async () => {
            const code = $('#input-invite-code').val().trim().toUpperCase();
            if(code === 'ADMIN') { 
                 localStorage.setItem('rsvp_admin', 'true'); isAdmin=true; location.reload(); return;
            }
            try {
                const snap = await db.collection('invitations').where('inviteCode', '==', code).limit(1).get();
                if(snap.empty) { $('#login-error').text('Invalid Code').removeClass('hidden'); return; }
                const doc = snap.docs[0];
                const data = doc.data();
                if(data.isAdmin) {
                    localStorage.setItem('rsvp_admin', 'true'); isAdmin=true; location.reload();
                } else {
                    localStorage.setItem('rsvp_id', doc.id); currentInviteId = doc.id;
                    loadGuestRSVP(doc.id, data);
                    if(player && player.getPlayerState() !== 1) toggleMusic();
                }
            } catch(e) { console.error(e); }
        });

        function loadGuestRSVP(id, data) {
            $('#view-login').fadeOut(); $('#view-landing').fadeOut(); $('#view-rsvp').fadeIn();
            $('#guest-group-name').text(data.guestNames); $('#rsvp-note').val(data.note || '');
            
            const d = new Date(siteConfig.deadline);
            if(new Date() > d) { $('#rsvp-locked-msg').removeClass('hidden'); $('#btn-submit-rsvp').hide(); }
            $('#deadline-badge').text(`Due: ${d.toLocaleDateString()}`);

            const c = $('#guest-list-container'); c.empty();
            data.guests.forEach((g, i) => {
                c.append(`<div class="guest-card bg-gray-50 p-4 rounded-xl border" data-idx="${i}"><div class="flex justify-between items-center mb-2"><span class="font-bold">${g.name}</span><div class="flex gap-2"><label class="cursor-pointer px-3 py-1 bg-white border rounded ${g.isAttending===true?'bg-green-100 border-green-500':''}"><input type="radio" name="s${i}" value="y" class="hidden" ${g.isAttending===true?'checked':''}>Yes</label><label class="cursor-pointer px-3 py-1 bg-white border rounded ${g.isAttending===false?'bg-red-100 border-red-500':''}"><input type="radio" name="s${i}" value="n" class="hidden" ${g.isAttending===false?'checked':''}>No</label></div></div><select class="w-full text-sm p-2 border rounded ${g.isAttending===true?'':'hidden'} meal-sel"><option value="Standard" ${g.meal=='Standard'?'selected':''}>Standard Meal</option><option value="Veg" ${g.meal=='Veg'?'selected':''}>Vegetarian</option></select></div>`);
            });
            $('input[type=radio]').change(function() {
                const card = $(this).closest('.guest-card');
                if($(this).val() === 'y') card.find('.meal-sel').slideDown(); else card.find('.meal-sel').slideUp();
            });

            const cl = $('#contact-list-display'); cl.empty();
            if(siteConfig.contacts) siteConfig.contacts.forEach(ct => cl.append(`<div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl"><div class="w-8 h-8 rounded-full bg-gold-400 flex items-center justify-center text-white font-bold">${ct.name.charAt(0)}</div><div><div class="font-bold text-sm">${ct.name}</div><div class="text-xs text-gold-500 font-bold uppercase">${ct.role}</div><div class="text-xs text-gray-500">${ct.phone}</div></div></div>`));
        }

        $('#rsvp-form').submit(async (e) => {
            e.preventDefault();
            const guests = [];
            $('.guest-card').each(function() {
                const i = $(this).data('idx');
                const val = $(this).find(`input[name="s${i}"]:checked`).val();
                guests.push({ name: $(this).find('span').text(), isAttending: val==='y'?true:(val==='n'?false:null), meal: $(this).find('.meal-sel').val() });
            });
            await db.collection('invitations').doc(currentInviteId).update({ guests, note: $('#rsvp-note').val(), status: 'responded' });
            alert('Saved!'); location.reload();
        });

        // --- ADMIN ---
        function loadAdminData() {
            if(siteConfig) {
                $('#set-theme').val(siteConfig.theme || 'classic'); 
                $('#set-names').val(siteConfig.names || ''); 
                $('#set-deadline').val(siteConfig.deadline || ''); 
                $('#set-music').val(siteConfig.youtube || '');
                $('#set-rec-loc').val(siteConfig.reception?.loc || '');
                $('#set-rec-time').val(siteConfig.reception?.time || '');
                $('#set-mat-enable').prop('checked', siteConfig.matrimony?.enabled || false);
                $('#set-mat-loc').val(siteConfig.matrimony?.loc || '');
                $('#set-mat-time').val(siteConfig.matrimony?.time || '');

                $('#photo-list-inputs').empty(); (siteConfig.photos||[]).forEach(url => addPhotoInput(url));
                $('#contact-list-inputs').empty(); (siteConfig.contacts||[]).forEach(c => addContactInput(c.name, c.role, c.phone));
            }
            db.collection('invitations').onSnapshot(snap => {
                const list = $('#admin-table-body'); list.empty();
                let stats = { total:0, acc:0, groom:0, bride:0 };
                snap.forEach(doc => {
                    const d = doc.data(); if(d.isAdmin) return;
                    stats.total += d.guests.length;
                    d.guests.forEach(g => { if(g.isAttending) stats.acc++; });
                    if(d.status==='responded') { const c=d.guests.filter(g=>g.isAttending).length; if(d.side==='groom') stats.groom+=c; else stats.bride+=c; }
                    list.append(`<tr class="border-b"><td class="p-3 font-bold">${d.inviteCode}</td><td class="p-3">${d.guestNames}</td><td class="p-3">${d.status}</td><td class="p-3"><button onclick="delInv('${doc.id}')" class="text-red-500">×</button></td></tr>`);
                });
                $('#stat-total').text(stats.total); $('#stat-attending').text(stats.acc); $('#stat-groom').text(stats.groom); $('#stat-bride').text(stats.bride);
            });
        }
        window.addPhotoInput = (v) => $('#photo-list-inputs').append(`<div class="flex gap-2"><input type="text" value="${v}" class="w-full p-2 border rounded photo-input"><button type="button" onclick="$(this).parent().remove()" class="text-red-500">×</button></div>`);
        window.addContactInput = (n='',r='',p='') => $('#contact-list-inputs').append(`<div class="flex gap-2 contact-row"><input value="${n}" class="w-1/3 p-2 border rounded c-name" placeholder="Name"><input value="${r}" class="w-1/3 p-2 border rounded c-role" placeholder="Role"><input value="${p}" class="w-1/3 p-2 border rounded c-phone" placeholder="Phone"><button type="button" onclick="$(this).parent().remove()" class="text-red-500">×</button></div>`);
        
        // --- SAFE SAVE ---
        $('#settings-form').submit(async (e) => {
            e.preventDefault();
            const photos=[], contacts=[];
            $('.photo-input').each(function(){ if($(this).val()) photos.push($(this).val()) });
            $('.contact-row').each(function(){ contacts.push({name:$(this).find('.c-name').val(), role:$(this).find('.c-role').val(), phone:$(this).find('.c-phone').val()}) });
            
            // SAFEGUARDS: || "" prevents undefined error
            const cfg = { 
                theme: $('#set-theme').val() || 'classic', 
                names: $('#set-names').val() || '', 
                deadline: $('#set-deadline').val() || '', 
                reception: { 
                    loc: $('#set-rec-loc').val() || '', 
                    time: $('#set-rec-time').val() || '' 
                }, 
                matrimony: { 
                    enabled: $('#set-mat-enable').is(':checked'), 
                    loc: $('#set-mat-loc').val() || '', 
                    time: $('#set-mat-time').val() || '' 
                }, 
                photos, contacts, youtube: $('#set-music').val() || '' 
            };
            await db.collection('site_config').doc('main').set(cfg); 
            $('#toast').fadeIn().delay(2000).fadeOut();
        });

        function switchAdminTab(t) { $('[id^=admin-tab]').hide(); $(`#admin-tab-${t}`).show(); }
        async function createInvite() {
            const code = $('#new-code').val().toUpperCase(); const names = $('#new-names').val();
            const guests = names.split(',').map(n => ({name:n.trim(), isAttending:null, meal:'Standard'}));
            await db.collection('invitations').add({ inviteCode: code, guestNames: names, side: $('input[name="new-side"]:checked').val(), guests, status: 'pending' });
            $('#modal-add-guest').fadeOut();
        }
        async function delInv(id) { if(confirm('Delete?')) await db.collection('invitations').doc(id).delete(); }
        function logout() { localStorage.clear(); location.reload(); }
        
        function initYouTube(url) {
            let vidId = ""; try { vidId = url.match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|\/watch\?v=|\/user\/\S+|\/ytscreeningroom\?v=))([\w\-]{10,12})\b/)[1]; } catch(e){}
            if(vidId) {
                $('#music-fab').removeClass('hidden');
                window.onYouTubeIframeAPIReady = function() { player = new YT.Player('youtube-player', { height: '0', width: '0', videoId: vidId, playerVars: { 'autoplay': 1, 'loop': 1, 'controls': 0, 'playlist': vidId }, events: { 'onReady': onPlayerReady } }); };
            }
        }
        function onPlayerReady(e) { e.target.setVolume(30); e.target.playVideo(); updateMusicIcon(true); }
        function toggleMusic() { if(!player)return; if(player.getPlayerState()===1){ player.pauseVideo(); updateMusicIcon(false); } else { player.playVideo(); updateMusicIcon(true); } }
        function updateMusicIcon(p) { if(p){ $('#music-icon').removeClass('fa-play').addClass('fa-pause'); $('#music-fab').addClass('music-playing'); } else { $('#music-icon').removeClass('fa-pause').addClass('fa-play'); $('#music-fab').removeClass('music-playing'); } }
    </script>
</body>
</html>
