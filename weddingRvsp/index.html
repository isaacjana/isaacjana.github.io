<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding RSVP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Lato:wght@300;400;700&family=Montserrat:wght@300;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#D4AF37', 500: '#C5A028' },
                        sage: { 100: '#E6EFE9', 800: '#4A5D52' },
                    },
                    fontFamily: {
                        classic: ['Cinzel', 'serif'],
                        modern: ['Montserrat', 'sans-serif'],
                        floral: ['Great Vibes', 'cursive'],
                        body: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Theme Specific Styles */
        .theme-classic-bg { background-color: #fdfbf7; border: 8px double #e5e7eb; }
        .theme-floral-bg { background: radial-gradient(circle, #fff0f5 0%, #fff 100%); }
        .theme-modern-bg { background-color: #ffffff; }
    </style>
</head>
<body class="text-gray-700 min-h-screen">

    <div id="view-landing" class="page-section min-h-screen w-full flex flex-col items-center justify-center p-4">
        <div id="invite-card" class="w-full max-w-4xl shadow-2xl overflow-hidden min-h-[80vh] relative transition-all duration-500">
            </div>

        <div class="fixed bottom-4 right-4 z-50">
            <button onclick="$('#view-landing').hide(); $('#view-login').fadeIn();" class="text-xs text-gray-300 hover:text-gray-500 bg-white/50 px-2 py-1 rounded backdrop-blur">Login / Admin</button>
        </div>
    </div>

    <div id="view-login" class="hidden fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white max-w-sm w-full p-8 rounded-xl shadow-2xl relative">
            <button onclick="closeLogin()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-bold text-center mb-6 font-classic">Enter Code</h2>
            <input type="text" id="input-invite-code" placeholder="GUEST OR ADMIN CODE" class="w-full p-4 border-2 border-gray-200 rounded-lg text-center font-bold text-xl uppercase tracking-widest focus:outline-none focus:border-gold-500 mb-4">
            <button id="btn-enter-code" class="w-full bg-black text-white py-4 rounded-lg font-bold hover:bg-gray-800 transition">ACCESS</button>
            <div id="login-error" class="hidden text-red-500 text-center mt-2 text-sm font-bold"></div>
        </div>
    </div>

    <main id="view-rsvp" class="page-section max-w-3xl mx-auto w-full p-6 pt-10">
        <button onclick="location.reload()" class="mb-4 text-sm text-gray-400 hover:text-gray-800"><i class="fas fa-arrow-left"></i> Back to Invitation</button>
        
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-gray-900 p-8 text-center text-white">
                <h2 class="text-3xl font-classic mb-2">RSVP</h2>
                <p class="opacity-80 text-sm">Welcome, <span id="guest-group-name" class="font-bold"></span></p>
                <div id="deadline-badge" class="mt-2 inline-block bg-white/20 px-3 py-1 rounded-full text-xs"></div>
            </div>
            
            <div class="p-8">
                <div id="rsvp-locked-msg" class="hidden bg-red-50 border-l-4 border-red-500 p-4 mb-6 text-red-700 text-sm">Deadline has passed.</div>
                
                <form id="rsvp-form" class="space-y-6">
                    <div id="guest-list-container" class="space-y-4"></div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Note for the Couple</label>
                        <textarea id="rsvp-note" rows="2" class="w-full p-3 border rounded-lg bg-gray-50"></textarea>
                    </div>
                    <button type="submit" id="btn-submit-rsvp" class="w-full bg-gold-500 hover:bg-gold-400 text-white font-bold py-4 rounded-xl shadow-lg">Confirm RSVP</button>
                </form>
            </div>
        </div>
    </main>

    <main id="view-admin" class="page-section max-w-6xl mx-auto w-full p-6">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
            <h2 class="text-xl font-bold">Admin Dashboard</h2>
            <div class="flex gap-2">
                <button onclick="switchAdminTab('guests')" class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm font-bold active-tab" id="tab-btn-guests">Guests</button>
                <button onclick="switchAdminTab('settings')" class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm font-bold" id="tab-btn-settings">Site Settings</button>
                <button onclick="logout()" class="px-4 py-2 text-red-500 hover:bg-red-50 rounded-lg"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div id="admin-tab-guests">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-gray-400">
                    <div class="text-xs uppercase text-gray-400">Total</div>
                    <div class="text-2xl font-bold" id="stat-total">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
                    <div class="text-xs uppercase text-green-600">Attending</div>
                    <div class="text-2xl font-bold" id="stat-attending">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
                    <div class="text-xs uppercase text-blue-600">Groom Side</div>
                    <div class="text-2xl font-bold" id="stat-groom">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-pink-500">
                    <div class="text-xs uppercase text-pink-600">Bride Side</div>
                    <div class="text-2xl font-bold" id="stat-bride">0</div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow overflow-hidden">
                <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                    <div class="flex gap-2 w-full max-w-md">
                        <input type="text" id="admin-search" placeholder="Search..." class="flex-1 p-2 border rounded text-sm">
                        <select id="admin-filter" class="p-2 border rounded text-sm"><option value="all">All</option><option value="groom">Groom</option><option value="bride">Bride</option></select>
                    </div>
                    <button onclick="$('#modal-add-guest').fadeIn()" class="bg-black text-white px-4 py-2 rounded text-sm font-bold">+ New Invite</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left"><tbody id="admin-table-body"></tbody></table>
                </div>
            </div>
        </div>

        <div id="admin-tab-settings" class="hidden">
            <div class="bg-white p-8 rounded-xl shadow max-w-2xl mx-auto">
                <h3 class="text-lg font-bold mb-6 border-b pb-2">Website Configuration</h3>
                <form id="settings-form" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-gray-500">Theme</label>
                            <select id="set-theme" class="w-full p-2 border rounded">
                                <option value="classic">Classic Elegant</option>
                                <option value="modern">Modern Minimal</option>
                                <option value="floral">Romantic Floral</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500">RSVP Deadline</label>
                            <input type="date" id="set-deadline" class="w-full p-2 border rounded">
                        </div>
                    </div>
                    
                    <div>
                        <label class="text-xs font-bold text-gray-500">Couple Names</label>
                        <input type="text" id="set-names" placeholder="Jane & John" class="w-full p-2 border rounded">
                    </div>

                    <div>
                        <label class="text-xs font-bold text-gray-500">Cover Photo URL</label>
                        <input type="text" id="set-photo" placeholder="https://..." class="w-full p-2 border rounded">
                        <p class="text-[10px] text-gray-400">Paste a link from Unsplash or Imgur.</p>
                    </div>

                    <div class="border-t pt-4">
                        <h4 class="font-bold text-sm mb-2">Events</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-gray-50 p-3 rounded">
                                <label class="text-xs font-bold uppercase block mb-1">Reception (Main)</label>
                                <input type="text" id="set-rec-loc" placeholder="Location" class="w-full p-2 border rounded mb-2 text-sm">
                                <input type="datetime-local" id="set-rec-time" class="w-full p-2 border rounded text-sm">
                            </div>
                            <div class="bg-gray-50 p-3 rounded">
                                <div class="flex justify-between mb-1">
                                    <label class="text-xs font-bold uppercase">Matrimony</label>
                                    <label class="text-xs flex items-center gap-1"><input type="checkbox" id="set-mat-enable"> Enable</label>
                                </div>
                                <input type="text" id="set-mat-loc" placeholder="Location" class="w-full p-2 border rounded mb-2 text-sm">
                                <input type="datetime-local" id="set-mat-time" class="w-full p-2 border rounded text-sm">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-black text-white py-3 rounded font-bold hover:bg-gray-800">Save Settings</button>
                </form>
            </div>
        </div>
    </main>

    <div id="modal-add-guest" class="fixed inset-0 bg-black/50 hidden z-[70] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="font-bold mb-4">New Invitation</h3>
            <input type="text" id="new-code" placeholder="CODE (e.g. SMITH24)" class="w-full p-3 border rounded mb-2 uppercase font-bold">
            <div class="flex gap-4 mb-2">
                <label><input type="radio" name="new-side" value="groom" checked> Groom</label>
                <label><input type="radio" name="new-side" value="bride"> Bride</label>
            </div>
            <input type="text" id="new-names" placeholder="Names (comma separated)" class="w-full p-3 border rounded mb-4">
            <button onclick="createInvite()" class="w-full bg-black text-white py-3 rounded font-bold">Create</button>
            <button onclick="$('#modal-add-guest').fadeOut()" class="w-full mt-2 text-gray-500 text-sm">Cancel</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-xl hidden z-[80]">Saved!</div>

    <script>
        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAOEMrxylKIxZQgsY-aHMI87KmVIqMh9AQ",
            authDomain: "wedding-rvsp-e446c.firebaseapp.com",
            projectId: "wedding-rvsp-e446c",
            storageBucket: "wedding-rvsp-e446c.firebasestorage.app",
            messagingSenderId: "836260285764",
            appId: "1:836260285764:web:b1e8ca3ea64f7616e7db11",
            measurementId: "G-461QMHPHXQ"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- STATE ---
        let siteConfig = null;
        let currentInviteId = localStorage.getItem('rsvp_id');
        let isAdmin = localStorage.getItem('rsvp_admin') === 'true';

        // --- INIT ---
        $(document).ready(async () => {
            await loadSiteConfig();
            
            // If already logged in
            if(isAdmin) {
                $('#view-landing').hide();
                $('#view-admin').show();
                loadAdminData();
            } else if(currentInviteId) {
                // If guest is logged in, do we show landing or RSVP? 
                // Let's show Landing, but the button says "Edit RSVP"
            }
        });

        // --- 1. SITE CONFIG & RENDERING ---
        async function loadSiteConfig() {
            try {
                const doc = await db.collection('site_config').doc('main').get();
                if (doc.exists) {
                    siteConfig = doc.data();
                } else {
                    // Default Config if none exists
                    siteConfig = {
                        names: "Jane & John",
                        theme: "classic",
                        deadline: "2026-12-31",
                        photo: "https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=2000",
                        reception: { loc: "Grand Hall", time: "2026-09-24T18:00" },
                        matrimony: { enabled: true, loc: "City Church", time: "2026-09-24T14:00" }
                    };
                }
                renderLandingPage();
            } catch (e) { console.error("Config Load Error", e); }
        }

        function renderLandingPage() {
            const c = siteConfig;
            const card = $('#invite-card');
            card.empty().removeClass().addClass('w-full max-w-4xl shadow-2xl overflow-hidden min-h-[80vh] relative flex flex-col md:flex-row');

            // Format Dates
            const recDate = new Date(c.reception.time);
            const dateStr = recDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            const timeStr = recDate.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit' });

            // THEME LOGIC
            let html = '';
            
            if (c.theme === 'classic') {
                // CLASSIC THEME
                card.addClass('bg-[#fdfbf7] border-[12px] border-double border-[#e5e7eb]');
                html = `
                    <div class="w-full md:w-1/2 h-64 md:h-auto bg-cover bg-center grayscale-[20%]" style="background-image: url('${c.photo}');"></div>
                    <div class="w-full md:w-1/2 p-10 flex flex-col justify-center text-center">
                        <p class="uppercase tracking-[0.3em] text-xs text-gray-500 mb-4">The Wedding Of</p>
                        <h1 class="font-classic text-5xl md:text-6xl text-gray-800 mb-6 leading-tight">${c.names.replace('&', '<br>&<br>')}</h1>
                        <div class="w-16 h-px bg-gold-400 mx-auto mb-6"></div>
                        <p class="font-classic text-lg font-bold mb-1">${dateStr}</p>
                        <p class="text-sm uppercase tracking-widest mb-8">${c.reception.loc} • ${timeStr}</p>
                        
                        ${c.matrimony.enabled ? `
                        <div class="mb-8 p-4 border border-gold-400/30 rounded-lg">
                            <p class="font-classic font-bold text-sm">Matrimony</p>
                            <p class="text-xs text-gray-500">${c.matrimony.loc} • ${new Date(c.matrimony.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</p>
                        </div>` : ''}

                        <button onclick="$('#view-login').fadeIn()" class="bg-gold-500 text-white font-classic py-3 px-8 rounded shadow-lg hover:bg-gold-400 transition tracking-widest">RSVP NOW</button>
                    </div>
                `;
            } 
            else if (c.theme === 'modern') {
                // MODERN THEME
                card.addClass('bg-white text-black');
                html = `
                    <div class="w-full h-full absolute inset-0 bg-cover bg-center grayscale opacity-10" style="background-image: url('${c.photo}');"></div>
                    <div class="relative z-10 w-full h-full flex flex-col items-center justify-center p-8 border-[20px] border-white">
                        <h1 class="font-modern font-black text-6xl md:text-8xl tracking-tighter mb-2 text-center uppercase leading-none">${c.names.split('&')[0]}<span class="text-gray-300">&</span><br>${c.names.split('&')[1]}</h1>
                        <div class="bg-black text-white px-6 py-2 text-xl font-bold font-modern mt-6 rotate-[-2deg]">${dateStr}</div>
                        <div class="mt-8 flex gap-8 text-center font-bold font-modern uppercase tracking-widest text-sm">
                            <div>
                                <div class="text-4xl block mb-1">RECEPTION</div>
                                ${c.reception.loc}<br>${timeStr}
                            </div>
                        </div>
                        <button onclick="$('#view-login').fadeIn()" class="mt-12 border-2 border-black px-10 py-4 font-black hover:bg-black hover:text-white transition uppercase tracking-widest">Respond</button>
                    </div>
                `;
            } 
            else {
                // FLORAL THEME
                card.addClass('bg-rose-50');
                html = `
                    <div class="w-full md:w-1/2 h-64 md:h-auto bg-cover bg-center rounded-b-[3rem] md:rounded-r-[0] md:rounded-l-[3rem] m-4" style="background-image: url('${c.photo}');"></div>
                    <div class="w-full md:w-1/2 p-8 flex flex-col justify-center text-center">
                        <h1 class="font-floral text-6xl md:text-7xl text-rose-900 mb-4">${c.names}</h1>
                        <p class="font-body italic text-gray-500 mb-6">Request the honor of your presence</p>
                        
                        <div class="bg-white/60 p-6 rounded-xl backdrop-blur-sm shadow-sm mb-6 mx-4">
                            <p class="font-bold text-rose-800 text-lg">${dateStr}</p>
                            <p class="text-sm text-gray-600">${c.reception.loc} @ ${timeStr}</p>
                        </div>
                        
                        <button onclick="$('#view-login').fadeIn()" class="bg-rose-800 text-white font-serif italic py-3 px-10 rounded-full shadow-lg hover:bg-rose-700 transition">Save your seat</button>
                    </div>
                `;
            }

            card.html(html);
            $('#view-landing').addClass('active');
        }

        // --- 2. LOGIN LOGIC ---
        function closeLogin() { $('#view-login').fadeOut(); }
        
        $('#btn-enter-code').click(async () => {
            const code = $('#input-invite-code').val().trim().toUpperCase();
            const btn = $('#btn-enter-code');
            
            // ADMIN CHECK
            if(code === 'ADMIN') { // HARDCODED FALLBACK or DB check
                // In production, fetch specific admin doc
                const adminSnap = await db.collection('invitations').where('isAdmin', '==', true).where('inviteCode', '==', code).get();
                 // Simulating DB Check for demo:
                 // In your DB, ensure you have an invite with code 'ADMIN' and isAdmin: true
            }

            btn.text('Checking...');
            
            try {
                const snap = await db.collection('invitations').where('inviteCode', '==', code).limit(1).get();
                if(snap.empty) {
                    $('#login-error').text('Invalid Code').removeClass('hidden');
                    btn.text('ACCESS');
                    return;
                }

                const doc = snap.docs[0];
                const data = doc.data();

                if(data.isAdmin) {
                    localStorage.setItem('rsvp_admin', 'true');
                    isAdmin = true;
                    location.reload(); // Reload to hit admin logic
                } else {
                    localStorage.setItem('rsvp_id', doc.id);
                    currentInviteId = doc.id;
                    loadGuestRSVP(doc.id, data);
                }

            } catch(e) { console.error(e); }
        });

        // --- 3. GUEST RSVP LOGIC ---
        function loadGuestRSVP(id, data) {
            $('#view-login').hide();
            $('#view-landing').hide();
            $('#view-rsvp').addClass('active');

            $('#guest-group-name').text(data.guestNames);
            $('#rsvp-note').val(data.note || '');

            // Deadline Check
            const d = new Date(siteConfig.deadline);
            const now = new Date();
            if(now > d) {
                $('#rsvp-locked-msg').removeClass('hidden');
                $('#btn-submit-rsvp').hide();
                $('#deadline-badge').text('Closed').addClass('bg-red-500');
            } else {
                $('#deadline-badge').text(`Deadline: ${d.toLocaleDateString()}`);
            }

            // Render Form
            const c = $('#guest-list-container');
            c.empty();
            
            data.guests.forEach((g, i) => {
                c.append(`
                    <div class="guest-card p-4 border rounded-lg bg-gray-50" data-idx="${i}">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold">${g.name}</span>
                            <div class="flex gap-2">
                                <label class="cursor-pointer px-3 py-1 bg-white border rounded ${g.isAttending===true?'bg-green-100 border-green-500':''}"><input type="radio" name="s${i}" value="y" class="hidden" ${g.isAttending===true?'checked':''}>Yes</label>
                                <label class="cursor-pointer px-3 py-1 bg-white border rounded ${g.isAttending===false?'bg-red-100 border-red-500':''}"><input type="radio" name="s${i}" value="n" class="hidden" ${g.isAttending===false?'checked':''}>No</label>
                            </div>
                        </div>
                        <select class="w-full text-sm p-2 border rounded ${g.isAttending===true?'':'hidden'} meal-sel">
                            <option value="Standard" ${g.meal=='Standard'?'selected':''}>Standard Meal</option>
                            <option value="Veg" ${g.meal=='Veg'?'selected':''}>Vegetarian</option>
                        </select>
                    </div>
                `);
            });

            // Toggle Logic
            $('input[type=radio]').change(function() {
                const card = $(this).closest('.guest-card');
                if($(this).val() === 'y') card.find('.meal-sel').slideDown();
                else card.find('.meal-sel').slideUp();
            });
        }

        $('#rsvp-form').submit(async (e) => {
            e.preventDefault();
            const guests = [];
            $('.guest-card').each(function() {
                const i = $(this).data('idx');
                const val = $(this).find(`input[name="s${i}"]:checked`).val();
                const name = $(this).find('span').text(); // simplistic
                guests.push({
                    name: name,
                    isAttending: val === 'y',
                    meal: $(this).find('.meal-sel').val()
                });
            });

            await db.collection('invitations').doc(currentInviteId).update({
                guests, note: $('#rsvp-note').val(), status: 'responded'
            });
            alert('RSVP Saved!');
            location.reload();
        });

        // --- 4. ADMIN LOGIC ---
        function loadAdminData() {
            // Load Settings Form
            if(siteConfig) {
                $('#set-theme').val(siteConfig.theme);
                $('#set-names').val(siteConfig.names);
                $('#set-deadline').val(siteConfig.deadline);
                $('#set-photo').val(siteConfig.photo);
                $('#set-rec-loc').val(siteConfig.reception.loc);
                $('#set-rec-time').val(siteConfig.reception.time);
                $('#set-mat-enable').prop('checked', siteConfig.matrimony.enabled);
                $('#set-mat-loc').val(siteConfig.matrimony.loc);
                $('#set-mat-time').val(siteConfig.matrimony.time);
            }

            // Load Guest List
            db.collection('invitations').onSnapshot(snap => {
                const list = $('#admin-table-body');
                list.empty();
                let stats = { total:0, acc:0, groom:0, bride:0 };

                snap.forEach(doc => {
                    const d = doc.data();
                    if(d.isAdmin) return;
                    
                    // Stats
                    stats.total += d.guests.length;
                    d.guests.forEach(g => { if(g.isAttending) stats.acc++; });
                    if(d.side === 'groom' && d.status === 'responded') stats.groom += d.guests.filter(g=>g.isAttending).length;
                    if(d.side === 'bride' && d.status === 'responded') stats.bride += d.guests.filter(g=>g.isAttending).length;

                    list.append(`
                        <tr class="border-b">
                            <td class="p-3 font-mono font-bold">${d.inviteCode}</td>
                            <td class="p-3"><span class="px-2 py-1 rounded text-xs ${d.side==='groom'?'bg-blue-100 text-blue-800':'bg-pink-100 text-pink-800'}">${d.side}</span></td>
                            <td class="p-3">${d.guestNames}</td>
                            <td class="p-3">${d.status}</td>
                            <td class="p-3 text-right"><button onclick="delInv('${doc.id}')" class="text-red-500">×</button></td>
                        </tr>
                    `);
                });

                $('#stat-total').text(stats.total);
                $('#stat-attending').text(stats.acc);
                $('#stat-groom').text(stats.groom);
                $('#stat-bride').text(stats.bride);
            });
        }

        // Settings Save
        $('#settings-form').submit(async (e) => {
            e.preventDefault();
            const cfg = {
                theme: $('#set-theme').val(),
                names: $('#set-names').val(),
                deadline: $('#set-deadline').val(),
                photo: $('#set-photo').val(),
                reception: { loc: $('#set-rec-loc').val(), time: $('#set-rec-time').val() },
                matrimony: { enabled: $('#set-mat-enable').is(':checked'), loc: $('#set-mat-loc').val(), time: $('#set-mat-time').val() }
            };
            await db.collection('site_config').doc('main').set(cfg);
            $('#toast').fadeIn().delay(2000).fadeOut();
        });

        function switchAdminTab(t) {
            $('[id^=admin-tab]').hide();
            $(`#admin-tab-${t}`).show();
            // Highlight logic skipped for brevity
        }

        async function createInvite() {
            // ... (Same as previous logic but using modal inputs)
            const code = $('#new-code').val().toUpperCase();
            const names = $('#new-names').val();
            const side = $('input[name="new-side"]:checked').val();
            const guests = names.split(',').map(n => ({name:n.trim(), isAttending:null, meal:'Standard'}));
            
            await db.collection('invitations').add({
                inviteCode: code, guestNames: names, side, guests, status: 'pending'
            });
            $('#modal-add-guest').fadeOut();
        }
        
        async function delInv(id) { if(confirm('Delete?')) await db.collection('invitations').doc(id).delete(); }
        function logout() { localStorage.clear(); location.reload(); }

    </script>
</body>
</html>
