<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julian & Elena | Our Wedding</title>
    <meta name="description" content="You are cordially invited to celebrate the union of Julian and Elena.">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

    <!-- Cinematic Loader -->
    <div id="loader">
        <div class="loader-logo serif">J & E</div>
        <div class="loader-line"></div>
    </div>

    <div class="app-container" id="main-content">
        <!-- Hero Section -->
        <section class="hero" id="home">
            <div class="hero-content fade-up">
                <p class="serif italic" style="margin-bottom: 20px; font-size: 1.2rem;">Join us in celebrating</p>
                <h1 class="names">Julian <span class="serif">&</span> Elena</h1>
                <div class="date">Saturday, June 20, 2026</div>
                <p style="letter-spacing: 0.2rem; margin-bottom: 40px;">THE RAFFLES HOTEL, SINGAPORE</p>
                <button class="cta-button" onclick="scrollToRSVP()">RSVP Now</button>
            </div>
        </section>

        <!-- Gallery / Visual Section -->
        <section style="background: var(--secondary); height: 70vh;">
            <div style="text-align: center; max-width: 600px;">
                <h2 class="serif" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 30px;">Our Journey</h2>
                <p class="fade-up">"Love is not finding someone to live with; it's finding someone you can't live without."</p>
            </div>
        </section>

        <!-- RSVP Section -->
        <section class="rsvp-section" id="rsvp">
            <div class="rsvp-card fade-up">
                <h2 class="serif" style="text-align: center; font-size: 2.5rem; margin-bottom: 1rem;">RSVP</h2>
                <p style="text-align: center; margin-bottom: 3rem; color: var(--accent);">Please respond by May 15, 2026</p>
                
                <form id="rsvp-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="guest-name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label>Attendance</label>
                        <select id="attendance" required>
                            <option value="attending">Accepts with Pleasure</option>
                            <option value="declined">Declines with Regret</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Number of Guests</label>
                        <input type="number" id="guest-count" value="1" min="1" max="10">
                    </div>
                    <div class="form-group">
                        <label>Dietary Restrictions</label>
                        <textarea id="dietary" rows="3" placeholder="Any allergies or requirements?"></textarea>
                    </div>
                    <button type="submit" class="cta-button" style="width: 100%;">Confirm Attendance</button>
                </form>
            </div>
        </section>

        <!-- Admin Dashboard (Conditional) -->
        <div id="admin-view" class="admin-view" style="display: none;">
            <h2 class="serif" style="font-size: 3rem; color: var(--primary); border-bottom: 1px solid var(--primary); padding-bottom: 1rem;">Guest Management</h2>
            <div id="stats" style="margin-top: 2rem; display: flex; gap: 2rem;">
                <div class="guest-card">Total Guests: <span id="total-guests">0</span></div>
                <div class="guest-card">Attending: <span id="total-attending">0</span></div>
            </div>
            <div class="rsvp-list" id="rsvp-list">
                <!-- Records will be injected here -->
            </div>
        </div>

        <!-- Footer -->
        <footer style="text-align: center; padding: 4rem; background: #111; color: var(--primary);">
            <div class="serif" style="font-size: 1.5rem; letter-spacing: 0.5rem;">J & E</div>
        </footer>
    </div>

    <!-- Firebase App Logic -->
    <script type="module" src="js/app.js"></script>
    <script>
        function scrollToRSVP() {
            document.getElementById('rsvp').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
