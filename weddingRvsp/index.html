<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding RSVP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Great+Vibes&family=Lato:wght@300;400;700&family=Montserrat:wght@200;400;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { gold: { 300: '#F5D061', 400: '#D4AF37', 500: '#C5A028', 900: '#5C4010' }, rose: { 50: '#fff0f3', 100: '#ffe4e6', 900: '#881337' } },
                fontFamily: { classic: ['Cinzel', 'serif'], modern: ['Montserrat', 'sans-serif'], floral: ['Great Vibes', 'cursive'], body: ['Lato', 'sans-serif'] },
                animation: { 'fade-in': 'fadeIn 1s ease-out' },
                keyframes: { fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } } }
            }}
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .page-section { display: none; opacity: 0; transition: opacity 0.6s ease-in-out; }
        .page-section.active { display: block; opacity: 1; }
        
        /* Loading */
        #loading-screen { position: fixed; inset: 0; background: #fff; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .loader-ring { width: 48px; height: 48px; border: 3px solid #f3f3f3; border-top: 3px solid #D4AF37; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Background Slideshow */
        #bg-slideshow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; background: #1a1a1a; }
        .bg-slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2s ease-in-out, transform 8s linear; transform: scale(1.05); }
        .bg-slide.active { opacity: 0.5; transform: scale(1); }

        /* Card Internal Gallery */
        .card-gallery-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .card-gallery-img.active { opacity: 1; }

        /* Curtain Animation */
        #entrance-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #000; transition: all 1.5s ease-in-out; }
        .tap-hint { animation: pulse-text 2s infinite; }
        @keyframes pulse-text { 0%, 100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1); } }
        
        /* Curtain Themes */
        .theme-classic #entrance-overlay { background: transparent; pointer-events: none; }
        .curtain-panel { position: absolute; top: 0; bottom: 0; width: 50%; background: #111; transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1); z-index: 51; }
        .curtain-left { left: 0; border-right: 1px solid #333; } .curtain-right { right: 0; border-left: 1px solid #333; }
        .open .curtain-left { transform: translateX(-100%); } .open .curtain-right { transform: translateX(100%); }
        .theme-modern #entrance-overlay { background: #000; transform-origin: top; } .theme-modern.open #entrance-overlay { transform: scaleY(0); }
        .theme-floral #entrance-overlay { background: #fff; } .theme-floral.open #entrance-overlay { opacity: 0; visibility: hidden; }

        /* Music Fab */
        .music-playing { animation: ripple 1.5s infinite; }
        @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }

        /* Glassmorphism */
        .glass-light { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body class="text-gray-800 min-h-screen font-body bg-gray-900">

    <div id="loading-screen">
        <div class="loader-ring"></div>
        <div class="mt-4 text-[10px] font-bold tracking-[0.3em] text-gray-400 uppercase">Loading Invitation</div>
    </div>

    <audio id="bg-music" loop></audio>
    <button id="music-fab" onclick="toggleMusic()" class="fixed bottom-6 right-6 z-[90] bg-white text-gray-900 w-12 h-12 rounded-full shadow-2xl hidden flex items-center justify-center transition hover:scale-110 active:scale-90 border border-gray-100">
        <i id="music-icon" class="fas fa-play ml-1"></i>
    </button>

    <div id="bg-slideshow"></div>

    <div id="entrance-curtains-container"></div>
    <div id="entrance-content" class="fixed inset-0 z-[55] flex flex-col items-center justify-center pointer-events-none transition-opacity duration-1000">
        <div class="pointer-events-auto cursor-pointer flex flex-col items-center" onclick="enterSite()">
            <div class="w-20 h-20 rounded-full border border-white/20 flex items-center justify-center bg-white/5 backdrop-blur-sm animate-pulse mb-4">
                <i class="fas fa-fingerprint text-white/80 text-3xl"></i>
            </div>
            <h2 class="text-white font-classic text-xl tracking-[0.3em] mb-2 tap-hint">OPEN</h2>
        </div>
    </div>

    <div id="view-landing" class="page-section min-h-screen w-full flex items-center justify-center p-4 relative z-10">
        <div id="invite-card" class="w-full max-w-md transition-all duration-1000 transform translate-y-8 opacity-0"></div>
        <button onclick="openLogin()" class="fixed bottom-6 left-6 text-[9px] text-white/50 hover:text-white uppercase tracking-widest bg-black/20 px-3 py-1 rounded border border-white/5 backdrop-blur transition z-20">
            Guest / Admin Login
        </button>
    </div>

    <div id="view-login" class="hidden fixed inset-0 z-[80] bg-black/90 backdrop-blur-md flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm p-8 rounded-2xl shadow-2xl relative text-center">
            <button onclick="$('#view-login').fadeOut()" class="absolute top-4 right-4 text-gray-300 p-2"><i class="fas fa-times"></i></button>
            <h2 class="text-xl font-bold font-classic mb-6 text-gray-900">Enter Code</h2>
            <input type="text" id="input-invite-code" placeholder="XYZ-123" class="w-full p-4 bg-gray-50 border rounded-xl text-center font-bold text-lg uppercase tracking-widest mb-4 outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400">
            <button id="btn-enter-code" class="w-full bg-gray-900 text-white py-4 rounded-xl font-bold uppercase text-xs tracking-widest shadow-lg hover:bg-black">Unlock</button>
            <div id="login-error" class="hidden text-red-500 text-xs font-bold mt-4 bg-red-50 p-2 rounded"></div>
        </div>
    </div>

    <main id="view-rsvp" class="page-section max-w-2xl mx-auto w-full p-4 pt-10 pb-24 relative z-10">
        <div class="flex justify-between items-center mb-6 px-2 text-white drop-shadow-md">
            <button onclick="location.reload()" class="text-xs font-bold uppercase tracking-widest hover:text-gold-300"><i class="fas fa-arrow-left mr-1"></i> Home</button>
            <button onclick="logout()" class="text-xs font-bold uppercase tracking-widest hover:text-red-300">Logout</button>
        </div>

        <div class="glass-light rounded-2xl shadow-2xl overflow-hidden mb-6">
            <div class="bg-gray-900 text-white p-8 text-center relative overflow-hidden">
                <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                <h2 class="text-3xl font-classic relative z-10">RSVP</h2>
                <p class="text-xs uppercase tracking-widest text-gold-400 mt-2 relative z-10">Welcome, <span id="guest-group-name" class="text-white"></span></p>
            </div>
            <div class="p-6 md:p-8">
                <div id="rsvp-locked-msg" class="hidden bg-red-50 text-red-800 text-xs font-bold p-4 rounded-xl text-center mb-6">RSVP Closed</div>
                <form id="rsvp-form" class="space-y-6">
                    <div id="guest-list-container" class="space-y-4"></div>
                    <div><label class="block text-xs font-bold uppercase text-gray-400 mb-2">Message</label><textarea id="rsvp-note" rows="3" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:bg-white transition" placeholder="Dietary requirements or wishes..."></textarea></div>
                    <button type="submit" id="btn-submit-rsvp" class="w-full bg-gold-500 hover:bg-gold-600 text-white font-bold py-4 rounded-xl shadow-lg uppercase tracking-widest text-sm transition transform active:scale-[0.98]">Confirm RSVP</button>
                </form>
            </div>
        </div>

        <div class="glass-light rounded-2xl p-6 md:p-8 shadow-lg">
            <h3 class="font-classic text-center mb-6 text-gray-800 border-b pb-4">Contact Us</h3>
            <div id="contact-list-display" class="grid grid-cols-1 gap-3"></div>
        </div>
    </main>

    <main id="view-admin" class="page-section max-w-5xl mx-auto w-full p-4 relative z-10 bg-gray-50 min-h-screen text-gray-800">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="text-xl font-bold font-classic">Admin Panel</h2>
            <div class="flex gap-2 mt-4 md:mt-0">
                <button onclick="switchAdminTab('guests')" class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-xs font-bold uppercase">Guests</button>
                <button onclick="switchAdminTab('settings')" class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-xs font-bold uppercase">Settings</button>
                <button onclick="logout()" class="px-3 py-2 text-red-500 border rounded-lg hover:bg-red-50"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        <div id="admin-tab-guests">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl shadow-sm border text-center"><div class="text-[10px] uppercase text-gray-400 font-bold">Total</div><div id="stat-total" class="text-2xl font-black">0</div></div>
                <div class="bg-white p-4 rounded-xl shadow-sm border text-center"><div class="text-[10px] uppercase text-green-600 font-bold">Yes</div><div id="stat-attending" class="text-2xl font-black text-green-600">0</div></div>
                <div class="bg-white p-4 rounded-xl shadow-sm border text-center"><div class="text-[10px] uppercase text-blue-600 font-bold">Groom</div><div id="stat-groom" class="text-2xl font-black text-blue-600">0</div></div>
                <div class="bg-white p-4 rounded-xl shadow-sm border text-center"><div class="text-[10px] uppercase text-pink-600 font-bold">Bride</div><div id="stat-bride" class="text-2xl font-black text-pink-600">0</div></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <div class="p-4 border-b bg-gray-50 flex gap-2"><button onclick="$('#modal-add-guest').fadeIn()" class="bg-black text-white px-4 py-2 rounded-lg text-xs font-bold uppercase shadow hover:bg-gray-800">+ Add Invite</button></div>
                <div class="overflow-x-auto max-h-[600px]"><table class="w-full text-sm text-left"><tbody id="admin-table-body"></tbody></table></div>
            </div>
        </div>
        <div id="admin-tab-settings" class="hidden">
            <form id="settings-form" class="max-w-3xl mx-auto space-y-8 bg-white p-8 rounded-2xl shadow-sm border">
                <div class="space-y-4">
                    <h3 class="font-bold border-b pb-2 uppercase text-xs text-gray-400">Design</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-xs font-bold mb-1">Layout</label><select id="set-theme" class="w-full p-2 border rounded bg-gray-50"><option value="classic">🏛️ Classic</option><option value="modern">🔳 Modern</option><option value="floral">🌸 Floral</option></select></div>
                        <div><label class="block text-xs font-bold mb-1">Music (Local MP3)</label><select id="set-music" class="w-full p-2 border rounded bg-gray-50"><option value="">None</option><option value="music1.mp3">Track 1</option><option value="music2.mp3">Track 2</option><option value="music3.mp3">Track 3</option></select></div>
                    </div>
                </div>
                <div class="space-y-4">
                    <h3 class="font-bold border-b pb-2 uppercase text-xs text-gray-400">Imagery</h3>
                    <div><label class="block text-xs font-bold mb-2">1. Background Photos (Full Screen)</label><div id="bg-photo-list" class="space-y-2 mb-2"></div><button type="button" onclick="addPhotoInput('bg-photo-list')" class="text-xs text-blue-600 font-bold">+ Add Background URL</button></div>
                    <div><label class="block text-xs font-bold mb-2">2. Card Photos (Gallery Inside Card)</label><div id="card-photo-list" class="space-y-2 mb-2"></div><button type="button" onclick="addPhotoInput('card-photo-list')" class="text-xs text-blue-600 font-bold">+ Add Card Photo URL</button></div>
                </div>
                <div class="space-y-4">
                    <h3 class="font-bold border-b pb-2 uppercase text-xs text-gray-400">Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-xs font-bold mb-1">Names</label><input id="set-names" class="w-full p-2 border rounded"></div>
                        <div><label class="block text-xs font-bold mb-1">Deadline</label><input type="date" id="set-deadline" class="w-full p-2 border rounded"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg">
                        <div><label class="block text-xs font-bold mb-1 text-gray-500">Reception</label><input id="set-rec-loc" class="w-full p-2 border rounded text-sm mb-2"><input type="datetime-local" id="set-rec-time" class="w-full p-2 border rounded text-sm"></div>
                        <div><label class="block text-xs font-bold mb-1 text-gray-500">Matrimony</label><input id="set-mat-loc" class="w-full p-2 border rounded text-sm mb-2"><input type="datetime-local" id="set-mat-time" class="w-full p-2 border rounded text-sm"></div>
                    </div>
                    <div><label class="block text-xs font-bold mb-2">Contacts</label><div id="contact-list-inputs" class="space-y-2"></div><button type="button" onclick="addContactInput()" class="text-xs text-blue-600 font-bold">+ Add Contact</button></div>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700">Save Changes</button>
            </form>
        </div>
    </main>

    <div id="modal-add-guest" class="fixed inset-0 bg-black/50 hidden z-[90] flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm">
            <h3 class="font-bold mb-4">New Invitation</h3>
            <input id="new-code" placeholder="CODE (e.g. FAM01)" class="w-full p-2 border rounded mb-2 uppercase font-bold">
            <input id="new-names" placeholder="Names (e.g. John, Jane)" class="w-full p-2 border rounded mb-4">
            <div class="flex gap-2 mb-4"><label><input type="radio" name="new-side" value="groom" checked> Groom</label><label><input type="radio" name="new-side" value="bride"> Bride</label></div>
            <button onclick="createInvite()" class="w-full bg-black text-white py-2 rounded font-bold">Create</button>
            <button onclick="$('#modal-add-guest').fadeOut()" class="w-full mt-2 text-gray-500 text-sm">Cancel</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIG & SETUP ---
        const firebaseConfig = { apiKey: "AIzaSyAOEMrxylKIxZQgsY-aHMI87KmVIqMh9AQ", authDomain: "wedding-rvsp-e446c.firebaseapp.com", projectId: "wedding-rvsp-e446c", storageBucket: "wedding-rvsp-e446c.firebasestorage.app", messagingSenderId: "836260285764", appId: "1:836260285764:web:b1e8ca3ea64f7616e7db11" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Updated Config Structure
        let siteConfig = { theme: 'classic', names: '', deadline: '', musicTrack: '', bgPhotos: [], cardPhotos: [], contacts: [] };
        let currentInviteId = localStorage.getItem('rsvp_id');
        let isAdmin = localStorage.getItem('rsvp_admin') === 'true';
        let bgInterval, cardInterval, audio = document.getElementById('bg-music');

        $(document).ready(async () => {
            await loadConfig();
            $('#loading-screen').fadeOut();
            
            if(isAdmin) { 
                $('#entrance-curtains-container').hide(); $('#entrance-content').hide();
                $('#view-admin').addClass('active'); loadAdmin(); 
            } else {
                renderLanding(); 
            }
        });

        async function loadConfig() {
            try {
                const doc = await db.collection('site_config').doc('main').get();
                if(doc.exists) siteConfig = { ...siteConfig, ...doc.data() };
                if(siteConfig.musicTrack) audio.src = siteConfig.musicTrack;
            } catch(e) { console.error(e); }
        }

        // --- 2. RENDER LOGIC ---
        function renderLanding() {
            const c = siteConfig;
            const curtainCont = $('#entrance-curtains-container');
            $('body').removeClass().addClass(`theme-${c.theme}`);

            // 1. Curtain
            if(c.theme === 'classic') curtainCont.html('<div id="entrance-overlay"><div class="curtain-panel curtain-left"></div><div class="curtain-panel curtain-right"></div></div>');
            else if (c.theme === 'modern') curtainCont.html('<div id="entrance-overlay"></div>');
            else curtainCont.html('<div id="entrance-overlay" class="bg-white"></div>');

            // 2. Background Slideshow
            const bgCont = $('#bg-slideshow'); bgCont.empty();
            const bgs = (c.bgPhotos && c.bgPhotos.length) ? c.bgPhotos : ["https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=2000"];
            bgs.forEach((url, i) => bgCont.append(`<div class="bg-slide ${i===0?'active':''}" style="background-image: url('${url}')"></div>`));
            
            if(bgs.length > 1) {
                if(bgInterval) clearInterval(bgInterval);
                let cur = 0;
                bgInterval = setInterval(() => {
                    $('.bg-slide').removeClass('active'); cur = (cur + 1) % bgs.length; $('.bg-slide').eq(cur).addClass('active');
                }, 6000);
            }

            // 3. Card Content & Gallery
            const card = $('#invite-card');
            const dateStr = new Date(c.reception.time || Date.now()).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            
            // Build Gallery HTML
            let galleryHtml = '';
            if(c.cardPhotos && c.cardPhotos.length > 0) {
                let imgs = '';
                c.cardPhotos.forEach((url, i) => imgs += `<img src="${url}" class="card-gallery-img ${i===0?'active':''}">`);
                galleryHtml = `<div id="card-slideshow-inner" class="relative w-full h-full">${imgs}</div>`;
                
                // Start Card Slideshow
                if(c.cardPhotos.length > 1) {
                    if(cardInterval) clearInterval(cardInterval);
                    let cCur = 0;
                    cardInterval = setInterval(() => {
                        $('.card-gallery-img').removeClass('active'); cCur = (cCur + 1) % c.cardPhotos.length; $('.card-gallery-img').eq(cCur).addClass('active');
                    }, 4000);
                }
            } else {
                galleryHtml = `<div class="flex items-center justify-center h-full bg-gray-100 text-gray-300"><i class="fas fa-heart text-4xl"></i></div>`;
            }

            // Layouts
            let html = '';
            if(c.theme === 'classic') {
                html = `
                    <div class="bg-[#fdfbf7] border-[8px] border-double border-gold-300 p-8 text-center shadow-2xl relative">
                        <div class="w-full h-64 border-4 border-gold-300 mb-6 shadow-inner relative overflow-hidden bg-gray-100">${galleryHtml}</div>
                        <p class="uppercase tracking-[0.3em] text-xs text-gray-500 mb-4 font-bold">The Wedding Of</p>
                        <h1 class="font-classic text-4xl md:text-5xl text-gray-800 mb-4">${c.names || 'Jane & John'}</h1>
                        <div class="h-px w-16 bg-gold-400 mx-auto mb-4"></div>
                        <p class="font-classic text-lg font-bold text-gray-700">${dateStr}</p>
                    </div>`;
            } else if (c.theme === 'modern') {
                html = `
                    <div class="bg-white shadow-2xl overflow-hidden">
                        <div class="w-full h-80 relative bg-gray-200 grayscale contrast-125">${galleryHtml}</div>
                        <div class="p-8 text-center">
                            <h1 class="font-modern font-black text-5xl tracking-tighter uppercase leading-none mb-2">${(c.names||'J&J').replace('&','<span class="text-gray-300">&</span>')}</h1>
                            <p class="font-bold text-lg bg-black text-white inline-block px-4 py-1 mt-2 transform -rotate-1">${dateStr}</p>
                        </div>
                    </div>`;
            } else {
                html = `
                    <div class="glass-light p-8 text-center rounded-[3rem] shadow-xl border border-white relative overflow-hidden">
                        <div class="w-48 h-48 mx-auto rounded-full border-4 border-white shadow-lg mb-6 relative overflow-hidden bg-rose-50">${galleryHtml}</div>
                        <h1 class="font-floral text-6xl text-rose-900 mb-2">${c.names || 'Jane & John'}</h1>
                        <p class="font-classic text-xl text-gray-700 border-t border-b border-rose-200 py-2 inline-block px-8">${dateStr}</p>
                    </div>`;
            }
            card.html(html);
        }

        // --- 3. INTERACTIONS ---
        function enterSite() {
            $('body').addClass('open');
            $('#entrance-content').css('opacity', '0');
            setTimeout(() => { $('#entrance-content').hide(); }, 1000);
            
            if(audio.src) {
                $('#music-fab').removeClass('hidden').addClass('flex');
                audio.play().then(() => $('#music-fab').addClass('music-playing')).catch(() => {});
            }

            setTimeout(() => {
                $('#view-landing').addClass('active');
                $('#invite-card').removeClass('translate-y-8 opacity-0');
            }, 800);
        }

        function toggleMusic() {
            if(audio.paused) { audio.play(); $('#music-fab').addClass('music-playing').find('i').removeClass('fa-play').addClass('fa-pause'); }
            else { audio.pause(); $('#music-fab').removeClass('music-playing').find('i').removeClass('fa-pause').addClass('fa-play'); }
        }

        // --- 4. LOGIN & RSVP ---
        function openLogin() { $('#view-login').fadeIn(); }
        
        $('#btn-enter-code').click(async () => {
            const code = $('#input-invite-code').val().trim().toUpperCase();
            if(code === 'ADMIN') { localStorage.setItem('rsvp_admin', 'true'); location.reload(); return; }
            const btn = $('#btn-enter-code'); btn.text('Checking...');
            
            try {
                const snap = await db.collection('invitations').where('inviteCode', '==', code).limit(1).get();
                if(snap.empty) { $('#login-error').text('Invalid Code').removeClass('hidden'); btn.text('Unlock'); return; }
                const doc = snap.docs[0]; const data = doc.data();
                
                if(data.isAdmin) { localStorage.setItem('rsvp_admin', 'true'); location.reload(); }
                else { localStorage.setItem('rsvp_id', doc.id); currentInviteId = doc.id; loadRSVP(data); }
            } catch(e) { console.error(e); }
        });

        function loadRSVP(data) {
            $('#view-login').fadeOut(); $('#view-landing').hide(); $('#view-rsvp').addClass('active');
            $('#guest-group-name').text(data.guestNames); $('#rsvp-note').val(data.note || '');
            if(new Date() > new Date(siteConfig.deadline)) { $('#rsvp-locked-msg').removeClass('hidden'); $('#btn-submit-rsvp').hide(); $('#rsvp-form :input').prop('disabled', true); }
            
            const cont = $('#guest-list-container'); cont.empty();
            data.guests.forEach((g, i) => {
                cont.append(`<div class="guest-card bg-white p-5 rounded-xl border border-gray-100 shadow-sm" data-idx="${i}"><div class="flex justify-between items-center mb-3"><span class="font-bold text-gray-800 text-lg">${g.name}</span><div class="flex gap-2"><label class="cursor-pointer px-3 py-2 bg-gray-50 border rounded-lg hover:bg-green-50 ${g.isAttending===true?'bg-green-100 border-green-500 text-green-700':''}"><input type="radio" name="g${i}" value="y" class="hidden" ${g.isAttending===true?'checked':''}>Accept</label><label class="cursor-pointer px-3 py-2 bg-gray-50 border rounded-lg hover:bg-red-50 ${g.isAttending===false?'bg-red-100 border-red-500 text-red-700':''}"><input type="radio" name="g${i}" value="n" class="hidden" ${g.isAttending===false?'checked':''}>Decline</label></div></div><div class="meal-sel ${g.isAttending===true?'block':'hidden'}"><select class="w-full p-2 border rounded-lg bg-gray-50 text-sm"><option value="Standard" ${g.meal=='Standard'?'selected':''}>Standard Meal</option><option value="Veg" ${g.meal=='Veg'?'selected':''}>Vegetarian</option><option value="Kids" ${g.meal=='Kids'?'selected':''}>Kids Meal</option></select></div></div>`);
            });
            $('input[type=radio]').change(function() { const card=$(this).closest('.guest-card'); if($(this).val()==='y') card.find('.meal-sel').slideDown(); else card.find('.meal-sel').slideUp(); });

            const cc = $('#contact-list-display'); cc.empty();
            siteConfig.contacts.forEach(c => cc.append(`<div class="flex items-center gap-4 p-3 border-b border-gray-200 last:border-0"><div class="w-8 h-8 rounded-full bg-gold-400 text-white flex items-center justify-center font-bold">${c.name[0]}</div><div><div class="font-bold text-sm">${c.name}</div><div class="text-[10px] text-gray-500 uppercase">${c.role}</div><a href="tel:${c.phone}" class="text-xs text-blue-600">${c.phone}</a></div></div>`));
        }

        $('#rsvp-form').submit(async (e) => {
            e.preventDefault(); const btn = $('#btn-submit-rsvp'); btn.text('Saving...').prop('disabled', true);
            const guests = [];
            $('.guest-card').each(function() { const i=$(this).data('idx'); const val=$(this).find(`input[name="g${i}"]:checked`).val(); guests.push({ name:$(this).find('span').text(), isAttending: val==='y'?true:(val==='n'?false:null), meal:$(this).find('select').val() }); });
            let status = 'pending'; if(guests.every(g=>g.isAttending===true)) status='accepted'; else if(guests.every(g=>g.isAttending===false)) status='declined'; else if(guests.some(g=>g.isAttending!==null)) status='responded';
            await db.collection('invitations').doc(currentInviteId).update({ guests, note: $('#rsvp-note').val(), status });
            btn.text('Saved').prop('disabled', false); alert("RSVP Updated!");
        });

        // --- 5. ADMIN ---
        function switchAdminTab(t) { $('[id^=admin-tab]').hide(); $(`#admin-tab-${t}`).fadeIn(); }
        function logout() { localStorage.clear(); location.reload(); }
        
        function loadAdmin() {
            const c = siteConfig;
            $('#set-theme').val(c.theme); $('#set-music').val(c.musicTrack); $('#set-names').val(c.names); $('#set-deadline').val(c.deadline);
            $('#set-rec-loc').val(c.reception?.loc); $('#set-rec-time').val(c.reception?.time); $('#set-mat-loc').val(c.matrimony?.loc); $('#set-mat-time').val(c.matrimony?.time);
            
            $('#bg-photo-list').empty(); (c.bgPhotos||[]).forEach(u => addPhotoInput('bg-photo-list', u));
            $('#card-photo-list').empty(); (c.cardPhotos||[]).forEach(u => addPhotoInput('card-photo-list', u));
            $('#contact-list-inputs').empty(); (c.contacts||[]).forEach(ct => addContactInput(ct.name, ct.role, ct.phone));

            db.collection('invitations').orderBy('status').onSnapshot(snap => {
                const tb = $('#admin-table-body'); tb.empty(); let s = { total:0, yes:0, gr:0, br:0 };
                snap.forEach(doc => {
                    const d = doc.data(); if(d.isAdmin) return;
                    s.total += d.guests.length; const yes = d.guests.filter(g=>g.isAttending).length; s.yes+=yes; if(d.side==='groom')s.gr+=yes; else s.br+=yes;
                    let badge = d.status==='accepted'?'bg-green-100 text-green-800':(d.status==='declined'?'bg-red-100 text-red-800':'bg-gray-100 text-gray-600');
                    tb.append(`<tr class="border-b hover:bg-gray-50"><td class="p-3 font-mono font-bold">${d.inviteCode}</td><td class="p-3"><div class="font-bold">${d.guestNames}</div><div class="text-xs text-gray-500">${d.guests.length} pax • ${d.side.toUpperCase()}</div></td><td class="p-3"><span class="px-2 py-1 rounded text-[10px] uppercase font-bold ${badge}">${d.status||'pending'}</span></td><td class="p-3 text-right"><button onclick="delInv('${doc.id}')" class="text-gray-400 hover:text-red-600"><i class="fas fa-trash"></i></button></td></tr>`);
                });
                $('#stat-total').text(s.total); $('#stat-attending').text(s.yes); $('#stat-groom').text(s.gr); $('#stat-bride').text(s.br);
            });
        }

        window.addPhotoInput = (containerId, val='') => { $(`#${containerId}`).append(`<div class="flex gap-2"><input value="${val}" class="w-full p-2 border rounded text-sm photo-input" placeholder="Image URL"><button type="button" onclick="$(this).parent().remove()" class="text-red-500 font-bold px-2">×</button></div>`); };
        window.addContactInput = (n='', r='', p='') => { $('#contact-list-inputs').append(`<div class="flex gap-2 contact-row mb-2"><input class="w-1/3 p-2 border rounded text-sm c-name" placeholder="Name" value="${n}"><input class="w-1/3 p-2 border rounded text-sm c-role" placeholder="Role" value="${r}"><input class="w-1/3 p-2 border rounded text-sm c-phone" placeholder="Phone" value="${p}"><button type="button" onclick="$(this).parent().remove()" class="text-red-500 font-bold px-2">×</button></div>`); };

        $('#settings-form').submit(async (e) => {
            e.preventDefault(); const btn = $(this).find('button[type="submit"]'); btn.text('Saving...').prop('disabled', true);
            const bgPhotos=[]; $('#bg-photo-list .photo-input').each(function(){ if($(this).val()) bgPhotos.push($(this).val()); });
            const cardPhotos=[]; $('#card-photo-list .photo-input').each(function(){ if($(this).val()) cardPhotos.push($(this).val()); });
            const contacts=[]; $('.contact-row').each(function(){ const n=$(this).find('.c-name').val(); if(n) contacts.push({ name:n, role:$(this).find('.c-role').val(), phone:$(this).find('.c-phone').val() }); });
            
            await db.collection('site_config').doc('main').set({
                theme: $('#set-theme').val(), musicTrack: $('#set-music').val(), names: $('#set-names').val(), deadline: $('#set-deadline').val(),
                reception: { loc: $('#set-rec-loc').val(), time: $('#set-rec-time').val() }, matrimony: { loc: $('#set-mat-loc').val(), time: $('#set-mat-time').val() },
                bgPhotos, cardPhotos, contacts
            });
            btn.text('Save Changes').prop('disabled', false); alert('Saved! Refreshing...'); location.reload();
        });

        async function createInvite() {
            const code = $('#new-code').val().toUpperCase(); const names = $('#new-names').val();
            if(!code || !names) return alert("Fill all fields");
            const guests = names.split(',').map(n => ({ name: n.trim(), isAttending: null, meal: 'Standard' }));
            await db.collection('invitations').add({ inviteCode: code, guestNames: names, side: $('input[name="new-side"]:checked').val(), guests, status: 'pending' });
            $('#modal-add-guest').fadeOut(); $('#new-code').val(''); $('#new-names').val('');
        }
        async function delInv(id) { if(confirm("Delete?")) await db.collection('invitations').doc(id).delete(); }

    </script>
</body>
</html>
