<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowState Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --bg-light: #f4f5f7;
            --border-color: #dfe1e6;
        }
        body { background-color: #ffffff; color: #172b4d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; }
        .hidden { display: none !important; }
        
        /* Navbar */
        .navbar { border-bottom: 1px solid var(--border-color); background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        
        /* Project Cards */
        .project-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
            background: #fff;
        }
        .project-card:hover { border-color: #0d6efd; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .project-date { font-size: 0.8rem; color: #6c757d; }

        /* Kanban Columns */
        .kanban-col {
            background: var(--bg-light);
            border-radius: 6px;
            padding: 10px;
            min-height: 75vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Task Cards */
        .task-card {
            background: #fff;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            transition: transform 0.1s;
            position: relative;
            cursor: grab;
            border: 1px solid transparent;
        }
        .task-card:hover { background-color: #ebecf0; }
        .task-card:active { cursor: grabbing; transform: rotate(1deg); }
        
        /* Drag Ghost */
        .sortable-ghost { opacity: 0.4; background: #cce5ff; border: 1px dashed #007bff; }
        .sortable-drag { opacity: 1; transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        /* Avatars */
        .avatar-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #0d6efd;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            border: 2px solid #fff;
        }

        /* Tags */
        .task-tag {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            margin-right: 4px;
            text-transform: uppercase;
        }
        .tag-bug { background-color: #ffebe6; color: #de350b; }
        .tag-feature { background-color: #e6fcff; color: #008da6; }
        .tag-urgent { background-color: #fff0b3; color: #172b4d; }
        
        /* Delete Task Icon */
        .btn-delete-task {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #6c757d;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .task-card:hover .btn-delete-task { opacity: 1; }
        .btn-delete-task:hover { color: #dc3545; }

        /* Chat Layout */
        #modal-comments-area {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .comment-bubble {
            background: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .comment-meta { font-size: 0.75rem; color: #adb5bd; margin-bottom: 2px; }

        /* Date Badges */
        .badge-date { font-size: 0.7rem; font-weight: normal; border-radius: 3px; padding: 2px 6px;}
        .bg-urgent { background-color: #ffc107; color: #000; }
        .bg-overdue { background-color: #dc3545; color: #fff; }
        .bg-normal { color: #6c757d; }
    </style>
</head>
<body>

    <div id="auth-section" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h2 class="text-center mb-4 fw-light">FlowState <span class="fw-bold">Pro</span></h2>
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <input type="email" id="email" class="form-control mb-3" placeholder="name@example.com">
                        <input type="password" id="password" class="form-control mb-3" placeholder="Password">
                        <div class="d-grid gap-2">
                            <button id="btn-login" class="btn btn-primary">Log In</button>
                            <button id="btn-signup" class="btn btn-outline-secondary">Create Account</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="app-section" class="hidden">
        
        <nav class="navbar navbar-expand-lg px-3 sticky-top">
            <a class="navbar-brand fw-bold" href="#" onclick="showDashboard()">
                <i class="fas fa-layer-group text-primary me-2"></i>FlowState
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span id="user-display" class="small text-muted me-3 d-none d-md-block"></span>
                <button id="btn-logout" class="btn btn-sm btn-outline-secondary me-2">Log Out</button>
                <button id="btn-delete-account" class="btn btn-sm btn-danger" title="Delete Account">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </nav>

        <div id="view-dashboard" class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-light">Your Projects</h4>
                <button class="btn btn-dark btn-sm" data-bs-toggle="modal" data-bs-target="#newProjectModal">
                    <i class="fas fa-plus"></i> New Project
                </button>
            </div>
            <div id="project-list" class="row g-3"></div>
        </div>

        <div id="view-project" class="container-fluid mt-3 hidden">
            <div class="mb-3 border-bottom pb-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div>
                        <button class="btn btn-sm btn-link text-decoration-none text-dark ps-0" onclick="showDashboard()">← Back</button>
                        <span class="mx-2 text-muted">/</span>
                        <strong id="current-project-title" class="fs-5">Loading...</strong>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-outline-danger me-2 hidden" id="btn-delete-project">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-secondary me-2" id="btn-manage-members">
                            <i class="fas fa-users"></i> Team
                        </button>
                        <button class="btn btn-sm btn-dark" id="btn-add-task-modal">
                            + Task
                        </button>
                    </div>
                </div>
                
                <div class="row align-items-center g-2">
                    <div class="col-auto"><span class="small text-muted fw-bold">Progress</span></div>
                    <div class="col">
                        <div class="progress" style="height: 8px;">
                            <div id="project-progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="col-auto"><span id="project-progress-text" class="small text-muted">0%</span></div>
                </div>
            </div>

            <div class="row g-3 overflow-auto flex-nowrap flex-md-wrap pb-5">
                <div class="col-10 col-md-4">
                    <div class="kanban-col">
                        <h6 class="text-secondary small fw-bold text-uppercase mb-3 px-1">To Do <span id="count-todo" class="badge bg-white text-dark border ms-1">0</span></h6>
                        <div id="col-todo" class="d-grid gap-2" data-status="todo"></div>
                    </div>
                </div>
                <div class="col-10 col-md-4">
                    <div class="kanban-col">
                        <h6 class="text-primary small fw-bold text-uppercase mb-3 px-1">In Progress <span id="count-doing" class="badge bg-white text-dark border ms-1">0</span></h6>
                        <div id="col-doing" class="d-grid gap-2" data-status="doing"></div>
                    </div>
                </div>
                <div class="col-10 col-md-4">
                    <div class="kanban-col">
                        <h6 class="text-success small fw-bold text-uppercase mb-3 px-1">Done <span id="count-done" class="badge bg-white text-dark border ms-1">0</span></h6>
                        <div id="col-done" class="d-grid gap-2" data-status="done"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="newProjectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-0"><h5 class="modal-title">Create Project</h5></div>
                <div class="modal-body">
                    <label class="small text-muted">Project Name</label>
                    <input type="text" id="inp-project-title" class="form-control mb-3" placeholder="e.g. Website Redesign">
                    <label class="small text-muted">Deadline</label>
                    <input type="date" id="inp-project-deadline" class="form-control mb-3">
                    <label class="small text-muted">Type</label>
                    <select id="inp-project-type" class="form-select">
                        <option value="individual">Individual</option>
                        <option value="group">Group Project</option>
                    </select>
                </div>
                <div class="modal-footer border-0">
                    <button class="btn btn-dark w-100" id="btn-create-project">Create Project</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="membersModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-0"><h5 class="modal-title">Team Members</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <ul id="member-list" class="list-group list-group-flush mb-3"></ul>
                    <div class="border-top pt-3">
                        <label class="small text-muted mb-1">Add Existing User</label>
                        <div class="input-group">
                            <input type="email" id="inp-member-email" class="form-control" list="dl-users" placeholder="Search user email...">
                            <datalist id="dl-users"></datalist>
                            <select class="form-select" id="inp-member-role" style="max-width: 100px;">
                                <option value="editor">Editor</option>
                                <option value="viewer">Viewer</option>
                            </select>
                            <button class="btn btn-outline-dark" id="btn-invite-member">Add</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-0"><h5 class="modal-title">New Task</h5></div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="small text-muted">Task Description</label>
                        <input type="text" id="inp-task-title" class="form-control" placeholder="What needs to be done?">
                    </div>
                    
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="small text-muted">Due Date</label>
                            <input type="date" id="inp-task-date" class="form-control">
                        </div>
                        <div class="col-6">
                            <label class="small text-muted">Tag</label>
                            <select id="inp-task-tag" class="form-select">
                                <option value="">None</option>
                                <option value="bug">Bug 🐞</option>
                                <option value="feature">Feature ✨</option>
                                <option value="urgent">Urgent 🔥</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="small text-muted">Assign To</label>
                        <select id="inp-task-assign" class="form-select">
                            </select>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button class="btn btn-dark w-100" id="btn-save-task">Create Task</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="taskDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <span id="detail-task-tag"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <h4 id="detail-task-title" class="mb-3 fw-bold"></h4>
                    
                    <div class="d-flex align-items-center gap-3 mb-4 p-2 bg-light rounded">
                        <div class="text-muted small"><i class="far fa-calendar me-1"></i> <span id="detail-task-date"></span></div>
                        
                        <div class="d-flex align-items-center">
                            <i class="far fa-user me-2 text-muted small"></i> 
                            <select id="detail-task-assign-select" class="form-select form-select-sm border-0 bg-transparent fw-bold" style="width: auto; cursor: pointer;">
                                </select>
                        </div>
                    </div>

                    <hr>
                    <h6 class="fw-bold mb-3"><i class="far fa-comments"></i> Discussion</h6>
                    
                    <div id="modal-comments-area">
                        </div>

                    <div class="input-group">
                        <input type="text" id="inp-new-comment" class="form-control" placeholder="Write a comment...">
                        <button class="btn btn-primary" id="btn-post-comment">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, updateDoc, getDocs, getDoc, setDoc, deleteDoc, writeBatch, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAdAoFYS_j2r58mZZeadwEz9h91zKj78zU",
            authDomain: "life-rpg-e7808.firebaseapp.com",
            projectId: "life-rpg-e7808",
            storageBucket: "life-rpg-e7808.firebasestorage.app",
            messagingSenderId: "1003021084182",
            appId: "1:1003021084182:web:0b84ad6782f8dc3034b737"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentProjectId = null;
        let currentRole = null;
        let projectMembersCache = {}; 
        let currentDetailTaskId = null; 

        // --- AUTH ---
        $('#btn-login').click(async () => {
            try { await signInWithEmailAndPassword(auth, $('#email').val(), $('#password').val()); }
            catch (e) { alert(e.message); }
        });

        $('#btn-signup').click(async () => {
            const email = $('#email').val();
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, $('#password').val());
                await setDoc(doc(db, "users", cred.user.uid), { email: email });
            } catch (e) { alert(e.message); }
        });

        $('#btn-logout').click(() => signOut(auth));

        $('#btn-delete-account').click(async () => {
            if(!confirm("Are you sure? This deletes all your data.")) return;
            try {
                await deleteDoc(doc(db, "users", currentUser.uid));
                await deleteUser(currentUser);
            } catch (e) { alert("Please re-login to delete account."); }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                $('#auth-section').addClass('hidden');
                $('#app-section').removeClass('hidden');
                $('#user-display').text(user.email);
                loadDashboard();
            } else {
                currentUser = null;
                $('#auth-section').removeClass('hidden');
                $('#app-section').addClass('hidden');
            }
        });

        // --- DASHBOARD ---
        window.showDashboard = function() {
            $('#view-project').addClass('hidden');
            $('#view-dashboard').removeClass('hidden');
            currentProjectId = null;
        }

        function loadDashboard() {
            const q = query(collection(db, "projects"), where("memberIds", "array-contains", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                const list = $('#project-list');
                list.empty();
                snapshot.forEach(docSnap => {
                    const p = docSnap.data();
                    const d = p.deadline ? new Date(p.deadline).toLocaleDateString() : '';
                    
                    const html = `
                        <div class="col-md-4 col-lg-3">
                            <div class="project-card p-3 h-100 d-flex flex-column" onclick="openProject('${docSnap.id}')">
                                <div class="d-flex justify-content-between mb-2">
                                    <h6 class="mb-0 fw-bold text-truncate">${p.title}</h6>
                                    ${p.type === 'group' ? '<i class="fas fa-users text-muted"></i>' : '<i class="fas fa-user text-muted"></i>'}
                                </div>
                                <span class="badge bg-secondary badge-role text-uppercase align-self-start" style="font-size:0.6rem;">${p.roles[currentUser.uid]}</span>
                                ${d ? `<div class="project-date mt-auto"><i class="far fa-clock"></i> Due: ${d}</div>` : ''}
                            </div>
                        </div>`;
                    list.append(html);
                });
            });
        }

        $('#btn-create-project').click(async () => {
            const title = $('#inp-project-title').val();
            if(!title) return;
            await addDoc(collection(db, "projects"), {
                title: title,
                type: $('#inp-project-type').val(),
                deadline: $('#inp-project-deadline').val(),
                createdAt: Date.now(),
                memberIds: [currentUser.uid],
                roles: { [currentUser.uid]: "owner" }
            });
            $('#newProjectModal').modal('hide');
        });

        // --- PROJECT VIEW ---
        window.openProject = async function(projectId) {
            currentProjectId = projectId;
            
            // Fetch Project Metadata
            onSnapshot(doc(db, "projects", projectId), (docSnap) => {
                if(!docSnap.exists()) { showDashboard(); return; }
                const p = docSnap.data();
                $('#current-project-title').text(p.title);
                
                currentRole = p.roles[currentUser.uid];
                
                if(currentRole === 'owner') $('#btn-delete-project').removeClass('hidden');
                else $('#btn-delete-project').addClass('hidden');

                cacheMembers(p.memberIds);
            });

            initSortable();
            loadTasks(projectId);

            $('#view-dashboard').addClass('hidden');
            $('#view-project').removeClass('hidden');
        }

        async function cacheMembers(memberIds) {
            projectMembersCache = {};
            // Populate "New Task" dropdown
            const dropdown = $('#inp-task-assign');
            dropdown.empty().append('<option value="">Unassigned</option>');

            for(const uid of memberIds) {
                const s = await getDoc(doc(db, "users", uid));
                if(s.exists()) {
                    const email = s.data().email;
                    projectMembersCache[uid] = email;
                    dropdown.append(`<option value="${uid}">${email}</option>`);
                }
            }
        }

        function initSortable() {
            const columns = ['col-todo', 'col-doing', 'col-done'];
            columns.forEach(colId => {
                new Sortable(document.getElementById(colId), {
                    group: 'kanban', 
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    delay: 100, 
                    delayOnTouchOnly: true,
                    onEnd: async function (evt) {
                        const itemEl = evt.item;
                        const newStatus = evt.to.getAttribute('data-status');
                        const taskId = itemEl.getAttribute('data-id');
                        
                        if(taskId && newStatus) {
                            await updateDoc(doc(db, "tasks", taskId), { status: newStatus });
                        }
                    }
                });
            });
        }

        // --- TASK LOGIC ---
        function loadTasks(projectId) {
            const q = query(collection(db, "tasks"), where("projectId", "==", projectId));
            
            onSnapshot(q, (snapshot) => {
                $('#col-todo, #col-doing, #col-done').empty();
                let counts = { todo: 0, doing: 0, done: 0 };
                
                snapshot.forEach(docSnap => {
                    const t = docSnap.data();
                    counts[t.status]++;
                    renderTask(docSnap.id, t);
                });

                $('#count-todo').text(counts.todo);
                $('#count-doing').text(counts.doing);
                $('#count-done').text(counts.done);

                const total = counts.todo + counts.doing + counts.done;
                const percent = total === 0 ? 0 : Math.round((counts.done / total) * 100);
                $('#project-progress-bar').css('width', percent + '%');
                $('#project-progress-text').text(percent + '%');
            });
        }

        function renderTask(id, task) {
            let tagHtml = '';
            if(task.tag) {
                const tagClasses = { 'bug': 'tag-bug', 'feature': 'tag-feature', 'urgent': 'tag-urgent' };
                tagHtml = `<span class="task-tag ${tagClasses[task.tag] || ''}">${task.tag}</span>`;
            }

            let avatarHtml = '';
            if(task.assignedTo && projectMembersCache[task.assignedTo]) {
                const initial = projectMembersCache[task.assignedTo].charAt(0).toUpperCase();
                avatarHtml = `<div class="avatar-circle" title="${projectMembersCache[task.assignedTo]}">${initial}</div>`;
            }

            let dateBadge = '';
            if(task.dueDate) {
                const due = new Date(task.dueDate);
                const today = new Date(); today.setHours(0,0,0,0);
                const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
                let colorClass = 'bg-normal';
                if(diffDays < 0 && task.status !== 'done') colorClass = 'bg-overdue';
                else if(diffDays <= 3 && task.status !== 'done') colorClass = 'bg-urgent';
                
                dateBadge = `<span class="badge badge-date ${colorClass}"><i class="far fa-clock"></i> ${diffDays < 0 ? 'Late' : (diffDays===0 ? 'Today' : diffDays+'d')}</span>`;
            }

            let deleteBtn = currentRole === 'owner' ? `<i class="fas fa-trash-alt btn-delete-task" onclick="event.stopPropagation(); window.deleteTask('${id}')"></i>` : '';

            const html = `
                <div class="task-card" data-id="${id}" onclick="openTaskDetails('${id}')">
                    ${deleteBtn}
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        ${tagHtml}
                    </div>
                    <div class="mb-2 fw-medium" style="font-size: 0.95rem;">${task.title}</div>
                    <div class="d-flex justify-content-between align-items-end mt-2">
                        ${dateBadge}
                        ${avatarHtml}
                    </div>
                </div>
            `;
            $(`#col-${task.status}`).append(html);
        }

        // --- TASK DETAILS & REASSIGN & COMMENTS ---
        window.openTaskDetails = async function(taskId) {
            currentDetailTaskId = taskId;
            const snap = await getDoc(doc(db, "tasks", taskId));
            if(!snap.exists()) return;
            const t = snap.data();

            $('#detail-task-title').text(t.title);
            $('#detail-task-date').text(t.dueDate || 'No Due Date');
            
            // 1. POPULATE REASSIGN DROPDOWN
            const assignSelect = $('#detail-task-assign-select');
            assignSelect.empty().append('<option value="">Unassigned</option>');
            
            // Fill with project members
            Object.keys(projectMembersCache).forEach(uid => {
                const email = projectMembersCache[uid];
                const selected = t.assignedTo === uid ? 'selected' : '';
                assignSelect.append(`<option value="${uid}" ${selected}>${email}</option>`);
            });

            // 2. REASSIGN EVENT LISTENER
            // Remove old listeners to prevent stacking, then add new one
            assignSelect.off('change').on('change', async function() {
                const newUid = $(this).val();
                await updateDoc(doc(db, "tasks", taskId), { assignedTo: newUid });
                // Note: The UI updates automatically via onSnapshot
            });

            if(t.tag) $('#detail-task-tag').html(`<span class="badge bg-secondary text-uppercase">${t.tag}</span>`);
            else $('#detail-task-tag').empty();

            loadComments(taskId);
            $('#taskDetailModal').modal('show');
        }

        function loadComments(taskId) {
            const q = query(collection(db, "comments"), where("taskId", "==", taskId), orderBy("createdAt", "asc"));
            
            onSnapshot(q, (snapshot) => {
                const area = $('#modal-comments-area');
                area.empty();
                if(snapshot.empty) {
                    area.append('<div class="text-center text-muted py-3 small">No comments yet.</div>');
                    return;
                }

                snapshot.forEach(docSnap => {
                    const c = docSnap.data();
                    const isMe = c.userId === currentUser.uid;
                    const dateStr = c.createdAt ? new Date(c.createdAt.toDate()).toLocaleString() : 'Just now';
                    
                    area.append(`
                        <div class="d-flex flex-column ${isMe ? 'align-items-end' : 'align-items-start'}">
                            <div class="comment-meta">${c.userEmail} • ${dateStr}</div>
                            <div class="comment-bubble ${isMe ? 'bg-primary text-white border-primary' : ''}">${c.text}</div>
                        </div>
                    `);
                });
                area.scrollTop(area[0].scrollHeight);
            }, (error) => {
                // This catches the permission error visually if rules aren't updated
                console.error("Comments error:", error);
            });
        }

        $('#btn-post-comment').click(async () => {
            const txt = $('#inp-new-comment').val().trim();
            if(!txt || !currentDetailTaskId) return;

            try {
                await addDoc(collection(db, "comments"), {
                    taskId: currentDetailTaskId,
                    text: txt,
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    createdAt: serverTimestamp()
                });
                $('#inp-new-comment').val('');
            } catch (e) {
                alert("Error: " + e.message + "\n\nDid you update the Firestore Rules?");
            }
        });

        // --- CRUD OPERATIONS ---
        $('#btn-add-task-modal').click(() => {
            $('#inp-task-date').val('');
            $('#inp-task-title').val('');
            $('#addTaskModal').modal('show');
        });

        $('#btn-save-task').click(async () => {
            const title = $('#inp-task-title').val();
            if(!title) return;

            await addDoc(collection(db, "tasks"), {
                projectId: currentProjectId,
                title: title,
                dueDate: $('#inp-task-date').val(),
                tag: $('#inp-task-tag').val(),
                assignedTo: $('#inp-task-assign').val(), 
                status: 'todo',
                createdBy: currentUser.uid,
                createdAt: Date.now()
            });
            $('#addTaskModal').modal('hide');
        });

        window.deleteTask = async function(id) {
            if(!confirm("Delete this task?")) return;
            await deleteDoc(doc(db, "tasks", id));
        };

        $('#btn-delete-project').click(async () => {
            if(!confirm("DELETE PROJECT? This will delete all tasks and comments.")) return;
            
            const q = query(collection(db, "tasks"), where("projectId", "==", currentProjectId));
            const snap = await getDocs(q);
            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();

            await deleteDoc(doc(db, "projects", currentProjectId));
            showDashboard();
        });

        // --- MEMBERS ---
        $('#btn-manage-members').click(async () => {
            $('#membersModal').modal('show');
            const snap = await getDoc(doc(db, "projects", currentProjectId)); 
            const data = snap.data();
            
            const list = $('#member-list');
            list.empty();

            for(const uid of data.memberIds) {
                const uSnap = await getDoc(doc(db, "users", uid));
                const email = uSnap.exists() ? uSnap.data().email : "Unknown";
                list.append(`<li class="list-group-item d-flex justify-content-between"><span>${email}</span> <span class="badge bg-light text-dark border">${data.roles[uid]}</span></li>`);
            }
            
            const allUsers = await getDocs(collection(db, "users"));
            $('#dl-users').empty();
            allUsers.forEach(u => {
                if(!data.memberIds.includes(u.id)) $('#dl-users').append(`<option value="${u.data().email}">`);
            });
        });

        $('#btn-invite-member').click(async () => {
            const email = $('#inp-member-email').val();
            const role = $('#inp-member-role').val();
            const uQ = query(collection(db, "users"), where("email", "==", email));
            const uSnap = await getDocs(uQ);
            
            if(uSnap.empty) { alert("User not found"); return; }
            const newUid = uSnap.docs[0].id;

            const pRef = doc(db, "projects", currentProjectId);
            const pSnap = await getDoc(pRef);
            const pData = pSnap.data();
            
            const newRoles = pData.roles;
            newRoles[newUid] = role;
            const newMembers = [...pData.memberIds];
            if(!newMembers.includes(newUid)) newMembers.push(newUid);

            await updateDoc(pRef, { roles: newRoles, memberIds: newMembers });
            $('#inp-member-email').val('');
            $('#btn-manage-members').click(); 
            cacheMembers(newMembers); 
        });

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
