<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeRPG PWA</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { background-color: #f0f2f5; user-select: none; }
        .hidden { display: none !important; }
        
        /* Game HUD */
        #game-hud {
            background: #fff;
            padding: 15px;
            border-bottom: 3px solid #0d6efd;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* Kanban Columns */
        .kanban-col {
            min-height: 80vh;
            background: #e9ecef;
            border-radius: 8px;
            padding: 10px;
        }
        .task-card {
            cursor: pointer;
            transition: transform 0.2s;
            border-left: 5px solid #0d6efd;
        }
        .task-card:active { transform: scale(0.98); }
        
        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="auth-section" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="text-center mb-4"><i class="fas fa-gamepad"></i> LifeRPG</h3>
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" id="email" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password" id="password" class="form-control">
                        </div>
                        <button id="btn-login" class="btn btn-primary w-100 mb-2">Login</button>
                        <button id="btn-signup" class="btn btn-outline-secondary w-100">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="app-section" class="hidden">
        
        <div id="game-hud">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="m-0">Lv. <span id="user-level">1</span> <small class="text-muted" id="user-email"></small></h5>
                <button id="btn-logout" class="btn btn-sm btn-danger">Logout</button>
            </div>
            <div class="progress" style="height: 20px;">
                <div id="xp-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-warning text-dark" role="progressbar" style="width: 0%">
                    <span id="xp-text">0 / 100 XP</span>
                </div>
            </div>
        </div>

        <div class="container-fluid mt-3">
            <div class="row g-3 overflow-auto flex-nowrap flex-md-wrap" style="padding-bottom: 80px;">
                
                <div class="col-10 col-md-4">
                    <div class="kanban-col">
                        <h6 class="text-uppercase fw-bold text-secondary">To Do 📝</h6>
                        <div id="col-todo" class="d-grid gap-2"></div>
                    </div>
                </div>

                <div class="col-10 col-md-4">
                    <div class="kanban-col">
                        <h6 class="text-uppercase fw-bold text-primary">In Progress ⚡</h6>
                        <div id="col-doing" class="d-grid gap-2"></div>
                    </div>
                </div>

                <div class="col-10 col-md-4">
                    <div class="kanban-col">
                        <h6 class="text-uppercase fw-bold text-success">Done ✅</h6>
                        <div id="col-done" class="d-grid gap-2"></div>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn btn-primary fab" data-bs-toggle="modal" data-bs-target="#addTaskModal">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Quest</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="task-title" class="form-control mb-3" placeholder="Quest Title (e.g., Gym Workout)">
                    <select id="task-difficulty" class="form-select">
                        <option value="10">Easy (10 XP)</option>
                        <option value="25">Medium (25 XP)</option>
                        <option value="50">Hard (50 XP)</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="btn-save-task">Create Quest</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
<script type="module">
    // We use the CDN URLs so this works directly in the browser
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-analytics.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, updateDoc, increment, setDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    // --- YOUR SPECIFIC CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyAdAoFYS_j2r58mZZeadwEz9h91zKj78zU",
      authDomain: "life-rpg-e7808.firebaseapp.com",
      projectId: "life-rpg-e7808",
      storageBucket: "life-rpg-e7808.firebasestorage.app",
      messagingSenderId: "1003021084182",
      appId: "1:1003021084182:web:0b84ad6782f8dc3034b737",
      measurementId: "G-KNSRPK9PM1"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app); // Analytics enabled
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let currentUser = null;

    // --- 1. AUTH LOGIC ---
    $('#btn-signup').click(async () => {
        const email = $('#email').val();
        const password = $('#password').val();
        if(password.length < 6) { alert("Password must be at least 6 characters"); return; }
        
        try {
            const cred = await createUserWithEmailAndPassword(auth, email, password);
            // Create the user document in Firestore with initial Level 1
            await setDoc(doc(db, "users", cred.user.uid), { 
                email: email,
                xp: 0, 
                level: 1 
            });
            console.log("User created:", cred.user.uid);
        } catch (e) { 
            console.error(e);
            alert("Signup Error: " + e.message); 
        }
    });

    $('#btn-login').click(async () => {
        const email = $('#email').val();
        const password = $('#password').val();
        try { 
            await signInWithEmailAndPassword(auth, email, password); 
        } catch (e) { 
            console.error(e);
            alert("Login Error: " + e.message); 
        }
    });

    $('#btn-logout').click(() => signOut(auth));

    // --- 2. STATE MANAGEMENT ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            $('#auth-section').addClass('hidden');
            $('#app-section').removeClass('hidden');
            $('#user-email').text(user.email);
            
            // Load Game Data & Tasks
            initGameSystem();
            loadTasks();
        } else {
            currentUser = null;
            $('#auth-section').removeClass('hidden');
            $('#app-section').addClass('hidden');
        }
    });

    // --- 3. GAME SYSTEM (XP & LEVEL) ---
    function initGameSystem() {
        // Listen to User Stats in real-time
        onSnapshot(doc(db, "users", currentUser.uid), (docSnap) => {
            if (!docSnap.exists()) return;
            
            const data = docSnap.data();
            const level = data.level || 1;
            const xp = data.xp || 0;
            
            // Logic: XP needed increases with level (Level * 100)
            const xpNeeded = level * 100; 
            const progressPercent = Math.min((xp / xpNeeded) * 100, 100);

            // Update UI
            $('#user-level').text(level);
            $('#xp-text').text(`${xp} / ${xpNeeded} XP`);
            $('#xp-bar').css('width', `${progressPercent}%`);

            // Check if Level Up is needed
            if (xp >= xpNeeded) {
                levelUp(level, xp, xpNeeded);
            }
        });
    }

    async function levelUp(currentLevel, currentXP, xpNeeded) {
         const nextLevel = currentLevel + 1;
         const carryOverXp = currentXP - xpNeeded;
         
         // Update Firestore
         await updateDoc(doc(db, "users", currentUser.uid), {
             level: nextLevel,
             xp: carryOverXp 
         });
         
         // Optional: Play a sound or show an alert
         alert(`🎉 LEVEL UP! You reached Level ${nextLevel}!`);
    }

    // --- 4. KANBAN LOGIC ---
    function loadTasks() {
        const q = query(collection(db, "tasks"), where("uid", "==", currentUser.uid));
        
        onSnapshot(q, (snapshot) => {
            // Clear current lists
            $('#col-todo, #col-doing, #col-done').empty(); 

            snapshot.forEach((docSnap) => {
                const task = docSnap.data();
                const taskId = docSnap.id;
                renderTask(taskId, task);
            });
        });
    }

    function renderTask(id, task) {
        let actionBtn = '';
        let colorClass = 'border-secondary';

        // Decide button logic based on status
        if (task.status === 'todo') {
            actionBtn = `<button class="btn btn-sm btn-outline-primary move-btn" data-id="${id}" data-status="doing" data-xp="${task.xp}">Start ▶</button>`;
        } else if (task.status === 'doing') {
            actionBtn = `<button class="btn btn-sm btn-success move-btn" data-id="${id}" data-status="done" data-xp="${task.xp}">Complete ✅</button>`;
            colorClass = 'border-primary';
        } else {
            // Done state
            actionBtn = `<span class="badge bg-success">+${task.xp} XP</span>`;
            colorClass = 'border-success opacity-75';
        }

        const html = `
            <div class="card task-card shadow-sm mb-2 ${colorClass}">
                <div class="card-body p-2 d-flex justify-content-between align-items-center">
                    <div>
                        <strong>${task.title}</strong>
                        <div class="small text-muted">${task.xp} XP</div>
                    </div>
                    ${actionBtn}
                </div>
            </div>
        `;

        // Append to correct column
        $(`#col-${task.status}`).append(html);
    }

    // --- 5. USER ACTIONS ---
    
    // Create New Task
    $('#btn-save-task').click(async () => {
        const title = $('#task-title').val();
        const xp = parseInt($('#task-difficulty').val());
        
        if (title) {
            await addDoc(collection(db, "tasks"), {
                uid: currentUser.uid,
                title: title,
                xp: xp,
                status: 'todo',
                createdAt: Date.now()
            });
            
            // Reset and close modal
            $('#task-title').val('');
            const modalEl = document.getElementById('addTaskModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();
        }
    });

    // Move Task (Dynamic Event Listener)
    $(document).on('click', '.move-btn', async function() {
        const id = $(this).data('id');
        const newStatus = $(this).data('status');
        const xpReward = $(this).data('xp');

        // 1. Update Task Status
        await updateDoc(doc(db, "tasks", id), { status: newStatus });

        // 2. If completing task, Give XP to User
        if (newStatus === 'done') {
            await updateDoc(doc(db, "users", currentUser.uid), {
                xp: increment(xpReward)
            });
        }
    });
    
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
