<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowState Kanban</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-light: #f8f9fa;
            --border-color: #e9ecef;
        }
        body { background-color: #ffffff; color: #212529; font-family: 'Segoe UI', sans-serif; }
        .hidden { display: none !important; }
        
        /* Navbar */
        .navbar { border-bottom: 1px solid var(--border-color); background: #fff; }
        
        /* Project Cards */
        .project-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .project-card:hover { border-color: #0d6efd; background: var(--bg-light); }
        .project-date { font-size: 0.8rem; color: #6c757d; }

        /* Kanban Columns */
        .kanban-col {
            background: var(--bg-light);
            border-radius: 6px;
            padding: 12px;
            min-height: 75vh;
        }
        
        /* Task Cards */
        .task-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: transform 0.1s;
        }
        .task-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        /* Date Badges */
        .badge-date { font-size: 0.75rem; font-weight: normal; }
        .bg-urgent { background-color: #ffc107; color: #000; } /* Yellow for 3 days */
        .bg-overdue { background-color: #dc3545; color: #fff; } /* Red for late */
        .bg-normal { background-color: #e9ecef; color: #6c757d; } /* Grey for normal */
    </style>
</head>
<body>

    <div id="auth-section" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h2 class="text-center mb-4 fw-light">FlowState Login</h2>
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <input type="email" id="email" class="form-control mb-3" placeholder="name@example.com">
                        <input type="password" id="password" class="form-control mb-3" placeholder="Password">
                        <div class="d-grid gap-2">
                            <button id="btn-login" class="btn btn-dark">Log In</button>
                            <button id="btn-signup" class="btn btn-outline-secondary">Create Account</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="app-section" class="hidden">
        
        <nav class="navbar navbar-expand-lg px-3 sticky-top">
            <a class="navbar-brand fw-bold" href="#" onclick="showDashboard()">
                <i class="fas fa-layer-group text-primary me-2"></i>FlowState
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span id="user-display" class="small text-muted me-3 d-none d-md-block"></span>
                <button id="btn-logout" class="btn btn-sm btn-outline-danger">Log Out</button>
            </div>
        </nav>

        <div id="view-dashboard" class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-light">Your Projects</h4>
                <button class="btn btn-dark btn-sm" data-bs-toggle="modal" data-bs-target="#newProjectModal">
                    <i class="fas fa-plus"></i> New Project
                </button>
            </div>
            <div id="project-list" class="row g-3">
                </div>
        </div>

        <div id="view-project" class="container-fluid mt-3 hidden">
            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                <div>
                    <button class="btn btn-sm btn-link text-decoration-none text-dark ps-0" onclick="showDashboard()">← Back</button>
                    <span class="mx-2 text-muted">/</span>
                    <strong id="current-project-title" class="fs-5">Loading...</strong>
                    <span id="current-project-deadline" class="badge bg-light text-dark border ms-2 fw-normal"></span>
                </div>
                <div>
                    <button class="btn btn-sm btn-outline-secondary me-2" id="btn-manage-members">
                        <i class="fas fa-users"></i> Members
                    </button>
                    <button class="btn btn-sm btn-dark" id="btn-add-task-modal">
                        + Add Task
                    </button>
                </div>
            </div>

            <div class="row g-3 overflow-auto flex-nowrap flex-md-wrap pb-5">
                <div class="col-10 col-md-4">
                    <div class="kanban-col">
                        <h6 class="text-secondary small fw-bold text-uppercase mb-3">To Do</h6>
                        <div id="col-todo" class="d-grid"></div>
                    </div>
                </div>
                <div class="col-10 col-md-4">
                    <div class="kanban-col">
                        <h6 class="text-primary small fw-bold text-uppercase mb-3">In Progress</h6>
                        <div id="col-doing" class="d-grid"></div>
                    </div>
                </div>
                <div class="col-10 col-md-4">
                    <div class="kanban-col">
                        <h6 class="text-success small fw-bold text-uppercase mb-3">Done</h6>
                        <div id="col-done" class="d-grid"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="newProjectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-0"><h5 class="modal-title">Create Project</h5></div>
                <div class="modal-body">
                    <label class="small text-muted">Project Name</label>
                    <input type="text" id="inp-project-title" class="form-control mb-3" placeholder="e.g. Website Redesign">
                    
                    <label class="small text-muted">Deadline (Optional)</label>
                    <input type="date" id="inp-project-deadline" class="form-control mb-3">

                    <label class="small text-muted">Type</label>
                    <select id="inp-project-type" class="form-select">
                        <option value="individual">Individual (Private)</option>
                        <option value="group">Group Project</option>
                    </select>
                </div>
                <div class="modal-footer border-0">
                    <button class="btn btn-dark w-100" id="btn-create-project">Create Project</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="membersModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-0"><h5 class="modal-title">Team Members</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <ul id="member-list" class="list-group list-group-flush mb-3"></ul>
                    <div class="border-top pt-3">
                        <label class="small text-muted mb-1">Add Member by Email</label>
                        <div class="input-group">
                            <input type="email" id="inp-member-email" class="form-control" placeholder="user@email.com">
                            <select class="form-select" id="inp-member-role" style="max-width: 100px;">
                                <option value="editor">Editor</option>
                                <option value="viewer">Viewer</option>
                            </select>
                            <button class="btn btn-outline-dark" id="btn-invite-member">Add</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-0"><h5 class="modal-title">New Task</h5></div>
                <div class="modal-body">
                    <label class="small text-muted">Task Description</label>
                    <input type="text" id="inp-task-title" class="form-control mb-3" placeholder="What needs to be done?">
                    
                    <label class="small text-muted">Due Date</label>
                    <input type="date" id="inp-task-date" class="form-control">
                </div>
                <div class="modal-footer border-0">
                    <button class="btn btn-dark w-100" id="btn-save-task">Add Task</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
        // 1. IMPORTS: Notice 'getDoc' is explicitly listed here
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, updateDoc, getDocs, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAdAoFYS_j2r58mZZeadwEz9h91zKj78zU",
            authDomain: "life-rpg-e7808.firebaseapp.com",
            projectId: "life-rpg-e7808",
            storageBucket: "life-rpg-e7808.firebasestorage.app",
            messagingSenderId: "1003021084182",
            appId: "1:1003021084182:web:0b84ad6782f8dc3034b737"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentProjectId = null;
        let currentRole = null; 

        // --- AUTH ---
        $('#btn-login').click(async () => {
            try { await signInWithEmailAndPassword(auth, $('#email').val(), $('#password').val()); }
            catch (e) { alert(e.message); }
        });

        $('#btn-signup').click(async () => {
            const email = $('#email').val();
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, $('#password').val());
                await setDoc(doc(db, "users", cred.user.uid), { email: email });
            } catch (e) { alert(e.message); }
        });

        $('#btn-logout').click(() => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                $('#auth-section').addClass('hidden');
                $('#app-section').removeClass('hidden');
                $('#user-display').text(user.email);
                loadDashboard();
            } else {
                currentUser = null;
                $('#auth-section').removeClass('hidden');
                $('#app-section').addClass('hidden');
            }
        });

        // --- DASHBOARD ---
        window.showDashboard = function() {
            $('#view-project').addClass('hidden');
            $('#view-dashboard').removeClass('hidden');
            currentProjectId = null;
        }

        function loadDashboard() {
            const q = query(collection(db, "projects"), where("memberIds", "array-contains", currentUser.uid));
            
            onSnapshot(q, (snapshot) => {
                const list = $('#project-list');
                list.empty();
                snapshot.forEach(docSnap => {
                    const p = docSnap.data();
                    const role = p.roles[currentUser.uid];
                    
                    let deadlineHtml = '';
                    if (p.deadline) {
                        const d = new Date(p.deadline);
                        deadlineHtml = `<div class="project-date mt-2"><i class="far fa-clock"></i> Due: ${d.toLocaleDateString()}</div>`;
                    }

                    const html = `
                        <div class="col-md-4 col-lg-3">
                            <div class="project-card p-3 h-100 d-flex flex-column" onclick="openProject('${docSnap.id}')">
                                <div class="d-flex justify-content-between mb-2">
                                    <h6 class="mb-0 fw-bold text-truncate">${p.title}</h6>
                                    ${p.type === 'group' ? '<i class="fas fa-users text-muted"></i>' : '<i class="fas fa-user text-muted"></i>'}
                                </div>
                                <span class="badge bg-secondary badge-role text-uppercase align-self-start" style="font-size:0.6rem;">${role}</span>
                                <div class="mt-auto">
                                    ${deadlineHtml}
                                </div>
                            </div>
                        </div>
                    `;
                    list.append(html);
                });
            });
        }

        $('#btn-create-project').click(async () => {
            const title = $('#inp-project-title').val();
            const type = $('#inp-project-type').val();
            const deadline = $('#inp-project-deadline').val(); 
            
            if(!title) return;

            const roles = {};
            roles[currentUser.uid] = "owner";

            await addDoc(collection(db, "projects"), {
                title: title,
                type: type,
                deadline: deadline,
                createdAt: Date.now(),
                memberIds: [currentUser.uid],
                roles: roles
            });

            $('#inp-project-title').val('');
            $('#inp-project-deadline').val('');
            $('#newProjectModal').modal('hide');
        });

        // --- SINGLE PROJECT ---
        window.openProject = function(projectId) {
            currentProjectId = projectId;
            
            onSnapshot(doc(db, "projects", projectId), (docSnap) => {
                if(!docSnap.exists()) return;
                const p = docSnap.data();
                
                $('#current-project-title').text(p.title);
                
                if(p.deadline) {
                    $('#current-project-deadline').text(`Due: ${p.deadline}`).show();
                } else {
                    $('#current-project-deadline').hide();
                }

                currentRole = p.roles[currentUser.uid];
                
                if(currentRole === 'viewer') {
                    $('#btn-add-task-modal').hide();
                    $('#btn-manage-members').hide();
                } else {
                    $('#btn-add-task-modal').show();
                    if(p.type === 'group' && currentRole === 'owner') {
                        $('#btn-manage-members').show();
                    } else {
                        $('#btn-manage-members').hide();
                    }
                }
            });

            loadTasks(projectId);

            $('#view-dashboard').addClass('hidden');
            $('#view-project').removeClass('hidden');
        }

        function loadTasks(projectId) {
            const q = query(collection(db, "tasks"), where("projectId", "==", projectId));
            
            onSnapshot(q, (snapshot) => {
                $('#col-todo, #col-doing, #col-done').empty();
                
                snapshot.forEach(docSnap => {
                    renderTask(docSnap.id, docSnap.data());
                });
            });
        }

        function renderTask(id, task) {
            let controls = '';
            
            if (currentRole !== 'viewer') {
                if(task.status === 'todo') 
                    controls = `<button class="btn btn-sm text-primary move-btn p-0" data-id="${id}" data-status="doing">Start <i class="fas fa-play"></i></button>`;
                else if(task.status === 'doing')
                    controls = `<button class="btn btn-sm text-success move-btn p-0" data-id="${id}" data-status="done">Finish <i class="fas fa-check"></i></button>`;
            }

            let dateBadge = '';
            if (task.dueDate && task.status !== 'done') {
                const today = new Date();
                today.setHours(0,0,0,0);
                const due = new Date(task.dueDate);
                const diffTime = due - today; 
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 

                if (diffDays < 0) {
                    dateBadge = `<span class="badge badge-date bg-overdue"><i class="fas fa-exclamation-circle"></i> Overdue (${task.dueDate})</span>`;
                } else if (diffDays <= 3) {
                    dateBadge = `<span class="badge badge-date bg-urgent"><i class="fas fa-clock"></i> Due in ${diffDays} days</span>`;
                } else {
                    dateBadge = `<span class="badge badge-date bg-normal"><i class="far fa-calendar"></i> ${task.dueDate}</span>`;
                }
            }

            const html = `
                <div class="task-card">
                    <div class="mb-2 fw-medium">${task.title}</div>
                    <div class="mb-2">${dateBadge}</div>
                    <div class="d-flex justify-content-end border-top pt-2 mt-2">
                        ${controls}
                    </div>
                </div>
            `;
            $(`#col-${task.status}`).append(html);
        }

        // --- TASK ACTIONS ---
        $('#btn-add-task-modal').click(() => {
            document.getElementById('inp-task-date').valueAsDate = new Date();
            $('#addTaskModal').modal('show')
        });

        $('#btn-save-task').click(async () => {
            const title = $('#inp-task-title').val();
            const date = $('#inp-task-date').val();
            if(!title) return;

            await addDoc(collection(db, "tasks"), {
                projectId: currentProjectId,
                title: title,
                dueDate: date,
                status: 'todo',
                createdBy: currentUser.uid,
                createdAt: Date.now()
            });
            $('#inp-task-title').val('');
            $('#addTaskModal').modal('hide');
        });

        $(document).on('click', '.move-btn', async function() {
            const id = $(this).data('id');
            const status = $(this).data('status');
            await updateDoc(doc(db, "tasks", id), { status: status });
        });

        // --- MEMBER MANAGEMENT ---
        $('#btn-manage-members').click(loadMembers);

        async function loadMembers() {
            $('#membersModal').modal('show');
            
            // This line was causing your error because getDoc wasn't imported
            const snap = await getDoc(doc(db, "projects", currentProjectId)); 
            if(!snap.exists()) return;
            
            const data = snap.data();
            const memberIds = data.memberIds;
            const rolesMap = data.roles;

            const list = $('#member-list');
            list.empty();

            for(const uid of memberIds) {
                const userSnap = await getDoc(doc(db, "users", uid));
                const email = userSnap.exists() ? userSnap.data().email : "Unknown User";
                const role = rolesMap[uid];
                
                list.append(`
                    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                        <span>
                            <i class="fas fa-user-circle text-muted me-2"></i>${email}
                        </span>
                        <span class="badge bg-light text-dark border">${role}</span>
                    </li>
                `);
            }
        }

        $('#btn-invite-member').click(async () => {
            const email = $('#inp-member-email').val();
            const newRole = $('#inp-member-role').val();
            
            const q = query(collection(db, "users"), where("email", "==", email));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                alert("User not found! Ask them to sign up first.");
                return;
            }

            let foundUid = null;
            querySnapshot.forEach(doc => foundUid = doc.id);

            const projectRef = doc(db, "projects", currentProjectId);
            const pSnap = await getDoc(projectRef);
            const pData = pSnap.data();

            const updatedRoles = pData.roles;
            updatedRoles[foundUid] = newRole;
            
            const updatedMembers = pData.memberIds;
            if(!updatedMembers.includes(foundUid)) updatedMembers.push(foundUid);

            await updateDoc(projectRef, {
                roles: updatedRoles,
                memberIds: updatedMembers
            });

            $('#inp-member-email').val('');
            loadMembers(); 
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
