<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Ocean - live seafood ordering, packing, delivery tracking and invoicing for Kuching, Sarawak">
    <meta name="theme-color" content="#0f2847">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ocean">
    <title>Ocean - Live Seafood</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <!-- Sign-in / loading -->
    <div class="gate" id="gate">
        <div class="box" id="gate-box">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- App -->
    <div id="app" hidden>
        <div class="demo-bar" id="demo-bar" hidden></div>
        <header class="topbar">
            <span class="logo">🌊 OCEAN</span>
            <span id="gps-chip"></span>
            <div class="who">
                <div class="small bold clip" id="who-name"></div>
                <span class="chip" id="who-role"></span>
            </div>
        </header>
        <main id="view"></main>
        <nav class="tabbar" id="tabs" aria-label="Sections"></nav>
    </div>

    <div id="sheets"></div>
    <div id="toasts" aria-live="polite"></div>

    <!-- Shared invoice engine from the Invoice app -->
    <script src="../invoice/invoice-pdf.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
