<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ocean Dashboard - Manage your live seafood inventory, orders, and deliveries">
    <meta name="theme-color" content="#0f2847">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Dashboard - Ocean</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo.png">

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/enhancements.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- jsPDF for Invoices -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
    </style>
</head>

<body class="min-h-screen">

    <!-- Dashboard Background Waves -->
    <div class="dashboard-waves">
        <div class="dashboard-wave dashboard-wave-1"></div>
        <div class="dashboard-wave dashboard-wave-2"></div>
    </div>

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <!-- Logo Section -->
        <div class="sidebar-header">
            <img src="assets/logo.png" alt="Ocean Logo" class="sidebar-logo-img" />
            <button id="close-sidebar" class="ml-auto md:hidden p-2 rounded-lg hover:bg-white/10 text-white/70">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="nav-menu flex-1 overflow-y-auto">
            <ul class="space-y-1 px-2" id="nav-menu">
                <!-- Nav items injected by JS based on role -->
            </ul>
        </nav>

        <!-- User Profile -->
        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="user-avatar" id="user-avatar">?</div>
                <div class="flex-1 min-w-0">
                    <p class="user-name truncate" id="user-name">Loading...</p>
                    <span class="user-role" id="user-role">...</span>
                </div>
            </div>
            <button onclick="signOut()" class="btn-signout">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
                Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Mobile Header -->
        <header class="mobile-header">
            <button id="open-sidebar" class="mobile-menu-btn">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
            </button>
            <div class="flex items-center">
                <img src="assets/logo.png" alt="Ocean Logo" class="h-8 w-auto"
                    style="filter: brightness(0) invert(1);" />
            </div>
            <div class="w-10"></div>
        </header>

        <!-- Content Area -->
        <div class="content-wrapper" id="main-view">
            <div id="view-loading" class="flex flex-col items-center justify-center h-[60vh]">
                <div class="ocean-spinner mb-4"></div>
                <p class="text-blue-900 font-semibold text-lg animate-pulse">Loading Ocean System...</p>
            </div>

            <!-- Dynamic Content Sections will be injected here -->
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container"></div>



    <script src="js/firebase-config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
