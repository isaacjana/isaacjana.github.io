<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ocean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        .active-nav {
            background-color: rgba(30, 64, 175, 0.1);
            border-right: 3px solid #1e40af;
            color: #1e3a8a;
            font-weight: 600;
        }

        .hidden-section {
            display: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-slate-50 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside
        class="w-64 bg-white border-r border-gray-200 flex-shrink-0 flex flex-col transition-all duration-300 transform -translate-x-full md:translate-x-0 absolute md:static z-50 h-full"
        id="sidebar">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-900">Ocean</h1>
            <button id="close-sidebar" class="md:hidden text-gray-500"><svg class="w-6 h-6" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg></button>
        </div>

        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1" id="nav-menu">
                <!-- Nav items injected by JS based on role -->
            </ul>
        </nav>

        <div class="p-4 border-t border-gray-100 bg-gray-50">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold"
                    id="user-avatar">
                    ?
                </div>
                <div>
                    <p class="text-sm font-semibold text-gray-800 truncate w-32" id="user-name">Loading...</p>
                    <p class="text-xs text-gray-500 capitalize" id="user-role">...</p>
                </div>
            </div>
            <button onclick="signOut()"
                class="w-full text-sm text-red-600 hover:bg-red-50 p-2 rounded transition text-left flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
                Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative">
        <!-- Header for Mobile -->
        <header class="bg-white border-b border-gray-200 p-4 flex items-center justify-between md:hidden">
            <button id="open-sidebar" class="text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg></button>
            <h1 class="text-xl font-bold text-blue-900">Ocean</h1>
            <div class="w-6"></div> <!-- Spacer -->
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8" id="main-view">
            <!-- Loading State -->
            <div id="view-loading" class="flex items-center justify-center h-full">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-900"></div>
            </div>

            <!-- Dynamic Content Sections will be injected here -->
        </div>
    </main>

    <!-- Modals -->
    <div id="modal-container"></div>

    <script src="js/firebase-config.js"></script>
    <!-- We don't include auth.js here because dashboard handles its own auth check/redirect in app.js -->
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
