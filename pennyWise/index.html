<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PennyWise Pro | Personal Budget & Bank Envelope Manager</title>
    <meta name="description" content="Sistem pengurusan bajet peribadi pintar berasaskan saluran bank, komitmen, dan baki pendapatan bulanan.">
    <meta name="theme-color" content="#004B23">

    <!-- Google Fonts: Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Modular Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/budget.css">
</head>

<body>

    <div class="app-wrapper">
        <!-- Header Hero Section (Period, Month Nav, Hero Balance, User Auth) -->
        <header class="glass-header" id="header-section" aria-label="Ringkasan Bajet Utama"></header>

        <!-- Main Content Area -->
        <main>
            <!-- Financial Summary Cards & Settlement Progress -->
            <section id="summary-section" aria-label="Kad Ringkasan Kewangan"></section>

            <!-- Bank Accounts Envelope List & Commitment Items -->
            <section id="banks-section" aria-label="Senarai Akaun Bank dan Komitmen"></section>
        </main>
    </div>

    <!-- Floating Quick Add Button -->
    <button id="floating-quick-add" class="fab" title="Tambah Komitmen Baru">
        <i class="fa-solid fa-plus text-base"></i>
        <span>Tambah Komitmen</span>
    </button>

    <!-- Toast Notification Container -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- Firebase Compat SDKs (Optional Cloud Sync) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- Application Script (ES Module) -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
