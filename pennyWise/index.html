<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PennyWise Pro | Personal Budget & Bank Envelope Manager</title>
    <meta name="description" content="Smart personal budget manager based on bank accounts, commitments, and monthly income balance. Mobile-friendly fintech experience.">
    <meta name="theme-color" content="#004B23">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Google Fonts: Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Modular Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/budget.css">
</head>

<body>

    <!-- Login First Screen (Visible when unauthenticated) -->
    <div id="login-view-container" class="login-view-container" style="display: none;"></div>

    <!-- Main Authenticated App Wrapper -->
    <div id="app-wrapper" class="app-wrapper" style="display: none;">
        <!-- Header Hero Section (Period, Month Nav, Hero Balance, User Auth) -->
        <header class="glass-header" id="header-section" aria-label="Main Budget Header"></header>

        <!-- Main Content Area -->
        <main>
            <!-- Financial Summary Cards & Settlement Progress -->
            <section id="summary-section" aria-label="Financial Summary Cards"></section>

            <!-- Bank Accounts Envelope List & Commitment Items -->
            <section id="banks-section" aria-label="Bank Accounts and Commitments List"></section>
        </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav id="mobile-bottom-nav" class="mobile-bottom-nav" aria-label="Mobile Navigation" style="display: none;"></nav>

    <!-- Floating Quick Add Button (Desktop / Tablet) -->
    <button id="floating-quick-add" class="fab" title="Add New Commitment" style="display: none;">
        <i class="fa-solid fa-plus text-base"></i>
        <span>Add Commitment</span>
    </button>

    <!-- Account Details & Switcher Drawer Overlay -->
    <div id="account-drawer-overlay" class="modal-overlay"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- Firebase Compat SDKs (Optional Cloud Sync) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- Application Script (ES Module) -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
