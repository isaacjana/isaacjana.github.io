<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oratio - Catholic Prayer Generator</title>
    <meta name="description" content="Generate beautiful Catholic prayers for meals, gatherings, trials, and more.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: '#FDF8F0',
                        gold: '#C9A227',
                        'gold-light': '#E8D48A',
                        crimson: '#8B0000',
                        'crimson-dark': '#5C0000',
                        ink: '#1A1A1A',
                        paper: '#FAF7F2'
                    },
                    fontFamily: {
                        serif: ['Lora', 'Georgia', 'serif'],
                        display: ['Cinzel', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'pulse-gold': 'pulseGold 2s infinite',
                        'float': 'float 3s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGold {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(201, 162, 39, 0.4);
            }

            50% {
                box-shadow: 0 0 0 10px rgba(201, 162, 39, 0);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        body {
            background: linear-gradient(135deg, #FDF8F0 0%, #F5EDE0 50%, #FDF8F0 100%);
            background-attachment: fixed;
        }

        .ornate-border {
            background: linear-gradient(135deg, #C9A227 0%, #E8D48A 50%, #C9A227 100%);
            padding: 2px;
        }

        .prayer-card {
            position: relative;
            background: linear-gradient(to bottom, #FFFFFF, #FAF7F2);
        }

        .prayer-card::before,
        .prayer-card::after {
            content: '❧';
            position: absolute;
            font-size: 1.5rem;
            color: #C9A227;
            opacity: 0.6;
        }

        .prayer-card::before {
            top: 1rem;
            left: 1rem;
        }

        .prayer-card::after {
            bottom: 1rem;
            right: 1rem;
            transform: rotate(180deg);
        }

        .category-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-btn.active {
            background: linear-gradient(135deg, #8B0000 0%, #5C0000 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.3);
        }

        .category-btn:not(.active):hover {
            border-color: #C9A227;
            background: rgba(201, 162, 39, 0.1);
        }

        .generate-btn {
            background: linear-gradient(135deg, #C9A227 0%, #A88A1E 100%);
            transition: all 0.3s ease;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 162, 39, 0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .static-prayer-btn {
            transition: all 0.2s ease;
        }

        .static-prayer-btn:hover {
            background: linear-gradient(135deg, #C9A227 0%, #E8D48A 100%);
            color: white;
            transform: scale(1.02);
        }

        .toast {
            animation: slideUp 0.3s ease-out, fadeIn 0.3s ease-out;
        }

        .cross-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cross-divider::before,
        .cross-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #C9A227, transparent);
        }
    </style>
</head>

<body class="text-ink min-h-screen flex flex-col font-serif selection:bg-gold selection:text-white">

    <!-- Header -->
    <header class="py-6 text-center bg-white/80 backdrop-blur-sm sticky top-0 z-50 border-b-2 border-gold shadow-sm">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl md:text-4xl font-display font-bold text-crimson tracking-widest">✝ ORATIO ✝</h1>
            <p class="text-sm italic text-gray-500 mt-1 font-serif">Sacred prayer, simply gathered</p>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-2xl">

        <!-- Inspiration Quote -->
        <div id="quoteSection" class="text-center mb-8 animate-fade-in">
            <p class="text-sm italic text-gray-500">"<span id="quoteText"></span>"</p>
            <p class="text-xs text-gold mt-1">— <span id="quoteAuthor"></span></p>
        </div>

        <!-- Controls Section -->
        <section
            class="bg-white/90 backdrop-blur-sm p-6 md:p-8 rounded-xl shadow-lg border border-gold/30 mb-8 animate-slide-up">

            <!-- Category Selection -->
            <div class="mb-6">
                <label class="block text-xs font-sans font-semibold text-gray-400 uppercase tracking-widest mb-3">
                    <span class="inline-block mr-2">📿</span> Intention Type
                </label>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-2">
                    <button
                        class="category-btn active py-3 px-3 rounded-lg border-2 border-crimson font-sans text-sm font-medium flex flex-col items-center gap-1"
                        data-category="meals">
                        <span class="text-lg">🍞</span>
                        <span>Meals</span>
                    </button>
                    <button
                        class="category-btn py-3 px-3 rounded-lg border-2 border-gray-200 font-sans text-sm font-medium flex flex-col items-center gap-1"
                        data-category="gatherings">
                        <span class="text-lg">👥</span>
                        <span>Gathering</span>
                    </button>
                    <button
                        class="category-btn py-3 px-3 rounded-lg border-2 border-gray-200 font-sans text-sm font-medium flex flex-col items-center gap-1"
                        data-category="trials">
                        <span class="text-lg">✝️</span>
                        <span>Trials</span>
                    </button>
                    <button
                        class="category-btn py-3 px-3 rounded-lg border-2 border-gray-200 font-sans text-sm font-medium flex flex-col items-center gap-1"
                        data-category="thanksgiving">
                        <span class="text-lg">🙏</span>
                        <span>Thanks</span>
                    </button>
                    <button
                        class="category-btn py-3 px-3 rounded-lg border-2 border-gray-200 font-sans text-sm font-medium flex flex-col items-center gap-1 col-span-2 md:col-span-1"
                        data-category="guidance">
                        <span class="text-lg">💡</span>
                        <span>Guidance</span>
                    </button>
                </div>
            </div>

            <!-- Intention Input -->
            <div class="mb-6">
                <label for="intentionInput"
                    class="block text-xs font-sans font-semibold text-gray-400 uppercase tracking-widest mb-3">
                    <span class="inline-block mr-2">✍️</span> Your Intention
                </label>
                <input type="text" id="intentionInput" placeholder="e.g., peace in our home, healing for a friend..."
                    class="w-full bg-paper border-2 border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-gold focus:ring-2 focus:ring-gold/20 font-serif text-lg placeholder-gray-400 transition-all duration-300">
                <p class="text-xs text-gray-400 mt-2 italic">Leave blank for a general prayer</p>
            </div>

            <!-- Tone Switcher -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-gray-100">
                <div class="flex items-center gap-3 bg-paper px-4 py-2 rounded-full border border-gray-200">
                    <span class="text-xs font-sans font-semibold text-gray-500 uppercase">Tone:</span>
                    <button id="toneTraditional"
                        class="tone-btn px-3 py-1 rounded-full text-sm font-sans font-medium bg-crimson text-white transition-all">Traditional</button>
                    <button id="toneSimple"
                        class="tone-btn px-3 py-1 rounded-full text-sm font-sans font-medium text-gray-600 hover:bg-gray-100 transition-all">Simple</button>
                </div>

                <button id="generateBtn"
                    class="generate-btn w-full sm:w-auto text-white font-sans font-bold py-3 px-8 rounded-lg flex items-center justify-center gap-2">
                    <span>✨</span> Generate Prayer
                </button>
            </div>
        </section>

        <!-- Output Section -->
        <section id="prayerOutputSection" class="hidden mb-8">
            <div class="ornate-border rounded-lg">
                <div class="prayer-card p-8 md:p-10 text-center rounded-lg">
                    <div class="cross-divider text-crimson text-2xl opacity-60 font-display mb-6">✝</div>
                    <p id="prayerText" class="text-xl md:text-2xl leading-relaxed text-gray-800 italic px-4"></p>
                    <div class="cross-divider text-crimson text-2xl opacity-60 font-display mt-6">✝</div>

                    <div class="mt-8 flex flex-wrap justify-center gap-3">
                        <button id="copyBtn"
                            class="flex items-center gap-2 px-4 py-2 rounded-lg border-2 border-gold text-gold hover:bg-gold hover:text-white transition-all font-sans text-sm font-semibold">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            Copy
                        </button>
                        <button id="regenerateBtn"
                            class="flex items-center gap-2 px-4 py-2 rounded-lg border-2 border-gray-300 text-gray-600 hover:border-crimson hover:text-crimson transition-all font-sans text-sm font-semibold">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                            New Variation
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Static Prayers -->
        <section class="mt-8">
            <h3 class="cross-divider text-center font-display text-lg text-gray-400 mb-6">Common Prayers</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                <button
                    class="static-prayer-btn p-3 bg-white/80 border border-gray-200 rounded-lg font-sans text-sm text-center"
                    data-key="grace">🍞 Grace Before Meals</button>
                <button
                    class="static-prayer-btn p-3 bg-white/80 border border-gray-200 rounded-lg font-sans text-sm text-center"
                    data-key="graceAfter">🙏 Grace After Meals</button>
                <button
                    class="static-prayer-btn p-3 bg-white/80 border border-gray-200 rounded-lg font-sans text-sm text-center"
                    data-key="glory">✨ Glory Be</button>
                <button
                    class="static-prayer-btn p-3 bg-white/80 border border-gray-200 rounded-lg font-sans text-sm text-center"
                    data-key="ourFather">📖 Our Father</button>
                <button
                    class="static-prayer-btn p-3 bg-white/80 border border-gray-200 rounded-lg font-sans text-sm text-center"
                    data-key="hailMary">🌹 Hail Mary</button>
                <button
                    class="static-prayer-btn p-3 bg-white/80 border border-gray-200 rounded-lg font-sans text-sm text-center"
                    data-key="memorare">💐 Memorare</button>
                <button
                    class="static-prayer-btn p-3 bg-white/80 border border-gray-200 rounded-lg font-sans text-sm text-center"
                    data-key="angelGuardian">👼 Guardian Angel</button>
                <button
                    class="static-prayer-btn p-3 bg-white/80 border border-gray-200 rounded-lg font-sans text-sm text-center"
                    data-key="stMichael">⚔️ St. Michael</button>
                <button
                    class="static-prayer-btn p-3 bg-white/80 border border-gray-200 rounded-lg font-sans text-sm text-center"
                    data-key="serenity">☮️ Serenity</button>
            </div>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-xl hidden font-sans text-sm z-50">
    </div>

    <footer class="py-6 text-center text-gray-400 text-xs font-sans border-t border-gold/20 bg-white/50">
        <p>✝ Ad Maiorem Dei Gloriam ✝</p>
    </footer>

    <script type="module">
        import { generatePrayer, getInspirationQuote } from './prayerEngine.js';
        import { staticPrayers } from './prayerData.js';

        const state = { category: 'meals', tone: 'traditional', intention: '' };

        // DOM Elements
        const $ = id => document.getElementById(id);
        const categoryBtns = document.querySelectorAll('.category-btn');
        const intentionInput = $('intentionInput');
        const generateBtn = $('generateBtn');
        const prayerOutputSection = $('prayerOutputSection');
        const prayerText = $('prayerText');
        const copyBtn = $('copyBtn');
        const regenerateBtn = $('regenerateBtn');
        const staticBtns = document.querySelectorAll('.static-prayer-btn');
        const toast = $('toast');
        const toneTraditional = $('toneTraditional');
        const toneSimple = $('toneSimple');

        // Initialize
        function init() {
            const quote = getInspirationQuote();
            $('quoteText').textContent = quote.text;
            $('quoteAuthor').textContent = quote.author;
        }

        // Category Selection
        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                state.category = btn.dataset.category;
                categoryBtns.forEach(b => {
                    b.classList.remove('active');
                    b.classList.add('border-gray-200');
                    b.classList.remove('border-crimson');
                });
                btn.classList.add('active', 'border-crimson');
                btn.classList.remove('border-gray-200');
            });
        });

        // Tone Selection
        toneTraditional.addEventListener('click', () => {
            state.tone = 'traditional';
            toneTraditional.classList.add('bg-crimson', 'text-white');
            toneTraditional.classList.remove('text-gray-600');
            toneSimple.classList.remove('bg-crimson', 'text-white');
            toneSimple.classList.add('text-gray-600');
        });

        toneSimple.addEventListener('click', () => {
            state.tone = 'simple';
            toneSimple.classList.add('bg-crimson', 'text-white');
            toneSimple.classList.remove('text-gray-600');
            toneTraditional.classList.remove('bg-crimson', 'text-white');
            toneTraditional.classList.add('text-gray-600');
        });

        // Generate Prayer
        function doGenerate() {
            state.intention = intentionInput.value;
            const result = generatePrayer(state.category, state.tone, state.intention);
            displayPrayer(result.prayer);
        }

        generateBtn.addEventListener('click', doGenerate);
        regenerateBtn.addEventListener('click', doGenerate);

        // Static Prayers
        staticBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.dataset.key;
                if (staticPrayers[key]) {
                    displayPrayer(staticPrayers[key].text);
                }
            });
        });

        // Copy
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(prayerText.innerText).then(() => showToast('Prayer copied to clipboard ✓'));
        });

        function displayPrayer(text) {
            prayerOutputSection.classList.remove('hidden');
            prayerOutputSection.style.animation = 'none';
            prayerOutputSection.offsetHeight; // Trigger reflow
            prayerOutputSection.style.animation = 'slideUp 0.5s ease-out';
            prayerText.innerText = text;
            prayerOutputSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        init();
    </script>
</body>

</html>
