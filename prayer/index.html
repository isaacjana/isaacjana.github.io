
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oratio - Prayer Generator</title>
    <meta name="description" content="A sacramental prayer generator for daily life.">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: '#FDFBF7',
                        gold: '#D4AF37',
                        crimson: '#800000',
                        ink: '#2B2B2B',
                        paper: '#F5F5F0'
                    },
                    fontFamily: {
                        serif: ['Lora', 'serif'],
                        display: ['Cinzel', 'serif'],
                        sans: ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23d4af37' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .prayer-card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #E5E5E5;
            position: relative;
        }
        .prayer-card::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid #D4AF37;
            pointer-events: none;
        }
        .active-tab {
            background-color: #800000;
            color: #FDFBF7;
            border-color: #800000;
        }
        .inactive-tab {
            background-color: transparent;
            color: #2B2B2B;
            border-color: #D4AF37;
        }
    </style>
</head>
<body class="bg-parchment text-ink min-h-screen flex flex-col font-serif selection:bg-gold selection:text-white">

    <header class="py-6 text-center border-b-4 border-gold bg-white bg-opacity-80 sticky top-0 z-10 shadow-sm">
        <h1 class="text-4xl md:text-5xl font-display font-bold text-crimson tracking-wider">ORATIO</h1>
        <p class="text-sm md:text-base italic text-gray-600 mt-2">Sacred prayer, simply gathered.</p>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-2xl">
        
        <!-- Controls Section -->
        <section class="bg-white p-6 rounded-lg shadow-md border border-gray-200 mb-8">
            <!-- Category Selection -->
            <div class="mb-6">
                <label class="block text-sm font-sans font-bold text-gray-500 uppercase tracking-wide mb-3">Intention Type</label>
                <div class="grid grid-cols-3 gap-3">
                    <button class="category-btn active-tab py-2 px-4 rounded border transition duration-300 font-sans text-sm font-medium hover:bg-crimson hover:text-white" data-category="meals">Meals</button>
                    <button class="category-btn inactive-tab py-2 px-4 rounded border transition duration-300 font-sans text-sm font-medium hover:bg-crimson hover:text-white" data-category="gatherings">Gathering</button>
                    <button class="category-btn inactive-tab py-2 px-4 rounded border transition duration-300 font-sans text-sm font-medium hover:bg-crimson hover:text-white" data-category="trials">Trials</button>
                </div>
            </div>

            <!-- Intention Input -->
            <div class="mb-6">
                <label for="intentionInput" class="block text-sm font-sans font-bold text-gray-500 uppercase tracking-wide mb-3">Who or what are we praying for?</label>
                <input type="text" id="intentionInput" placeholder="e.g., peace in our home, healing for a friend..." 
                       class="w-full bg-paper border border-gray-300 rounded px-4 py-3 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold font-serif text-lg placeholder-gray-400 transition">
            </div>

            <!-- Tone Switcher & Generate -->
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-3 bg-paper px-4 py-2 rounded-full border border-gray-200">
                    <span class="text-sm font-sans text-gray-600">Tone:</span>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toneSwitch" class="sr-only peer">
                        <div class="relative w-11 h-6 bg-gray-300 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-gold rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-crimson"></div>
                        <span class="ml-3 text-sm font-sans font-medium text-gray-700" id="toneLabel">Traditional</span>
                    </label>
                </div>

                <button id="generateBtn" class="w-full md:w-auto bg-gold hover:bg-yellow-600 text-white font-sans font-bold py-3 px-8 rounded shadow-md transform transition hover:-translate-y-1 hover:shadow-lg">
                    Generate Prayer
                </button>
            </div>
        </section>

        <!-- Output Section -->
        <section id="prayerOutputSection" class="relative hidden opacity-0 transition-opacity duration-700 ease-in-out">
            <div class="prayer-card bg-white p-8 md:p-12 text-center rounded-sm">
                <div class="mb-6 text-crimson text-3xl opacity-50 font-display">✠</div>
                <p id="prayerText" class="text-xl md:text-2xl leading-relaxed text-gray-800 italic">
                    <!-- Prayer goes here -->
                </p>
                <div class="mt-8 flex justify-center">
                    <button id="copyBtn" class="text-gold hover:text-crimson font-sans text-sm font-bold uppercase tracking-widest transition flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Copy Prayer
                    </button>
                </div>
            </div>
        </section>

        <!-- Static Prayers (Footer/Quick Access) -->
        <section class="mt-12 border-t border-gold/30 pt-8">
            <h3 class="text-center font-display text-xl text-gray-500 mb-6">Common Prayers</h3>
            <div class="flex flex-wrap justify-center gap-4">
                <button class="static-prayer-btn px-4 py-2 bg-white border border-gray-300 rounded hover:border-gold hover:text-gold transition font-sans text-sm" data-key="grace">Meal Grace</button>
                <button class="static-prayer-btn px-4 py-2 bg-white border border-gray-300 rounded hover:border-gold hover:text-gold transition font-sans text-sm" data-key="glory">Glory Be</button>
                <button class="static-prayer-btn px-4 py-2 bg-white border border-gray-300 rounded hover:border-gold hover:text-gold transition font-sans text-sm" data-key="memorare">Memorare</button>
            </div>
        </section>

    </main>

    <footer class="py-6 text-center text-gray-400 text-sm font-sans">
        <p>&copy; 2026 Oratio. Ad Maiorem Dei Gloriam.</p>
    </footer>

    <!-- Logic -->
    <script type="module">
        import { generatePrayer } from './prayerEngine.js';
        import { staticPrayers } from './prayerData.js';

        const state = {
            category: 'meals',
            tone: 'traditional',
            intention: ''
        };

        // DOM Elements
        const categoryBtns = document.querySelectorAll('.category-btn');
        const intentionInput = document.getElementById('intentionInput');
        const toneSwitch = document.getElementById('toneSwitch');
        const toneLabel = document.getElementById('toneLabel');
        const generateBtn = document.getElementById('generateBtn');
        const prayerOutputSection = document.getElementById('prayerOutputSection');
        const prayerText = document.getElementById('prayerText');
        const copyBtn = document.getElementById('copyBtn');
        const staticBtns = document.querySelectorAll('.static-prayer-btn');

        // Event Listeners
        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update State
                state.category = btn.dataset.category;
                
                // Update UI
                categoryBtns.forEach(b => {
                    b.classList.remove('active-tab');
                    b.classList.add('inactive-tab');
                });
                btn.classList.add('active-tab');
                btn.classList.remove('inactive-tab');
            });
        });

        toneSwitch.addEventListener('change', (e) => {
            state.tone = e.target.checked ? 'simple' : 'traditional';
            toneLabel.innerText = state.tone.charAt(0).toUpperCase() + state.tone.slice(1);
        });

        generateBtn.addEventListener('click', () => {
            state.intention = intentionInput.value;
            const prayer = generatePrayer(state.category, state.tone, state.intention);
            displayPrayer(prayer);
        });

        staticBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.dataset.key;
                if (staticPrayers[key]) {
                    displayPrayer(staticPrayers[key]);
                }
            });
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(prayerText.innerText).then(() => {
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<span class="text-green-600">Copied!</span>';
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            });
        });

        function displayPrayer(text) {
            prayerOutputSection.classList.remove('hidden');
            // Trigger reflow for transition
            void prayerOutputSection.offsetWidth;
            prayerOutputSection.classList.remove('opacity-0');
            
            prayerText.innerText = text;
            
            // Scroll to prayer on mobile
            if (window.innerWidth < 768) {
                prayerOutputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
    </script>
</body>
</html>
