<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Next Kiosk | Modern Queue Management</title>

    <!-- SEO & Metadata -->
    <meta name="description" content="Q-Next Business Kiosk - A modern digital queue management system.">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --brand-primary: #000000;
            --brand-accent: #6366f1;
            --bg-canvas: #fbfbfd;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-canvas);
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }

        .gradient-text {
            background: linear-gradient(135deg, #000 0%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-action {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.15);
        }

        .btn-action:active {
            transform: translateY(0px) scale(0.98);
        }

        /* Pulse for Live Status */
        .live-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            position: relative;
        }

        .live-dot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #10b981;
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        #qrcode img {
            border-radius: 1.5rem;
            padding: 1rem;
            background: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Background Decoration -->
    <div class="fixed inset-0 overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-50 rounded-full blur-[120px] opacity-60">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-50 rounded-full blur-[120px] opacity-60">
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- Left Side: Serving Display -->
        <div class="lg:col-span-12 flex justify-between items-center mb-4 px-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center shadow-lg">
                    <span class="text-white font-bold text-lg">Q</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Q-Next</h1>
                    <div class="flex items-center gap-1.5 opacity-60">
                        <div class="live-dot"></div>
                        <span class="text-[10px] uppercase font-bold tracking-wider">Kiosk Live</span>
                    </div>
                </div>
            </div>

            <div id="connection-status"
                class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white border border-gray-100 shadow-sm transition-all duration-300">
                <div class="w-2 h-2 rounded-full bg-yellow-400" id="status-dot"></div>
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest"
                    id="status-text">Connecting</span>
            </div>
        </div>

        <!-- MAIN CARD -->
        <div class="lg:col-span-7">
            <div
                class="glass-panel rounded-[3rem] p-12 text-center relative overflow-hidden h-full flex flex-col justify-center">
                <p class="text-gray-400 font-bold uppercase tracking-[0.3em] text-sm mb-4">Now Serving</p>
                <div id="serving-display"
                    class="text-[12rem] font-extrabold leading-none tracking-tighter gradient-text">
                    --
                </div>
                <div class="mt-8 flex items-center justify-center gap-4 text-gray-400 font-medium">
                    <span class="px-4 py-1.5 bg-gray-100 rounded-full text-xs">Tickets Issued: <b id="last-issued"
                            class="text-black ml-1">--</b></span>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE: CONTROLS & QR -->
        <div class="lg:col-span-5 space-y-6">

            <!-- QR CODE CARD -->
            <div class="glass-panel rounded-[2.5rem] p-8 text-center space-y-6">
                <div>
                    <h3 class="font-bold text-lg">Join the Queue</h3>
                    <p class="text-gray-400 text-xs">Scan the code on your phone</p>
                </div>
                <div class="flex justify-center">
                    <div id="qrcode" class="transition-all duration-500 scale-95 hover:scale-100"></div>
                </div>
            </div>

            <!-- BUTTONS -->
            <div class="grid grid-cols-1 gap-4">
                <button id="btn-next"
                    class="btn-action w-full bg-black text-white py-6 rounded-[2rem] font-bold text-xl flex items-center justify-center gap-3 shadow-2xl">
                    <span>Next Customer</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </button>
                <div class="grid grid-cols-2 gap-4">
                    <button id="btn-chime"
                        class="btn-action bg-white border border-gray-100 py-4 rounded-[1.5rem] font-bold text-gray-600 hover:text-black hover:bg-gray-50 flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"
                                clip-rule="evenodd" />
                        </svg>
                        Test Audio
                    </button>
                    <button id="btn-reset"
                        class="btn-action bg-white border border-gray-100 py-4 rounded-[1.5rem] font-bold text-gray-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center gap-2">
                        Reset
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Notification Audio -->
    <audio id="chime-audio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
        preload="auto"></audio>

    <script type="module">
        import { db, ref, onValue, runTransaction, set } from './firebase-config.js';

        $(document).ready(function () {
            // Check if running via file:// protocol
            if (window.location.protocol === 'file:') {
                alert("CRITICAL: Use a local web server (like VS Code Live Server) to run this app. Modern browsers block modules via 'file://'.");
            }

            const queueRef = ref(db, 'queue');
            let lastServedValue = null;

            // Robust URL generation for GitHub Pages
            function getClientUrl() {
                const current = window.location.href;
                // Works even for directory/base paths
                if (current.includes('host.html')) {
                    return current.replace('host.html', 'client.html');
                } else if (current.endsWith('/')) {
                    return current + 'client.html';
                }
                return current + '/client.html';
            }

            const clientUrl = getClientUrl();

            // Generate QR Code
            new QRCode(document.getElementById("qrcode"), {
                text: clientUrl,
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Connection Status UI
            const connectedRef = ref(db, ".info/connected");
            onValue(connectedRef, (snap) => {
                const dot = $('#status-dot');
                const text = $('#status-text');
                if (snap.val() === true) {
                    dot.removeClass('bg-yellow-400 bg-red-400').addClass('bg-green-500');
                    text.text('Online').addClass('text-green-600').removeClass('text-gray-500');
                } else {
                    dot.removeClass('bg-yellow-400 bg-green-500').addClass('bg-red-400');
                    text.text('Offline').addClass('text-red-600').removeClass('text-gray-500');
                }
            });

            // Listen for Queue Changes
            onValue(queueRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const current = data.current_serving || 0;
                    const issued = data.last_issued || 0;

                    // Update UI with counting animation effect if possible
                    updateDisplay('#serving-display', current === 0 ? '--' : current);
                    $('#last-issued').text(issued);

                    if (lastServedValue !== null && current > lastServedValue) {
                        playChime();
                    }
                    lastServedValue = current;
                } else {
                    initializeQueue();
                }
            });

            function updateDisplay(el, val) {
                $(el).fadeOut(100, function () {
                    $(this).text(val).fadeIn(200);
                });
            }

            // Controls
            $('#btn-next').on('click', function () {
                const currentServingRef = ref(db, 'queue/current_serving');
                runTransaction(currentServingRef, (currentValue) => {
                    return (currentValue || 0) + 1;
                });
            });

            $('#btn-reset').on('click', function () {
                if (confirm("Reset the entire queue system?")) {
                    initializeQueue();
                }
            });

            $('#btn-chime').on('click', () => playChime());

            function initializeQueue() {
                set(ref(db, 'queue'), {
                    current_serving: 0,
                    last_issued: 0,
                    tickets: {}
                });
            }

            function playChime() {
                const audio = document.getElementById('chime-audio');
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio requires user interaction first."));
            }
        });
    </script>
</body>

</html>
