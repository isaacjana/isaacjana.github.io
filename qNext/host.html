<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Next Kiosk | Modern Queue Management</title>

    <!-- SEO & Metadata -->
    <meta name="description" content="Q-Next Business Kiosk - A modern digital queue management system.">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --brand-primary: #000000;
            --brand-accent: #6366f1;
            --bg-canvas: #fbfbfd;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-canvas);
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }

        .gradient-text {
            background: linear-gradient(135deg, #000 0%, #444 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-action {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.15);
        }

        .btn-action:active {
            transform: translateY(0px) scale(0.98);
        }

        /* Pulse for Live Status */
        .live-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            position: relative;
        }

        .live-dot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #10b981;
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        #qrcode img {
            border-radius: 1.5rem;
            padding: 1rem;
            background: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Background Decoration -->
    <div class="fixed inset-0 overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-50 rounded-full blur-[120px] opacity-60">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-50 rounded-full blur-[120px] opacity-60">
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- Header Row -->
        <div class="lg:col-span-12 flex justify-between items-center px-4">
            <div class="flex items-center gap-3">
                <div
                    class="w-12 h-12 bg-black rounded-2xl flex items-center justify-center shadow-2xl rotate-3 hover:rotate-0 transition-transform duration-500">
                    <span class="text-white font-bold text-xl">Q</span>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight tracking-tighter">Q-Next <span
                            class="text-indigo-600">Pro</span></h1>
                    <div class="flex items-center gap-1.5 opacity-60">
                        <div class="live-dot"></div>
                        <span class="text-[10px] uppercase font-bold tracking-widest text-emerald-600">Terminal
                            Active</span>
                    </div>
                </div>
            </div>

            <div id="connection-status"
                class="flex items-center gap-3 px-4 py-2 rounded-2xl bg-white border border-gray-100 shadow-sm">
                <div class="flex flex-col items-end">
                    <span class="text-[9px] uppercase font-black text-gray-400 leading-none mb-0.5">Network</span>
                    <span class="text-[11px] font-bold text-gray-600" id="status-text">Synchronizing</span>
                </div>
                <div class="w-2.5 h-2.5 rounded-full bg-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.5)]"
                    id="status-dot"></div>
            </div>
        </div>

        <!-- LEFT COLUMN: Main Display -->
        <div class="lg:col-span-8 space-y-6">
            <!-- MAIN SERVING CARD -->
            <div class="glass-panel rounded-[3.5rem] p-12 text-center relative overflow-hidden group">
                <div
                    class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-indigo-500 to-transparent opacity-20 group-hover:opacity-100 transition-opacity duration-1000">
                </div>

                <p class="text-gray-400 font-bold uppercase tracking-[0.4em] text-xs mb-4">Now Serving</p>
                <div id="serving-display"
                    class="text-[14rem] font-black leading-none tracking-tighter gradient-text drop-shadow-sm select-none">
                    --
                </div>

                <div class="mt-8 flex items-center justify-center gap-8">
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] uppercase font-black text-gray-400 tracking-widest mb-1">Total
                            Issued</span>
                        <div class="text-2xl font-bold bg-gray-100 px-4 py-1 rounded-full" id="last-issued">--</div>
                    </div>
                    <div class="w-px h-10 bg-gray-100"></div>
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] uppercase font-black text-gray-400 tracking-widest mb-1">Waiting</span>
                        <div class="text-2xl font-bold text-indigo-600 bg-indigo-50 px-4 py-1 rounded-full"
                            id="waiting-count">0</div>
                    </div>
                </div>
            </div>

            <!-- CONTROLS CARD -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button id="btn-next"
                    class="btn-action bg-black text-white p-8 rounded-[2.5rem] font-black text-2xl flex flex-col items-center justify-center gap-2 shadow-2xl group relative overflow-hidden">
                    <div
                        class="absolute inset-0 bg-indigo-600 translate-y-full group-hover:translate-y-0 transition-transform duration-500 opacity-20">
                    </div>
                    <div class="flex items-center gap-3">
                        <span>NEXT CUSTOMER</span>
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="h-8 w-8 group-hover:translate-x-1 transition-transform" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                d="M13 7l5 5m0 0l-5 5m5-5H6" />
                        </svg>
                    </div>
                    <span class="text-[10px] font-bold text-gray-400 tracking-widest uppercase mt-2">Call next
                        ticket</span>
                </button>

                <div class="grid grid-cols-1 gap-4">
                    <button id="btn-chime"
                        class="btn-action bg-white border-2 border-transparent hover:border-gray-100 p-6 rounded-[2rem] font-bold text-gray-600 flex items-center justify-center gap-4 group">
                        <div
                            class="w-12 h-12 rounded-2xl bg-gray-50 flex items-center justify-center group-hover:bg-indigo-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-500" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                            </svg>
                        </div>
                        <div class="text-left">
                            <p class="text-black font-bold">Audio Test</p>
                            <p class="text-[10px] text-gray-400 uppercase tracking-widest">Verify chime</p>
                        </div>
                    </button>
                    <button id="btn-reset"
                        class="btn-action bg-white border-2 border-transparent hover:border-red-50 p-6 rounded-[2rem] font-bold text-gray-400 hover:text-red-500 flex items-center justify-center gap-4 group">
                        <div
                            class="w-12 h-12 rounded-2xl bg-gray-50 flex items-center justify-center group-hover:bg-red-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </div>
                        <div class="text-left">
                            <p class="font-bold">System Reset</p>
                            <p class="text-[10px] text-gray-400 uppercase tracking-widest">Clear all data</p>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Activity & QR -->
        <div class="lg:col-span-4 space-y-6 self-stretch">
            <!-- QR CODE BOX -->
            <div class="glass-panel rounded-[2.5rem] p-8 text-center flex flex-col items-center">
                <div class="mb-4 text-left w-full px-2">
                    <h3 class="font-black text-lg">Customer Portal</h3>
                    <p class="text-gray-400 text-[11px] font-bold uppercase tracking-wider">Scan to get ticket</p>
                </div>
                <div id="qrcode"
                    class="p-4 bg-white rounded-3xl shadow-inner mb-4 transition-transform hover:scale-[1.02] cursor-none">
                </div>
                <div class="w-full bg-gray-50 rounded-2xl p-4 border border-gray-100">
                    <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1 text-center">Direct
                        Link</p>
                    <p id="client-link-text"
                        class="text-[10px] font-medium text-indigo-600 break-all select-all text-center"></p>
                </div>
            </div>

            <!-- ACTIVITY FEED -->
            <div class="glass-panel rounded-[2.5rem] p-8 flex-grow">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-black text-lg text-black">Live Feed</h3>
                    <span
                        class="px-2 py-1 bg-indigo-50 text-indigo-600 text-[9px] font-black rounded-md uppercase tracking-widest">Live</span>
                </div>
                <div id="activity-feed" class="space-y-4 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar">
                    <div class="flex items-center gap-3 opacity-40 py-2 border-b border-gray-50 italic text-[11px]">
                        Waiting for activity...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Audio -->
    <audio id="chime-audio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
        preload="auto"></audio>

    <script type="module">
        import { db, ref, onValue, runTransaction, set } from './firebase-config.js';

        $(document).ready(function () {
            // Check if running via file:// protocol
            if (window.location.protocol === 'file:') {
                alert("CRITICAL: Use a local web server (like VS Code Live Server) to run this app. Modern browsers block modules via 'file://'.");
            }

            const queueRef = ref(db, 'queue');
            let lastServedValue = null;

            // Robust URL generation for GitHub Pages
            function getClientUrl() {
                const current = window.location.href;
                // Works even for directory/base paths
                if (current.includes('host.html')) {
                    return current.replace('host.html', 'client.html');
                } else if (current.endsWith('/')) {
                    return current + 'client.html';
                }
                return current + '/client.html';
            }

            const clientUrl = getClientUrl();
            $('#client-link-text').text(clientUrl);

            // Generate QR Code
            new QRCode(document.getElementById("qrcode"), {
                text: clientUrl,
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Connection Status UI
            const connectedRef = ref(db, ".info/connected");
            onValue(connectedRef, (snap) => {
                const dot = $('#status-dot');
                const text = $('#status-text');
                if (snap.val() === true) {
                    dot.removeClass('bg-yellow-400 bg-red-400').addClass('bg-green-500');
                    text.text('Online').addClass('text-green-600').removeClass('text-gray-500');
                } else {
                    dot.removeClass('bg-yellow-400 bg-green-500').addClass('bg-red-400');
                    text.text('Offline').addClass('text-red-600').removeClass('text-gray-500');
                }
            });

            // Listen for Queue Changes
            onValue(queueRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const current = data.current_serving || 0;
                    const issued = data.last_issued || 0;
                    const tickets = data.tickets || {};

                    // Update UI
                    updateDisplay('#serving-display', current === 0 ? '--' : current);
                    $('#last-issued').text(issued);

                    // Update Waiting Count
                    const waiting = Object.values(tickets).filter(t => t.status === 'waiting').length;
                    $('#waiting-count').text(waiting);

                    // Update Activity Feed
                    updateActivityFeed(current, tickets);

                    if (lastServedValue !== null && current > lastServedValue) {
                        playChime();
                    }
                    lastServedValue = current;
                } else {
                    initializeQueue();
                }
            }, (error) => {
                console.error("Firebase Read Error:", error);
                $('#status-text').text("DB Error").addClass('text-red-600');
                if (error.message.includes('permission_denied')) {
                    alert("Firebase Permission Denied. Please check your Database Rules.");
                }
            });

            function updateDisplay(el, val) {
                const display = $(el);
                if (display.text() !== val.toString()) {
                    display.css('transform', 'scale(0.95)').css('opacity', '0');
                    setTimeout(() => {
                        display.text(val).css('transform', 'scale(1)').css('opacity', '1');
                    }, 150);
                }
            }

            function updateActivityFeed(current, tickets) {
                const feed = $('#activity-feed');
                feed.empty();

                // Sort tickets by timestamp to show latest activity
                const sortedTickets = Object.entries(tickets)
                    .map(([id, data]) => ({ id, ...data, num: id.split('_')[1] }))
                    .sort((a, b) => b.timestamp - a.timestamp)
                    .slice(0, 10);

                if (sortedTickets.length === 0) {
                    feed.append('<div class="text-[11px] text-gray-400 italic">No tickets issued yet.</div>');
                    return;
                }

                sortedTickets.forEach(ticket => {
                    const isServed = parseInt(ticket.num) <= parseInt(current);
                    const isNow = parseInt(ticket.num) === parseInt(current);

                    const item = $(`
                        <div class="flex items-center justify-between p-3 rounded-2xl ${isNow ? 'bg-indigo-50 border border-indigo-100' : 'bg-white border border-gray-50'} transition-all duration-500">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full ${isServed ? (isNow ? 'bg-indigo-500 text-white' : 'bg-gray-100 text-gray-400') : 'bg-emerald-50 text-emerald-600'} flex items-center justify-center font-black text-[10px]">
                                    #${ticket.num}
                                </div>
                                <div>
                                    <p class="text-xs font-bold ${isNow ? 'text-indigo-900' : 'text-gray-900'}">${ticket.name}</p>
                                    <p class="text-[9px] uppercase font-black text-gray-400 tracking-wider">${isNow ? 'Now Serving' : (isServed ? 'Served' : 'Waiting')}</p>
                                </div>
                            </div>
                            ${isNow ? '<div class="w-2 h-2 rounded-full bg-indigo-500 animate-ping"></div>' : ''}
                        </div>
                    `);
                    feed.append(item);
                });
            }

            // Controls
            $('#btn-next').on('click', function () {
                const currentServingRef = ref(db, 'queue/current_serving');
                runTransaction(currentServingRef, (currentValue) => {
                    return (currentValue || 0) + 1;
                });
            });

            $('#btn-reset').on('click', function () {
                if (confirm("Reset the entire queue system?")) {
                    initializeQueue();
                }
            });

            $('#btn-chime').on('click', () => playChime());

            function initializeQueue() {
                set(ref(db, 'queue'), {
                    current_serving: 0,
                    last_issued: 0,
                    tickets: {}
                });
            }

            function playChime() {
                const audio = document.getElementById('chime-audio');
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio requires user interaction first."));
            }
        });
    </script>
</body>

</html>
