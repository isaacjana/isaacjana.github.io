 <!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkKaraoke - Direct Queue</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>

        .glass {

            background: rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.1);

        }

        .animate-enter {

            animation: slideIn 0.3s ease-out forwards;

        }

        @keyframes slideIn {

            from { opacity: 0; transform: translateY(10px); }

            to { opacity: 1; transform: translateY(0); }

        }

    </style>

</head>

<body class="bg-gray-900 text-white h-screen flex flex-col font-sans">


    <header class="h-16 border-b border-gray-800 bg-gray-950 flex items-center px-6 shadow-lg z-20">

        <i class="fas fa-link text-green-400 text-xl mr-3"></i>

        <h1 class="text-xl font-bold tracking-wide">Direct<span class="text-green-400">Queue</span></h1>

        <div class="ml-auto flex items-center text-xs text-gray-500 gap-4">

            <span><i class="fas fa-signal mr-1"></i> Ready</span>

            <span class="bg-gray-800 px-2 py-1 rounded text-gray-300" id="queue-counter">Queue: 0</span>

        </div>

    </header>


    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">

        

        <div class="w-full md:w-3/4 flex flex-col bg-black relative">

            <div id="youtube-player" class="w-full h-full"></div>

            

            <div id="idle-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-10">

                <div class="text-center p-8">

                    <i class="fas fa-paste text-6xl text-gray-700 mb-6 block"></i>

                    <h2 class="text-2xl font-bold text-gray-300">Paste a Link to Start</h2>

                    <p class="text-gray-500 mt-2">Supports youtube.com, youtu.be, and embed links</p>

                </div>

            </div>


            <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/90 to-transparent flex items-end justify-between pointer-events-none">

                <div class="pointer-events-auto">

                    <h2 id="np-title" class="text-lg font-bold text-white drop-shadow-md">Waiting...</h2>

                    <p id="np-status" class="text-sm text-green-400 font-mono">IDLE</p>

                </div>

                <button onclick="skipSong()" class="pointer-events-auto bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-full text-sm font-bold border border-gray-600 transition">

                    Skip <i class="fas fa-step-forward ml-2"></i>

                </button>

            </div>

        </div>


        <div class="w-full md:w-1/4 bg-gray-900 border-l border-gray-800 flex flex-col z-10 shadow-2xl">

            

            <div class="p-5 border-b border-gray-800 bg-gray-800/50">

                <label class="text-xs font-bold text-gray-400 uppercase mb-2 block">Add Song</label>

                <div class="flex gap-2">

                    <input type="text" id="url-input" 

                        placeholder="Paste YouTube Link here..." 

                        class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-sm text-white focus:border-green-500 focus:outline-none transition">

                    <button onclick="processLink()" id="btn-add" class="bg-green-600 hover:bg-green-500 text-white px-4 rounded transition">

                        <i class="fas fa-plus"></i>

                    </button>

                </div>

                <p id="input-error" class="text-xs text-red-400 mt-2 hidden">Invalid YouTube URL</p>

            </div>


            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="queue-list">

                <div class="text-center text-gray-600 mt-10 text-sm">

                    Queue is empty.

                </div>

            </div>

            

            <div class="p-3 border-t border-gray-800 text-center text-xs text-gray-600">

                Powered by NoEmbed & YouTube IFrame

            </div>

        </div>

    </main>


    <script>

        // --- 1. STATE & SETUP ---

        let player;

        let queue = [];

        let isPlaying = false;

        

        // Load YouTube API

        const tag = document.createElement('script');

        tag.src = "https://www.youtube.com/iframe_api";

        const firstScriptTag = document.getElementsByTagName('script')[0];

        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);


        function onYouTubeIframeAPIReady() {

            player = new YT.Player('youtube-player', {

                height: '100%',

                width: '100%',

                playerVars: { 

                    'autoplay': 1, 

                    'controls': 1,

                    'rel': 0,

                    'modestbranding': 1

                },

                events: {

                    'onStateChange': onPlayerStateChange

                }

            });

        }


        function onPlayerStateChange(event) {

            // 0 = Ended

            if (event.data === YT.PlayerState.ENDED) {

                playNext();

            }

        }


        // --- 2. URL PARSING HELPER ---

        function extractVideoID(url) {

            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;

            const match = url.match(regExp);

            return (match && match[2].length === 11) ? match[2] : null;

        }


        // --- 3. CORE LOGIC ---

        

        async function processLink() {

            const input = document.getElementById('url-input');

            const errorMsg = document.getElementById('input-error');

            const btn = document.getElementById('btn-add');

            

            const url = input.value.trim();

            const videoId = extractVideoID(url);


            if (!videoId) {

                errorMsg.classList.remove('hidden');

                return;

            }

            errorMsg.classList.add('hidden');


            // UI Loading State

            input.disabled = true;

            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';


            try {

                // Fetch Title via NoEmbed (No API Key needed)

                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);

                const data = await response.json();

                

                const title = data.title || "Unknown Title";

                const thumb = `https://img.youtube.com/vi/${videoId}/default.jpg`;


                addToQueue({ id: videoId, title, thumb });

                

                // Reset Input

                input.value = '';

            } catch (e) {

                console.error("Meta fetch failed", e);

                // Fallback if fetch fails

                addToQueue({ id: videoId, title: "Linked Video", thumb: `https://img.youtube.com/vi/${videoId}/default.jpg` });

            } finally {

                input.disabled = false;

                btn.innerHTML = '<i class="fas fa-plus"></i>';

                input.focus();

            }

        }


        function addToQueue(video) {

            queue.push(video);

            updateQueueUI();


            // Auto-start if idle

            if (!isPlaying) {

                playNext();

            }

        }


        function playNext() {

            if (queue.length > 0) {

                const video = queue.shift();

                isPlaying = true;

                

                // UI Updates

                document.getElementById('idle-screen').classList.add('hidden');

                document.getElementById('np-title').innerText = video.title;

                document.getElementById('np-status').innerText = "NOW PLAYING";

                updateQueueUI();


                // Player Load

                player.loadVideoById(video.id);

            } else {

                isPlaying = false;

                document.getElementById('idle-screen').classList.remove('hidden');

                document.getElementById('np-title').innerText = "Queue Finished";

                document.getElementById('np-status').innerText = "IDLE";

                updateQueueUI();

            }

        }


        function skipSong() {

            playNext();

        }


        function removeFromQueue(index) {

            queue.splice(index, 1);

            updateQueueUI();

        }


        // --- 4. RENDER UI ---

        function updateQueueUI() {

            document.getElementById('queue-counter').innerText = `Queue: ${queue.length}`;

            const list = document.getElementById('queue-list');

            list.innerHTML = '';


            if (queue.length === 0) {

                list.innerHTML = '<div class="text-center text-gray-600 mt-10 text-sm">Queue is empty.</div>';

                return;

            }


            queue.forEach((video, index) => {

                const item = document.createElement('div');

                item.className = 'flex items-center p-2 bg-gray-800 rounded border border-gray-700 animate-enter group hover:bg-gray-700 transition';

                item.innerHTML = `

                    <div class="w-6 text-center text-gray-500 font-bold text-xs">${index + 1}</div>

                    <img src="${video.thumb}" class="w-10 h-8 object-cover rounded ml-2 bg-black">

                    <div class="ml-3 flex-1 min-w-0">

                        <div class="text-xs font-bold text-gray-200 truncate">${video.title}</div>

                    </div>

                    <button onclick="removeFromQueue(${index})" class="text-gray-500 hover:text-red-400 p-2 opacity-0 group-hover:opacity-100 transition">

                        <i class="fas fa-times"></i>

                    </button>

                `;

                list.appendChild(item);

            });

        }


        // Enter key support

        document.getElementById('url-input').addEventListener('keypress', function (e) {

            if (e.key === 'Enter') processLink();

        });


    </script>

</body>

</html>
