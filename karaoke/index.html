<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munch Karaoke Party</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-4xl font-black italic mb-8">MUNCH<span class="text-blue-500">KARAOKE</span></h1>
        
        <div id="login-section" class="space-y-4">
            <button id="btn-login" class="bg-white text-black font-bold py-3 px-8 rounded-full flex items-center gap-3">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5">
                Sign in with Google
            </button>
        </div>

        <div id="party-section" class="hidden space-y-4 w-full max-w-xs">
            <p class="text-slate-400 text-sm">Enter Party Code to Join</p>
            <input id="party-code-input" type="text" placeholder="e.g. PARTY123" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-center font-mono text-xl uppercase tracking-widest outline-none focus:border-blue-500">
            <button id="btn-join-party" class="w-full bg-blue-600 font-bold py-3 rounded-lg">JOIN SESSION</button>
        </div>
    </div>

    <nav class="h-16 border-b border-slate-800 flex items-center justify-between px-6 bg-slate-900">
        <div class="flex items-center gap-4">
            <span class="font-black italic text-xl">MUNCH</span>
            <span id="active-party-display" class="bg-slate-800 px-3 py-1 rounded text-[10px] font-mono text-blue-400"></span>
        </div>
        <div class="flex gap-4 items-center">
            <button id="nav-admin" class="text-xs text-slate-500 hover:text-white hidden">ADMIN SETUP</button>
            <button id="nav-main" class="text-xs text-blue-500 font-bold">MAIN PAGE</button>
            <img id="user-avatar" class="w-8 h-8 rounded-full border border-slate-700">
        </div>
    </nav>

    <main class="flex-1 overflow-hidden flex flex-col">
        
        <section id="view-admin" class="hidden flex-1 p-6 overflow-y-auto">
            <h2 class="text-2xl font-bold mb-6">Master Song Setup</h2>
            <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 mb-8 max-w-xl">
                <div class="grid gap-4">
                    <input id="setup-title" type="text" placeholder="Song Title" class="bg-black border border-slate-700 p-3 rounded-lg text-sm">
                    <input id="setup-artist" type="text" placeholder="Artist" class="bg-black border border-slate-700 p-3 rounded-lg text-sm">
                    <input id="setup-url" type="text" placeholder="YouTube URL" class="bg-black border border-slate-700 p-3 rounded-lg text-sm">
                    <button id="btn-save-master" class="bg-green-600 font-bold py-3 rounded-lg">SAVE TO LIBRARY</button>
                </div>
            </div>
        </section>

        <section id="view-main" class="flex-1 flex flex-col md:flex-row overflow-hidden">
            <div class="flex-1 bg-black relative min-h-[300px]">
                <div id="youtube-player"></div>
                <div id="idle-screen" class="absolute inset-0 flex items-center justify-center bg-slate-950 text-slate-700">
                    <i class="fas fa-microphone-alt text-6xl"></i>
                </div>
            </div>

            <div class="w-full md:w-96 border-l border-slate-800 flex flex-col bg-slate-950">
                <div class="p-4 border-b border-slate-800">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-3 text-slate-600"></i>
                        <input id="main-search" type="text" placeholder="Search song library..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-sm outline-none focus:border-blue-500">
                    </div>
                </div>
                
                <div id="search-results" class="hidden p-2 bg-slate-900 border-b border-slate-800 max-h-48 overflow-y-auto"></div>

                <div class="flex-1 overflow-y-auto p-4">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4">The Queue</h3>
                    <div id="queue-list" class="space-y-3"></div>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk6mub0hDCzJ5iDmV-61v3WLSHMC51JP4",
            authDomain: "munch-24119.firebaseapp.com",
            projectId: "munch-24119",
            storageBucket: "munch-24119.firebasestorage.app",
            messagingSenderId: "834099093086",
            appId: "1:834099093086:web:2f618d05d479f49e17decf",
            measurementId: "G-GRP6GVZVEY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser, player, partyCode, isPlaying = false;
        const ADMIN_EMAIL = "isaacjana.h@gmail.com"; // CHANGE THIS

        // --- AUTH & INITIALIZATION ---
        $('#btn-login').click(() => signInWithPopup(auth, provider));
        
        onAuthStateChanged(auth, user => {
            if (user) {
                currentUser = user;
                $('#login-section').addClass('hidden');
                $('#party-section').removeClass('hidden');
                $('#user-avatar').attr('src', user.photoURL);
                if(user.email === ADMIN_EMAIL) $('#nav-admin').removeClass('hidden');
            }
        });

        $('#btn-join-party').click(() => {
            partyCode = $('#party-code-input').val().toUpperCase();
            if(!partyCode) return alert("Enter a code!");
            $('#auth-overlay').addClass('hidden');
            $('#active-party-display').text("SESSION: " + partyCode);
            startQueueListener();
        });

        // --- ADMIN: SAVE TO MASTER LIBRARY ---
        $('#btn-save-master').click(async () => {
            const title = $('#setup-title').val();
            const artist = $('#setup-artist').val();
            const videoId = extractID($('#setup-url').val());

            if(!title || !videoId) return alert("Missing info!");

            await addDoc(collection(db, "songs"), {
                title, artist, videoId,
                searchKey: title.toLowerCase()
            });
            alert("Song added to library!");
            $('#setup-title, #setup-artist, #setup-url').val('');
        });

        // --- USER: SEARCH & QUEUE ---
        $('#main-search').on('input', async function() {
            const val = $(this).val().toLowerCase();
            if(val.length < 2) return $('#search-results').addClass('hidden');

            const q = query(collection(db, "songs"), where("searchKey", ">=", val), where("searchKey", "<=", val + '\uf8ff'));
            const snap = await getDocs(q);
            
            const $results = $('#search-results').empty().removeClass('hidden');
            snap.forEach(doc => {
                const song = doc.data();
                $results.append(`
                    <div onclick="window.queueSong('${song.videoId}', '${song.title.replace(/'/g, "")}')" class="p-2 hover:bg-slate-800 cursor-pointer text-xs flex justify-between">
                        <span>${song.title} - ${song.artist}</span>
                        <i class="fas fa-plus text-blue-500"></i>
                    </div>
                `);
            });
        });

        window.queueSong = async (videoId, name) => {
            await addDoc(collection(db, "munch_queue"), {
                name, videoId, partyCode,
                addedBy: currentUser.displayName,
                userPhoto: currentUser.photoURL,
                timestamp: serverTimestamp()
            });
            $('#main-search').val('');
            $('#search-results').addClass('hidden');
        };

        // --- REALTIME QUEUE ---
        function startQueueListener() {
            const q = query(collection(db, "munch_queue"), where("partyCode", "==", partyCode), orderBy("timestamp", "asc"));
            onSnapshot(q, snap => {
                const queue = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderQueue(queue);
                if(queue.length > 0 && !isPlaying) playSong(queue[0]);
            });
        }

        async function playSong(song) {
            isPlaying = true;
            player.loadVideoById(song.videoId);
            $('#idle-screen').addClass('hidden');
            await deleteDoc(doc(db, "munch_queue", song.id));
        }

        // --- UI HELPERS ---
        function renderQueue(list) {
            const $l = $('#queue-list').empty();
            list.forEach(s => {
                $l.append(`
                    <div class="flex items-center gap-3 p-3 bg-slate-900 border border-slate-800 rounded-lg">
                        <img src="${s.userPhoto}" class="w-8 h-8 rounded">
                        <div class="flex-1 truncate"><p class="text-xs font-bold">${s.name}</p></div>
                    </div>
                `);
            });
        }

        function extractID(url) {
            const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(reg);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Navigation
        $('#nav-admin').click(() => { $('#view-main').addClass('hidden'); $('#view-admin').removeClass('hidden'); });
        $('#nav-main').click(() => { $('#view-admin').addClass('hidden'); $('#view-main').removeClass('hidden'); });

        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('youtube-player', { height: '100%', width: '100%', playerVars: { 'autoplay': 1, 'controls': 1 } });
        };
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
