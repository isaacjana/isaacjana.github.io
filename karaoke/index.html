<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munch Karaoke - Pro Build</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --bg: #020617; }
        body { background-color: var(--bg); transition: all 0.5s ease; color: #f8fafc; }
        
        /* Party Vibe Variable overrides */
        .vibe-party { --accent: #f472b6; --bg: #0f0014; }

        /* Stage Layout */
        .stage-container { position: relative; background: #000; overflow: hidden; height: 100%; border-radius: 1rem; }
        #youtube-player { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .glass-dark { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .neo-timer { font-variant-numeric: tabular-nums; letter-spacing: -1px; }

        /* Scrubber Bar */
        #scrubber-container { height: 4px; background: rgba(255,255,255,0.1); width: 100%; position: absolute; bottom: 0; left: 0; }
        #scrubber-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.5s linear; box-shadow: 0 0 10px var(--accent); }

        @keyframes float-up { 
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-400px) scale(2); opacity: 0; }
        }
        .emoji-float {
            position: absolute; bottom: 20%; left: 50%; font-size: 4rem; pointer-events: none;
            animation: float-up 1.8s ease-out forwards; z-index: 100;
        }

        /* Queue Animations */
        .queue-item { animation: slideIn 0.4s ease-out forwards; }
        @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
        <div class="glass-dark p-10 rounded-3xl max-w-sm w-full shadow-2xl border-blue-500/20">
            <h1 class="text-4xl font-black italic mb-2 tracking-tighter">MUNCH<span class="text-blue-500 transition-colors">KARAOKE</span></h1>
            <div id="login-section">
                <button id="btn-login" class="w-full bg-white text-black font-bold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 transition hover:bg-slate-100 active:scale-95 shadow-xl">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5"> Login with Google
                </button>
            </div>
            <div id="party-section" class="hidden space-y-4 mt-6">
                <input id="party-code-input" type="text" placeholder="SESSION CODE" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-center font-mono text-2xl uppercase tracking-widest outline-none focus:border-blue-500 text-white">
                <button id="btn-join" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-4 rounded-xl transition shadow-lg shadow-blue-500/20">ENTER PARTY</button>
            </div>
        </div>
    </div>

    <header class="h-16 bg-slate-900/80 border-b border-slate-800 flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <span class="text-xl font-black italic text-blue-500 transition-colors tracking-tighter">MUNCH</span>
            <div id="session-tag" class="hidden flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-full text-[10px] font-mono text-blue-400">
                <span class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-pulse"></span> <span id="session-code-text"></span>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <button id="vibe-toggle" class="text-slate-500 hover:text-white transition text-lg"><i class="fas fa-wand-magic-sparkles"></i></button>
            <button id="nav-admin" class="hidden text-slate-500 hover:text-white"><i class="fas fa-cog text-lg"></i></button>
            <img id="user-pfp" class="w-9 h-9 rounded-full border-2 border-slate-700 p-0.5">
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden p-2 md:p-4 gap-4">
        
        <section id="view-main" class="flex-1 flex flex-col relative rounded-2xl overflow-hidden shadow-2xl">
            <div class="flex-1 stage-container">
                <div id="youtube-player"></div>
                
                <div id="scrubber-container"><div id="scrubber-bar"></div></div>

                <div id="idle-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 z-10 transition-opacity duration-1000">
                    <div id="qrcode" class="p-6 bg-white rounded-3xl mb-6 shadow-2xl"></div>
                    <div class="text-center">
                        <p class="text-blue-500 font-black uppercase tracking-[0.5em] text-xs mb-2">Scan & Join</p>
                        <h2 id="idle-code-display" class="text-6xl font-black text-white italic">---</h2>
                        <div id="last-played" class="mt-8 text-slate-500 text-xs italic font-medium"></div>
                    </div>
                </div>

                <div id="animation-layer" class="absolute inset-0 pointer-events-none z-30"></div>
            </div>

            <div id="stage-info-bar" class="h-24 bg-slate-900/90 border-t border-slate-800 flex items-center px-8 gap-6 z-40 transition-transform duration-500 translate-y-full">
                <div class="flex-1 min-w-0">
                    <p id="np-user-display" class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1"></p>
                    <h2 id="np-title-display" class="text-xl font-bold truncate italic text-white leading-tight"></h2>
                </div>
                <div class="text-right">
                    <div id="singer-timer" class="neo-timer text-blue-500 font-bold text-3xl tracking-tighter">00:00</div>
                    <p class="text-[8px] text-slate-500 font-black uppercase tracking-widest">Live Mic</p>
                </div>
            </div>
        </section>

        <aside class="w-full md:w-96 bg-slate-950/50 flex flex-col rounded-2xl border border-slate-800 shadow-2xl overflow-hidden">
            <div class="p-5 border-b border-slate-800 bg-slate-900/30">
                <div class="relative">
                    <i class="fas fa-search absolute left-4 top-4 text-slate-600 text-xs"></i>
                    <input id="song-search" type="text" placeholder="URL or Song Name..." class="w-full bg-slate-900 border border-slate-700 rounded-2xl py-3.5 pl-12 pr-4 text-sm outline-none focus:border-blue-500 transition-all text-white shadow-inner">
                    <div id="search-results" class="hidden absolute top-full left-0 w-full bg-slate-900 border border-slate-700 rounded-2xl mt-2 z-[60] p-2 shadow-2xl max-h-80 overflow-y-auto border-t-4 border-blue-500"></div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-6 no-scrollbar">
                <div class="flex items-center justify-between mb-8">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Up Next</h3>
                    <div class="flex gap-3">
                        <button id="btn-applause" class="w-12 h-12 rounded-full bg-yellow-500 text-black flex items-center justify-center shadow-lg shadow-yellow-500/20 active:scale-90 transition"><i class="fas fa-hands-clapping text-lg"></i></button>
                        <button onclick="window.playNext()" class="w-12 h-12 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center hover:text-white transition"><i class="fas fa-forward text-lg"></i></button>
                    </div>
                </div>
                <div id="queue-list" class="space-y-4"></div>
            </div>
        </aside>
    </main>

    <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-3xl p-8 shadow-2xl flex flex-col max-h-[90vh]">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold italic">Master Setup</h2>
            <button id="close-admin" class="text-slate-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-8 bg-black/40 p-4 rounded-2xl border border-slate-800">
            <input id="setup-title" type="text" placeholder="Song Title" class="bg-black border border-slate-800 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-white">
            <input id="setup-artist" type="text" placeholder="Artist" class="bg-black border border-slate-800 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-white">
            <input id="setup-url" type="text" placeholder="YouTube Link" class="md:col-span-2 bg-black border border-slate-800 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-white">
            <button id="btn-save-song" class="md:col-span-2 bg-blue-600 font-bold py-3 rounded-xl transition hover:bg-blue-500 shadow-xl shadow-blue-500/20">PUBLISH TO LIBRARY</button>
        </div>

        <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4">Master Library</h3>
        
        <div id="master-song-list" class="flex-1 overflow-y-auto space-y-2 pr-2 no-scrollbar">
            <p class="text-slate-600 text-center py-4 italic text-sm">Loading library...</p>
        </div>
    </div>

    <audio id="applause-sound" src="https://www.myinstants.com/media/sounds/applause-8.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, getDoc, setDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyCk6mub0hDCzJ5iDmV-61v3WLSHMC51JP4",
            authDomain: "munch-24119.firebaseapp.com",
            projectId: "munch-24119",
            storageBucket: "munch-24119.firebasestorage.app",
            messagingSenderId: "834099093086",
            appId: "1:834099093086:web:2f618d05d479f49e17decf",
            measurementId: "G-GRP6GVZVEY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser, player, sessionCode, isPlaying = false, timerInterval, scrubberInterval;

        // --- AUTH & INITIALIZATION ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                $('#user-pfp').attr('src', user.photoURL);
                $('#login-section').addClass('hidden');
                $('#party-section').removeClass('hidden');
                
                const code = new URLSearchParams(window.location.search).get('join');
                if(code) { $('#party-code-input').val(code); $('#btn-join').click(); }

                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) $('#nav-admin').removeClass('hidden');
            }
        });

        $('#btn-login').click(() => signInWithPopup(auth, provider));

        $('#btn-join').click(() => {
            sessionCode = $('#party-code-input').val().toUpperCase();
            if(!sessionCode) return;
            $('#auth-overlay').addClass('opacity-0 pointer-events-none');
            $('#session-code-text').text(sessionCode);
            $('#idle-code-display').text(sessionCode);
            
            const joinLink = window.location.origin + window.location.pathname + "?join=" + sessionCode;
            $('#qrcode').empty();
            new QRCode(document.getElementById("qrcode"), { text: joinLink, width: 220, height: 220, colorDark : "#000000", colorLight : "#ffffff" });

            initSync();
        });

        // --- THE PLAYER ENGINE ---
        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('youtube-player', { 
                host: 'https://www.youtube-nocookie.com',
                height: '100%', width: '100%', 
                playerVars: { 'autoplay': 1, 'controls': 1, 'origin': window.location.origin, 'rel': 0, 'modestbranding': 1 },
                events: { 
                    'onStateChange': (e) => { 
                        if(e.data === 0) { isPlaying = false; playNext(); }
                        if(e.data === 1) startScrubber(); // Playing
                        else stopScrubber();
                    },
                    'onError': (e) => { console.error("YT Error", e); playNext(); }
                }
            });
        };

        function startScrubber() {
            clearInterval(scrubberInterval);
            scrubberInterval = setInterval(() => {
                if(player && player.getDuration) {
                    const perc = (player.getCurrentTime() / player.getDuration()) * 100;
                    $('#scrubber-bar').css('width', perc + '%');
                }
            }, 1000);
        }
        function stopScrubber() { clearInterval(scrubberInterval); }

        // --- SYNC ENGINE ---
        function initSync() {
            onSnapshot(query(collection(db, "munch_queue"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "asc")), snap => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderQueue(list);
                if(list.length > 0 && !isPlaying && player) playNext(list[0]);
            });

            onSnapshot(doc(db, "session_status", sessionCode), (snap) => {
                const data = snap.data();
                if(data && data.startTime) {
                    $('#np-title-display').text(data.currentSong);
                    $('#np-user-display').text("Currently Singing: " + data.userName);
                    $('#last-played').text("Previously: " + data.currentSong);
                    updateTimer(data.startTime);
                }
            });

            onSnapshot(query(collection(db, "applause_events"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "desc")), (snap) => {
                snap.docChanges().forEach(change => { if (change.type === "added") handleApplause(); });
            });
        }

        function updateTimer(start) {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - start;
                const m = Math.floor(elapsed / 60000).toString().padStart(2, '0');
                const s = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
                $('#singer-timer').text(`${m}:${s}`);
            }, 1000);
        }

        async function playNext(song = null) {
            if(!player) return;
            if(song) {
                isPlaying = true;
                player.loadVideoById(song.videoId);
                $('#idle-screen').css('opacity', '0');
                $('#stage-info-bar').removeClass('translate-y-full');
                await setDoc(doc(db, "session_status", sessionCode), { currentSong: song.name, userName: song.userName, startTime: Date.now() });
                await deleteDoc(doc(db, "munch_queue", song.id));
            } else {
                isPlaying = false;
                $('#idle-screen').css('opacity', '1');
                $('#stage-info-bar').addClass('translate-y-full');
                $('#scrubber-bar').css('width', '0%');
            }
        }
        window.playNext = () => playNext();

        // --- INTERACTIONS ---
        $('#song-search').on('keypress', async function(e) {
            if (e.key === 'Enter') {
                const val = $(this).val().trim();
                const videoId = extractID(val);
                if(videoId) {
                    const resp = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                    const data = await resp.json();
                    window.queueItem(videoId, data.title || "Linked Song");
                } else {
                    const q = query(collection(db, "songs"), where("searchKey", ">=", val.toLowerCase()), where("searchKey", "<=", val.toLowerCase() + '\uf8ff'));
                    const snap = await getDocs(q);
                    const $res = $('#search-results').empty().removeClass('hidden');
                    snap.forEach(d => {
                        const s = d.data();
                        $res.append(`<div onclick="window.queueItem('${s.videoId}', '${s.title.replace(/'/g, "")}')" class="p-3 hover:bg-slate-800 rounded-xl cursor-pointer text-xs mb-1 transition-colors border border-transparent hover:border-blue-500"><b>${s.title}</b><br><span class="text-slate-500 uppercase">${s.artist}</span></div>`);
                    });
                }
            }
        });

        window.queueItem = async (videoId, name) => {
            await addDoc(collection(db, "munch_queue"), { name, videoId, sessionCode, userPhoto: currentUser.photoURL, userName: currentUser.displayName, timestamp: serverTimestamp() });
            $('#song-search').val(''); $('#search-results').addClass('hidden');
        };

        function handleApplause() {
            const emojis = ['👏', '🔥', '✨', '🎸', '🙌', '🎤'];
            const $e = $(`<div class="emoji-float">${emojis[Math.floor(Math.random()*emojis.length)]}</div>`);
            $e.css('left', (20 + Math.random() * 60) + '%');
            $('#animation-layer').append($e);
            setTimeout(() => $e.remove(), 1800);
            const s = document.getElementById('applause-sound');
            s.currentTime = 0; s.volume = 0.2; s.play().catch(()=>{});
        }

        // --- HELPERS ---
        function renderQueue(list) {
            const $l = $('#queue-list').empty();
            list.forEach(s => $l.append(`<div class="queue-item flex items-center gap-4 p-4 bg-slate-900 border border-slate-800 rounded-2xl shadow-inner"><img src="${s.userPhoto}" class="w-10 h-10 rounded-full border border-slate-700"><div><p class="text-[11px] font-bold text-slate-200">${s.name}</p><p class="text-[9px] text-blue-500 font-black uppercase">${s.userName}</p></div></div>`));
        }

        function extractID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        $('#vibe-toggle').click(() => $('body').toggleClass('vibe-party'));
        $('#close-admin').click(() => $('#admin-modal').addClass('hidden'));
        // Open Modal and Load List
        $('#nav-admin').click(() => {
            $('#admin-modal').removeClass('hidden');
            refreshMasterLibrary();
        });

        // Update Save logic to refresh list
        $('#btn-save-song').click(async () => {
            const title = $('#setup-title').val();
            const artist = $('#setup-artist').val();
            const url = $('#setup-url').val();
            const vid = extractID(url);
            
            if(title && vid) {
                await addDoc(collection(db, "songs"), { 
                    title, 
                    artist: artist || "Unknown Artist", 
                    videoId: vid, 
                    searchKey: title.toLowerCase(), 
                    createdAt: serverTimestamp() 
                });
                
                // Clear inputs
                $('#setup-title, #setup-artist, #setup-url').val('');
                // Refresh the list immediately
                refreshMasterLibrary();
            } else {
                alert("Please enter a title and a valid YouTube URL");
            }
        });
        $('#btn-applause').click(() => addDoc(collection(db, "applause_events"), { sessionCode, timestamp: serverTimestamp() }));
        
        // Function to load and display the library in the Admin Modal
        async function refreshMasterLibrary() {
            const $list = $('#master-song-list').empty();
            const q = query(collection(db, "songs"), orderBy("createdAt", "desc"));
            const snap = await getDocs(q);
            
            if (snap.empty) {
                $list.append('<p class="text-slate-600 text-center py-4">No songs in library.</p>');
                return;
            }

            snap.forEach(d => {
                const s = d.data();
                const id = d.id;
                $list.append(`
                    <div class="flex items-center justify-between p-3 bg-black/40 rounded-xl border border-slate-800 hover:border-slate-700 transition">
                        <div class="min-w-0">
                            <p class="text-sm font-bold truncate text-white">${s.title}</p>
                            <p class="text-[10px] text-slate-500 uppercase">${s.artist}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="window.deleteSong('${id}')" class="text-slate-600 hover:text-red-500 p-2 transition"><i class="fas fa-trash-can"></i></button>
                        </div>
                    </div>
                `);
            });
        }

        // Global delete function
        window.deleteSong = async (id) => {
            if(confirm("Remove this song from the library?")) {
                await deleteDoc(doc(db, "songs", id));
                refreshMasterLibrary();
            }
        }; 
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
