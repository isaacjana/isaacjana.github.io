<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munch Karaoke - Party Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .stage-bg { background: radial-gradient(circle at center, #1e293b 0%, #020617 100%); }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .loader-spin { border: 3px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #youtube-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
        <div class="glass p-10 rounded-3xl max-w-sm w-full shadow-2xl">
            <h1 class="text-4xl font-black italic mb-2">MUNCH<span class="text-blue-500">KARAOKE</span></h1>
            <div id="login-section" class="mt-8">
                <button id="btn-login" class="w-full bg-white text-black font-bold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 shadow-lg transition active:scale-95">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5"> Login with Google
                </button>
            </div>
            <div id="party-section" class="hidden mt-8 space-y-4">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Enter Party Code</p>
                <input id="party-code-input" type="text" placeholder="NYE2026" class="w-full bg-black border border-slate-700 rounded-xl p-4 text-center font-mono text-2xl uppercase tracking-widest outline-none focus:border-blue-500 text-white">
                <button id="btn-join" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-4 rounded-xl transition shadow-lg shadow-blue-500/20">JOIN PARTY</button>
            </div>
        </div>
    </div>

    <header class="h-16 bg-slate-900/80 border-b border-slate-800 flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <span class="text-xl font-black italic text-blue-500 tracking-tighter">MUNCH</span>
            <span id="session-tag" class="text-[10px] font-mono text-slate-500 bg-slate-800 px-2 py-1 rounded"></span>
        </div>
        <div class="flex items-center gap-6">
            <button id="nav-admin" class="hidden text-[10px] font-black text-slate-400 hover:text-white uppercase tracking-widest">Library Setup</button>
            <button id="nav-main" class="text-[10px] font-black text-blue-500 uppercase tracking-widest">Stage</button>
            <img id="user-pfp" class="w-8 h-8 rounded-full border border-slate-700 bg-slate-800">
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <section id="view-admin" class="hidden flex-1 p-8 overflow-y-auto">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                <div class="space-y-6">
                    <h2 class="text-2xl font-bold">Add to Master Library</h2>
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4 shadow-xl">
                        <input id="setup-title" type="text" placeholder="Song Title" class="w-full bg-black border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500">
                        <input id="setup-artist" type="text" placeholder="Artist Name" class="w-full bg-black border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500">
                        <input id="setup-url" type="text" placeholder="YouTube URL (Paste Link)" class="w-full bg-black border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500">
                        <button id="btn-save-song" class="w-full bg-green-600 hover:bg-green-500 font-bold py-3 rounded-xl transition">SAVE TO DATABASE</button>
                    </div>
                </div>
                <div>
                    <h2 class="text-2xl font-bold mb-6">Saved Songs</h2>
                    <div id="admin-catalog" class="space-y-2 max-h-[65vh] overflow-y-auto pr-3"></div>
                </div>
            </div>
        </section>

        <section id="view-main" class="flex-1 flex flex-col md:flex-row overflow-hidden">
            <div class="flex-1 bg-black relative stage-bg">
                <div id="player-status" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-950">
                    <div class="loader-spin mb-4"></div>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest animate-pulse">Initializing Stage...</p>
                </div>

                <div id="youtube-player"></div>
                
                <div id="idle-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 z-10 pointer-events-none transition-opacity duration-700">
                    <i class="fas fa-microphone-lines text-7xl text-slate-800 mb-4"></i>
                    <p class="text-slate-700 font-black uppercase text-xs tracking-widest">Waiting for a Singer</p>
                </div>
            </div>

            <aside class="w-full md:w-96 bg-slate-950 border-l border-slate-800 flex flex-col shadow-2xl">
                <div class="p-4 bg-slate-900/50 border-b border-slate-800">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-3.5 text-slate-600"></i>
                        <input id="song-search" type="text" placeholder="Search song library..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl py-3 pl-11 pr-4 text-sm focus:border-blue-500 outline-none">
                    </div>
                    <div id="search-results" class="hidden mt-3 max-h-56 overflow-y-auto space-y-2 pr-1"></div>
                </div>

                <div class="flex-1 overflow-y-auto p-6">
                    <div class="flex items-center justify-between mb-6">
                        <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Upcoming Lineup</span>
                        <button onclick="window.playNext()" class="text-[10px] font-black text-blue-500 uppercase hover:text-white transition">Skip <i class="fas fa-forward ml-1"></i></button>
                    </div>
                    <div id="queue-list" class="space-y-4"></div>
                </div>
            </aside>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, getDoc, setDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. FIREBASE INIT
        const firebaseConfig = {
            apiKey: "AIzaSyCk6mub0hDCzJ5iDmV-61v3WLSHMC51JP4",
            authDomain: "munch-24119.firebaseapp.com",
            projectId: "munch-24119",
            storageBucket: "munch-24119.firebasestorage.app",
            messagingSenderId: "834099093086",
            appId: "1:834099093086:web:2f618d05d479f49e17decf",
            measurementId: "G-GRP6GVZVEY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser, player, sessionCode;
        let isPlaying = false;
        let isPlayerReady = false;

        // AUTH & ADMIN DETECTION
        $('#btn-login').click(() => signInWithPopup(auth, provider));
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                $('#user-pfp').attr('src', user.photoURL);
                $('#login-section').addClass('hidden');
                $('#party-section').removeClass('hidden');
                
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) {
                    $('#nav-admin').removeClass('hidden');
                    loadMasterCatalog();
                }
            }
        });

        $('#btn-join').click(() => {
            sessionCode = $('#party-code-input').val().toUpperCase();
            if(!sessionCode) return;
            $('#auth-overlay').addClass('opacity-0 pointer-events-none');
            $('#session-tag').text("CODE: " + sessionCode);
            startSessionSync();
        });

        // ADMIN: CATALOG MANAGEMENT
        $('#btn-save-song').click(async () => {
            const title = $('#setup-title').val();
            const artist = $('#setup-artist').val() || "Unknown";
            const videoId = extractYTID($('#setup-url').val());

            if(!title || !videoId) return alert("Title and Valid YouTube Link required!");

            await addDoc(collection(db, "songs"), {
                title, artist, videoId,
                searchKey: title.toLowerCase(),
                createdAt: serverTimestamp()
            });
            $('#setup-title, #setup-artist, #setup-url').val('');
            loadMasterCatalog();
        });

        async function loadMasterCatalog() {
            const q = query(collection(db, "songs"), orderBy("createdAt", "desc"));
            const snap = await getDocs(q);
            const $cat = $('#admin-catalog').empty();
            snap.forEach(d => {
                const s = d.data();
                $cat.append(`
                    <div class="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex justify-between items-center group">
                        <div class="text-xs">
                            <p class="font-bold text-slate-200">${s.title}</p>
                            <p class="text-slate-500 uppercase tracking-tighter">${s.artist}</p>
                        </div>
                        <button onclick="window.trashSong('${d.id}')" class="text-slate-700 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `);
            });
        }
        window.trashSong = async (id) => { if(confirm("Delete this song from library?")) { await deleteDoc(doc(db, "songs", id)); loadMasterCatalog(); }};

        // USER SEARCH
        $('#song-search').on('input', async function() {
            const val = $(this).val().toLowerCase();
            if(val.length < 2) return $('#search-results').addClass('hidden');
            const q = query(collection(db, "songs"), where("searchKey", ">=", val), where("searchKey", "<=", val + '\uf8ff'));
            const snap = await getDocs(q);
            const $res = $('#search-results').empty().removeClass('hidden');
            
            snap.forEach(d => {
                const s = d.data();
                $res.append(`
                    <div onclick="window.sendToQueue('${s.videoId}', '${s.title.replace(/'/g, "")}')" class="p-3 bg-slate-900 border border-slate-800 rounded-xl cursor-pointer hover:border-blue-500 flex justify-between items-center">
                        <div class="text-[11px] truncate"><b>${s.title}</b><br><span class="text-slate-500 uppercase">${s.artist}</span></div>
                        <i class="fas fa-plus-circle text-blue-500"></i>
                    </div>
                `);
            });
        });

        window.sendToQueue = async (videoId, name) => {
            await addDoc(collection(db, "munch_queue"), { 
                name, videoId, sessionCode, 
                userPhoto: currentUser.photoURL, 
                userName: currentUser.displayName,
                timestamp: serverTimestamp() 
            });
            $('#song-search').val(''); $('#search-results').addClass('hidden');
        };

        // PLAYER ENGINE
        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 },
                events: {
                    'onReady': () => { isPlayerReady = true; $('#player-status').fadeOut(); },
                    'onStateChange': (e) => { if(e.data === 0) { isPlaying = false; } }
                }
            });
        };

        function startSessionSync() {
            const q = query(collection(db, "munch_queue"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "asc"));
            onSnapshot(q, snap => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderQueue(list);
                if(list.length > 0 && !isPlaying && isPlayerReady) autoPlay(list[0]);
            });
        }

        async function autoPlay(song) {
            isPlaying = true;
            player.loadVideoById(song.videoId);
            $('#idle-screen').addClass('opacity-0');
            await deleteDoc(doc(db, "munch_queue", song.id));
        }

        window.playNext = () => autoPlay();

        function renderQueue(list) {
            const $l = $('#queue-list').empty();
            list.forEach(s => {
                $l.append(`
                    <div class="flex items-center gap-4 p-4 bg-slate-900/80 border border-slate-800 rounded-2xl">
                        <img src="${s.userPhoto}" class="w-10 h-10 rounded-full border-2 border-slate-800">
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-bold truncate text-slate-200">${s.name}</p>
                            <p class="text-[9px] text-blue-500 font-black uppercase tracking-widest">${s.userName}</p>
                        </div>
                    </div>
                `);
            });
        }

        function extractYTID(url) {
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        $('#nav-admin').click(() => { $('#view-main').addClass('hidden'); $('#view-admin').removeClass('hidden'); });
        $('#nav-main').click(() => { $('#view-admin').addClass('hidden'); $('#view-main').removeClass('hidden'); });
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
