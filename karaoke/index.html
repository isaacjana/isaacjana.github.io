<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNCH KARAOKE - PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --bg: #020617; }
        body { background-color: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .vibe-party { --accent: #f472b6; --bg: #0f0014; }
        
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .stage-container { position: relative; background: #000; overflow: hidden; height: 100%; border-radius: 2rem; border: 4px solid #1e293b; }
        
        #youtube-player { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Status Glows */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .ready { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .idle { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

        #scrubber-bar { transition: width 0.5s linear; background: var(--accent); box-shadow: 0 0 15px var(--accent); }
        
        @keyframes float-up { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-400px) scale(2); opacity: 0; } }
        .emoji-float { position: absolute; bottom: 20%; left: 50%; font-size: 4rem; pointer-events: none; animation: float-up 1.8s ease-out forwards; z-index: 100; }
        
        .handle { cursor: grab; padding: 10px; color: #475569; }
        @media (max-width: 768px) { #view-main { display: none; } body { overflow-y: auto; } }
    </style>
</head>
<body>

    <div id="auth-overlay" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-6">
        <div class="glass p-10 rounded-[3rem] max-w-sm w-full text-center border-blue-500/20 shadow-2xl">
            <h1 class="text-5xl font-black italic mb-8 tracking-tighter">MUNCH<span class="text-blue-500">KARAOKE</span></h1>
            <div id="login-section">
                <button id="btn-login" class="w-full bg-white text-black font-bold py-5 rounded-3xl flex items-center justify-center gap-3 active:scale-95 transition">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-6"> Login with Google
                </button>
            </div>
            <div id="party-section" class="hidden space-y-4">
                <input id="party-code-input" type="text" placeholder="SESSION CODE" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-5 text-center font-mono text-3xl uppercase tracking-widest text-white outline-none">
                <button id="btn-join" class="w-full bg-blue-600 font-bold py-5 rounded-3xl text-white shadow-lg text-lg hover:bg-blue-500 transition">ENTER STAGE</button>
            </div>
        </div>
    </div>

    <header class="h-16 bg-slate-900/40 border-b border-slate-800 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-3">
            <div id="status-indicator" class="status-dot idle"></div>
            <span class="text-xl font-black italic text-blue-500 tracking-tighter uppercase">Munch</span>
        </div>
        <div class="flex items-center gap-4">
            <button id="vibe-toggle" class="text-slate-400"><i class="fas fa-wand-magic-sparkles"></i></button>
            <button id="nav-admin" class="hidden text-slate-400"><i class="fas fa-shield-halved"></i></button>
            <img id="user-pfp" class="w-8 h-8 rounded-full border border-slate-700">
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden p-2 md:p-4 gap-4">
        
        <section id="view-main" class="flex-1 flex flex-col relative rounded-[2.5rem] overflow-hidden bg-black shadow-2xl border-4 border-slate-900">
            <div class="flex-1 stage-container">
                <div id="player-container" class="w-full h-full">
                    <div id="youtube-player"></div>
                </div>
                
                <div id="idle-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 z-20 transition-opacity duration-1000">
                    <div id="qrcode" class="p-6 bg-white rounded-[2rem] shadow-2xl"></div>
                    <h2 id="idle-code-display" class="text-7xl font-black text-white italic mt-8 tracking-tighter">---</h2>
                    <p class="text-blue-500 font-bold uppercase tracking-[0.4em] text-[10px] mt-4 animate-pulse">Waiting for your request</p>
                </div>

                <div id="animation-layer" class="absolute inset-0 pointer-events-none z-30"></div>
            </div>

            <div id="stage-info-bar" class="h-24 bg-slate-900 flex items-center px-10 gap-8 z-40 transition-transform duration-500 translate-y-full border-t border-slate-800">
                <div class="flex-1 min-w-0">
                    <p id="np-user-display" class="text-blue-400 font-black uppercase text-[10px] tracking-widest mb-1"></p>
                    <h2 id="np-title-display" class="text-2xl font-bold truncate text-white italic"></h2>
                </div>
                <div id="singer-timer" class="text-white font-black text-4xl tabular-nums tracking-tighter">00:00</div>
            </div>
            <div class="h-1.5 bg-white/5 relative z-50">
                <div id="scrubber-bar" class="h-full w-0"></div>
            </div>
        </section>

        <aside class="w-full md:w-96 flex flex-col bg-slate-950/50 rounded-[2.5rem] border border-slate-800 overflow-hidden shadow-2xl">
            <div class="p-5 border-b border-slate-800">
                <div class="relative">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input id="song-search" type="text" placeholder="Search Song or Artist..." class="w-full bg-slate-900 border border-slate-700 rounded-2xl py-4 pl-12 pr-4 text-white focus:border-blue-500 outline-none transition-all">
                    <div id="search-results" class="hidden absolute top-full left-0 w-full bg-slate-900 border border-slate-700 rounded-2xl mt-3 z-[100] p-2 shadow-2xl max-h-96 overflow-y-auto"></div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-5 no-scrollbar">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Live Queue</h3>
                    <div class="flex gap-2">
                        <button id="btn-play-pause" class="admin-only hidden w-10 h-10 rounded-full bg-blue-500/20 text-blue-500 flex items-center justify-center transition"><i class="fas fa-play"></i></button>
                        <button onclick="window.stopPlayback()" class="admin-only hidden w-10 h-10 rounded-full bg-red-500/20 text-red-500 flex items-center justify-center transition"><i class="fas fa-stop"></i></button>
                        <button onclick="window.playNext()" class="admin-only hidden w-10 h-10 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center transition"><i class="fas fa-forward"></i></button>
                    </div>
                </div>
                <div id="queue-list" class="space-y-4"></div>
            </div>
            
            <div class="p-4 bg-slate-900/50 border-t border-slate-800 md:hidden">
                <button id="btn-applause-mobile" class="w-full bg-yellow-500 text-black font-black py-4 rounded-2xl flex items-center justify-center gap-3 shadow-xl"><i class="fas fa-hands-clapping"></i> SEND LOVE</button>
            </div>
        </aside>
    </main>

    <audio id="applause-sound" src="https://www.myinstants.com/media/sounds/applause-8.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, getDoc, setDoc, updateDoc, serverTimestamp, getDocs, limit, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk6mub0hDCzJ5iDmV-61v3WLSHMC51JP4",
            authDomain: "munch-24119.firebaseapp.com",
            projectId: "munch-24119",
            storageBucket: "munch-24119.firebasestorage.app",
            messagingSenderId: "834099093086",
            appId: "1:834099093086:web:2f618d05d479f49e17decf",
            measurementId: "G-GRP6GVZVEY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser, player, sessionCode, isPlaying = false, timerInterval, scrubberInterval;
        let isPlayerReady = false;

        // --- HANDSHAKE & PLAYER ---
        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'modestbranding': 1, 'iv_load_policy': 3 },
                events: {
                    'onReady': () => { isPlayerReady = true; console.log("Player Loaded"); },
                    'onStateChange': (e) => {
                        if(e.data === 0) playNext(); // Song ended
                        updateRemoteButton(e.data);
                    }
                }
            });
        };

        $('#btn-join').click(async () => {
            sessionCode = $('#party-code-input').val().toUpperCase();
            if(!sessionCode) return;
            
            // Interaction to enable sound/video
            $('#status-indicator').removeClass('idle').addClass('ready');
            $('#auth-overlay').fadeOut();
            $('#session-code-text, #idle-code-display').text(sessionCode);
            
            const joinLink = window.location.origin + window.location.pathname + "?join=" + sessionCode;
            $('#qrcode').empty();
            new QRCode(document.getElementById("qrcode"), { text: joinLink, width: 220, height: 220 });

            initSync();
        });

        // --- FIREBASE SYNC ---
        function initSync() {
            // Queue Management
            onSnapshot(query(collection(db, "munch_queue"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "asc")), snap => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderQueue(list);
                if(list.length > 0 && !isPlaying && window.innerWidth > 768) playNext(list[0]);
            });

            // Master Playback Sync
            onSnapshot(doc(db, "session_status", sessionCode), (snap) => {
                const data = snap.data();
                if(data && data.startTime) {
                    $('#np-title-display').text(data.currentSong);
                    $('#np-user-display').text("Singing: " + data.userName);
                    $('#idle-screen').css('opacity', '0').css('pointer-events', 'none');
                    $('#stage-info-bar').removeClass('translate-y-full');
                    updateTimer(data.startTime);

                    // Sync Stage Player
                    if(!isPlaying && player && window.innerWidth > 768) {
                        isPlaying = true;
                        player.loadVideoById(data.videoId);
                    }
                    
                    // Remote Play/Pause Sync
                    if(player && window.innerWidth > 768) {
                        data.isPaused ? player.pauseVideo() : player.playVideo();
                    }
                } else {
                    isPlaying = false;
                    if(player) player.stopVideo();
                    $('#idle-screen').css('opacity', '1').css('pointer-events', 'auto');
                    $('#stage-info-bar').addClass('translate-y-full');
                }
            });

            onSnapshot(query(collection(db, "applause_events"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "desc")), (snap) => {
                snap.docChanges().forEach(change => { if (change.type === "added") handleApplause(); });
            });
        }

        async function playNext(song = null) {
            if(!player) return;
            if(song) {
                isPlaying = true;
                await setDoc(doc(db, "session_status", sessionCode), { 
                    currentSong: song.name, userName: song.userName, 
                    startTime: Date.now(), videoId: song.videoId, isPaused: false 
                });
                if(song.id) await deleteDoc(doc(db, "munch_queue", song.id));
            } else {
                isPlaying = false;
                await setDoc(doc(db, "session_status", sessionCode), { currentSong: "", userName: "", startTime: null });
            }
        }
        window.playNext = () => playNext();

        window.stopPlayback = async () => {
            await setDoc(doc(db, "session_status", sessionCode), { currentSong: "", userName: "", startTime: null });
        };

        // REMOTE PAUSE/PLAY
        $('#btn-play-pause').click(async () => {
            const snap = await getDoc(doc(db, "session_status", sessionCode));
            if(snap.exists()) {
                const newState = !snap.data().isPaused;
                await updateDoc(doc(db, "session_status", sessionCode), { isPaused: newState });
            }
        });

        function updateRemoteButton(state) {
            const $btn = $('#btn-play-pause');
            if(state === 1) $btn.html('<i class="fas fa-pause"></i>').addClass('bg-orange-500/20 text-orange-500').removeClass('bg-blue-500/20 text-blue-500');
            else $btn.html('<i class="fas fa-play"></i>').addClass('bg-blue-500/20 text-blue-500').removeClass('bg-orange-500/20 text-orange-500');
        }

        // --- UI RENDER ---
        function renderQueue(list) {
            const $l = $('#queue-list').empty();
            const isAdmin = !$('#nav-admin').hasClass('hidden');
            list.forEach(s => {
                $l.append(`
                    <div data-id="${s.id}" class="flex items-center gap-4 p-4 bg-slate-900 border border-slate-800 rounded-3xl shadow-xl">
                        ${isAdmin ? '<div class="handle text-slate-700"><i class="fas fa-grip-vertical"></i></div>' : ''}
                        <img src="${s.userPhoto}" class="w-10 h-10 rounded-full border border-slate-700">
                        <div class="flex-1 min-w-0">
                            <p class="text-[11px] font-bold text-white truncate">${s.name}</p>
                            <p class="text-[9px] text-blue-500 font-black uppercase tracking-widest">${s.userName}</p>
                        </div>
                        ${isAdmin ? `
                            <button onclick="window.forcePlay('${s.id}')" class="w-8 h-8 bg-green-500/10 text-green-500 rounded-full text-[10px]"><i class="fas fa-play"></i></button>
                            <button onclick="window.removeFromQueue('${s.id}')" class="w-8 h-8 bg-red-500/10 text-red-500 rounded-full text-[10px]"><i class="fas fa-trash"></i></button>
                        ` : ''}
                    </div>`);
            });
        }

        // --- SEARCH ---
        $('#song-search').on('input', async function() {
            const val = $(this).val().trim();
            if(val.length < 2) return $('#search-results').addClass('hidden');
            const q = query(collection(db, "songs"), where("searchKey", ">=", val.toLowerCase()), where("searchKey", "<=", val.toLowerCase() + '\uf8ff'), limit(10));
            const snap = await getDocs(q);
            const $res = $('#search-results').empty().removeClass('hidden');
            snap.forEach(d => {
                const s = d.data();
                $res.append(`<div onclick="window.queueItem('${s.videoId}', '${s.title.replace(/'/g, "")}')" class="p-4 hover:bg-slate-800 rounded-2xl cursor-pointer text-sm mb-1 transition"><b>${s.title}</b><br><span class="text-[10px] text-slate-500 uppercase">${s.artist}</span></div>`);
            });
        });

        window.queueItem = async (videoId, name) => {
            await addDoc(collection(db, "munch_queue"), { 
                name, videoId, sessionCode, userPhoto: currentUser.photoURL, 
                userName: currentUser.displayName, timestamp: serverTimestamp() 
            });
            $('#song-search').val(''); $('#search-results').addClass('hidden');
        };

        // Sortable logic
        new Sortable(document.getElementById('queue-list'), {
            animation: 200, handle: '.handle',
            onEnd: async () => {
                const batch = writeBatch(db);
                $('#queue-list > div').each((i, el) => {
                    batch.update(doc(db, "munch_queue", $(el).data('id')), { timestamp: new Date(Date.now() + i * 1000) });
                });
                await batch.commit();
            }
        });

        // Helpers
        function startScrubber() { clearInterval(scrubberInterval); scrubberInterval = setInterval(() => { if(player?.getDuration) $('#scrubber-bar').css('width', (player.getCurrentTime()/player.getDuration()*100)+'%'); }, 1000); }
        function stopScrubber() { clearInterval(scrubberInterval); }
        function updateTimer(start) { clearInterval(timerInterval); timerInterval = setInterval(() => { const elapsed = Date.now() - start; const m = Math.floor(elapsed/60000).toString().padStart(2,'0'); const s = Math.floor((elapsed%60000)/1000).toString().padStart(2,'0'); $('#singer-timer').text(`${m}:${s}`); }, 1000); }
        function handleApplause() { const emojis = ['👏','🔥','✨','🎸','🙌']; const $e = $(`<div class="emoji-float">${emojis[Math.floor(Math.random()*emojis.length)]}</div>`).css('left', (20+Math.random()*60)+'%'); $('#animation-layer').append($e); setTimeout(()=> $e.remove(), 1800); document.getElementById('applause-sound').play().catch(()=>{}); }
        window.forcePlay = async (id) => { const s = await getDoc(doc(db, "munch_queue", id)); if(s.exists()) playNext({ id: s.id, ...s.data() }); };
        window.removeFromQueue = async (id) => { if(confirm("Remove?")) await deleteDoc(doc(db, "munch_queue", id)); };

        // --- AUTH & MISC ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                $('#user-pfp').attr('src', user.photoURL);
                $('#login-section').addClass('hidden');
                $('#party-section').removeClass('hidden');
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) $('#nav-admin, .admin-only').removeClass('hidden');
                const code = new URLSearchParams(window.location.search).get('join');
                if(code) { $('#party-code-input').val(code); $('#btn-join').click(); }
            }
        });
        $('#btn-login').click(() => signInWithPopup(auth, provider));
        $('#vibe-toggle').click(() => $('body').toggleClass('vibe-party'));
        $('#btn-applause-mobile').click(() => addDoc(collection(db, "applause_events"), { sessionCode, timestamp: serverTimestamp() }));
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
