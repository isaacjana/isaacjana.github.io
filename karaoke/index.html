<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNCH KARAOKE - PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            /* Violet */
            --secondary: #ec4899;
            /* Pink */
            --accent: #22c55e;
            /* Green */
            --bg: #030014;
            /* Deep Violet Black */
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(17, 24, 39, 0.7);
        }

        body {
            background-color: var(--bg);
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Animated Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--primary), transparent 70%);
            animation-duration: 25s;
        }

        .orb-2 {
            bottom: -20%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--secondary), transparent 70%);
            animation-delay: -5s;
            animation-duration: 30s;
        }

        .orb-3 {
            top: 40%;
            left: 40%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, #3b82f6, transparent 70%);
            animation-delay: -12s;
            animation-duration: 22s;
            opacity: 0.3;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 50px);
            }
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .stage-container {
            position: relative;
            background: #000;
            overflow: hidden;
            height: 100%;
            border-radius: 2rem;
            border: 4px solid #1e293b;
            box-shadow: 0 0 50px -10px var(--primary);
        }

        #youtube-player {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Inputs */
        input:focus,
        textarea:focus {
            box-shadow: 0 0 0 2px var(--primary), 0 0 20px var(--primary);
            border-color: var(--primary) !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-enter {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Floating Emojis */
        .emoji-float {
            position: absolute;
            bottom: 0;
            font-size: 3rem;
            animation: floatUp 3s ease-in forwards;
            pointer-events: none;
            z-index: 100;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }

            20% {
                opacity: 1;
                transform: translateY(-50px) scale(1.2);
            }

            100% {
                transform: translateY(-80vh) scale(1);
                opacity: 0;
            }
        }

        #toast-container {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: none;
            width: max-content;
        }

        .toast {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            font-size: 0.875rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            pointer-events: auto;
            display: flex;
            items-center;
            gap: 0.5rem;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            #view-main {
                display: none;
            }

            body {
                overflow-y: auto;
            }
        }
    </style>
</head>

<body>

    <div class="ambient-bg">
        <div class="orb orb-1"></div>

    <!-- Voting Mobile Overlay -->

        <div class="grid grid-cols-5 gap-2 mb-8">

            <button onclick="submitVote(3)"

            <button onclick="submitVote(4)"

    <header class="h-16 glass border-b-0 flex items-center justify-between px-6 z-50 shrink-0">

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden p-2 md:p-6 gap-6">
        <!-- Stage View -->
        <section id="view-main"
            class="flex-1 flex flex-col relative rounded-[2.5rem] overflow-hidden bg-black shadow-2xl ring-1 ring-white/10">
            <div class="flex-1 stage-container group">
                <div id="youtube-player"></div>

                <!-- Idle Screen -->
                <div id="idle-screen"

                    <div class="relative">

                    <div class="text-9xl font-black text-yellow-500 drop-shadow-2xl" id="final-score">0.0</div>

                <!-- Search Results -->

                    class="hidden absolute top-[4.5rem] left-4 right-4 bg-slate-900 border border-slate-700 rounded-2xl z-50 p-2 shadow-2xl max-h-64 overflow-y-auto custom-scroll ring-1 ring-black/50">

            <!-- Queue List -->

            <!-- Admin / Footer -->

                class="hidden p-4 bg-slate-900/60 border-t border-white/5 flex gap-3 backdrop-blur-sm">

                    class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-2xl active:scale-95 transition text-sm flex items-center justify-center gap-2">

                <button id="btn-admin-stop"
                    class="w-16 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-2xl active:scale-95 transition flex items-center justify-center">

    <!-- Admin Modal -->
    <div id="admin-modal"
        class="fixed inset-0 z-[200] bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div
            class="glass w-full max-w-4xl h-[85vh] rounded-[3rem] flex flex-col overflow-hidden shadow-2xl ring-1 ring-white/10 animate-enter">
            <div class="px-8 py-5 border-b border-white/5 flex justify-between items-center bg-slate-900/40">
                <h2 class="text-xl font-bold italic tracking-tight"><i class="fas fa-database text-green-500 mr-2"></i>
                    Master Library</h2>
                <button id="close-admin"
                    class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center transition text-slate-400 hover:text-white"><i
                        class="fas fa-times"></i></button>
            </div>
            <div class="p-6 border-b border-white/5 bg-slate-900/20 flex gap-4 items-center">
                <div class="flex-1">
                    <h3 class="text-xs font-bold text-slate-500 uppercase mb-2 tracking-wider">Remote Volume</h3>
                    <input type="range" id="volume-slider" min="0" max="100"
                        class="w-full accent-green-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
            <div class="p-6 border-b border-white/5 bg-slate-900/20">
                <h3 class="text-xs font-bold text-slate-500 uppercase mb-3 tracking-wider">Json Bulk Import</h3>
                <div class="flex gap-3">
                    <textarea id="bulk-input"
                        class="flex-1 bg-black/40 border border-white/10 rounded-xl p-3 text-xs font-mono h-20 focus:border-green-500/50 outline-none resize-none text-slate-300"
                        placeholder='[{"title":"Song Title", "artist":"Artist", "videoId":"..."}, ...]'></textarea>
                    <button id="btn-bulk-import"
                        class="bg-blue-600 hover:bg-blue-500 px-6 rounded-xl text-xs font-bold text-white shadow-lg active:scale-95 transition">IMPORT</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-2 custom-scroll" id="master-song-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, getDoc, setDoc, updateDoc, serverTimestamp, getDocs, limit, writeBatch, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk6mub0hDCzJ5iDmV-61v3WLSHMC51JP4",
            authDomain: "munch-24119.firebaseapp.com",
            projectId: "munch-24119",
            storageBucket: "munch-24119.firebasestorage.app",
            messagingSenderId: "834099093086",
            appId: "1:834099093086:web:2f618d05d479f49e17decf",
            measurementId: "G-GRP6GVZVEY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // State
        let currentUser = null;
        let player = null;
        let sessionCode = null;
        let isPlaying = false;

        // --- UTILS ---
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        function showToast(msg, type = 'info') {
            const container = $('#toast-container');
            const el = document.createElement('div');
            el.className = 'toast';
            const icon = type === 'error' ? 'fa-circle-exclamation text-red-500' : 'fa-check-circle text-green-500';
            el.innerHTML = `<i class="fas ${icon}"></i> <span>${msg}</span>`;
            container.appendChild(el);
            setTimeout(() => el.classList.add('show'), 10);
            setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        function extractID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // --- YOUTUBE API ---
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'modestbranding': 1, 'iv_load_policy': 3 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        };

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                // Instead of skipping immediately, start voting
                if (window.innerWidth > 768) startVotingSession();
            }
        }

        // --- AUTH & SETUP ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                $('#user-pfp').src = user.photoURL;
                $('#user-name-tooltip').textContent = user.displayName;
                $('#login-section').classList.add('hidden');
                $('#party-section').classList.remove('hidden');

                // Check Admin Override
                if (user.email === "isaacjana.h@gmail.com") {
                    $('#btn-make-admin').classList.remove('hidden');
                }

                // Check Admin Role
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) {
                    $('#admin-controls').classList.remove('hidden');
                    $('#nav-admin').classList.remove('hidden');
                    // Mobile view admin logic could go here
                }
            } else {
                $('#login-section').classList.remove('hidden');
                $('#party-section').classList.add('hidden');
            }
        });

        $('#btn-login').addEventListener('click', () => signInWithPopup(auth, provider));

        $('#btn-make-admin').addEventListener('click', async () => {
            if (!currentUser) return;
            await setDoc(doc(db, "users", currentUser.uid), {
                name: currentUser.displayName,
                email: currentUser.email,
                isAdmin: true
            });
            showToast("Admin privileges granted!", "success");
            setTimeout(() => location.reload(), 1000);
        });

        // --- SESSION JOIN ---
        $('#btn-join').addEventListener('click', joinSession);
        $('#party-code-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') joinSession(); });

        async function joinSession() {
            const codeInput = $('#party-code-input').value.trim().toUpperCase();
            if (!codeInput) {
                showToast("Please enter a session code", "error");
                return;
            }
            sessionCode = codeInput;

            // UI Transition
            $('#auth-overlay').style.opacity = '0';
            setTimeout(() => $('#auth-overlay').classList.add('hidden'), 500);

            $('#idle-code-display').textContent = sessionCode;

            // Generate QR
            $('#qrcode').innerHTML = '';
            new QRCode($('#qrcode'), {
                text: window.location.origin + window.location.pathname + "?join=" + sessionCode,
                width: 200, height: 200,
                colorDark: "#000000", colorLight: "#ffffff"
            });

            // Auto-play if ready
            if (player && player.playVideo) player.playVideo();

            $('#reaction-bar').classList.remove('hidden');

            initSync();
        }

        // --- SYNC ENGINE ---
        function initSync() {
            // Queue Listener
            onSnapshot(query(collection(db, "munch_queue"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "asc")), snap => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderQueueUI(list);

                // Auto-start if host (desktop) and not playing
                if (list.length > 0 && !isPlaying && window.innerWidth > 768) {
                    sendCommand('skip');
                }
            });

            // Command Listener
            onSnapshot(doc(db, "session_status", sessionCode), async (snap) => {
                const data = snap.data();
                // Only host (desktop) processes commands for playback
                if (!data || window.innerWidth < 768) return;

                if (data.command === 'skip') {
                    await handleSkipAction();
                    await updateDoc(doc(db, "session_status", sessionCode), { command: null });
                }
                if (data.command === 'stop') {
                    handleStopAction();
                    await updateDoc(doc(db, "session_status", sessionCode), { command: null });
                }

                // Volume Listener
                if (data.volume !== undefined && player && player.setVolume) {
                    player.setVolume(data.volume);
                }

                // Reaction Listener
                if (data.reaction && data.reaction.id !== lastReactionId) {
                    lastReactionId = data.reaction.id;
                    spawnFloatingEmoji(data.reaction.type);
                }
            });
        }

        let lastReactionId = 0;
        window.sendReaction = async (emoji) => {
            if (!sessionCode) return;
            // Optimistic UI for sender
            spawnFloatingEmoji(emoji);
            await setDoc(doc(db, "session_status", sessionCode), { reaction: { type: emoji, id: Date.now() } }, { merge: true });
        };

        function spawnFloatingEmoji(char) {
            const el = document.createElement('div');
            el.className = 'emoji-float';
            el.textContent = char;
            el.style.left = Math.random() * 80 + 10 + '%'; // Random horizontal
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }


        // --- VOTING LOGIC ---
        window.submitVote = async (stars) => {
            $('#voting-overlay').classList.add('hidden');
            showToast("Vote Submitted!");
            await updateDoc(doc(db, "session_status", sessionCode), { votes: arrayUnion(stars) });
        };

        async function startVotingSession() {
            await updateDoc(doc(db, "session_status", sessionCode), { status: 'voting', votes: [], finalScore: null });

            // TV Side: Wait 10s then calculate
            setTimeout(async () => {
                const snap = await getDoc(doc(db, "session_status", sessionCode));
                const votes = snap.data().votes || [];
                const avg = votes.length ? (votes.reduce((a, b) => a + b, 0) / votes.length).toFixed(1) : "0.0";

                // Show Score
                $('#score-display').classList.remove('hidden');
                $('#final-score').textContent = avg;
                await updateDoc(doc(db, "session_status", sessionCode), { status: 'idle', finalScore: avg });

                // Finish up
                setTimeout(async () => {
                    $('#score-display').classList.add('hidden');
                    sendCommand('skip');
                }, 4000); // Show score for 4s
            }, 10000); // 10s voting window
        }

        async function sendCommand(cmd, payload = null) {
            await setDoc(doc(db, "session_status", sessionCode), { command: cmd, payload }, { merge: true });
        }

        // --- PLAYBACK LOGIC (HOST) ---
        async function handleSkipAction() {
            const q = query(collection(db, "munch_queue"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "asc"), limit(1));
            const snap = await getDocs(q);

            if (!snap.empty) {
                const nextSong = snap.docs[0].data();
                const nextId = snap.docs[0].id;

                isPlaying = true;
                $('#idle-screen').style.opacity = '0';
                $('#stage-info-bar').classList.remove('translate-y-full');

                $('#np-title-display').textContent = nextSong.name;
                $('#np-user-display').textContent = "PERFORMING: " + nextSong.userName;

                if (player && player.loadVideoById) {
                    player.loadVideoById(nextSong.videoId);
                }

                await deleteDoc(doc(db, "munch_queue", nextId));
            } else {
                handleStopAction();
            }
        }

        function handleStopAction() {
            isPlaying = false;
            $('#idle-screen').style.opacity = '1';
            $('#stage-info-bar').classList.add('translate-y-full');
            if (player && player.stopVideo) player.stopVideo();
        }

        // --- SEARCH & QUEUE ---
        $('#btn-add').addEventListener('click', handleAddSong);
        $('#btn-lucky').addEventListener('click', handleLucky);
        $('#song-search').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAddSong(); });

        const luckySongs = [
            { id: 'fJ9rUzIMcZQ', t: 'Bohemian Rhapsody - Queen' },
            { id: 'lDK9QqIzhwk', t: 'Livin On A Prayer - Bon Jovi' },
            { id: 'Start,e-ORhEE9VVg', t: 'Blank Space - Taylor Swift' },
            { id: 'T5xCn87Pr9E', t: 'Don\'t Stop Believin\' - Journey' },
            { id: 'ftjEcrrf7r0', t: 'I Want It That Way - Backstreet Boys' },
            { id: 'P37xPiRz19o', t: 'Mr. Brightside - The Killers' },
            { id: 'V1bFr2SWP1I', t: 'Shallow - Lady Gaga & Bradley Cooper' },
            { id: 'Zi_XLOBDo_Y', t: 'Billie Jean - Michael Jackson' }
        ];

        async function handleLucky() {
            const song = luckySongs[Math.floor(Math.random() * luckySongs.length)];
            await queueItem(song.id, song.t);
            showToast(`🎲 Queued: ${song.t}`, "success");
        }

        let searchTimeout;
        $('#song-search').addEventListener('input', (e) => {
            const val = e.target.value.trim();
            clearTimeout(searchTimeout);

            // If it's a URL, don't search. If it's short, don't search.
            if (val.length > 1 && !extractID(val)) {
                searchTimeout = setTimeout(() => runLibrarySearch(val), 400);
            } else if (val.length === 0) {
                $('#search-results').classList.add('hidden');
            }
        });

        async function handleAddSong() {
            const input = $('#song-search');
            const val = input.value.trim();
            const videoId = extractID(val);

            if (videoId) {
                // It's a URL
                try {
                    input.disabled = true;
                    // Verify Embeddability via YouTube API
                    const details = await checkVideoDetails(videoId);

                    if (!details) {
                        showToast("Video not found or API error", "error");
                        return;
                    }

                    if (!details.embeddable) {
                        showToast("Video is not embeddable (restricted)", "error");
                        return;
                    }

                    await queueItem(videoId, details.title);
                    input.value = '';
                    showToast("Song queued!", "success");
                } catch (e) {
                    console.error(e);
                    showToast("Error checking video", "error");
                } finally {
                    input.disabled = false;
                    input.focus();
                }
            } else if (val.length > 1) {
                // It's a search term
                runLibrarySearch(val);
            }
        }

        async function checkVideoDetails(videoId) {
            try {
                const key = firebaseConfig.apiKey;
                const url = `https://www.googleapis.com/youtube/v3/videos?id=${videoId}&part=snippet,status&key=${key}`;
                const res = await fetch(url);
                const data = await res.json();

                if (!data.items || data.items.length === 0) return null;

                const item = data.items[0];
                return {
                    title: item.snippet.title,
                    embeddable: item.status.embeddable
                };
            } catch (e) {
                console.error("YouTube API Error", e);
                // Fallback to noembed if API fails (quota etc), but can't check embed status
                try {
                    const resp = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                    const data = await resp.json();
                    if (data.error) return null;
                    return { title: data.title, embeddable: true }; // Assume true on fallback
                } catch (err) {
                    return null;
                }
            }
        }

        async function runLibrarySearch(term) {
            const resContainer = $('#search-results');
            resContainer.innerHTML = '<div class="p-4 text-center text-xs text-slate-500"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
            resContainer.classList.remove('hidden');

            const q = query(collection(db, "songs"),
                where("searchKey", ">=", term.toLowerCase()),
                where("searchKey", "<=", term.toLowerCase() + '\uf8ff'),
                limit(10)
            );
            const snap = await getDocs(q);

            resContainer.innerHTML = '';
            if (snap.empty) {
                resContainer.innerHTML = '<div class="p-4 text-center text-xs text-slate-500">No matches found.</div>';
                return;
            }

            snap.forEach(d => {
                const s = d.data();
                const el = document.createElement('div');
                el.className = 'p-3 hover:bg-slate-800 rounded-xl cursor-pointer text-xs mb-1 flex items-center justify-between group transition-colors';
                el.innerHTML = `
                    <div class="font-bold text-slate-200 group-hover:text-white truncate pr-2">${s.title}</div>
                    <div class="text-[10px] text-slate-500 group-hover:text-slate-400">${s.artist || ''}</div>
                `;
                el.onclick = async () => {
                    await queueItem(s.videoId, s.title);
                    resContainer.classList.add('hidden');
                    $('#song-search').value = '';
                    showToast(`Added "${s.title}"`, "success");
                };
                resContainer.appendChild(el);
            });
        }

        async function queueItem(videoId, name) {
            await addDoc(collection(db, "munch_queue"), {
                name,
                videoId,
                sessionCode,
                userName: currentUser.displayName,
                userId: currentUser.uid, // STORE UID FOR DELETION CHECK
                timestamp: serverTimestamp()
            });
        }

        function renderQueueUI(list) {
            const listContainer = $('#queue-list');
            listContainer.innerHTML = '';

            if (list.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center p-8 opacity-30 mt-10">
                        <i class="fas fa-music text-4xl mb-3"></i>
                        <p class="text-xs font-bold uppercase">Queue is empty</p>
                    </div>
                `;
                return;
            }

            list.forEach((s) => {
                const el = document.createElement('div');
                el.className = 'flex items-center gap-3 p-3 bg-slate-900/60 border border-white/5 rounded-2xl animate-enter group hover:bg-slate-800/60 transition';

                // Check if user owns this song
                const isOwner = currentUser && s.userId === currentUser.uid;
                const deleteBtn = isOwner
                    ? `<button class="w-8 h-8 rounded-full bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white flex items-center justify-center transition opacity-0 group-hover:opacity-100 delete-btn"><i class="fas fa-trash text-xs"></i></button>`
                    : '';

                el.innerHTML = `
                    <img src="https://img.youtube.com/vi/${s.videoId}/default.jpg" class="w-12 h-9 rounded-lg object-cover shadow-sm bg-slate-800">
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-bold text-slate-200 truncate group-hover:text-white">${s.name}</p>
                        <p class="text-[9px] text-green-500 font-bold uppercase tracking-wide">${s.userName}</p>
                    </div>
                    ${deleteBtn}
                `;

                if (isOwner) {
                    const btn = el.querySelector('.delete-btn');
                    if (btn) btn.onclick = () => deleteQueueItem(s.id);
                }

                listContainer.appendChild(el);
            });
        }

        async function deleteQueueItem(docId) {
            if (confirm("Remove this song?")) {
                await deleteDoc(doc(db, "munch_queue", docId));
                showToast("Removed from queue");
            }
        }

        // --- ADMIN CONTROLS ---
        $('#btn-admin-skip').addEventListener('click', () => sendCommand('skip'));
        $('#btn-admin-stop').addEventListener('click', () => sendCommand('stop'));

        // Volume Control
        let volTimeout;
        $('#volume-slider').addEventListener('input', (e) => {
            clearTimeout(volTimeout);
            volTimeout = setTimeout(async () => {
                await updateDoc(doc(db, "session_status", sessionCode), { volume: parseInt(e.target.value) }, { merge: true });
            }, 200);
        });

        $('#nav-admin').addEventListener('click', () => {
            $('#admin-modal').classList.remove('hidden');
            loadMasterLibrary();
        });
        $('#close-admin').addEventListener('click', () => $('#admin-modal').classList.add('hidden'));

        async function loadMasterLibrary() {
            const list = $('#master-song-list');
            list.innerHTML = '<div class="text-center p-4"><i class="fas fa-spinner fa-spin text-green-500"></i></div>';

            const snap = await getDocs(query(collection(db, "songs"), limit(100)));
            list.innerHTML = '';

            snap.forEach(d => {
                const s = d.data();
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-3 bg-black/40 border border-white/5 rounded-2xl hover:bg-slate-800/40 transition';
                el.innerHTML = `
                    <div class="min-w-0 pr-4">
                        <p class="text-sm font-bold text-slate-200 truncate">${s.title}</p>
                        <p class="text-[10px] text-slate-500 uppercase">${s.artist || 'Unknown Artist'}</p>
                    </div>
                    <button class="text-slate-600 hover:text-red-500 p-2 transition del-btn"><i class="fas fa-trash"></i></button>
                `;
                el.querySelector('.del-btn').onclick = async () => {
                    if (confirm(`Delete "${s.title}"?`)) {
                        await deleteDoc(doc(db, "songs", d.id));
                        loadMasterLibrary(); // visual refresh
                    }
                };
                list.appendChild(el);
            });
        }

        $('#btn-bulk-import').addEventListener('click', async () => {
            try {
                const raw = $('#bulk-input').value;
                if (!raw) return;
                const list = JSON.parse(raw);
                if (!Array.isArray(list)) throw new Error("Not an array");

                const btn = $('#btn-bulk-import');
                const originalText = btn.textContent;
                btn.textContent = "VERIFYING...";
                btn.disabled = true;

                const batch = writeBatch(db);
                let validCount = 0;
                let ignoredCount = 0;

                for (const s of list) {
                    // Check embeddability if videoId is present
                    if (s.videoId) {
                        const details = await checkVideoDetails(s.videoId);
                        if (details && details.embeddable) {
                            const ref = doc(collection(db, "songs"));
                            batch.set(ref, {
                                title: s.title || details.title,
                                artist: s.artist || "",
                                videoId: s.videoId,
                                searchKey: (s.title || details.title).toLowerCase()
                            });
                            validCount++;
                        } else {
                            ignoredCount++;
                        }
                    }
                }

                if (validCount > 0) {
                    await batch.commit();
                    $('#bulk-input').value = '';
                    showToast(`Imported ${validCount} songs! (${ignoredCount} failed)`, "success");
                    loadMasterLibrary();
                } else {
                    showToast("No valid embeddable videos found.", "error");
                }

                btn.textContent = originalText;
                btn.disabled = false;

            } catch (e) {
                alert("Invalid JSON format or Error: " + e.message);
                $('#btn-bulk-import').textContent = "IMPORT";
                $('#btn-bulk-import').disabled = false;
            }
        });

        // Hide search results on click outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#song-search') && !e.target.closest('#search-results')) {
                $('#search-results').classList.add('hidden');
            }
        });

    </script>
</body>

</html>
