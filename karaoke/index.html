<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munch Karaoke - Ultimate Master Build</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --bg: #020617; }
        body { background-color: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; }
        .vibe-party { --accent: #f472b6; --bg: #0f0014; }
        .glass-dark { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        #scrubber-bar { transition: width 0.5s linear; box-shadow: 0 0 10px var(--accent); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .stage-container { position: relative; background: #000; overflow: hidden; height: 100%; border-radius: 1rem; }
        #youtube-player { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .emoji-float { position: absolute; bottom: 20%; left: 50%; font-size: 4rem; pointer-events: none; animation: float-up 1.8s ease-out forwards; z-index: 100; }
        @keyframes float-up { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-400px) scale(2); opacity: 0; } }
        
        /* Drag and Drop Styles */
        .sortable-ghost { opacity: 0.3; background: #3b82f6 !important; }
        .handle { cursor: grab; }
        .handle:active { cursor: grabbing; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="auth-overlay" class="fixed inset-0 z-[150] bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
        <div class="glass-dark p-10 rounded-3xl max-w-sm w-full shadow-2xl border-blue-500/20">
            <h1 class="text-4xl font-black italic mb-2 tracking-tighter">MUNCH<span class="text-blue-500">KARAOKE</span></h1>
            <div id="login-section">
                <button id="btn-login" class="w-full bg-white text-black font-bold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 transition hover:bg-slate-100 active:scale-95 shadow-xl">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5"> Login with Google
                </button>
            </div>
            <div id="party-section" class="hidden space-y-4 mt-6">
                <input id="party-code-input" type="text" placeholder="SESSION CODE" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-center font-mono text-2xl uppercase tracking-widest outline-none focus:border-blue-500 text-white">
                <button id="btn-join" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-4 rounded-xl transition shadow-lg shadow-blue-500/20 text-white">ENTER PARTY</button>
            </div>
        </div>
    </div>

    <header class="h-16 bg-slate-900/80 border-b border-slate-800 flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <span class="text-xl font-black italic text-blue-500 tracking-tighter">MUNCH</span>
            <div id="session-tag" class="hidden flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-full text-[10px] font-mono text-blue-400">
                <span class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-pulse"></span> <span id="session-code-text"></span>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <button id="vibe-toggle" class="text-slate-500 hover:text-white transition text-lg"><i class="fas fa-wand-magic-sparkles"></i></button>
            <button id="nav-admin" class="hidden text-slate-500 hover:text-white"><i class="fas fa-cog text-lg"></i></button>
            <img id="user-pfp" class="w-9 h-9 rounded-full border-2 border-slate-700 p-0.5">
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden p-2 md:p-4 gap-4">
        <section class="flex-1 flex flex-col relative rounded-2xl overflow-hidden shadow-2xl bg-black">
            <div class="flex-1 stage-container">
                <div id="youtube-player"></div>
                <div id="scrubber-container" class="h-1 bg-white/10 absolute bottom-0 left-0 w-full z-50"><div id="scrubber-bar" class="h-full bg-blue-500 w-0"></div></div>
                <div id="idle-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 z-10">
                    <div id="qrcode" class="p-6 bg-white rounded-3xl mb-6 shadow-2xl"></div>
                    <h2 id="idle-code-display" class="text-6xl font-black text-white italic">---</h2>
                </div>
                <div id="animation-layer" class="absolute inset-0 pointer-events-none z-[60]"></div>
            </div>
            
            <div id="stage-info-bar" class="h-24 bg-slate-900/90 border-t border-slate-800 flex items-center px-8 gap-6 z-40 transition-transform duration-500 translate-y-full">
                <div class="flex-1 min-w-0">
                    <p id="np-user-display" class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1"></p>
                    <h2 id="np-title-display" class="text-xl font-bold truncate text-white italic"></h2>
                </div>
                <div class="text-right">
                    <div id="singer-timer" class="text-blue-500 font-bold text-3xl tabular-nums">00:00</div>
                </div>
            </div>
        </section>

        <aside class="w-full md:w-96 bg-slate-950/50 flex flex-col rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
            <div class="p-5 border-b border-slate-800 bg-slate-900/30">
                <div class="relative">
                    <i class="fas fa-search absolute left-4 top-4 text-slate-600 text-xs"></i>
                    <input id="song-search" type="text" placeholder="Find a song..." class="w-full bg-slate-900 border border-slate-700 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-white focus:border-blue-500 outline-none">
                    <div id="search-results" class="hidden absolute top-full left-0 w-full bg-slate-900 border border-slate-700 rounded-2xl mt-2 z-[100] p-2 shadow-2xl max-h-80 overflow-y-auto"></div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-6 no-scrollbar">
                <div class="flex items-center justify-between mb-8">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Up Next</h3>
                    <div class="flex gap-2">
                        <button id="btn-applause" class="w-10 h-10 rounded-full bg-yellow-500 text-black flex items-center justify-center shadow-lg"><i class="fas fa-hands-clapping"></i></button>
                        <button onclick="window.stopPlayback()" class="w-10 h-10 rounded-full bg-red-500/20 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition"><i class="fas fa-stop"></i></button>
                        <button onclick="window.playNext()" class="w-10 h-10 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center hover:text-white transition"><i class="fas fa-forward"></i></button>
                    </div>
                </div>
                <div id="queue-list" class="space-y-3"></div>
            </div>
        </aside>
    </main>

    <div id="admin-modal" class="fixed inset-0 z-[200] bg-slate-950/95 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-5xl h-[85vh] rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                <div class="flex gap-8">
                    <button onclick="window.switchAdminTab('library')" class="admin-tab-btn active text-blue-500 font-bold text-sm" data-tab="library">LIBRARY MANAGER</button>
                    <button onclick="window.switchAdminTab('bulk')" class="admin-tab-btn text-slate-500 hover:text-white font-bold text-sm" data-tab="bulk">BULK IMPORT</button>
                </div>
                <button id="close-admin" class="text-slate-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>

            <div id="tab-library" class="admin-tab-content flex-1 flex flex-col md:flex-row overflow-hidden">
                <div class="w-full md:w-80 p-6 border-r border-slate-800 bg-black/20 overflow-y-auto">
                    <h3 id="editor-title" class="text-xs font-black text-blue-500 uppercase mb-4 tracking-widest">Add Song</h3>
                    <div class="space-y-4">
                        <input id="edit-id" type="hidden">
                        <input id="setup-title" type="text" placeholder="Song Title" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:border-blue-500 outline-none">
                        <input id="setup-artist" type="text" placeholder="Artist Name" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:border-blue-500 outline-none">
                        <select id="setup-genre" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-400 outline-none">
                            <option value="Pop">Pop</option><option value="Rock">Rock</option><option value="R&B">R&B</option>
                            <option value="Country">Country</option><option value="Anime">Anime</option>
                        </select>
                        <input id="setup-url" type="text" placeholder="YouTube URL" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:border-blue-500 outline-none">
                        <div class="flex gap-2">
                            <button id="btn-save-song" class="flex-1 bg-blue-600 font-bold py-3 rounded-xl text-white text-sm">SAVE</button>
                            <button id="btn-reset-editor" class="hidden px-4 bg-slate-800 rounded-xl hover:bg-slate-700"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                </div>
                <div class="flex-1 flex flex-col bg-slate-900/20">
                    <div class="p-4 bg-slate-900/40"><input id="master-filter" type="text" placeholder="Filter library..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white outline-none"></div>
                    <div id="master-song-list" class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar"></div>
                    <div class="p-4 border-t border-slate-800 flex justify-between items-center bg-slate-950">
                        <button id="prev-page" class="px-4 py-2 bg-slate-800 rounded-lg text-xs font-bold disabled:opacity-20">PREV</button>
                        <span id="page-info" class="text-[10px] text-slate-500 font-mono">PAGE 1</span>
                        <button id="next-page" class="px-4 py-2 bg-slate-800 rounded-lg text-xs font-bold disabled:opacity-20">NEXT</button>
                    </div>
                </div>
            </div>

            <div id="tab-bulk" class="admin-tab-content hidden flex-1 p-8 flex flex-col">
                <textarea id="bulk-input" class="flex-1 bg-black border border-slate-800 rounded-2xl p-6 font-mono text-xs text-blue-400 outline-none" placeholder='[{"title": "Song A", "artist": "Artist A", "videoId": "abc12345"}]'></textarea>
                <div class="mt-6 flex justify-end"><button id="btn-run-import" class="bg-green-600 text-white font-bold py-4 px-10 rounded-2xl shadow-xl">START IMPORT</button></div>
            </div>
        </div>
    </div>

    <audio id="applause-sound" src="https://www.myinstants.com/media/sounds/applause-8.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, getDoc, setDoc, updateDoc, serverTimestamp, getDocs, limit, startAfter, endBefore, limitToLast, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk6mub0hDCzJ5iDmV-61v3WLSHMC51JP4",
            authDomain: "munch-24119.firebaseapp.com",
            projectId: "munch-24119",
            storageBucket: "munch-24119.firebasestorage.app",
            messagingSenderId: "834099093086",
            appId: "1:834099093086:web:2f618d05d479f49e17decf",
            measurementId: "G-GRP6GVZVEY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser, player, sessionCode, isPlaying = false, timerInterval, scrubberInterval;
        let lastVisible = null, firstVisible = null, currentPage = 1, currentFilter = "";
        const PAGE_SIZE = 12;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                $('#user-pfp').attr('src', user.photoURL);
                $('#login-section').addClass('hidden');
                $('#party-section').removeClass('hidden');
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) $('#nav-admin').removeClass('hidden');
            }
        });

        $('#btn-login').click(() => signInWithPopup(auth, provider));
        $('#btn-join').click(() => {
            sessionCode = $('#party-code-input').val().toUpperCase();
            if(!sessionCode) return;
            $('#auth-overlay').addClass('opacity-0 pointer-events-none');
            $('#session-code-text, #idle-code-display').text(sessionCode);
            new QRCode(document.getElementById("qrcode"), { text: window.location.href + "?join=" + sessionCode, width: 220, height: 220 });
            initSync();
        });

        // --- MASTER LIBRARY ---
        async function loadMasterLibrary(direction = 'next') {
            const $list = $('#master-song-list').empty();
            let q;
            const songsRef = collection(db, "songs");

            if (currentFilter) {
                q = query(songsRef, where("searchKey", ">=", currentFilter.toLowerCase()), where("searchKey", "<=", currentFilter.toLowerCase() + '\uf8ff'), limit(PAGE_SIZE));
            } else {
                if (direction === 'next' && lastVisible) q = query(songsRef, orderBy("createdAt", "desc"), startAfter(lastVisible), limit(PAGE_SIZE));
                else if (direction === 'prev' && firstVisible) q = query(songsRef, orderBy("createdAt", "desc"), endBefore(firstVisible), limitToLast(PAGE_SIZE));
                else q = query(songsRef, orderBy("createdAt", "desc"), limit(PAGE_SIZE));
            }

            const snap = await getDocs(q);
            if (snap.empty) return $list.append('<p class="text-center py-10 opacity-30 italic">No songs found.</p>');
            firstVisible = snap.docs[0]; lastVisible = snap.docs[snap.docs.length - 1];

            snap.forEach(d => {
                const s = d.data();
                $list.append(`
                    <div class="flex items-center justify-between p-3 bg-black/40 border border-slate-800 rounded-xl group hover:border-blue-500/50">
                        <div class="min-w-0"><p class="text-sm font-bold text-white truncate">${s.title}</p><p class="text-[10px] text-slate-500 uppercase">${s.artist} • ${s.genre}</p></div>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                            <button onclick="window.editSong('${d.id}')" class="p-2 text-blue-400 hover:text-white"><i class="fas fa-edit"></i></button>
                            <button onclick="window.deleteSong('${d.id}')" class="p-2 text-red-500 hover:text-white"><i class="fas fa-trash-can"></i></button>
                        </div>
                    </div>`);
            });
            $('#page-info').text(`PAGE ${currentPage}`);
            $('#prev-page').prop('disabled', currentPage === 1 || !!currentFilter);
            $('#next-page').prop('disabled', snap.docs.length < PAGE_SIZE || !!currentFilter);
        }

        $('#btn-save-song').click(async () => {
            const id = $('#edit-id').val(), title = $('#setup-title').val(), artist = $('#setup-artist').val(), genre = $('#setup-genre').val(), vid = extractID($('#setup-url').val());
            if(!title || !vid) return;
            const data = { title, artist, genre, videoId: vid, searchKey: title.toLowerCase(), updatedAt: serverTimestamp() };
            if(id) await updateDoc(doc(db, "songs", id), data);
            else await addDoc(collection(db, "songs"), { ...data, createdAt: serverTimestamp() });
            window.resetEditor(); loadMasterLibrary();
        });

        window.editSong = async (id) => {
            const s = (await getDoc(doc(db, "songs", id))).data();
            $('#edit-id').val(id); $('#setup-title').val(s.title); $('#setup-artist').val(s.artist); $('#setup-genre').val(s.genre); $('#setup-url').val(`https://www.youtube.com/watch?v=${s.videoId}`);
            $('#editor-title').text("Edit Song"); $('#btn-reset-editor').removeClass('hidden');
        };

        window.deleteSong = async (id) => { if(confirm("Delete song?")) { await deleteDoc(doc(db, "songs", id)); loadMasterLibrary(); } };
        window.resetEditor = () => { $('#edit-id, #setup-title, #setup-artist, #setup-url').val(''); $('#editor-title').text("Add Song"); $('#btn-reset-editor').addClass('hidden'); };
        $('#btn-reset-editor').click(window.resetEditor);

        // --- QUEUE ENGINE (SORTABLE) ---
        let currentQueue = [];
        const sortable = new Sortable(document.getElementById('queue-list'), {
            animation: 150, handle: '.handle', ghostClass: 'sortable-ghost',
            onEnd: async () => {
                const isAdmin = !$('#nav-admin').hasClass('hidden');
                if(!isAdmin) return initSync(); // Re-sync if unauthorized
                
                const batch = writeBatch(db);
                const items = $('#queue-list > div').toArray();
                items.forEach((el, i) => {
                    const id = $(el).data('id');
                    const ref = doc(db, "munch_queue", id);
                    batch.update(ref, { timestamp: new Date(Date.now() + i * 1000) }); // Artificial delay for ordering
                });
                await batch.commit();
            }
        });

        function renderQueue(list) {
            currentQueue = list;
            const $l = $('#queue-list').empty();
            const isAdmin = !$('#nav-admin').hasClass('hidden');

            list.forEach(s => {
                $l.append(`
                    <div data-id="${s.id}" class="flex items-center gap-3 p-3 bg-slate-900 border border-slate-800 rounded-2xl shadow-inner">
                        ${isAdmin ? '<div class="handle text-slate-600 px-1"><i class="fas fa-grip-vertical"></i></div>' : ''}
                        <img src="${s.userPhoto}" class="w-8 h-8 rounded-full border border-slate-700">
                        <div class="flex-1 min-w-0">
                            <p class="text-[11px] font-bold text-slate-200 truncate">${s.name}</p>
                            <p class="text-[9px] text-blue-500 font-black uppercase tracking-widest">${s.userName}</p>
                        </div>
                        ${isAdmin ? `
                        <div class="flex gap-1">
                            <button onclick="window.forcePlay('${s.id}')" class="w-7 h-7 rounded-full bg-green-500/20 text-green-500 hover:bg-green-500 hover:text-white transition text-[10px]"><i class="fas fa-play"></i></button>
                            <button onclick="window.removeFromQueue('${s.id}')" class="w-7 h-7 rounded-full bg-red-500/20 text-red-500 hover:bg-red-500 hover:text-white transition text-[10px]"><i class="fas fa-trash"></i></button>
                        </div>` : ''}
                    </div>`);
            });
        }

        window.forcePlay = async (id) => { 
            const song = currentQueue.find(x => x.id === id); 
            if(song) playNext(song); 
        };
        window.removeFromQueue = async (id) => { if(confirm("Remove?")) await deleteDoc(doc(db, "munch_queue", id)); };
        window.stopPlayback = async () => {
            if(player) player.stopVideo(); isPlaying = false;
            $('#idle-screen').css('opacity', '1'); $('#stage-info-bar').addClass('translate-y-full');
            await setDoc(doc(db, "session_status", sessionCode), { currentSong: "", userName: "", startTime: null });
        };

        // --- YOUTUBE & SYNC ---
        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('youtube-player', {
                host: 'https://www.youtube-nocookie.com', height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 1, 'origin': window.location.origin, 'rel': 0 },
                events: { 'onStateChange': (e) => { if(e.data === 0) { isPlaying = false; playNext(); } if(e.data === 1) startScrubber(); else stopScrubber(); } }
            });
        };

        function initSync() {
            onSnapshot(query(collection(db, "munch_queue"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "asc")), snap => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderQueue(list);
                if(list.length > 0 && !isPlaying && player) playNext(list[0]);
            });
            onSnapshot(doc(db, "session_status", sessionCode), (snap) => {
                const data = snap.data();
                if(data?.startTime) {
                    $('#np-title-display').text(data.currentSong); $('#np-user-display').text("Singing: " + data.userName);
                    updateTimer(data.startTime);
                }
            });
            onSnapshot(query(collection(db, "applause_events"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "desc")), (snap) => {
                snap.docChanges().forEach(change => { if (change.type === "added") handleApplause(); });
            });
        }

        async function playNext(song = null) {
            if(!player) return;
            if(song) {
                isPlaying = true; player.loadVideoById(song.videoId);
                $('#idle-screen').css('opacity', '0'); $('#stage-info-bar').removeClass('translate-y-full');
                await setDoc(doc(db, "session_status", sessionCode), { currentSong: song.name, userName: song.userName, startTime: Date.now() });
                await deleteDoc(doc(db, "munch_queue", song.id));
            } else {
                isPlaying = false; $('#idle-screen').css('opacity', '1'); $('#stage-info-bar').addClass('translate-y-full');
            }
        }
        window.playNext = () => playNext();

        function startScrubber() { clearInterval(scrubberInterval); scrubberInterval = setInterval(() => { if(player?.getDuration) $('#scrubber-bar').css('width', (player.getCurrentTime()/player.getDuration()*100)+'%'); }, 1000); }
        function stopScrubber() { clearInterval(scrubberInterval); }
        function updateTimer(start) { clearInterval(timerInterval); timerInterval = setInterval(() => { const elapsed = Date.now() - start; const m = Math.floor(elapsed/60000).toString().padStart(2,'0'); const s = Math.floor((elapsed%60000)/1000).toString().padStart(2,'0'); $('#singer-timer').text(`${m}:${s}`); }, 1000); }
        function handleApplause() { const emojis = ['👏','🔥','✨','🎸','🙌']; const $e = $(`<div class="emoji-float">${emojis[Math.floor(Math.random()*emojis.length)]}</div>`).css('left', (20+Math.random()*60)+'%'); $('#animation-layer').append($e); setTimeout(()=> $e.remove(), 1800); document.getElementById('applause-sound').play().catch(()=>{}); }
        function extractID(url) { const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/; const match = url.match(regExp); return (match && match[2].length === 11) ? match[2] : url; }

        // General Events
        $('#song-search').on('keypress', async function(e) {
            if (e.key === 'Enter') {
                const val = $(this).val().trim();
                const q = query(collection(db, "songs"), where("searchKey", ">=", val.toLowerCase()), where("searchKey", "<=", val.toLowerCase() + '\uf8ff'), limit(10));
                const snap = await getDocs(q);
                const $res = $('#search-results').empty().removeClass('hidden');
                snap.forEach(d => { const s = d.data(); $res.append(`<div onclick="window.queueItem('${s.videoId}', '${s.title.replace(/'/g, "")}')" class="p-3 hover:bg-slate-800 rounded-xl cursor-pointer text-xs mb-1"><b>${s.title}</b><br><span class="text-slate-500 uppercase">${s.artist}</span></div>`); });
            }
        });

        window.queueItem = async (videoId, name) => { await addDoc(collection(db, "munch_queue"), { name, videoId, sessionCode, userPhoto: currentUser.photoURL, userName: currentUser.displayName, timestamp: serverTimestamp() }); $('#song-search').val(''); $('#search-results').addClass('hidden'); };
        $('#vibe-toggle').click(() => $('body').toggleClass('vibe-party'));
        $('#nav-admin').click(() => { $('#admin-modal').removeClass('hidden'); loadMasterLibrary(); });
        $('#close-admin').click(() => $('#admin-modal').addClass('hidden'));
        window.switchAdminTab = (tab) => { $('.admin-tab-content').addClass('hidden'); $(`#tab-${tab}`).removeClass('hidden'); $('.admin-tab-btn').removeClass('active text-blue-500').addClass('text-slate-500'); $(`[data-tab="${tab}"]`).addClass('active text-blue-500'); if(tab === 'library') loadMasterLibrary(); };
        $('#btn-run-import').click(async () => { try { const list = JSON.parse($('#bulk-input').val()); for(let item of list) await addDoc(collection(db, "songs"), { ...item, searchKey: item.title.toLowerCase(), createdAt: serverTimestamp() }); alert("Done!"); window.switchAdminTab('library'); } catch(e) { alert(e); } });
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
