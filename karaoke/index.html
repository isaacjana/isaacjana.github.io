<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNCH KARAOKE - PRO MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --bg: #020617; }
        body { background-color: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .stage-container { position: relative; background: #000; overflow: hidden; height: 100%; border-radius: 2rem; border: 4px solid #1e293b; }
        #youtube-player { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #scrubber-bar { transition: width 0.5s linear; background: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .status-ready { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .status-idle { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        @keyframes float-up { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-400px) scale(2); opacity: 0; } }
        .emoji-float { position: absolute; bottom: 20%; left: 50%; font-size: 4rem; pointer-events: none; animation: float-up 1.8s ease-out forwards; z-index: 100; }
        @media (max-width: 768px) { #view-main { display: none; } body { overflow-y: auto; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="auth-overlay" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-6 text-center">
        <div class="glass p-10 rounded-[3rem] max-w-sm w-full border-blue-500/20 shadow-2xl">
            <h1 class="text-4xl font-black italic mb-8 tracking-tighter uppercase">Munch<span class="text-blue-500">Karaoke</span></h1>
            <div id="login-section">
                <button id="btn-login" class="w-full bg-white text-black font-bold py-4 rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5"> Login with Google
                </button>
            </div>
            <div id="party-section" class="hidden space-y-4">
                <input id="party-code-input" type="text" placeholder="CODE" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-center font-mono text-2xl uppercase text-white outline-none">
                <button id="btn-join" class="w-full bg-blue-600 font-bold py-4 rounded-xl text-white shadow-lg">ENTER STAGE</button>
            </div>
        </div>
    </div>

    <header class="h-16 bg-slate-900/40 border-b border-slate-800 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-3">
            <div id="status-dot" class="w-2.5 h-2.5 rounded-full status-idle"></div>
            <span class="text-xl font-black italic text-blue-500 tracking-tighter uppercase">Munch</span>
        </div>
        <div class="flex items-center gap-4">
            <button id="nav-admin" class="hidden text-slate-400 p-2"><i class="fas fa-cog text-lg"></i></button>
            <img id="user-pfp" class="w-8 h-8 rounded-full border border-slate-700">
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden p-2 md:p-4 gap-4">
        <section id="view-main" class="flex-1 flex flex-col relative rounded-[2.5rem] overflow-hidden bg-black shadow-2xl">
            <div class="flex-1 stage-container">
                <div id="youtube-player"></div>
                <div id="idle-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 z-20">
                    <div id="qrcode" class="p-6 bg-white rounded-[2rem] shadow-2xl"></div>
                    <h2 id="idle-code-display" class="text-6xl font-black text-white italic mt-8 tracking-tighter">---</h2>
                </div>
                <div id="animation-layer" class="absolute inset-0 pointer-events-none z-30"></div>
            </div>
            <div id="stage-info-bar" class="h-20 bg-slate-900 flex items-center px-10 gap-8 z-40 transition-transform duration-500 translate-y-full border-t border-slate-800">
                <div class="flex-1 min-w-0">
                    <p id="np-user-display" class="text-blue-400 font-black uppercase text-[10px] tracking-widest mb-1"></p>
                    <h2 id="np-title-display" class="text-lg font-bold truncate text-white italic"></h2>
                </div>
                <div id="singer-timer" class="text-white font-black text-2xl">00:00</div>
            </div>
            <div class="h-1 bg-white/5 relative z-50"><div id="scrubber-bar" class="h-full w-0"></div></div>
        </section>

        <aside class="w-full md:w-96 flex flex-col bg-slate-950/50 rounded-[2rem] border border-slate-800 overflow-hidden shadow-2xl relative">
            <div class="p-5 border-b border-slate-800 bg-slate-900/30">
                <div class="flex gap-2 relative">
                    <input id="song-search" type="text" autocomplete="off" placeholder="Search or paste link..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl py-3 px-4 text-sm text-white focus:border-blue-500 outline-none">
                    <button id="btn-direct-add" class="bg-blue-600 px-4 rounded-xl text-white"><i class="fas fa-plus"></i></button>
                    <div id="search-results" class="hidden absolute top-full left-0 right-0 bg-slate-900 border border-slate-800 rounded-2xl mt-2 z-[999] p-2 shadow-2xl max-h-80 overflow-y-auto no-scrollbar border-t-4 border-blue-500"></div>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-5 no-scrollbar">
                <div id="queue-list" class="space-y-3"></div>
            </div>
            <div class="p-4 bg-slate-900/50 border-t border-slate-800 flex gap-2">
                <button id="btn-applause" class="flex-1 bg-yellow-500 text-black font-black py-3 rounded-xl flex items-center justify-center gap-2"><i class="fas fa-hands-clapping"></i></button>
                <button onclick="window.stopPlayback()" class="admin-only hidden w-12 rounded-xl bg-red-500/20 text-red-500"><i class="fas fa-stop"></i></button>
                <button onclick="window.playNext()" class="admin-only hidden w-12 rounded-xl bg-slate-800 text-slate-400"><i class="fas fa-forward"></i></button>
            </div>
        </aside>
    </main>

    <div id="admin-modal" class="fixed inset-0 z-[200] bg-slate-950/95 backdrop-blur-xl hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-5xl h-[85vh] rounded-[3rem] flex flex-col overflow-hidden shadow-2xl">
            <div class="px-8 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <div class="flex gap-6">
                    <button onclick="window.switchTab('list')" class="tab-btn active text-blue-500 font-bold text-sm">SONG LIST</button>
                    <button onclick="window.switchTab('bulk')" class="tab-btn text-slate-500 font-bold text-sm">BULK IMPORT</button>
                </div>
                <button id="close-admin" class="text-slate-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div id="admin-list-tab" class="flex-1 flex flex-col md:flex-row overflow-hidden">
                <div id="master-song-list" class="flex-1 overflow-y-auto p-6 space-y-2 no-scrollbar"></div>
                <div class="w-full md:w-80 p-6 border-l border-slate-800 bg-black/20 space-y-4">
                    <h3 class="text-blue-500 font-bold text-xs uppercase">Quick Add</h3>
                    <input id="setup-title" type="text" placeholder="Title" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm">
                    <input id="setup-artist" type="text" placeholder="Artist" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm">
                    <input id="setup-url" type="text" placeholder="YouTube URL" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm">
                    <button id="btn-save-song" class="w-full bg-blue-600 font-bold py-3 rounded-xl text-white">SAVE SONG</button>
                </div>
            </div>

            <div id="admin-bulk-tab" class="hidden flex-1 p-8 flex flex-col">
                <p class="text-xs text-slate-500 mb-2 italic">Format: [{"title":"Song", "artist":"Name", "videoId":"ID"}]</p>
                <textarea id="bulk-input" class="flex-1 bg-black border border-slate-800 rounded-2xl p-6 font-mono text-xs text-blue-400 outline-none"></textarea>
                <button id="btn-bulk-import" class="mt-4 bg-green-600 font-bold py-4 rounded-xl text-white">RUN IMPORT</button>
            </div>
        </div>
    </div>

    <audio id="applause-sound" src="https://www.myinstants.com/media/sounds/applause-8.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, getDoc, setDoc, updateDoc, serverTimestamp, getDocs, limit, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        // Correction for import sources
        import { getFirestore as getDB } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        // Re-importing to ensure full toolset
        const firestoreFull = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
        const { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, getDoc, setDoc, updateDoc, serverTimestamp, getDocs, limit, writeBatch } = firestoreFull;

        const firebaseConfig = {
            apiKey: "AIzaSyCk6mub0hDCzJ5iDmV-61v3WLSHMC51JP4",
            authDomain: "munch-24119.firebaseapp.com",
            projectId: "munch-24119",
            storageBucket: "munch-24119.firebasestorage.app",
            messagingSenderId: "834099093086",
            appId: "1:834099093086:web:2f618d05d479f49e17decf",
            measurementId: "G-GRP6GVZVEY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser, player, sessionCode, isPlaying = false, timerInterval;

        // YouTube API Init
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'modestbranding': 1 },
                events: { 'onStateChange': (e) => { if (e.data === 0) { isPlaying = false; playNext(); } } }
            });
        };

        // Improved Search Logic
        async function runSearch(val) {
            const $res = $('#search-results').empty().removeClass('hidden');
            const term = val.toLowerCase();
            
            // Try searching by Title (via searchKey)
            const q = query(collection(db, "songs"), 
                where("searchKey", ">=", term), 
                where("searchKey", "<=", term + '\uf8ff'), 
                limit(15));
            
            const snap = await getDocs(q);
            
            if (snap.empty) {
                return $res.append('<div class="p-4 text-center text-xs text-slate-500 italic">No exact matches. Check spelling or try a URL.</div>');
            }

            snap.forEach(d => {
                const s = d.data();
                $res.append(`
                    <div onclick="window.queueItem('${s.videoId}', '${s.title.replace(/'/g, "")}')" class="p-3 hover:bg-slate-800 rounded-xl cursor-pointer text-xs mb-1 border border-transparent hover:border-blue-500 transition">
                        <b class="text-white">${s.title}</b><br><span class="text-slate-500 uppercase">${s.artist || 'Unknown Artist'}</span>
                    </div>
                `);
            });
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        window.queueItem = async (videoId, name) => {
            await addDoc(collection(db, "munch_queue"), { 
                name, videoId, sessionCode, 
                userPhoto: currentUser.photoURL, 
                userName: currentUser.displayName, 
                timestamp: serverTimestamp() 
            });
            $('#song-search').val(''); $('#search-results').addClass('hidden');
        };

        $('#btn-direct-add').click(async () => {
            const val = $('#song-search').val().trim();
            const vid = extractVideoID(val);
            if(vid) {
                const resp = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vid}`);
                const data = await resp.json();
                window.queueItem(vid, data.title || "Linked Video");
            } else {
                runSearch(val);
            }
        });

        // Admin & Tabs
        window.switchTab = (tab) => {
            $('.tab-btn').removeClass('active text-blue-500').addClass('text-slate-500');
            $(event.target).addClass('active text-blue-500');
            if(tab === 'list') { $('#admin-list-tab').removeClass('hidden'); $('#admin-bulk-tab').addClass('hidden'); loadMasterLibrary(); }
            else { $('#admin-list-tab').addClass('hidden'); $('#admin-bulk-tab').removeClass('hidden'); }
        };

        async function loadMasterLibrary() {
            const $list = $('#master-song-list').empty().append('<p class="text-xs p-4 opacity-50">Loading global library...</p>');
            const snap = await getDocs(query(collection(db, "songs"), limit(100)));
            $list.empty();
            snap.forEach(d => {
                const s = d.data();
                $list.append(`<div class="flex items-center justify-between p-3 bg-black/40 border border-slate-800 rounded-xl"><div class="min-w-0"><p class="text-sm font-bold text-white truncate">${s.title}</p><p class="text-[10px] text-slate-500 uppercase">${s.artist}</p></div><button onclick="window.deleteSong('${d.id}')" class="text-red-500 p-2"><i class="fas fa-trash"></i></button></div>`);
            });
        }

        $('#btn-bulk-import').click(async () => {
            try {
                const list = JSON.parse($('#bulk-input').val());
                const batch = writeBatch(db);
                for(let s of list) {
                    const ref = doc(collection(db, "songs"));
                    batch.set(ref, { ...s, searchKey: s.title.toLowerCase(), createdAt: serverTimestamp() });
                }
                await batch.commit();
                alert("Bulk Import Successful!"); window.switchTab('list');
            } catch(e) { alert("JSON Error: Ensure proper array format."); }
        });

        // Auth & Sync
        $('#btn-join').click(async () => {
            sessionCode = $('#party-code-input').val().toUpperCase();
            if(!sessionCode) return;
            $('#status-dot').removeClass('status-idle').addClass('status-ready');
            $('#auth-overlay').fadeOut();
            $('#idle-code-display').text(sessionCode);
            new QRCode(document.getElementById("qrcode"), { text: window.location.href + "?join=" + sessionCode, width: 220, height: 220 });
            initSync();
        });

        function initSync() {
            onSnapshot(query(collection(db, "munch_queue"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "asc")), snap => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderQueueUI(list);
                if(list.length > 0 && !isPlaying && window.innerWidth > 768) playNext(list[0]);
            });
            onSnapshot(doc(db, "session_status", sessionCode), (snap) => {
                const data = snap.data();
                if(data && data.startTime) {
                    $('#np-title-display').text(data.currentSong); $('#np-user-display').text("Singing: " + data.userName);
                    $('#idle-screen').css('opacity', '0'); $('#stage-info-bar').removeClass('translate-y-full');
                    updateTimerUI(data.startTime);
                    if(!isPlaying && window.innerWidth > 768) { isPlaying = true; player.loadVideoById(data.videoId); }
                } else {
                    isPlaying = false; if(player && window.innerWidth > 768) player.stopVideo();
                    $('#idle-screen').css('opacity', '1'); $('#stage-info-bar').addClass('translate-y-full');
                }
            });
            onSnapshot(query(collection(db, "applause_events"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "desc")), (snap) => {
                snap.docChanges().forEach(change => { if (change.type === "added") triggerApplauseAnim(); });
            });
        }

        async function playNext(song = null) {
            if(!player) return;
            if(song) {
                isPlaying = true;
                await setDoc(doc(db, "session_status", sessionCode), { currentSong: song.name, userName: song.userName, startTime: Date.now(), videoId: song.videoId });
                if(song.id) await deleteDoc(doc(db, "munch_queue", song.id));
            } else {
                isPlaying = false; await setDoc(doc(db, "session_status", sessionCode), { currentSong: "", userName: "", startTime: null });
            }
        }
        window.playNext = () => playNext();
        window.stopPlayback = async () => await setDoc(doc(db, "session_status", sessionCode), { currentSong: "", userName: "", startTime: null });

        function renderQueueUI(list) {
            const $l = $('#queue-list').empty();
            list.forEach((s) => {
                $l.append(`<div class="flex items-center gap-3 p-3 bg-slate-900 border border-slate-800 rounded-2xl animate-in fade-in duration-500"><img src="https://img.youtube.com/vi/${s.videoId}/default.jpg" class="w-10 h-8 rounded object-cover"><div class="flex-1 min-w-0"><p class="text-xs font-bold text-white truncate">${s.name}</p><p class="text-[9px] text-blue-500 uppercase">${s.userName}</p></div></div>`);
            });
        }

        function updateTimerUI(start) {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - start;
                const m = Math.floor(elapsed/60000).toString().padStart(2,'0');
                const s = Math.floor((elapsed%60000)/1000).toString().padStart(2,'0');
                $('#singer-timer').text(`${m}:${s}`);
                if(player?.getDuration) $('#scrubber-bar').css('width', (player.getCurrentTime()/player.getDuration()*100)+'%');
            }, 1000);
        }

        function triggerApplauseAnim() {
            const emojis = ['👏','🔥','✨','🎸','🙌'];
            const $e = $(`<div class="emoji-float">${emojis[Math.floor(Math.random()*emojis.length)]}</div>`).css('left', (20+Math.random()*60)+'%');
            $('#animation-layer').append($e); setTimeout(()=> $e.remove(), 1800);
            document.getElementById('applause-sound').play().catch(()=>{});
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                $('#user-pfp').attr('src', user.photoURL);
                $('#login-section').addClass('hidden');
                $('#party-section').removeClass('hidden');
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) $('#nav-admin, .admin-only').removeClass('hidden');
            }
        });
        
        $('#btn-login').click(() => signInWithPopup(auth, provider));
        $('#btn-applause').click(() => addDoc(collection(db, "applause_events"), { sessionCode, timestamp: serverTimestamp() }));
        $('#nav-admin').click(() => { $('#admin-modal').removeClass('hidden'); loadMasterLibrary(); });
        $('#close-admin').click(() => $('#admin-modal').addClass('hidden'));
        window.deleteSong = async (id) => { if(confirm("Delete?")) { await deleteDoc(doc(db, "songs", id)); loadMasterLibrary(); } };
    </script>
</body>
</html>
