<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNCH KARAOKE - PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #22c55e; --bg: #020617; }
        body { background-color: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .stage-container { position: relative; background: #000; overflow: hidden; height: 100%; border-radius: 2rem; border: 4px solid #1e293b; }
        #youtube-player { width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @media (max-width: 768px) { #view-main { display: none; } body { overflow-y: auto; } }
    </style>
</head>
<body>

    <div id="auth-overlay" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-6 text-center">
        <div class="glass p-10 rounded-[3rem] max-w-sm w-full border-green-500/20 shadow-2xl">
            <h1 class="text-4xl font-black italic mb-8 tracking-tighter uppercase text-white">Munch<span class="text-green-500">Karaoke</span></h1>
            <div id="login-section">
                <button id="btn-login" class="w-full bg-white text-black font-bold py-5 rounded-3xl flex items-center justify-center gap-3 active:scale-95 transition">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-6"> Login with Google
                </button>
            </div>
            <div id="party-section" class="hidden space-y-4">
                <input id="party-code-input" type="text" placeholder="SESSION CODE" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-center font-mono text-2xl uppercase text-white outline-none">
                <button id="btn-join" class="w-full bg-green-600 font-bold py-4 rounded-xl text-white shadow-lg">ENTER STAGE</button>
            </div>
        </div>
    </div>

    <header class="h-16 bg-slate-900/40 border-b border-slate-800 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-3">
            <i class="fas fa-microphone text-green-500 text-xl"></i>
            <span class="text-xl font-black italic tracking-tighter uppercase text-white">Munch<span class="text-green-500">Karaoke</span></span>
        </div>
        <div class="flex items-center gap-4">
            <button id="btn-make-admin" class="hidden bg-red-600 text-white text-[10px] px-3 py-1 rounded-full font-bold">SETUP ADMIN</button>
            <button id="nav-admin" class="hidden text-slate-400 p-2 hover:text-white transition"><i class="fas fa-cog text-lg"></i></button>
            <img id="user-pfp" class="w-8 h-8 rounded-full border border-slate-700">
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden p-2 md:p-4 gap-4">
        <section id="view-main" class="flex-1 flex flex-col relative rounded-[2.5rem] overflow-hidden bg-black shadow-2xl">
            <div class="flex-1 stage-container">
                <div id="youtube-player"></div>
                <div id="idle-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 z-20">
                    <div id="qrcode" class="p-6 bg-white rounded-[2rem] shadow-2xl"></div>
                    <h2 id="idle-code-display" class="text-7xl font-black text-white italic mt-8 tracking-tighter">---</h2>
                </div>
            </div>
            <div id="stage-info-bar" class="h-20 bg-slate-900 flex items-center px-10 gap-8 z-40 border-t border-slate-800 translate-y-full transition-all">
                <div class="flex-1 min-w-0">
                    <p id="np-user-display" class="text-green-500 font-black uppercase text-[10px] tracking-widest mb-1"></p>
                    <h2 id="np-title-display" class="text-lg font-bold truncate text-white italic"></h2>
                </div>
            </div>
        </section>

        <aside class="w-full md:w-96 flex flex-col bg-slate-950/50 rounded-[2rem] border border-slate-800 overflow-hidden shadow-2xl relative">
            <div class="p-5 border-b border-slate-800">
                <div class="flex gap-2">
                    <input id="song-search" type="text" placeholder="Search or paste link..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl py-3 px-4 text-sm text-white focus:border-green-500 outline-none">
                    <button id="btn-add" class="bg-green-600 px-4 rounded-xl text-white active:scale-95 transition-all"><i class="fas fa-plus"></i></button>
                </div>
                <div id="search-results" class="hidden absolute top-40 left-4 right-4 md:static md:mt-3 bg-slate-900 border border-slate-700 rounded-2xl z-[100] p-2 shadow-2xl max-h-60 overflow-y-auto"></div>
            </div>
            <div class="flex-1 overflow-y-auto p-5 space-y-3 no-scrollbar" id="queue-list"></div>
            
            <div id="admin-controls" class="hidden p-4 bg-slate-900/50 border-t border-slate-800 flex gap-2">
                <button onclick="window.sendStageCommand('skip')" class="flex-1 bg-slate-800 text-white font-bold py-4 rounded-2xl active:scale-95 transition">SKIP</button>
                <button onclick="window.sendStageCommand('stop')" class="w-16 bg-red-600/20 text-red-500 rounded-2xl active:scale-95 transition"><i class="fas fa-stop"></i></button>
            </div>
        </aside>
    </main>

    <div id="admin-modal" class="fixed inset-0 z-[200] bg-slate-950/95 backdrop-blur-xl hidden flex items-center justify-center p-4">
        <div class="glass border border-slate-800 w-full max-w-4xl h-[85vh] rounded-[3rem] flex flex-col overflow-hidden shadow-2xl">
            <div class="px-8 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h2 class="text-xl font-bold italic">Master Library</h2>
                <button id="close-admin" class="text-slate-500 hover:text-white transition"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 border-b border-slate-800">
                <h3 class="text-xs font-bold text-slate-500 uppercase mb-2">Bulk Import (JSON)</h3>
                <div class="flex gap-2">
                    <textarea id="bulk-input" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono h-20" placeholder='[{"title":"Name", "artist":"Artist", "videoId":"ID"}]'></textarea>
                    <button id="btn-bulk-import" class="bg-blue-600 px-4 rounded-xl text-xs font-bold">IMPORT</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-2 no-scrollbar" id="master-song-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, getDoc, setDoc, updateDoc, serverTimestamp, getDocs, limit, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk6mub0hDCzJ5iDmV-61v3WLSHMC51JP4",
            authDomain: "munch-24119.firebaseapp.com",
            projectId: "munch-24119",
            storageBucket: "munch-24119.firebasestorage.app",
            messagingSenderId: "834099093086",
            appId: "1:834099093086:web:2f618d05d479f49e17decf",
            measurementId: "G-GRP6GVZVEY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser, player, sessionCode, isPlaying = false;

        // --- YOUTUBE API ---
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'modestbranding': 1 },
                events: { 'onStateChange': (e) => { 
                    if (e.data === YT.PlayerState.ENDED) window.sendStageCommand('skip');
                }}
            });
        };

        // --- ADMIN RECOVERY ---
        $('#btn-make-admin').click(async () => {
            await setDoc(doc(db, "users", currentUser.uid), { 
                name: currentUser.displayName, 
                email: currentUser.email, 
                isAdmin: true 
            });
            alert("Admin privileges granted. Refreshing...");
            location.reload();
        });

        // --- AUTH ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                $('#user-pfp').attr('src', user.photoURL);
                $('#login-section').addClass('hidden');
                $('#party-section').removeClass('hidden');

                // Check if user is you (Admin Override)
                if(user.email === "isaacjana.h@gmail.com") { // CHANGE THIS to your actual email
                    $('#btn-make-admin').removeClass('hidden');
                }

                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) {
                    $('#admin-controls, #nav-admin').removeClass('hidden');
                }
            }
        });

        $('#btn-login').click(() => signInWithPopup(auth, provider));

        // --- SESSION JOIN ---
        $('#btn-join').click(async () => {
            sessionCode = $('#party-code-input').val().toUpperCase();
            if(!sessionCode) return;
            $('#auth-overlay').fadeOut();
            $('#idle-code-display').text(sessionCode);
            if(player) player.playVideo(); 
            new QRCode(document.getElementById("qrcode"), { 
                text: window.location.origin + window.location.pathname + "?join=" + sessionCode, 
                width: 220, height: 220 
            });
            initSync();
        });

        // --- SYNC ENGINE ---
        function initSync() {
            onSnapshot(query(collection(db, "munch_queue"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "asc")), snap => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderQueueUI(list);
                if(list.length > 0 && !isPlaying && window.innerWidth > 768) {
                    window.sendStageCommand('skip');
                }
            });

            onSnapshot(doc(db, "session_status", sessionCode), async (snap) => {
                const data = snap.data();
                if(!data || window.innerWidth < 768) return; 
                if(data.command === 'skip') {
                    await handleSkipOnTV();
                    await updateDoc(doc(db, "session_status", sessionCode), { command: null });
                }
                if(data.command === 'stop') {
                    handleStopOnTV();
                    await updateDoc(doc(db, "session_status", sessionCode), { command: null });
                }
            });
        }

        async function handleSkipOnTV() {
            const q = query(collection(db, "munch_queue"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "asc"), limit(1));
            const snap = await getDocs(q);
            if(!snap.empty) {
                const nextSong = snap.docs[0].data();
                const nextId = snap.docs[0].id;
                isPlaying = true;
                $('#idle-screen').css('opacity', '0');
                $('#stage-info-bar').removeClass('translate-y-full');
                $('#np-title-display').text(nextSong.name);
                $('#np-user-display').text("Singing: " + nextSong.userName);
                player.loadVideoById(nextSong.videoId);
                await deleteDoc(doc(db, "munch_queue", nextId));
            } else { handleStopOnTV(); }
        }

        function handleStopOnTV() {
            isPlaying = false;
            $('#idle-screen').css('opacity', '1');
            $('#stage-info-bar').addClass('translate-y-full');
            if(player) player.stopVideo();
        }

        window.sendStageCommand = async (cmd) => {
            await setDoc(doc(db, "session_status", sessionCode), { command: cmd }, { merge: true });
        };

        // --- SEARCH & BULK ---
        $('#btn-add').click(async () => {
            const input = $('#song-search');
            const val = input.val().trim();
            const videoId = extractID(val);
            if(videoId) {
                const resp = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                const data = await resp.json();
                window.queueItem(videoId, data.title || "Linked Video");
                input.val('');
            } else if(val.length > 1) {
                runLibrarySearch(val);
            }
        });

        async function runLibrarySearch(term) {
            const $res = $('#search-results').empty().removeClass('hidden');
            const q = query(collection(db, "songs"), where("searchKey", ">=", term.toLowerCase()), where("searchKey", "<=", term.toLowerCase() + '\uf8ff'), limit(10));
            const snap = await getDocs(q);
            if(snap.empty) return $res.append('<div class="p-4 text-center text-xs opacity-50">Not found.</div>');
            snap.forEach(d => {
                const s = d.data();
                $res.append(`<div onclick="window.queueItem('${s.videoId}', '${s.title.replace(/'/g, "")}')" class="p-3 hover:bg-slate-800 rounded-xl cursor-pointer text-xs mb-1"><b>${s.title}</b></div>`);
            });
        }

        window.queueItem = async (videoId, name) => {
            await addDoc(collection(db, "munch_queue"), { name, videoId, sessionCode, userName: currentUser.displayName, timestamp: serverTimestamp() });
            $('#search-results').addClass('hidden');
        };

        $('#btn-bulk-import').click(async () => {
            try {
                const list = JSON.parse($('#bulk-input').val());
                const batch = writeBatch(db);
                list.forEach(s => {
                    const ref = doc(collection(db, "songs"));
                    batch.set(ref, { title: s.title, artist: s.artist, videoId: s.videoId, searchKey: s.title.toLowerCase() });
                });
                await batch.commit();
                alert("Imported!"); window.loadMasterLibrary();
            } catch(e) { alert("JSON Error!"); }
        });

        // --- UI UTILS ---
        function extractID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function renderQueueUI(list) {
            const $l = $('#queue-list').empty();
            list.forEach((s) => $l.append(`<div class="flex items-center gap-3 p-3 bg-slate-900 border border-slate-800 rounded-2xl"><img src="https://img.youtube.com/vi/${s.videoId}/default.jpg" class="w-10 h-8 rounded object-cover"><div class="flex-1 min-w-0"><p class="text-xs font-bold text-white truncate">${s.name}</p><p class="text-[9px] text-green-500 uppercase">${s.userName}</p></div></div>`));
        }

        window.loadMasterLibrary = async () => {
            const $list = $('#master-song-list').empty();
            const snap = await getDocs(query(collection(db, "songs"), limit(100)));
            snap.forEach(d => {
                const s = d.data();
                $list.append(`<div class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800 rounded-2xl"><div class="min-w-0"><p class="text-sm font-bold text-white truncate">${s.title}</p></div><button onclick="window.deleteSong('${d.id}')" class="text-red-500 p-2"><i class="fas fa-trash"></i></button></div>`);
            });
        };
        window.deleteSong = async (id) => { if(confirm("Delete?")) { await deleteDoc(doc(db, "songs", id)); window.loadMasterLibrary(); } };

        $('#nav-admin').click(() => { $('#admin-modal').removeClass('hidden'); window.loadMasterLibrary(); });
        $('#close-admin').click(() => $('#admin-modal').addClass('hidden'));
    </script>
</body>
</html>
