<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munch Karaoke - Pro Build</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .stage-bg { background: radial-gradient(circle at top, #1e293b 0%, #020617 100%); }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
        <div class="glass p-8 rounded-3xl max-w-sm w-full shadow-2xl">
            <h1 class="text-4xl font-black italic mb-2 tracking-tighter">MUNCH<span class="text-blue-500">KARAOKE</span></h1>
            <div id="login-section">
                <button id="btn-login" class="w-full bg-white text-black font-bold py-3 px-6 rounded-xl flex items-center justify-center gap-3">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5"> Login with Google
                </button>
            </div>
            <div id="party-section" class="hidden space-y-4">
                <input id="party-code-input" type="text" placeholder="SESSION CODE" class="w-full bg-black border border-slate-700 rounded-xl p-4 text-center font-mono text-2xl uppercase tracking-widest outline-none focus:border-blue-500 text-white">
                <button id="btn-join" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-4 rounded-xl">ENTER STAGE</button>
            </div>
        </div>
    </div>

    <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <span class="text-xl font-black italic text-blue-500">MUNCH</span>
            <span id="session-tag" class="text-[10px] font-mono text-slate-500"></span>
        </div>
        <div class="flex items-center gap-6">
            <button id="nav-admin" class="hidden text-[10px] font-black text-slate-400 hover:text-white uppercase tracking-widest">Library Management</button>
            <button id="nav-main" class="text-[10px] font-black text-blue-500 uppercase tracking-widest">Stage</button>
            <img id="user-pfp" class="w-8 h-8 rounded-full border border-slate-700">
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <section id="view-admin" class="hidden flex-1 p-8 overflow-y-auto">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div>
                    <h2 class="text-2xl font-bold mb-6">Add New Song</h2>
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                        <input id="setup-title" type="text" placeholder="Song Title" class="w-full bg-black border border-slate-700 rounded-lg p-3 text-sm text-white">
                        <input id="setup-artist" type="text" placeholder="Artist" class="w-full bg-black border border-slate-700 rounded-lg p-3 text-sm text-white">
                        <input id="setup-url" type="text" placeholder="YouTube URL (Paste Link Here)" class="w-full bg-black border border-slate-700 rounded-lg p-3 text-sm text-white">
                        <button id="btn-save-song" class="w-full bg-green-600 font-bold py-3 rounded-lg">SAVE TO LIBRARY</button>
                    </div>
                </div>
                <div>
                    <h2 class="text-2xl font-bold mb-6">Library Catalog</h2>
                    <div id="admin-song-list" class="space-y-2 max-h-[60vh] overflow-y-auto pr-2">
                        </div>
                </div>
            </div>
        </section>

        <section id="view-main" class="flex-1 flex flex-col md:flex-row overflow-hidden">
            <div class="flex-1 bg-black relative stage-bg">
                <div id="player-loader" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-950">
                    <div class="spinner mb-4"></div>
                    <p class="text-xs text-slate-500 animate-pulse uppercase tracking-widest">Initializing Stage...</p>
                </div>

                <div id="youtube-player"></div>
                <div id="idle-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 z-10 pointer-events-none transition-opacity duration-500 opacity-100">
                    <i class="fas fa-microphone-alt text-7xl text-slate-800 mb-4"></i>
                    <p class="text-slate-600 font-black uppercase text-xs tracking-widest">Stage Idle</p>
                </div>
            </div>

            <aside class="w-full md:w-96 bg-slate-950 border-l border-slate-800 flex flex-col">
                <div class="p-4 bg-slate-900/50 border-b border-slate-800">
                    <input id="song-search" type="text" placeholder="Search saved songs..." class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-sm outline-none text-white">
                    <div id="search-results" class="hidden mt-3 max-h-48 overflow-y-auto space-y-2"></div>
                </div>
                <div class="flex-1 overflow-y-auto p-5">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4">Queue</h3>
                    <div id="queue-list" class="space-y-3"></div>
                </div>
            </aside>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, getDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk6mub0hDCzJ5iDmV-61v3WLSHMC51JP4",
            authDomain: "munch-24119.firebaseapp.com",
            projectId: "munch-24119",
            storageBucket: "munch-24119.firebasestorage.app",
            messagingSenderId: "834099093086",
            appId: "1:834099093086:web:2f618d05d479f49e17decf",
            measurementId: "G-GRP6GVZVEY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser, player, sessionCode;
        let isPlaying = false;
        let isPlayerReady = false;

        // AUTH & ADMIN DETECTION
        $('#btn-login').click(() => signInWithPopup(auth, provider));
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                $('#user-pfp').attr('src', user.photoURL);
                $('#login-section').addClass('hidden');
                $('#party-section').removeClass('hidden');
                
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) {
                    $('#nav-admin').removeClass('hidden');
                    loadAdminSongList();
                }
            }
        });

        $('#btn-join').click(() => {
            sessionCode = $('#party-code-input').val().toUpperCase();
            if(!sessionCode) return;
            $('#auth-overlay').addClass('opacity-0 pointer-events-none');
            $('#session-tag').text("CODE: " + sessionCode);
            startSync();
        });

        // ADMIN: MANAGE SAVED SONGS
        $('#btn-save-song').click(async () => {
            const title = $('#setup-title').val();
            const artist = $('#setup-artist').val();
            const videoId = extractID($('#setup-url').val());

            if(!title || !videoId) return alert("Valid Title and YouTube Link required!");

            await addDoc(collection(db, "songs"), {
                title, artist, videoId,
                searchKey: title.toLowerCase(),
                timestamp: serverTimestamp()
            });
            $('#setup-title, #setup-artist, #setup-url').val('');
            loadAdminSongList();
        });

        async function loadAdminSongList() {
            const q = query(collection(db, "songs"), orderBy("timestamp", "desc"));
            const snap = await getDocs(q);
            const $list = $('#admin-song-list').empty();
            snap.forEach(d => {
                const s = d.data();
                $list.append(`
                    <div class="p-3 bg-slate-900 border border-slate-800 rounded-lg flex justify-between items-center">
                        <div class="text-xs">
                            <span class="font-bold">${s.title}</span><br>
                            <span class="text-slate-500 uppercase">${s.artist}</span>
                        </div>
                        <button onclick="window.deleteSong('${d.id}')" class="text-slate-700 hover:text-red-500"><i class="fas fa-trash"></i></button>
                    </div>
                `);
            });
        }
        window.deleteSong = async (id) => { if(confirm("Delete song?")) { await deleteDoc(doc(db, "songs", id)); loadAdminSongList(); } };

        // SEARCH & QUEUE
        $('#song-search').on('input', async function() {
            const val = $(this).val().toLowerCase();
            if(val.length < 2) return $('#search-results').addClass('hidden');
            const q = query(collection(db, "songs"), where("searchKey", ">=", val), where("searchKey", "<=", val + '\uf8ff'));
            const snap = await getDocs(q);
            const $res = $('#search-results').empty().removeClass('hidden');
            snap.forEach(d => {
                const s = d.data();
                $res.append(`<div onclick="window.addToQueue('${s.videoId}', '${s.title.replace(/'/g, "")}')" class="p-2 bg-slate-800 rounded cursor-pointer text-xs"><b>${s.title}</b> - ${s.artist}</div>`);
            });
        });

        window.addToQueue = async (videoId, name) => {
            await addDoc(collection(db, "munch_queue"), { name, videoId, sessionCode, userPhoto: currentUser.photoURL, timestamp: serverTimestamp() });
            $('#song-search').val(''); $('#search-results').addClass('hidden');
        };

        // YOUTUBE & SYNC
        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 1 },
                events: {
                    'onReady': () => { isPlayerReady = true; $('#player-loader').fadeOut(); },
                    'onStateChange': (e) => { if(e.data === 0) { isPlaying = false; } }
                }
            });
        };

        function startSync() {
            const q = query(collection(db, "munch_queue"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "asc"));
            onSnapshot(q, snap => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderQueue(list);
                if(list.length > 0 && !isPlaying && isPlayerReady) playNext(list[0]);
            });
        }

        async function playNext(song) {
            isPlaying = true;
            player.loadVideoById(song.videoId);
            $('#idle-screen').addClass('opacity-0');
            await deleteDoc(doc(db, "munch_queue", song.id));
        }

        function renderQueue(list) {
            const $l = $('#queue-list').empty();
            list.forEach(s => $l.append(`<div class="flex items-center gap-3 p-3 bg-slate-900 border border-slate-800 rounded-xl"><img src="${s.userPhoto}" class="w-8 h-8 rounded-full"><p class="text-xs font-bold truncate text-slate-200">${s.name}</p></div>`));
        }

        function extractID(url) {
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        $('#nav-admin').click(() => { $('#view-main').addClass('hidden'); $('#view-admin').removeClass('hidden'); });
        $('#nav-main').click(() => { $('#view-admin').addClass('hidden'); $('#view-main').removeClass('hidden'); });
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
