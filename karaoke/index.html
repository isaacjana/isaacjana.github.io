<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNCH KARAOKE - PRO BUILD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --bg: #020617; }
        body { background-color: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .vibe-party { --accent: #f472b6; --bg: #0f0014; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .stage-container { position: relative; background: #000; overflow: hidden; height: 100%; border-radius: 2rem; border: 4px solid #1e293b; }
        #youtube-player { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #scrubber-bar { transition: width 0.5s linear; background: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .status-ready { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .status-idle { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        @keyframes float-up { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-400px) scale(2); opacity: 0; } }
        .emoji-float { position: absolute; bottom: 20%; left: 50%; font-size: 4rem; pointer-events: none; animation: float-up 1.8s ease-out forwards; z-index: 100; }
        @media (max-width: 768px) { #view-main { display: none; } body { overflow-y: auto; } }
    </style>
</head>
<body>

    <div id="auth-overlay" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-6 text-center">
        <div class="glass p-10 rounded-[3rem] max-w-sm w-full border-blue-500/20 shadow-2xl">
            <h1 class="text-4xl font-black italic mb-8 tracking-tighter">MUNCH<span class="text-blue-500">KARAOKE</span></h1>
            <div id="login-section">
                <button id="btn-login" class="w-full bg-white text-black font-bold py-4 rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5"> Login with Google
                </button>
            </div>
            <div id="party-section" class="hidden space-y-4">
                <input id="party-code-input" type="text" placeholder="CODE" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-center font-mono text-2xl uppercase text-white outline-none">
                <button id="btn-join" class="w-full bg-blue-600 font-bold py-4 rounded-xl text-white shadow-lg">ENTER STAGE</button>
            </div>
        </div>
    </div>

    <header class="h-16 bg-slate-900/40 border-b border-slate-800 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-3">
            <div id="status-dot" class="w-2.5 h-2.5 rounded-full status-idle"></div>
            <span class="text-xl font-black italic text-blue-500 tracking-tighter uppercase">Munch</span>
        </div>
        <div class="flex items-center gap-4">
            <button id="vibe-toggle" class="text-slate-400 p-2"><i class="fas fa-wand-magic-sparkles"></i></button>
            <button id="nav-admin" class="hidden text-slate-400 p-2"><i class="fas fa-cog"></i></button>
            <img id="user-pfp" class="w-8 h-8 rounded-full border border-slate-700">
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden p-2 md:p-4 gap-4">
        
        <section id="view-main" class="flex-1 flex flex-col relative rounded-[2.5rem] overflow-hidden bg-black shadow-2xl">
            <div class="flex-1 stage-container">
                <div id="youtube-player"></div>
                
                <div id="idle-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 z-20 transition-opacity duration-700">
                    <div id="qrcode" class="p-6 bg-white rounded-[2rem] shadow-2xl"></div>
                    <h2 id="idle-code-display" class="text-6xl font-black text-white italic mt-8 tracking-tighter">---</h2>
                    <p class="text-blue-500 text-[10px] font-bold uppercase tracking-[0.4em] mt-4 animate-pulse">Ready to Play</p>
                </div>
                <div id="animation-layer" class="absolute inset-0 pointer-events-none z-30"></div>
            </div>

            <div id="stage-info-bar" class="h-20 bg-slate-900 flex items-center px-10 gap-8 z-40 transition-transform duration-500 translate-y-full border-t border-slate-800">
                <div class="flex-1 min-w-0">
                    <p id="np-user-display" class="text-blue-400 font-black uppercase text-[10px] tracking-widest mb-1"></p>
                    <h2 id="np-title-display" class="text-lg font-bold truncate text-white italic"></h2>
                </div>
                <div id="singer-timer" class="text-white font-black text-2xl tabular-nums">00:00</div>
            </div>
            <div class="h-1 bg-white/5 relative z-50"><div id="scrubber-bar" class="h-full w-0"></div></div>
        </section>

        <aside class="w-full md:w-96 flex flex-col bg-slate-950/50 rounded-[2rem] border border-slate-800 overflow-hidden shadow-2xl">
            <div class="p-5 border-b border-slate-800">
                <div class="flex gap-2">
                    <input id="song-search" type="text" placeholder="Paste YouTube Link or Search..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl py-3 px-4 text-sm text-white focus:border-blue-500 outline-none transition-all">
                    <button id="btn-direct-add" class="bg-blue-600 px-4 rounded-xl text-white"><i class="fas fa-plus"></i></button>
                </div>
                <div id="search-results" class="hidden absolute top-[140px] left-4 right-4 md:left-auto md:w-[350px] bg-slate-900 border border-slate-700 rounded-2xl z-[100] p-2 shadow-2xl max-h-96 overflow-y-auto"></div>
            </div>

            <div class="flex-1 overflow-y-auto p-5 no-scrollbar">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Queue</h3>
                    <div class="flex gap-2">
                        <button id="btn-play-pause" class="admin-only hidden w-9 h-9 rounded-full bg-blue-500/20 text-blue-500 flex items-center justify-center transition"><i class="fas fa-play"></i></button>
                        <button onclick="window.stopPlayback()" class="admin-only hidden w-9 h-9 rounded-full bg-red-500/20 text-red-500 flex items-center justify-center transition"><i class="fas fa-stop"></i></button>
                        <button onclick="window.playNext()" class="admin-only hidden w-9 h-9 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center transition"><i class="fas fa-forward"></i></button>
                    </div>
                </div>
                <div id="queue-list" class="space-y-3"></div>
            </div>
            
            <div class="p-4 bg-slate-900/50 border-t border-slate-800">
                <button id="btn-applause" class="w-full bg-yellow-500 text-black font-black py-3 rounded-xl flex items-center justify-center gap-2 shadow-xl"><i class="fas fa-hands-clapping"></i> APPLAUSE</button>
            </div>
        </aside>
    </main>

    <audio id="applause-sound" src="https://www.myinstants.com/media/sounds/applause-8.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, getDoc, setDoc, updateDoc, serverTimestamp, getDocs, limit, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- FIREBASE CONFIG (Replace with your own) ---
        const firebaseConfig = {
            apiKey: "AIzaSyCk6mub0hDCzJ5iDmV-61v3WLSHMC51JP4",
            authDomain: "munch-24119.firebaseapp.com",
            projectId: "munch-24119",
            storageBucket: "munch-24119.firebasestorage.app",
            messagingSenderId: "834099093086",
            appId: "1:834099093086:web:2f618d05d479f49e17decf",
            measurementId: "G-GRP6GVZVEY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser, player, sessionCode, isPlaying = false, timerInterval, scrubberInterval;

        // --- 1. THE EMBED HANDSHAKE (WORKS LIKE YOUR EXAMPLE) ---
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'modestbranding': 1 },
                events: {
                    'onReady': () => { console.log("YT Player Active"); },
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        function onPlayerStateChange(event) {
            // event.data === 0 means "ENDED"
            if (event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
                playNext(); 
            }
            updateRemoteUI(event.data);
        }

        // --- 2. URL PARSER ---
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // --- 3. SESSION JOIN ---
        $('#btn-join').click(async () => {
            sessionCode = $('#party-code-input').val().toUpperCase();
            if(!sessionCode) return;
            $('#status-dot').removeClass('status-idle').addClass('status-ready');
            $('#auth-overlay').fadeOut();
            $('#idle-code-display').text(sessionCode);
            
            const joinLink = window.location.origin + window.location.pathname + "?join=" + sessionCode;
            $('#qrcode').empty();
            new QRCode(document.getElementById("qrcode"), { text: joinLink, width: 220, height: 220 });

            initSync();
        });

        // --- 4. CORE SYNC ENGINE ---
        function initSync() {
            // Listener for Queue
            onSnapshot(query(collection(db, "munch_queue"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "asc")), snap => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderQueueUI(list);
                // Trigger play if nothing is on stage and window is large (TV Mode)
                if(list.length > 0 && !isPlaying && window.innerWidth > 768) {
                    playNext(list[0]);
                }
            });

            // Listener for Stage Playback status
            onSnapshot(doc(db, "session_status", sessionCode), (snap) => {
                const data = snap.data();
                if(data && data.startTime) {
                    $('#np-title-display').text(data.currentSong);
                    $('#np-user-display').text("Singing: " + data.userName);
                    $('#idle-screen').css('opacity', '0');
                    $('#stage-info-bar').removeClass('translate-y-full');
                    updateTimerUI(data.startTime);

                    if(!isPlaying && window.innerWidth > 768) {
                        isPlaying = true;
                        player.loadVideoById(data.videoId);
                    }
                    
                    // Pause/Play Remote Handshake
                    if(player && window.innerWidth > 768) {
                        data.isPaused ? player.pauseVideo() : player.playVideo();
                    }
                } else {
                    isPlaying = false;
                    if(player && window.innerWidth > 768) player.stopVideo();
                    $('#idle-screen').css('opacity', '1');
                    $('#stage-info-bar').addClass('translate-y-full');
                }
            });

            onSnapshot(query(collection(db, "applause_events"), where("sessionCode", "==", sessionCode), orderBy("timestamp", "desc")), (snap) => {
                snap.docChanges().forEach(change => { if (change.type === "added") triggerApplauseAnim(); });
            });
        }

        async function playNext(song = null) {
            if(!player) return;
            if(song) {
                isPlaying = true;
                await setDoc(doc(db, "session_status", sessionCode), { 
                    currentSong: song.name, userName: song.userName, 
                    startTime: Date.now(), videoId: song.videoId, isPaused: false 
                });
                if(song.id) await deleteDoc(doc(db, "munch_queue", song.id));
            } else {
                isPlaying = false;
                await setDoc(doc(db, "session_status", sessionCode), { currentSong: "", userName: "", startTime: null });
            }
        }
        window.playNext = () => playNext();

        window.stopPlayback = async () => {
            await setDoc(doc(db, "session_status", sessionCode), { currentSong: "", userName: "", startTime: null });
        };

        // --- 5. LINK PROCESSING (The Example Logic) ---
        async function handleAddSong() {
            const input = $('#song-search');
            const url = input.val().trim();
            const videoId = extractVideoID(url);

            if(videoId) {
                try {
                    const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                    const data = await response.json();
                    window.queueItem(videoId, data.title || "Linked Video");
                    input.val('');
                } catch (e) {
                    window.queueItem(videoId, "Video Request");
                    input.val('');
                }
            } else {
                // Trigger normal search if not a URL
                runSearch(url);
            }
        }

        $('#btn-direct-add').click(handleAddSong);
        $('#song-search').on('keypress', (e) => { if(e.key === 'Enter') handleAddSong(); });

        window.queueItem = async (videoId, name) => {
            await addDoc(collection(db, "munch_queue"), { 
                name, videoId, sessionCode, 
                userPhoto: currentUser.photoURL, 
                userName: currentUser.displayName, 
                timestamp: serverTimestamp() 
            });
            $('#search-results').addClass('hidden');
        };

        // --- 6. UTILS ---
        function renderQueueUI(list) {
            const $l = $('#queue-list').empty();
            const isAdmin = !$('#nav-admin').hasClass('hidden');
            list.forEach((s, i) => {
                $l.append(`
                    <div class="flex items-center gap-3 p-3 bg-slate-900 border border-slate-800 rounded-2xl">
                        <span class="text-[10px] text-slate-600 font-bold">${i+1}</span>
                        <img src="https://img.youtube.com/vi/${s.videoId}/default.jpg" class="w-10 h-8 rounded object-cover">
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-bold text-white truncate">${s.name}</p>
                            <p class="text-[9px] text-blue-500 font-black uppercase tracking-widest">${s.userName}</p>
                        </div>
                        ${isAdmin ? `<button onclick="window.removeFromQueue('${s.id}')" class="text-slate-500 hover:text-red-500 p-1"><i class="fas fa-trash"></i></button>` : ''}
                    </div>`);
            });
        }

        window.removeFromQueue = async (id) => { if(confirm("Remove?")) await deleteDoc(doc(db, "munch_queue", id)); };

        function updateRemoteUI(state) {
            const $btn = $('#btn-play-pause');
            if(state === 1) $btn.html('<i class="fas fa-pause"></i>').addClass('text-orange-500');
            else $btn.html('<i class="fas fa-play"></i>').removeClass('text-orange-500');
        }

        function updateTimerUI(start) {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - start;
                const m = Math.floor(elapsed/60000).toString().padStart(2,'0');
                const s = Math.floor((elapsed%60000)/1000).toString().padStart(2,'0');
                $('#singer-timer').text(`${m}:${s}`);
                if(player?.getDuration) $('#scrubber-bar').css('width', (player.getCurrentTime()/player.getDuration()*100)+'%');
            }, 1000);
        }

        function triggerApplauseAnim() {
            const emojis = ['👏','🔥','✨','🎸','🙌'];
            const $e = $(`<div class="emoji-float">${emojis[Math.floor(Math.random()*emojis.length)]}</div>`).css('left', (20+Math.random()*60)+'%');
            $('#animation-layer').append($e);
            setTimeout(()=> $e.remove(), 1800);
            document.getElementById('applause-sound').play().catch(()=>{});
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                $('#user-pfp').attr('src', user.photoURL);
                $('#login-section').addClass('hidden');
                $('#party-section').removeClass('hidden');
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) {
                    $('#nav-admin, .admin-only').removeClass('hidden');
                }
            }
        });

        $('#btn-login').click(() => signInWithPopup(auth, provider));
        $('#btn-applause').click(() => addDoc(collection(db, "applause_events"), { sessionCode, timestamp: serverTimestamp() }));
    </script>
</body>
</html>
