<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNCH | Intelligent Tracker</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        body { @apply transition-colors duration-300; }
        .dark body { background-color: #0f0f0f; color: #e5e7eb; }
        body:not(.dark) { background-color: #f3f4f6; color: #1f2937; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .light .glass { background: rgba(0, 0, 0, 0.03); border: 1px solid rgba(0, 0, 0, 0.05); }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="font-sans pb-28">

    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-[#0f0f0f] flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-5xl font-black mb-2 text-emerald-500 tracking-tighter">MUNCH</h1>
        <button id="login-btn" class="glass px-10 py-4 rounded-2xl font-bold active:scale-95 text-emerald-400">Sign in with Google</button>
    </div>

    <main id="app" class="max-w-md mx-auto p-5 hidden">
        <div id="view-dashboard" class="view-section active">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <h2 class="text-gray-500 text-xs font-bold uppercase tracking-widest">Analytics</h2>
                    <h1 class="text-3xl font-bold">Suggestions</h1>
                </div>
                <button id="dark-mode-toggle" class="glass p-3 rounded-2xl active:scale-95 text-xl">🌓</button>
            </div>

            <div id="ai-suggestion" class="glass rounded-[2rem] p-6 mb-8 border-emerald-500/30 bg-gradient-to-br from-emerald-500/10 to-transparent">
                <span class="text-[10px] font-black text-emerald-500 uppercase">System Recommendation</span>
                <h3 id="suggested-meal-name" class="text-xl font-bold mt-1">Calculating...</h3>
                <p id="suggested-reason" class="text-sm text-gray-500 mb-4 italic">Analyzing your eating patterns...</p>
                <button id="quick-log-suggested" class="w-full bg-emerald-500 text-black py-3 rounded-xl font-black text-sm hidden">LOG THIS MEAL</button>
            </div>

            <div id="meal-list" class="space-y-3"></div>
        </div>

        <div id="view-recipes" class="view-section">
            <h1 class="text-3xl font-bold mb-6">Recipe Vault</h1>
            <button id="open-recipe-modal" class="w-full glass p-4 rounded-2xl text-emerald-500 font-bold mb-6">+ Create New Recipe</button>
            <div id="recipe-list" class="space-y-4"></div>
        </div>

        <div id="view-calendar" class="view-section">
            <h1 class="text-3xl font-bold mb-6">History</h1>
            <input type="date" id="date-filter" class="w-full glass p-4 rounded-2xl outline-none mb-6">
            <div id="calendar-results" class="space-y-3"></div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[95%] max-w-sm h-16 glass rounded-2xl flex justify-around items-center px-2 z-50">
        <button class="nav-item text-emerald-500" data-target="dashboard">Dashboard</button>
        <button class="nav-item text-gray-500" data-target="recipes">Recipes</button>
        <button class="nav-item text-gray-500" data-target="calendar">History</button>
    </nav>

    <div id="recipe-modal" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md"></div>
        <form id="recipe-form" class="glass relative w-full max-w-sm rounded-[2.5rem] p-8 space-y-4">
            <h2 class="text-2xl font-bold mb-4">New Recipe</h2>
            <input type="text" id="recipeName" placeholder="Recipe Name (e.g. Chicken Salad)" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 outline-none" required>
            <textarea id="recipeInstructions" placeholder="Ingredients / Instructions" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 outline-none h-32"></textarea>
            <div class="flex gap-3">
                <button type="button" class="close-modal flex-1 p-4 rounded-xl bg-white/5 font-bold">Cancel</button>
                <button type="submit" class="flex-1 p-4 rounded-xl bg-emerald-500 text-black font-black">SAVE</button>
            </div>
        </form>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
