<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNCH | Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        html { background-color: #f3f4f6; transition: background-color 0.3s; }
        html.dark { background-color: #0f0f0f; }
        body { -webkit-tap-highlight-color: transparent; }
        
        .glass { backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); transition: background-color 0.3s, border-color 0.3s; }
        .dark .glass { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
        html:not(.dark) .glass { background: rgba(255, 255, 255, 0.7); border-color: rgba(0, 0, 0, 0.05); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeUp 0.3s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .arrow-icon { transition: transform 0.2s; }
        .collapsed .arrow-icon { transform: rotate(-90deg); }
        .collapsed + div { display: none; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans pb-36 text-gray-900 dark:text-gray-100 min-h-screen">

    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-[#0f0f0f] flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-6xl font-black mb-2 text-emerald-500 italic tracking-tighter">MUNCH</h1>
        <button id="login-btn" class="glass px-10 py-4 rounded-2xl font-bold active:scale-95 text-emerald-500 border-emerald-500/20">Sign in with Google</button>
    </div>

    <main id="app" class="max-w-md mx-auto p-5 hidden">
        
        <div id="view-dashboard" class="view-section active">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-black tracking-tight">Munch IQ</h1>
                <button id="dark-mode-toggle" class="glass p-3 rounded-2xl active:scale-95 text-xl">🌓</button>
            </div>

            <div id="ai-suggestion" class="glass rounded-[2rem] p-6 mb-8 border-emerald-500/30 bg-gradient-to-br from-emerald-500/5 to-transparent">
                <div class="flex items-center gap-2 mb-2">
                    <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Suggestion</span>
                </div>
                <h3 id="suggested-meal-name" class="text-2xl font-bold">Analyzing...</h3>
                <p id="suggested-reason" class="text-sm text-gray-500 dark:text-gray-400 mb-4 italic">Processing habits...</p>
                <button id="quick-log-suggested" class="w-full bg-emerald-500 text-black py-3 rounded-xl font-black text-sm hidden active:scale-95 transition-transform">LOG THIS MEAL</button>
            </div>

            <div class="mb-8">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Consistency (7 Days)</h2>
                <div class="glass p-4 rounded-2xl flex justify-between items-end h-32 relative" id="weekly-chart">
                    </div>
            </div>

            <div class="space-y-4 pb-4">
                <div id="section-breakfast" class="hidden">
                    <button class="toggle-header w-full text-left text-xs font-bold text-emerald-500 uppercase tracking-widest mb-2 flex items-center gap-2 p-2 rounded-lg hover:bg-emerald-500/5 transition-colors">
                        <span class="arrow-icon">▼</span> 🌅 Breakfast <span class="text-gray-500 text-[10px] ml-auto">04:00 - 11:00</span>
                    </button>
                    <div id="list-breakfast" class="space-y-2 pl-4 border-l border-emerald-500/20"></div>
                </div>

                <div id="section-lunch" class="hidden">
                    <button class="toggle-header w-full text-left text-xs font-bold text-orange-400 uppercase tracking-widest mb-2 flex items-center gap-2 p-2 rounded-lg hover:bg-orange-500/5 transition-colors">
                        <span class="arrow-icon">▼</span> ☀️ Lunch <span class="text-gray-500 text-[10px] ml-auto">11:00 - 16:00</span>
                    </button>
                    <div id="list-lunch" class="space-y-2 pl-4 border-l border-orange-500/20"></div>
                </div>

                <div id="section-dinner" class="hidden">
                    <button class="toggle-header w-full text-left text-xs font-bold text-indigo-400 uppercase tracking-widest mb-2 flex items-center gap-2 p-2 rounded-lg hover:bg-indigo-500/5 transition-colors">
                        <span class="arrow-icon">▼</span> 🌙 Dinner <span class="text-gray-500 text-[10px] ml-auto">16:00 - 21:00</span>
                    </button>
                    <div id="list-dinner" class="space-y-2 pl-4 border-l border-indigo-500/20"></div>
                </div>

                <div id="section-snack" class="hidden">
                    <button class="toggle-header w-full text-left text-xs font-bold text-pink-400 uppercase tracking-widest mb-2 flex items-center gap-2 p-2 rounded-lg hover:bg-pink-500/5 transition-colors">
                        <span class="arrow-icon">▼</span> 🍿 Snacks
                    </button>
                    <div id="list-snack" class="space-y-2 pl-4 border-l border-pink-500/20"></div>
                </div>
                
                <div id="empty-state" class="text-center py-10 hidden">
                    <p class="text-gray-500 italic text-sm">No meals logged today.</p>
                </div>
            </div>
        </div>

        <div id="view-recipes" class="view-section">
            <h1 class="text-3xl font-bold mb-6">Recipe Vault</h1>
            <div class="flex gap-2 mb-6">
                <button id="open-recipe-modal" class="flex-1 glass p-4 rounded-2xl text-emerald-500 font-bold border-dashed border-emerald-500/30 active:scale-95">+ New Recipe</button>
                <button id="open-shopping-modal" class="flex-1 glass p-4 rounded-2xl text-indigo-400 font-bold border-dashed border-indigo-500/30 active:scale-95">🛒 Shop List</button>
            </div>
            <div id="recipe-list" class="space-y-4"></div>
        </div>

        <div id="view-calendar" class="view-section">
            <h1 class="text-3xl font-bold mb-6">History</h1>
            
            <div class="glass p-4 rounded-2xl mb-6 space-y-3">
                <div class="flex items-center gap-3">
                    <span class="text-xs font-bold text-gray-500 uppercase w-16">Date</span>
                    <input type="date" id="date-filter" class="flex-1 bg-transparent p-2 outline-none font-bold text-emerald-500 text-right uppercase tracking-widest">
                </div>
                <div class="h-px bg-white/10 w-full"></div>
                <div class="flex items-center gap-3">
                    <span class="text-xs font-bold text-gray-500 uppercase w-16">Type</span>
                    <select id="category-filter" class="flex-1 bg-transparent p-2 outline-none font-bold text-emerald-500 text-right uppercase tracking-widest appearance-none dark:bg-[#0f0f0f]">
                        <option value="all">All Meals</option>
                        <option value="breakfast">Breakfast</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                        <option value="snack">Snack</option>
                    </select>
                </div>
            </div>

            <div id="calendar-results" class="space-y-3">
                <p class="text-center text-gray-500 py-10">Select filters above.</p>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm h-16 glass rounded-2xl flex justify-around items-center px-4 z-50 shadow-2xl backdrop-blur-xl">
        <button class="nav-item text-emerald-500 font-black text-[10px] tracking-widest" data-target="dashboard">HOME</button>
        <button class="nav-item text-gray-500 font-black text-[10px] tracking-widest" data-target="recipes">VAULT</button>
        <button class="nav-item text-gray-500 font-black text-[10px] tracking-widest" data-target="calendar">HISTORY</button>
    </nav>

    <button id="open-log-modal" class="fixed bottom-24 right-6 w-14 h-14 bg-emerald-500 rounded-full shadow-lg shadow-emerald-500/20 flex items-center justify-center text-black text-3xl font-light active:scale-90 z-40 transition-transform">+</button>

    <div id="modal-container" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
        
        <form id="log-form" class="modal-content relative w-full max-w-sm glass rounded-[2.5rem] p-8 space-y-4 hidden bg-[#0f0f0f]">
            <h2 class="text-2xl font-bold">Quick Log</h2>
            <input type="text" id="logDescription" placeholder="What are you eating?" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 outline-none focus:border-emerald-500" required>
            <div class="flex gap-3 pt-2">
                <button type="button" class="close-modal flex-1 p-4 rounded-xl bg-white/5 font-bold text-gray-400">Cancel</button>
                <button type="submit" class="flex-1 p-4 rounded-xl bg-emerald-500 text-black font-black">LOG</button>
            </div>
        </form>

        <form id="recipe-form" class="modal-content relative w-full max-w-sm glass rounded-[2.5rem] p-8 space-y-4 hidden bg-[#0f0f0f]">
            <h2 class="text-2xl font-bold">New Recipe</h2>
            <input type="text" id="recipeName" placeholder="Recipe Name" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 outline-none focus:border-emerald-500" required>
            <textarea id="recipeInstructions" placeholder="Ingredients..." class="w-full bg-white/5 border border-white/10 rounded-xl p-4 outline-none h-32 resize-none focus:border-emerald-500"></textarea>
            <div class="flex gap-3 pt-2">
                <button type="button" class="close-modal flex-1 p-4 rounded-xl bg-white/5 font-bold text-gray-400">Cancel</button>
                <button type="submit" class="flex-1 p-4 rounded-xl bg-emerald-500 text-black font-black">SAVE</button>
            </div>
        </form>

        <div id="shopping-modal" class="modal-content glass relative w-full max-w-md rounded-[2rem] p-6 h-[70vh] flex flex-col bg-[#0f0f0f] hidden">
            <h2 class="text-2xl font-bold mb-2">Generate List</h2>
            <p class="text-xs text-gray-500 mb-4">Tap recipes to add ingredients.</p>
            <div id="shop-recipe-select" class="flex-1 overflow-y-auto space-y-2 mb-4 pr-2"></div>
            <textarea id="shop-output" class="w-full bg-white/5 rounded-xl p-3 text-xs h-32 mb-4 hidden focus:outline-none" readonly></textarea>
            <button type="button" id="copy-shop-list" class="w-full p-4 rounded-xl bg-indigo-500 text-white font-bold hidden mb-2">COPY</button>
            <button type="button" class="close-modal w-full p-3 text-gray-500 text-xs">Close</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
