<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNCH | Intelligence</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        html { background-color: #f3f4f6; transition: background-color 0.3s; }
        html.dark { background-color: #0f0f0f; }
        
        body { -webkit-tap-highlight-color: transparent; }
        
        /* Glassmorphism Logic */
        .glass { backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); transition: background-color 0.3s, border-color 0.3s; }
        .dark .glass { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
        html:not(.dark) .glass { background: rgba(255, 255, 255, 0.7); border-color: rgba(0, 0, 0, 0.05); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }

        /* View Switching Animation */
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeUp 0.3s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Fatigue State */
        .fatigue-high { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
    </style>
</head>
<body class="font-sans pb-32 text-gray-900 dark:text-gray-100 min-h-screen">

    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-[#0f0f0f] flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-6xl font-black mb-2 text-emerald-500 italic tracking-tighter">MUNCH</h1>
        <button id="login-btn" class="glass px-10 py-4 rounded-2xl font-bold active:scale-95 text-emerald-500 border-emerald-500/20">Sign in with Google</button>
    </div>

    <main id="app" class="max-w-md mx-auto p-5 hidden">
        
        <div id="view-dashboard" class="view-section active">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-black tracking-tight">Munch IQ</h1>
                <button id="dark-mode-toggle" class="glass p-3 rounded-2xl active:scale-95 text-xl">🌓</button>
            </div>

            <div id="ai-suggestion" class="glass rounded-[2rem] p-6 mb-8 border-emerald-500/30 bg-gradient-to-br from-emerald-500/5 to-transparent">
                <div class="flex items-center gap-2 mb-2">
                    <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Suggestion</span>
                </div>
                <h3 id="suggested-meal-name" class="text-2xl font-bold">Analyzing...</h3>
                <p id="suggested-reason" class="text-sm text-gray-500 dark:text-gray-400 mb-4 italic">Processing your habits...</p>
                <button id="quick-log-suggested" class="w-full bg-emerald-500 text-black py-3 rounded-xl font-black text-sm hidden active:scale-95 transition-transform">LOG THIS MEAL</button>
            </div>

            <div class="mb-6">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Quick Add from Vault</h2>
                <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar" id="quick-select-bar">
                    <span class="text-sm text-gray-500 italic px-2">Add recipes to see shortcuts...</span>
                </div>
            </div>

            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Today's Fuel</h2>
            <div id="meal-list" class="space-y-3 pb-4"></div>
        </div>

        <div id="view-recipes" class="view-section">
            <h1 class="text-3xl font-bold mb-6">Recipe Vault</h1>
            <button id="open-recipe-modal" class="w-full glass p-5 rounded-2xl text-emerald-500 font-bold mb-6 border-dashed border-emerald-500/30 active:scale-95">+ Create New Recipe</button>
            <div id="recipe-list" class="space-y-4"></div>
        </div>

        <div id="view-calendar" class="view-section">
            <h1 class="text-3xl font-bold mb-6">History</h1>
            <div class="glass p-2 rounded-2xl mb-6 flex items-center">
                <input type="date" id="date-filter" class="w-full bg-transparent p-2 outline-none font-bold text-emerald-500 text-center uppercase tracking-widest">
            </div>
            <div id="calendar-results" class="space-y-3">
                <p class="text-center text-gray-500 py-10">Select a date above.</p>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm h-16 glass rounded-2xl flex justify-around items-center px-4 z-50 shadow-2xl backdrop-blur-xl">
        <button class="nav-item text-emerald-500 font-black text-[10px] tracking-widest" data-target="dashboard">HOME</button>
        <button class="nav-item text-gray-500 font-black text-[10px] tracking-widest" data-target="recipes">VAULT</button>
        <button class="nav-item text-gray-500 font-black text-[10px] tracking-widest" data-target="calendar">HISTORY</button>
    </nav>

    <button id="open-log-modal" class="fixed bottom-24 right-6 w-14 h-14 bg-emerald-500 rounded-full shadow-lg shadow-emerald-500/20 flex items-center justify-center text-black text-3xl font-light active:scale-90 z-40 transition-transform">
        +
    </button>

    <div id="modal-container" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity"></div>
        
        <form id="log-form" class="modal-content glass relative w-full max-w-sm rounded-[2.5rem] p-8 space-y-4 hidden bg-[#0f0f0f]">
            <h2 class="text-2xl font-bold">Quick Log</h2>
            <input type="text" id="logDescription" placeholder="What are you eating?" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 outline-none focus:border-emerald-500 transition-colors" required>
            <div class="flex gap-3 pt-2">
                <button type="button" class="close-modal flex-1 p-4 rounded-xl bg-white/5 font-bold text-gray-400">Cancel</button>
                <button type="submit" class="flex-1 p-4 rounded-xl bg-emerald-500 text-black font-black">LOG</button>
            </div>
        </form>

        <form id="recipe-form" class="modal-content glass relative w-full max-w-sm rounded-[2.5rem] p-8 space-y-4 hidden bg-[#0f0f0f]">
            <h2 class="text-2xl font-bold">New Recipe</h2>
            <input type="text" id="recipeName" placeholder="Recipe Name (e.g. Oats)" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 outline-none focus:border-emerald-500" required>
            <textarea id="recipeInstructions" placeholder="Ingredients or Notes..." class="w-full bg-white/5 border border-white/10 rounded-xl p-4 outline-none h-32 resize-none focus:border-emerald-500"></textarea>
            <div class="flex gap-3 pt-2">
                <button type="button" class="close-modal flex-1 p-4 rounded-xl bg-white/5 font-bold text-gray-400">Cancel</button>
                <button type="submit" class="flex-1 p-4 rounded-xl bg-emerald-500 text-black font-black">SAVE</button>
            </div>
        </form>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
