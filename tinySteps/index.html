        /**
         * SERVICE LAYER
         * Core business logic and state management
         */
        class TinyService {
            constructor() {
                this.storageKey = 'tinysteps_pro_v1';
                this.state = this.load();
            }

            load() {
                const data = localStorage.getItem(this.storageKey);
                return data ? JSON.parse(data) : {
                    user: { name: '', dob: '', age: 0, onboarded: false },
                    plan: [], history: [], settings: { debug: false }
                };
            }

            save() {
                localStorage.setItem(this.storageKey, JSON.stringify(this.state));
            }

            getMonths(dob) {
                const diff = new Date() - new Date(dob);
                return Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24 * 30.44)));
            }

            generatePlan(age) {
                const pool = ACTIVITIES_DB.filter(a => age >= a.age_range[0] && age <= a.age_range[1]);
                const shuffle = [...pool].sort(() => 0.5 - Math.random());
                const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

                this.state.plan = shuffle.slice(0, 5).map((a, i) => ({
                    ...a, day: days[i], completed: false, uid: Date.now() + i
                }));
                this.save();
                return this.state.plan;
            }

            toggleComplete(id) {
                const item = this.state.plan.find(p => p.id === id);
                if (item && !item.completed) {
                    item.completed = true;
                    this.state.history.push({ ...item, timestamp: Date.now() });
                    this.save();
                    return true;
                }
                return false;
            }
        }

         * UI VIEW LAYER
         * Component templates and rendering logic
         */

                return `
                    <div onclick="app.openDetail(${item.id})" class="activity-card bg-white rounded-[2.5rem] p-6 shadow-soft border border-white flex items-center justify-between group cursor-pointer mb-4">
                        <div class="flex items-center space-x-5">
                            <div class="w-16 h-16 rounded-3xl ${colors[item.mood]} flex items-center justify-center text-2xl transition-all group-hover:scale-110">
                                <i class="fa-solid fa-${icons[item.mood]}"></i>
                            </div>
                            <div>
                                <h4 class="font-black text-slate-800 text-lg ${item.completed ? 'line-through opacity-30 italic' : ''}">${item.title}</h4>
                                <div class="flex items-center space-x-3 text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">
                                    <span>${item.category}</span>
                                    <span class="w-1 h-1 bg-slate-200 rounded-full"></span>
                                    <span>${item.duration}</span>
                                </div>
                            </div>
                        </div>
                        <div class="w-10 h-10 rounded-full flex items-center justify-center transition-all ${item.completed ? 'bg-accent/10 text-accent' : 'bg-slate-50 text-slate-300 group-hover:bg-slate-100'}">
                            <i class="fa-solid ${item.completed ? 'fa-check' : 'fa-chevron-right text-xs'}"></i>
                        </div>
                    </div>
                `;
            },

            detail: (item, isPlan, isCompleted) => {
                return `
                    <div class="flex justify-between items-center mb-8">
                        <span class="px-5 py-2 rounded-full bg-primary/10 text-primary text-[11px] font-black uppercase tracking-widest">${item.category}</span>
                        <button onclick="app.closeDetail()" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <h2 class="text-3xl font-black mb-6 leading-tight">${item.title}</h2>
                    
                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="bg-slate-50 p-5 rounded-3xl">
                            <div class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Duration</div>
                            <div class="text-sm font-bold"><i class="fa-regular fa-clock mr-3 text-primary"></i>${item.duration}</div>
                        </div>
                        <div class="bg-slate-50 p-5 rounded-3xl">
                            <div class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Ideal Mood</div>
                            <div class="text-sm font-bold"><i class="fa-solid fa-face-smile mr-3 text-primary"></i>${item.mood}</div>
                        </div>
                    </div>

                    <div class="mb-8">
                        <h4 class="text-xs font-black text-slate-400 uppercase tracking-[0.15em] mb-4">Required Materials</h4>
                        <div class="flex flex-wrap gap-2">
                            ${item.materials.map(m => `<span class="px-4 py-2 bg-white border-2 border-slate-50 rounded-2xl text-[13px] font-bold text-slate-600">${m}</span>`).join('')}
                        </div>
                    </div>

                    <div class="mb-10">
                        <h4 class="text-xs font-black text-slate-400 uppercase tracking-[0.15em] mb-4">How to Play</h4>
                        <p class="text-slate-600 text-[15px] leading-relaxed font-medium">${item.instructions}</p>
                    </div>

                    <div class="p-6 bg-secondary/5 rounded-3xl border border-secondary/10 flex items-start space-x-4 mb-10">
                        <i class="fa-solid fa-triangle-exclamation text-secondary mt-1"></i>
                        <p class="text-[12px] text-secondary font-bold leading-snug">Safety reminder: Supervise your child at all times during these activities.</p>
                    </div>

                    ${isPlan && !item.completed ? `
                        <button onclick="app.complete(${item.id})" class="w-full bg-slate-900 border-b-4 border-slate-950 text-white font-black py-6 rounded-[2rem] shadow-2xl active:translate-y-1 active:border-b-0 transition-all flex items-center justify-center space-x-3">
                            <span>Activity Completed</span>
                            <i class="fa-solid fa-check-double scale-110"></i>
                        </button>
                    ` : item.completed ? `
                        <div class="w-full py-6 rounded-[2rem] bg-accent/10 border-2 border-accent/30 text-accent font-black text-center text-lg">
                            <i class="fa-solid fa-trophy mr-3"></i>Milestone Unlocked!
                        </div>
                    ` : `<p class="text-center text-xs font-bold text-slate-400 italic">Add this to your weekly plan to track progress.</p>`}
                `;
            }
        };

        /**
         * CONTROLLER LAYER
         * Application orchestration and event handling
         */
        class TinyApp {
            constructor() {
                this.view = 'plan';
                this.service = new TinyService();
                this.init();
            }

            init() {
                const s = this.service.state;
                if (!s.user.onboarded) {
                    document.getElementById('onboarding-modal').classList.remove('hidden');
                } else {
                    this.updateHeader();
                    this.render();
                }

                document.getElementById('onboarding-form').onsubmit = (e) => {
                    e.preventDefault();
                    const name = document.getElementById('parent-name').value;
                    const dob = document.getElementById('baby-dob').value;
                    const age = this.service.getMonths(dob);

                    this.service.state.user = { name, dob, age, onboarded: true };
                    this.service.generatePlan(age);
                    this.service.save();

                    document.getElementById('onboarding-modal').classList.add('hidden');
                    this.updateHeader();
                    this.render();
                    confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 }, colors: ['#6366f1', '#10b981'] });
                };
            }

            updateHeader() {
                const age = this.service.state.user.age;
                let stage = "Newborn";
                if (age > 6) stage = "Sitter";
                if (age > 12) stage = "Explorer";
                if (age > 24) stage = "Discovery";
                if (age > 36) stage = "Preschool";
                document.getElementById('current-stage').innerHTML = `<span class="text-primary">${stage} Stage</span> • ${age}m`;
            }

            navigate(view) {
                this.view = view;
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                document.getElementById(`nav-${view}`).classList.add('active');
                this.render();
                window.scrollTo({ top: 0, behavior: 'instant' });
            }

            render() {
                const container = document.getElementById('view-container');
                container.innerHTML = `<div class="fade-in">${this[`v_${this.view}`]()}</div>`;
            }

            v_plan() {
                const plan = this.service.state.plan;
                const done = plan.filter(p => p.completed).length;
                const pct = (done / plan.length) * 100;

                return `
                    <div class="bg-primary rounded-[3rem] p-10 text-white mb-10 shadow-premium relative overflow-hidden">
                        <div class="absolute -right-10 -top-10 w-48 h-48 bg-white/20 rounded-full blur-3xl"></div>
                        <h2 class="text-xs font-black uppercase tracking-[0.2em] mb-2 opacity-60">Weekly Sprint</h2>
                        <div class="flex items-baseline space-x-3 mb-6">
                            <span class="text-6xl font-black">${done}</span>
                            <span class="text-2xl opacity-40">/ ${plan.length}</span>
                        </div>
                        <div class="w-full bg-black/10 h-3 rounded-full overflow-hidden p-0.5 border border-white/10">
                            <div class="bg-white h-full rounded-full transition-all duration-1000" style="width: ${pct}%"></div>
                        </div>
                    </div>
                    <div class="px-2">
                        <h3 class="text-lg font-black mb-6">Focus Activities</h3>
                        ${plan.map(p => TinyUI.card(p)).join('')}
                    </div>
                `;
            }

            v_library() {
                const moods = ['All', 'Energetic', 'Calm', 'Fussy'];
                const age = this.service.state.user.age;
                return `
                    <div class="flex space-x-3 overflow-x-auto pb-6 px-2 no-scrollbar mb-4">
                        ${moods.map(m => `<button onclick="app.filterLib('${m}')" class="mood-btn whitespace-nowrap px-8 py-4 rounded-[1.5rem] font-bold text-sm transition-all ${m === 'All' ? 'bg-primary text-white shadow-xl' : 'bg-white text-slate-500'}">${m}</button>`).join('')}
                    </div>
                    <div id="lib-results" class="space-y-4">
                        ${ACTIVITIES_DB.filter(a => age >= a.age_range[0] && age <= a.age_range[1]).map(a => TinyUI.card(a)).join('')}
                    </div>
                `;
            }

            filterLib(mood) {
                const age = this.service.state.user.age;
                const results = mood === 'All'
                    ? ACTIVITIES_DB.filter(a => age >= a.age_range[0] && age <= a.age_range[1])
                    : ACTIVITIES_DB.filter(a => a.mood === mood && age >= a.age_range[0] && age <= a.age_range[1]);

                document.querySelectorAll('.mood-btn').forEach(btn => {
                    btn.classList.toggle('bg-primary', btn.innerText === mood);
                    btn.classList.toggle('text-white', btn.innerText === mood);
                    btn.classList.toggle('bg-white', btn.innerText !== mood);
                    btn.classList.toggle('text-slate-500', btn.innerText !== mood);
                });
                document.getElementById('lib-results').innerHTML = results.map(a => TinyUI.card(a)).join('');
            }

            v_pantry() {
                return `
                    <div class="bg-white rounded-[3rem] p-10 shadow-soft mb-10 text-center border-t border-white">
                        <div class="w-20 h-20 bg-primary/10 text-primary rounded-[2rem] flex items-center justify-center text-3xl mx-auto mb-6">
                            <i class="fa-solid fa-kitchen-set"></i>
                        </div>
                        <h2 class="text-2xl font-black mb-3">Ingredient Search</h2>
                        <p class="text-slate-500 text-sm mb-8 leading-relaxed">What do you have at home? We'll suggest activities based on your materials.</p>
                        <textarea id="pantry-input" placeholder="e.g. Scarf, spoon, box..." class="w-full bg-slate-50 border-2 border-transparent rounded-[1.5rem] px-6 py-5 focus:bg-white focus:border-primary/20 transition-all outline-none text-slate-800 font-bold mb-6 min-h-[100px]"></textarea>
                        <button onclick="app.searchPantry()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl">Discover Play</button>
                    </div>
                    <div id="pantry-results"></div>
                `;
            }

            searchPantry() {
                const text = document.getElementById('pantry-input').value.toLowerCase();
                if (!text.trim()) return;
                const terms = text.split(/[,;\n]/).map(t => t.trim()).filter(t => t.length > 0);
                const results = ACTIVITIES_DB.filter(a => terms.some(t => a.materials.some(m => m.toLowerCase().includes(t))));

                const resEl = document.getElementById('pantry-results');
                if (results.length > 0) {
                    resEl.innerHTML = `<h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-6 px-4">Possible Match (${results.length})</h3>` + results.map(a => TinyUI.card(a)).join('');
                } else {
                    resEl.innerHTML = `<div class="text-center py-10 opacity-40 font-bold italic">No magic matches yet. Try simpler terms like "toy" or "box".</div>`;
                }
            }

            v_profile() {
                const user = this.service.state.user;
                const stats = { total: this.service.state.history.length };
                return `
                    <div class="flex flex-col items-center mb-12">
                        <div class="w-28 h-28 rounded-[2.5rem] bg-gradient-to-tr from-indigo-50 to-white shadow-soft flex items-center justify-center text-5xl mb-6 border-b-4 border-slate-100">👶</div>
                        <h2 class="text-3xl font-black">${user.name}</h2>
                        <p class="text-slate-400 font-black uppercase text-[10px] tracking-widest mt-2">Level: ${user.age} Months Old</p>
                    </div>
                    <div class="grid grid-cols-2 gap-6 mb-12">
                        <div class="bg-white p-8 rounded-[2rem] shadow-soft text-center group transition-all hover:bg-slate-900 border-b-4 border-slate-50 hover:border-slate-800">
                            <div class="text-4xl font-black text-primary group-hover:text-white">${stats.total}</div>
                            <div class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-2 group-hover:text-slate-500">Activities Done</div>
                        </div>
                         <div class="bg-white p-8 rounded-[2rem] shadow-soft text-center group transition-all hover:bg-slate-900 border-b-4 border-slate-50 hover:border-slate-800">
                            <div class="text-4xl font-black text-accent group-hover:text-white">${Math.min(100, stats.total * 2)}</div>
                            <div class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-2 group-hover:text-slate-500">Mastery Score</div>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <button onclick="app.openDebug()" class="w-full flex justify-between items-center px-8 py-6 bg-white rounded-[2rem] shadow-soft font-bold text-slate-600 transition-all hover:pl-10">
                            <span><i class="fa-solid fa-microchip mr-4 text-primary"></i> Diagnostics</span>
                            <i class="fa-solid fa-chevron-right text-[10px] opacity-30"></i>
                        </button>
                    </div>
                `;
            }

            openDetail(id) {
                const item = ACTIVITIES_DB.find(a => a.id === id);
                const planItem = this.service.state.plan.find(p => p.id === id);
                const modal = document.getElementById('activity-modal');
                const content = document.getElementById('modal-content');

                content.innerHTML = TinyUI.detail(item, !!planItem, !!(planItem && planItem.completed));
                modal.classList.remove('hidden');
                setTimeout(() => content.classList.remove('translate-y-full'), 10);
            }

            closeDetail() {
                const modal = document.getElementById('activity-modal');
                const content = document.getElementById('modal-content');
                content.classList.add('translate-y-full');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }

            complete(id) {
                if (this.service.toggleComplete(id)) {
                    this.closeDetail();
                    this.render();
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.9 } });
                }
            }

            openDebug() {
                const p = document.getElementById('debug-panel');
                p.classList.remove('hidden');
                setTimeout(() => p.classList.add('open'), 10);
            }

            closeDebug() {
                const p = document.getElementById('debug-panel');
                p.classList.remove('open');
                setTimeout(() => p.classList.add('hidden'), 400);
            }

            showNotification() {
                const tips = [
                    "Language tip: Describe everything you do today to boost baby's vocabulary.",
                    "Physical tip: A simple scarf can become a cape, a tail, or a magic rope!",
                    "Safety tip: Small objects like buttons can be choking hazards for children under 3.",
                    "Mood tip: If play gets too wild, try a 'Cloud Watching' session to calm down."
                ];
                alert(tips[Math.floor(Math.random() * tips.length)]);
            }
        }

        /**
         * TESTING LAYER
         * Automated diagnostics for TDD stability
         */
        class TinyTester {
            constructor() {
                this.logEl = document.getElementById('test-log');
                this.statusEl = document.getElementById('test-status');
                this.taps = 0;
                this.listen();
            }

            listen() {
                document.getElementById('logo').onclick = () => {
                    this.taps++;
                    if (this.taps >= 3) { app.openDebug(); this.taps = 0; }
                    setTimeout(() => this.taps = 0, 1000);
                };
            }

            log(msg, success = true) {
                const p = document.createElement('div');
                p.className = success ? 'text-green-400' : 'text-rose-400';
                p.innerHTML = `<span class="opacity-30 mr-2">${new Date().toLocaleTimeString()}</span> ${success ? '✓' : '✗'} ${msg}`;
                this.logEl.appendChild(p);
                this.logEl.scrollTop = this.logEl.scrollHeight;
            }

            async runTests() {
                this.logEl.innerHTML = '';
                this.statusEl.innerText = 'RUNNING';
                this.statusEl.className = 'text-[9px] font-black px-3 py-1 rounded-full bg-primary text-white';

                let fails = 0;

                // Test 1: Content Balance
                const chunks = [0, 12, 24, 36, 48];
                chunks.forEach(c => {
                    const count = ACTIVITIES_DB.filter(a => c >= a.age_range[0] && c <= a.age_range[1]).length;
                    if (count < 5) { this.log(`Age Stage ${c}m has only ${count} items!`, false); fails++; }
                    else { this.log(`Age Stage ${c}m coverage verified (${count} items)`); }
                });

                // Test 2: Plan Consistency
                const p = app.service.generatePlan(12);
                if (p.length === 5) { this.log("Weekly algorithm generates exactly 5 items"); }
                else { this.log("Weekly algorithm failed count test", false); fails++; }

                // Test 3: System Health
                if (typeof confetti === 'function') this.log("Confetti component active");
                else { this.log("External library failed to load", false); fails++; }

                this.statusEl.innerText = fails > 0 ? 'FAILED' : 'STABLE';
                this.statusEl.className = `text-[9px] font-black px-3 py-1 rounded-full ${fails > 0 ? 'bg-secondary' : 'bg-accent'} text-white`;
                if (!fails) confetti({ particleCount: 50 });
            }

            simulateWeekChange() { app.service.generatePlan(app.service.state.user.age); app.render(); this.log('Simulated week turn-over'); }
            resetOnboarding() { localStorage.clear(); window.location.reload(); }
            unlockAll() { app.service.state.plan.forEach(p => p.completed = true); app.service.save(); app.render(); this.log('Force-levelled all items'); }
            injectMockData() {
                app.service.state.history = Array.from({ length: 20 }, (_, i) => ({ id: i, title: 'Mock ' + i, timestamp: Date.now() }));
                app.service.save(); app.render(); this.log('Injected 20 mock history entries');
            }
        }

        // BOOTSTRAP
        const app = new TinyApp();
        const tester = new TinyTester();
    </script>
</body>

</html>
